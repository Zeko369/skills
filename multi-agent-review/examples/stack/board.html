      },
      /**
       * Drag handle that resizes a docked panel; append it inside the (positioned) panel on every render.
       * The width goes to a CSS custom property (default --drawer-width on <html>) so the theme's CSS stays in charge:
       * width: min(var(--drawer-width, 520px), 100vw). Double-click resets. Arrow keys resize. Persisted per key.
       * side 'left' (default) means the handle sits on the panel's left edge, for a panel docked to the right.
       */
      resizer(panel, opts) {
        opts = opts || {};
        const key = opts.key || 'drawer';
        const prop = opts.property || '--drawer-width';
        const target = opts.target || document.documentElement;
        const min = opts.min || 320;
        const dir = opts.side === 'right' ? -1 : 1;
        const maxWidth = () => Math.max(min, Math.min(opts.max || Infinity, window.innerWidth - (opts.gutter == null ? 48 : opts.gutter)));
        const handle = h('div', {
          class: 'resize-handle', role: 'separator', tabindex: '0', 'aria-orientation': 'vertical', 'aria-label': opts.label || 'Resize panel',
          'aria-valuemin': String(min), title: 'Drag to resize · double-click to reset', dataset: { side: opts.side || 'left' },
        });
        const apply = (width, save) => {
          if (width == null) { target.style.removeProperty(prop); handle.removeAttribute('aria-valuenow'); }
          else {
            width = Math.round(Math.min(maxWidth(), Math.max(min, width)));
            target.style.setProperty(prop, `${width}px`);
            handle.setAttribute('aria-valuenow', String(width));
          }
          if (save) { if (width == null) delete sizes[key]; else sizes[key] = width; persist(); }
        };
        if (typeof sizes[key] === 'number') apply(sizes[key]);
        let drag = null;
        const end = () => {
          if (!drag) return;
          drag = null;
          document.documentElement.classList.remove('is-resizing');
          const width = parseFloat(target.style.getPropertyValue(prop));
          if (width) apply(width, true);
        };
        handle.addEventListener('pointerdown', (event) => {
          if (event.button !== 0) return;
          event.preventDefault();
          drag = { x: event.clientX, width: panel.getBoundingClientRect().width };
          handle.setPointerCapture(event.pointerId);
          document.documentElement.classList.add('is-resizing');
        });
        handle.addEventListener('pointermove', (event) => { if (drag) apply(drag.width + (drag.x - event.clientX) * dir); });
        handle.addEventListener('pointerup', end);
        handle.addEventListener('pointercancel', end);
        handle.addEventListener('lostpointercapture', end);
        handle.addEventListener('dblclick', () => apply(null, true));
        handle.addEventListener('click', (event) => event.stopPropagation());
        handle.addEventListener('keydown', (event) => {
          const step = event.shiftKey ? 120 : 40;
          const width = panel.getBoundingClientRect().width;
          if (event.key === 'ArrowLeft') apply(width + step * dir, true);
          else if (event.key === 'ArrowRight') apply(width - step * dir, true);
          else if (event.key === 'Home') apply(maxWidth(), true);
          else if (event.key === 'End') apply(min, true);
          else if (event.key === 'Enter') apply(null, true);
          else return;
          event.preventDefault();
          event.stopPropagation();
        });
        return handle;
      },
      prChip(id) {
        if (!hasStack) return null; // one PR is the target itself; there is nothing to filter to
        const node = stack.byId.get(id);
        return h('button', { type: 'button', class: 'pr-chip', title: node ? `${node.title} — show only this PR` : 'Show only this PR', dataset: { pr: id },
          onclick: (e) => { e.stopPropagation(); app.setFacet('pr', [id]); } }, prLabel(id));
      },
      reviewerBadges(names) {
        return h('span', { class: 'rv-badges' }, names.map((name) => h('span', { class: 'rv', title: name, dataset: { rv: String(reviewerIndex(name)) } }, app.initials(name))));
      },
      /** Per-severity counts. { labels: true } renders "P1 2" instead of a bare number. */
      severityPips(row, opts) {
        const labels = opts && opts.labels;
        return h('span', { class: 'sev-pips', role: 'img', 'aria-label': SEVERITIES.filter((s) => row[s]).map((s) => `${row[s]} ${s} ${SEVERITY_LABELS[s]}`).join(', ') || 'No findings' },
          SEVERITIES.filter((s) => row[s]).map((s) => h('span', { class: 'sev-pip', title: `${row[s]} × ${s} ${SEVERITY_LABELS[s]}`, dataset: { severity: s } }, labels ? `${s} ${row[s]}` : `${row[s]}`)));
      },
      /** Default tree: trunk, then PRs in stack order. Click filters to one PR; shift-click adds. */
      stackTree(opts) {
        if (!hasStack) return null;
        opts = opts || {};
        const items = stack.order.map((node) => {
          const pips = h('span', { class: 'stack-pips' });
          const total = h('span', { class: 'stack-total' });
          const button = h('button', {
            type: 'button', class: 'stack-select', 'aria-pressed': 'false', dataset: { focusKey: `stack:${node.id}` },
            title: `${node.title}${node.branch ? ` (${node.branch})` : ''}. Click to show only this PR; shift-click to add it.`,
            onclick: (event) => app.toggle('pr', node.id, !(event.shiftKey || event.altKey)),

            node.trail.map((line) => h('span', { class: line ? 'stack-guide stack-guide-line' : 'stack-guide' })),

            h('span', { class: 'stack-head' }, h('span', { class: 'stack-number' }, prLabel(node.id)), h('span', { class: 'stack-title' }, node.title)),
            opts.meta === false ? null : h('span', { class: 'stack-meta' }, [node.branch, node.forked ? `forks from ${prLabel(node.parent)}` : null, node.status].filter(Boolean).join(' · '))),
          h('span', { class: 'stack-stats' }, pips, total));
          const li = h('li', { class: 'stack-node', dataset: { pr: node.id, depth: String(node.depth), indent: String(node.indent), lane: String(node.lane) } }, button);
          return { node, li, button, pips, total };
        });
        refreshers.push(() => {
          const rows = prBreakdown();
          items.forEach(({ node, button, pips, total }) => {
            const row = rows.get(node.id);
            button.setAttribute('aria-pressed', String(state.pr.has(node.id)));

          h('li', { class: 'stack-node stack-trunk' }, h('span', { class: 'stack-graph', 'aria-hidden': 'true' }, h('span', { class: 'stack-dot' })), h('span', { class: 'stack-number' }, stack.trunk)),
          items.map((item) => item.li));
      },
      /** Inline legend (a details element) listing every key, including theme additions, plus a button for the ? sheet. */
      shortcuts() {
        const list = h('div', { class: 'shortcut-groups' });
        const root = h('details', { class: 'shortcuts', ontoggle: () => { if (root.open) list.replaceChildren(...shortcutList(shortcutGroups())); } },
          h('summary', null, 'Keyboard shortcuts'), list,
          h('button', { type: 'button', class: 'shortcuts-open', onclick: () => openSheet() }, 'Open cheatsheet (?)'));
        return root;
      },
    };
    app.ui = ui;

    document.addEventListener('keydown', (event) => {
      if (event.defaultPrevented || event.metaKey || event.ctrlKey || event.altKey) return;
      const target = event.target;
      const typing = /^(INPUT|SELECT|TEXTAREA)$/.test(target.tagName) || target.isContentEditable;
      if (event.key === 'Escape') {
        if (typing) target.blur(); else if (state.drawerFull) app.setDrawerFull(false); else if (state.selected) app.select(null);
        return;
      }
      if (typing) return;
      const id = state.selected;

      const answerBlock = id && Array.from(document.querySelectorAll(`.answer[data-answer-for="${CSS.escape(id)}"]`)).find(isShown);
      switch (event.key) {
        case '?': openSheet(); break;
        case '/': if (searchInput) { event.preventDefault(); searchInput.focus(); searchInput.select(); } break;
        case 'j': app.move(1); break;
        case 'k': app.move(-1); break;
        case 'f': app.toggleDrawerFull(); break;
        case 'o': if (id) app.setOpen(id, !open.has(id)); break;
        case 'p': if (id) app.togglePinned(id); break;
        case 'x': if (id) app.toggleAnswer(id); break;
        case 'a': if (!answerBlock) return; app.setAnswer(id, 'fix'); break;
        case 'i': case 'r': if (!answerBlock) return; app.setAnswer(id, 'ignore'); break;

    window.addEventListener('beforeprint', () => {
      openBeforePrint = Array.from(document.querySelectorAll('details')).map((el) => [el, el.open]);
      openBeforePrint.forEach(([el]) => { el.open = true; });
    });
    window.addEventListener('afterprint', () => { if (openBeforePrint) openBeforePrint.forEach(([el, wasOpen]) => { el.open = wasOpen; }); });

    readHash();
    return app;
  }

  window.MultiAgentReview = { create, h, safeUrl, SEVERITIES, SEVERITY_LABELS, DISPOSITIONS };
}());

<script>
(() => {
  'use strict';
  const app = MultiAgentReview.create();
  const { h, ui, data, state, stack } = app;
  const C = app.constants;
  const SEVS = C.SEVERITIES;
  const SEV_LABEL = C.SEVERITY_LABELS;
  const DISPS = C.DISPOSITIONS;
  const DISP_LABEL = { confirmed: 'Confirmed', 'needs validation': 'Needs validation', disputed: 'Disputed', rejected: 'Rejected' };
  const findings = app.findings;
  const hasFindings = findings.length > 0;
  const reviewerNames = app.options.reviewer.map((o) => o.value);
  const BAD = ['failed', 'timed_out', 'unavailable', 'cancelled'];
  const WARN = ['stale', 'running'];

  // Theme-local view state (memory only): folded board columns and swimlanes, strip panels.
  const foldedCols = new Set();
  const foldedLanes = new Set();
  let stripOpen = false;
  let moreOpen = ['reviewer', 'confidence', 'tag'].some((k) => state[k].size) || state.pinnedOnly;
  let drawerFor = null;
  let opener = null; // focus key of the control that opened the drawer, restored on close

  const plural = (n, one, many) => `${n} ${n === 1 ? one : (many || `${one}s`)}`;
  const lower = (v) => String(v == null ? '' : v).trim().toLowerCase();
  const kicker = (text) => h('span', { class: 'kicker' }, text);
  const swatch = (d) => h('span', { class: 'disp-sw', dataset: { disposition: d }, 'aria-hidden': 'true' });
  const tally = (list) => {
    const row = { total: 0, P0: 0, P1: 0, P2: 0, P3: 0 };
    list.forEach((f) => { row.total += 1; row[f.severity] += 1; });
    return row;
  };
  const statusText = (s) => String(s).replace(/_/g, ' ');

  /** Re-render a region outside core's notify() while keeping keyboard focus on the same control. */
  function keepFocus(fn) {
    const active = document.activeElement;
    const key = active && active.dataset ? active.dataset.focusKey : null;
    fn();
    if (key && (!document.activeElement || document.activeElement === document.body)) {
      const el = document.querySelector(`[data-focus-key="${CSS.escape(key)}"]`);
      if (el) el.focus({ preventScroll: true });
    }
  }
  /** Core syncs these marks only inside notify(); set them at build time for local re-renders too. */
  function mark(el, id) {
    el.toggleAttribute('data-selected', state.selected === id);
    el.toggleAttribute('data-pinned', app.isPinned(id));
    el.dataset.answer = app.answer(id);
    el.toggleAttribute('data-ignored', app.isIgnored(id));
    el.toggleAttribute('data-commented', Boolean(app.comment(id).trim()));
    return el;
  }
  /** Comments are typed without a re-render; mirror them onto the cards (and print) as the user types. */
  function syncComment(id) {
    const text = app.comment(id).trim();
    document.querySelectorAll(`.card-comment[data-comment-for="${CSS.escape(id)}"]`).forEach((el) => {
      el.hidden = !text;
      el.querySelector('.card-comment-text').textContent = text;
    });
  }

  function segbar(row, opts) {
    opts = opts || {};
    const present = SEVS.filter((s) => row[s]);
    const label = row.total ? present.map((s) => `${row[s]} ${s} ${SEV_LABEL[s]}`).join(', ') : 'No findings in view';
    return h('span', { class: `segbar${opts.size ? ` segbar-${opts.size}` : ''}`, role: 'img', 'aria-label': label, title: label },
      row.total
        ? present.map((s) => h('span', { class: 'segbar-seg', dataset: { severity: s }, style: `flex-grow:${row[s]}` }, String(row[s])))
        : h('span', { class: 'segbar-none' }, opts.empty || ''));
  }

  function confidence(value) {
    const v = lower(value);
    const level = v === 'high' ? 3 : v === 'medium' ? 2 : v === 'low' ? 1 : 0;
    return h('span', { class: 'conf', title: `${value} confidence` },
      h('span', { class: 'conf-bars', 'aria-hidden': 'true' }, [1, 2, 3].map((i) => h('i', { class: i <= level ? 'on' : null }))),
      h('span', null, value ? `${value}` : 'Unknown'), h('span', { class: 'sr-only' }, ' confidence'));
  }

  const secHead = (id, title, aside) => h('div', { class: 'sec-head' },
    h('span', { class: 'sec-num', 'aria-hidden': 'true' }),
    h('h2', { class: 'sec-title', id }, title),
    aside ? h('div', { class: 'sec-aside' }, aside) : null);

  /* ── Top bar ── */
  function buildTopbar() {
    const defs = [app.hasStack && ['stack', 'Stack map'], hasFindings && ['matrix', 'Who found what'], ['team', 'Reviewers'], ['details', 'Scope & follow-up']].filter(Boolean);
    const pop = h('details', { class: 'view-pop no-print' }, h('summary', null, 'View'),
      h('div', { class: 'view-panel' }, ui.sections(defs), ui.print('Print / PDF')));
    document.addEventListener('click', (event) => { if (pop.open && !pop.contains(event.target)) pop.open = false; });
    window.addEventListener('keydown', (event) => {
      if (event.key !== 'Escape' || !pop.open) return;

      event.preventDefault();

      ? h('span', { class: 'topbar-snap', title: 'Reviewed snapshot' }, `snapshot ${data.snapshot_id} · ${data.snapshot_verified === true ? 'verified' : 'unverified'}`)

    return h('header', { class: 'topbar' },
      h('span', { class: 'brand' }, h('span', { class: 'brand-mark', 'aria-hidden': 'true' }, SEVS.map((s) => h('i', { dataset: { severity: s } }))), 'Multi-agent review'),
      h('span', { class: 'topbar-meta' }, `Generated ${data.generated_at}`),
      snap,
      h('span', { class: 'topbar-tools' }, pop));
  }

  /* ── Masthead and metric tiles ── */
  function buildMasthead() {
    const word = { complete: 'Complete', incomplete: 'Incomplete', setup: 'Setup' }[data.status] || data.status;

      h('div', { class: 'status-tile', dataset: { status: data.status } },

        h('p', { class: 'status-word', style: `--len:${Math.max(4.6, word.length)}` }, word),
        h('p', { class: 'status-note' }, data.meta.status_note)),
      h('div', { class: 'mast-main' },
        h('h1', { class: 'mast-title' }, data.title),
        h('p', { class: 'verdict' }, data.verdict),
        h('p', { class: 'summary' }, data.summary)));
  }

  let heroBar = null;
  let heroSegs = [];
  function buildMetrics() {
    const total = data.reviewers.length;
    const done = data.meta.completed;
    const short = data.reviewers.filter((r) => r.status !== 'completed');
    const all = tally(findings);
    heroSegs = SEVS.filter((s) => all[s]).map((s) => h('button', {
      type: 'button', class: 'herobar-seg', 'aria-pressed': 'false', style: `flex-grow:${all[s]}`,
      title: `${all[s]} ${s} ${SEV_LABEL[s]}. Click to filter; shift-click to show only ${s}.`,
      dataset: { severity: s, focusKey: `hero:${s}` },
      onclick: (event) => app.toggle('severity', s, event.shiftKey || event.altKey),
    }, h('span', { class: 'n' }, String(all[s])), h('span', { class: 'k' }, s)));
    heroBar = all.total
      ? h('div', { class: 'herobar', role: 'group', 'aria-label': 'Findings by severity; click to filter' }, heroSegs)
      : h('div', { class: 'herobar is-empty' }, 'No findings recorded');
    const metric = (label, value, note, flags) => h('div', { class: 'metric', dataset: flags || {} },
      kicker(label), h('div', { class: 'metric-value' }, value), h('p', { class: 'metric-note' }, note));
    return h('div', { class: 'metrics' },
      metric('Reviewers completed', [String(done), h('small', null, `/${total}`)],
        short.length ? `Not completed: ${short.map((r) => `${r.name} (${statusText(r.status)})`).join(', ')}` : 'Every requested reviewer finished.',
        done < total ? { warn: '' } : null),
      metric('Confirmed', String(data.meta.confirmed), hasFindings ? `of ${plural(findings.length, 'finding')}` : 'Nothing to confirm yet'),
      metric('Unresolved', String(data.meta.unresolved), 'Disputed or still needs validation', data.meta.unresolved ? { hatch: '' } : null),
      h('div', { class: 'metric metric-sev' },
        kicker('Findings by severity'),
        h('div', { class: 'metric-value' }, String(all.total)),
        h('div', { class: 'sev-block' }, heroBar,
          h('ul', { class: 'hero-legend' }, SEVS.map((s) => h('li', { dataset: { severity: s } },
            h('span', { class: 'sw', 'aria-hidden': 'true' }), h('span', { class: 'lbl' }, h('b', null, s), SEV_LABEL[s])))))));
  }
  function refreshHero() {
    if (!heroBar) return;
    heroBar.toggleAttribute('data-filtered', state.severity.size > 0);
    heroSegs.forEach((b) => b.setAttribute('aria-pressed', String(state.severity.has(b.dataset.severity))));
  }

  /* ── Stack map: x = depth, y = lane; connectors are CSS borders so they reflow and print ── */
  function buildStackMap() {
    const grid = h('div', { class: 'map-grid' });
    const clear = h('button', { type: 'button', class: 'btn', dataset: { focusKey: 'map-clear' }, onclick: () => app.setFacet('pr', []) }, 'Show all PRs');
    const section = h('section', { class: 'section section-stack', dataset: { section: 'stack' }, 'aria-labelledby': 'sec-stack' },
      secHead('sec-stack', 'Stack', h('span', null, `${plural(stack.order.length, 'pull request')} on `, h('code', null, stack.trunk))),
      h('div', { class: 'map-tools no-print' },
        h('p', { class: 'map-hint' }, 'Click a PR to show only its findings. Shift-click to add more.'),
        ui.toggle('prInherited', 'Include lower PRs'), clear),
      h('div', { class: 'map-scroll' }, grid));

    function node(n, row, o) {
      const label = app.prLabel(n.id);
      const diff = [n.additions != null ? `+${n.additions}` : null, n.deletions != null ? `−${n.deletions}` : null].filter(Boolean).join(' ');
      const diffLine = [diff, n.changed_files != null ? plural(n.changed_files, 'file') : null].filter(Boolean).join(' · ');
      const branchLine = [n.branch, n.head ? `@ ${n.head}` : null].filter(Boolean).join(' ');
      const card = h('button', {
        type: 'button', class: 'map-card', 'aria-pressed': String(state.pr.has(n.id)),
        title: `${label} ${n.title}. Click to show only this PR; shift-click to add it.`,
        dataset: { focusKey: `map:${n.id}`, empty: row.total ? null : '' },
        onclick: (event) => app.toggle('pr', n.id, !(event.shiftKey || event.altKey)),
      },
      h('span', { class: 'mc-top' },
        h('span', { class: 'mc-num' }, label),
        o.included ? h('span', { class: 'mc-flag', title: 'Included because a higher PR is selected with “Include lower PRs”' }, 'Included') : null,
        n.status ? h('span', { class: 'mc-status', dataset: { status: lower(n.status) } }, n.status) : null),
      h('span', { class: 'mc-title' }, n.title),
      branchLine ? h('span', { class: 'mc-line' }, branchLine) : null,
      n.forked && n.parent ? h('span', { class: 'mc-line' }, `forks from ${app.prLabel(n.parent)}`) : null,
      diffLine ? h('span', { class: 'mc-line' }, diffLine) : null,
      h('span', { class: 'mc-foot' }, segbar(row, { empty: 'Nothing in view' }),
        h('span', { class: 'mc-total', 'aria-label': plural(row.total, 'finding') }, String(row.total))));
      return h('div', { class: 'map-node', style: `grid-column:${o.col};grid-row:${n.lane + 1}`, dataset: { pr: n.id, wire: o.wire, included: o.included ? '' : null } },
        o.joined ? null : h('span', { class: 'stub stub-in', 'aria-hidden': 'true' }),
        h('span', { class: 'port port-in', 'aria-hidden': 'true' }),
        card,
        n.url ? h('a', { class: 'map-link', href: n.url, target: '_blank', rel: 'noopener noreferrer', title: `Open ${label} in a new tab`, 'aria-label': `Open ${label} in a new tab` }, '↗') : null,
        n.children.length ? [
          h('span', { class: 'stub stub-out', 'aria-hidden': 'true', dataset: { wire: o.outWire } }),
          h('span', { class: 'port port-out', 'aria-hidden': 'true', dataset: { wire: o.outWire } }),
        ] : null);
    }

    function render() {
      const rows = app.prBreakdown();
      const focus = new Set();
      state.pr.forEach((id) => { if (stack.byId.has(id)) { focus.add(id); stack.ancestors(id).forEach((a) => focus.add(a)); } });
      const lit = (id) => !focus.size || focus.has(id);
      const included = new Set();
      if (state.prInherited) state.pr.forEach((id) => stack.ancestors(id).forEach((a) => { if (!state.pr.has(a)) included.add(a); }));
      grid.style.gridTemplateColumns = `var(--trunk-w) repeat(${stack.maxDepth + 1}, minmax(var(--card-min), var(--card-max)))`;
      const trunkWire = stack.roots.some((r) => lit(r.id)) ? 'on' : 'off';
      const items = [h('div', { class: 'map-node map-trunk', style: 'grid-column:1;grid-row:1' },
        h('div', { class: 'trunk-tile' }, h('span', { class: 'kicker' }, 'Base'), h('span', { class: 'trunk-name' }, stack.trunk)),
        h('span', { class: 'stub stub-out', 'aria-hidden': 'true', dataset: { wire: trunkWire } }),
        h('span', { class: 'port port-out', 'aria-hidden': 'true', dataset: { wire: trunkWire } }))];
      for (const n of stack.order) {
        const col = n.depth + 2;
        const fromLane = n.parentEntry ? n.parentEntry.lane : 0;
        const wire = lit(n.id) ? 'on' : 'off';
        if (n.lane > fromLane) {
          // Fork: drop from the parent's row to this row in the gutter just left of this column.
          const span = n.lane - fromLane + 1;
          const inset = `calc((100% - ${span - 1} * var(--gy)) / ${2 * span} - 1.5px)`;
          items.push(h('div', { class: 'map-elbow', 'aria-hidden': 'true', style: `grid-column:${col};grid-row:${fromLane + 1} / ${n.lane + 2}`, dataset: { wire } },
            h('span', { class: 'elbow-line', style: `top:${inset};bottom:${inset}` })));
        }
        items.push(node(n, rows.get(n.id), {
          col, wire, included: included.has(n.id), joined: n.lane > fromLane,
          outWire: n.children.some((c) => lit(c.id)) ? 'on' : 'off',
        }));
      }
      grid.replaceChildren(...items);
      clear.hidden = !state.pr.size;
    }
    return { section, render };
  }

  /* ── Filter strip ── */
  function buildStrip() {
    const filtersBadge = h('span', { class: 'badge' });
    const moreBadge = h('span', { class: 'badge' });
    const filtersBtn = h('button', { type: 'button', class: 'btn strip-toggle', 'aria-expanded': 'false', 'aria-controls': 'strip-body', onclick: () => { stripOpen = !stripOpen; sync(); } }, 'Filters', filtersBadge);
    const moreBtn = h('button', { type: 'button', class: 'btn more-toggle', 'aria-expanded': 'false', 'aria-controls': 'more-panel', onclick: () => { moreOpen = !moreOpen; sync(); } }, 'More', moreBadge);
    const more = h('div', { class: 'more-panel', id: 'more-panel' },
      ui.facet('pr'), ui.facet('reviewer', { legend: 'Raised by' }), ui.facet('confidence'), ui.facet('tag'),
      h('div', { class: 'more-group' }, h('span', { class: 'facet-legend' }, 'Display'),
        ui.select('groupBy', 'Lanes'), ui.select('sort', 'Sort'), ui.toggle('pinnedOnly', 'Pinned only'), ui.expand()),
      h('div', { class: 'more-group more-answers' }, h('span', { class: 'facet-legend' }, 'Answer every finding shown'),
        ui.bulkAnswer(),
        h('p', { class: 'more-note' }, 'Filter first (say P3), then ignore them in one go. Reset restores every default and deletes your comments.')),
      h('div', { class: 'more-group' }, h('span', { class: 'facet-legend' }, 'Export'),
        h('div', { class: 'strip-out' }, ui.copy('Copy Markdown'), ui.print('Print / PDF'))));
    const el = h('div', { class: 'strip no-print', role: 'region', 'aria-label': 'Filters and answers' },
      h('div', { class: 'strip-row strip-a' },
        filtersBtn, ui.search(),
        h('div', { class: 'strip-presets' }, ui.presets()),
        h('span', { class: 'strip-spacer' }),
        ui.count(), ui.reset('Clear'),
        h('div', { class: 'strip-view' }, moreBtn),
        ui.copyAnswers('Copy answers JSON')),
      h('div', { class: 'strip-body', id: 'strip-body' },
        h('div', { class: 'strip-row strip-b' },
          ui.facet('severity'), ui.facet('disposition'),
          h('span', { class: 'strip-spacer' }),
          ui.facet('answer')),
        more));
    function sync() {
      el.classList.toggle('is-open', stripOpen);
      filtersBtn.setAttribute('aria-expanded', String(stripOpen));
      moreBtn.setAttribute('aria-expanded', String(moreOpen));
      more.hidden = !moreOpen;
    }
    function refresh() {
      const secondary = ['pr', 'reviewer', 'confidence', 'tag'].reduce((n, k) => n + state[k].size, 0) + (state.pinnedOnly ? 1 : 0);
      moreBadge.textContent = secondary ? String(secondary) : '';
      const all = C.FACETS.reduce((n, k) => n + state[k].size, 0) + (state.q ? 1 : 0) + (state.pinnedOnly ? 1 : 0);
      filtersBadge.textContent = all ? String(all) : '';
    }
    new ResizeObserver(() => document.documentElement.style.setProperty('--strip-h', `${el.offsetHeight}px`)).observe(el);
    sync();
    return { el, refresh };
  }

  /* ── Board: disposition columns × group swimlanes ── */
  const boardHost = h('div', { class: 'board-host' });
  const showing = h('p', { class: 'board-showing' });

  function openFinding(id, opts) {
    const active = document.activeElement;
    opener = active && active.dataset && active.dataset.focusKey && !drawer.contains(active) ? active.dataset.focusKey : null;
    app.select(id, opts);
    const title = drawer.querySelector('.drawer-title');

  function card(f) {

  function colHead(d, n) {
    const folded = foldedCols.has(d);

    return h('div', { class: 'col-head', dataset: { disposition: d, folded: folded ? '' : null } },
      swatch(d), h('span', { class: 'col-label' }, DISP_LABEL[d]), h('span', { class: 'col-count' }, String(n)),

        onclick: () => { if (folded) foldedCols.delete(d); else foldedCols.add(d); keepFocus(renderBoard); },
      }, folded ? `+${n}` : 'Hide'));
  }

  function laneHead(g, folded, empty) {
    let tile = 'All';
    let kind = null;
    let label = g.label;
    let meta = null;
    if (g.pr) {
      tile = app.prLabel(g.pr.id);
      label = g.pr.title;
      meta = [g.pr.branch, g.pr.forked && g.pr.parent ? `forks from ${app.prLabel(g.pr.parent)}` : null, g.pr.status].filter(Boolean).join(' · ');
    } else if (g.key === C.CROSS_PR) { tile = 'Multi'; kind = 'cross'; meta = 'Root cause spans more than one PR'; }
    else if (g.key === C.NO_PR) { tile = '—'; kind = 'none'; }
    else if (g.severity) { tile = g.severity; label = SEV_LABEL[g.severity]; }
    const parts = [
      h('span', { class: 'lane-tile', dataset: { severity: g.severity || null, kind } }, tile),
      h('span', { class: 'lane-text' }, h('span', { class: 'lane-label' }, label), meta ? h('span', { class: 'lane-meta' }, meta) : null),
      empty ? h('span', { class: 'lane-empty' }, 'Nothing in view') : h('span', { class: 'lane-bar' }, segbar(tally(g.items), { size: 'sm' })),
      h('span', { class: 'lane-count' }, String(g.items.length)),
    ];
    if (empty) return h('div', { class: 'lane-head' }, parts);
    return h('button', {
      type: 'button', class: 'lane-head', 'aria-expanded': String(!folded), title: folded ? 'Expand this lane' : 'Collapse this lane',
      dataset: { focusKey: `lane:${g.key}` },
      onclick: () => { if (foldedLanes.has(g.key)) foldedLanes.delete(g.key); else foldedLanes.add(g.key); keepFocus(renderBoard); },
    }, parts, h('span', { class: 'lane-chev', 'aria-hidden': 'true' }, folded ? '+' : '−'));
  }

  function cell(d, items) {
    const folded = foldedCols.has(d);
    return h('div', { class: 'cell', dataset: { disposition: d, count: String(items.length), folded: folded ? '' : null } },
      h('div', { class: 'cell-label' }, swatch(d), h('span', null, DISP_LABEL[d]), h('span', { class: 'cell-n' }, String(items.length))),
      folded && items.length ? h('span', { class: 'cell-fold', 'aria-hidden': 'true', title: `${plural(items.length, 'finding')} in the hidden column` }, String(items.length)) : null,
      items.map(card));
  }

  function lane(g, bare) {
    const empty = !g.items.length;
    const folded = !bare && foldedLanes.has(g.key);
    return h('section', {
      class: 'lane', 'aria-label': bare ? 'Findings' : `${g.label}: ${plural(g.items.length, 'finding')}`,
      dataset: { lane: g.key, empty: empty ? '' : null, collapsed: folded ? '' : null },
    },
    bare ? null : laneHead(g, folded, empty),
    empty ? null : h('div', { class: 'lane-cells' }, DISPS.map((d) => cell(d, g.items.filter((f) => f.disposition === d)))));
  }

  function noMatch() {
    const answerOnly = state.answer.size > 0;
    return h('div', { class: 'nomatch' },
      h('p', { class: 'nomatch-big' }, 'No findings match'),
      h('p', { class: 'nomatch-why' }, `Current view: ${app.filterSummary()}`),
      h('div', { class: 'nomatch-actions' },
        app.isFiltered() ? h('button', { type: 'button', class: 'btn btn-solid', dataset: { focusKey: 'nomatch-clear' }, onclick: () => app.reset() }, 'Clear filters') : null,
        answerOnly ? h('button', { type: 'button', class: 'btn', dataset: { focusKey: 'nomatch-answer' }, onclick: () => app.setFacet('answer', []) }, 'Show fix and ignore') : null));
  }

  function renderBoard() {
    const v = app.view({ keepEmpty: true });
    showing.textContent = `${v.flat.length} of ${plural(findings.length, 'finding')} shown`;
    if (!v.flat.length) { boardHost.replaceChildren(noMatch()); return; }
    const bare = state.groupBy === 'disposition' || state.groupBy === 'none';
    const groups = bare ? [{ key: 'all', label: 'All findings', items: v.flat }] : v.groups;
    const counts = Object.fromEntries(DISPS.map((d) => [d, 0]));
    v.flat.forEach((f) => { counts[f.disposition] += 1; });
    const cols = DISPS.map((d) => (foldedCols.has(d) ? 'var(--fold)' : 'minmax(0,1fr)')).join(' ');
    boardHost.replaceChildren(h('div', { class: 'board', style: `--cols:${cols}`, dataset: { bare: bare ? '' : null } },
      h('div', { class: 'board-head' }, DISPS.map((d) => colHead(d, counts[d]))),
      groups.map((g) => lane(g, bare))));
  }

    }

      secHead('sec-board', 'Board', [showing, ui.filterSummary(), ui.answerSummary()]),

  /* ── Who found what ── */
  const matrixHost = h('div', { class: 'matrix-host' });
  function renderMatrix() {
    const list = app.view().flat;
    const R = reviewerNames;
    const n = R.length;
    if (!list.length) { matrixHost.replaceChildren(h('p', { class: 'muted' }, 'No findings in the current view.')); return; }
    const hits = (f) => R.filter((r) => f.reviewers.includes(r)).length;
    const isAll = (k) => n > 1 && k === n;
    const stats = [];
    for (let k = n; k >= 0; k -= 1) {
      const count = list.filter((f) => hits(f) === k).length;
      if (k === 0 && !count) continue;
      stats.push(h('div', { class: 'mx-stat', dataset: { k: isAll(k) ? 'all' : String(k) } },
        h('b', null, String(count)),
        h('span', null, isAll(k) ? `All ${n} reviewers` : k === 0 ? 'Coordinator only' : k === 1 ? 'One reviewer' : `${k} of ${n} reviewers`)));
    }
    const rows = list.map((f) => {
      const k = hits(f);
      return h('tr', { class: `mx-row${isAll(k) ? ' is-all' : k <= 1 ? ' is-solo' : ''}`, dataset: { findingId: f.id, disposition: f.disposition } },
        h('th', { scope: 'row' }, h('span', { class: 'mx-fin' },

        R.map((r) => h('td', { class: 'mx-cell' }, f.reviewers.includes(r)

        h('td', { class: 'mx-agree' }, h('span', { class: 'mx-agree-tag' }, isAll(k) ? `All ${n}` : `${k}/${n}`)));
    });
    const table = h('table', { class: 'matrix' },
      h('caption', { class: 'sr-only' }, 'Which reviewer raised each finding in the current view'),
      h('thead', null, h('tr', null,
        h('th', { scope: 'col' }, 'Finding'),
        R.map((r) => h('th', { scope: 'col', class: 'mx-h-rv', title: r }, h('span', { class: 'mx-rv' }, ui.reviewerBadges([r]), h('span', { class: 'mx-rv-name' }, r)))),
        h('th', { scope: 'col', class: 'mx-h-agree' }, 'Agreement'))),
      h('tbody', null, rows),
      h('tfoot', null, h('tr', null,
        h('th', { scope: 'row' }, 'Raised in view'),
        R.map((r) => {
          const raised = list.filter((f) => f.reviewers.includes(r)).length;
          const solo = list.filter((f) => f.reviewers.length === 1 && f.reviewers[0] === r).length;
          return h('td', { class: 'mx-total' }, h('b', null, String(raised)), h('span', null, `${solo} alone`));
        }),
        h('td', null))));
    matrixHost.replaceChildren(h('div', { class: 'mx-summary' }, stats), h('div', { class: 'mx-scroll' }, table));
  }

  /* ── Reviewers ── */
  function teamCard(r) {
    const tone = BAD.includes(r.status) ? 'bad' : WARN.includes(r.status) ? 'warn' : r.status === 'not_run' ? 'idle' : r.status === 'completed' ? 'ok' : 'idle';

  function buildTeam() {

      h('div', { class: 'lists' }, list('checks', 'Checks', data.checks), list('gaps', 'Gaps', data.gaps), list('next', 'Next steps', data.next_steps)),
      data.notes.length ? h('div', { class: 'notes' }, data.notes.map((n) => h('article', { class: 'note' }, n.title ? h('h3', null, n.title) : null, h('p', null, n.body || '')))) : null,
      data.sources.length ? h('div', { class: 'sources' }, kicker('Sources'),

  /* ── Detail drawer ── */
  const drawer = h('aside', { class: 'drawer no-print', role: 'dialog', 'aria-modal': 'false', 'aria-labelledby': 'drawer-title', hidden: true });
  // One handle node, re-appended on every render so a drag survives re-renders. Width lives in --drawer-width.
  const drawerHandle = ui.resizer(drawer, { key: 'board-drawer', min: 380, label: 'Resize the details drawer' });
  // Full-screen toggle (core key f). One node, so its focus survives re-renders; 'layout' only re-syncs it.
  const fullBtn = h('button', {
    type: 'button', class: 'drawer-full', 'aria-pressed': 'false', dataset: { focusKey: 'drawer-full' }, onclick: () => app.toggleDrawerFull(),
  }, h('span', { class: 'drawer-full-icon', 'aria-hidden': 'true' }), h('span', { class: 'drawer-full-label' }, 'Full screen'));
  /** In full screen the board is covered, so keep keyboard focus inside the drawer. Runs after core has
      restored focus to the control that was re-rendered (a microtask), so it only catches focus left outside. */
  function focusIntoFullDrawer() {
    queueMicrotask(() => {
      if (!app.isDrawerFull() || drawer.contains(document.activeElement)) return;
      const title = drawer.querySelector('.drawer-title');
      if (title) title.focus({ preventScroll: true });
    });
  }
  function syncFull() {
    const on = app.isDrawerFull();
    fullBtn.setAttribute('aria-pressed', String(on));
    fullBtn.title = on ? 'Leave full screen (f or Esc)' : 'Full screen (f)';
  }
  drawer.addEventListener('input', (event) => {
    const owner = event.target.closest && event.target.closest('[data-answer-for]');
    if (owner && event.target.matches('.answer-input')) syncComment(owner.dataset.answerFor);
  });
  function renderDrawer() {
    const f = state.selected ? app.byId.get(state.selected) : null;
    if (!f) {
      if (!drawer.hidden) {
        const hadFocus = drawer.contains(document.activeElement);
        drawer.hidden = true;
        drawer.replaceChildren();
        if (hadFocus || document.activeElement === document.body) {
          const back = (opener && document.querySelector(`[data-focus-key="${CSS.escape(opener)}"]`))
            || (drawerFor && document.querySelector(`[data-finding-id="${CSS.escape(drawerFor)}"] .card-open`));
          if (back) back.focus({ preventScroll: true });
        }
        opener = null;
      }
      drawerFor = null;
      return;
    }
    const flat = app.view().flat;
    const at = flat.findIndex((x) => x.id === f.id);
    const step = (dir, glyph, label) => h('button', {
      type: 'button', class: 'drawer-step', 'aria-label': label, title: `${label} (${dir > 0 ? 'j' : 'k'})`,
      disabled: at >= 0 && (dir < 0 ? at === 0 : at === flat.length - 1),
      dataset: { focusKey: `drawer-${dir > 0 ? 'next' : 'prev'}` }, onclick: () => app.move(dir),
    }, glyph);
    const answerFiltered = state.answer.size && !state.answer.has(app.answer(f.id));
    const outNote = answerFiltered ? `Your answer is ${C.ANSWER_LABELS[app.answer(f.id)]}, so the “Your answer” filter leaves it out of the current view.` : 'Not in the current filtered view.';
    // Same finding re-rendered (answer, pin, or filter change): keep the reader's place in the drawer.
    const prevScroll = drawerFor === f.id && drawer.querySelector('.drawer-scroll') ? drawer.querySelector('.drawer-scroll').scrollTop : 0;
    drawer.dataset.severity = f.severity;
    drawer.dataset.disposition = f.disposition;
    drawer.toggleAttribute('data-ignored', app.isIgnored(f.id));
    const scroll = h('div', { class: 'drawer-scroll' },
      at < 0 ? h('p', { class: 'drawer-note' }, outNote) : null,
      h('h2', { class: 'drawer-title', id: 'drawer-title', tabindex: '-1', dataset: { focusKey: 'drawer-title' } }, f.title),
      h('div', { class: 'drawer-disp' },
        h('span', { class: 'drawer-disp-label' }, swatch(f.disposition), DISP_LABEL[f.disposition]),
        ui.findingActions(f, { answer: false })),
      h('div', { class: 'drawer-lead' },
        ui.answer(f, { legend: 'Your answer', rows: 3, placeholder: 'Comment for whoever fixes it (optional): what to do differently, or why to ignore it' }),
        h('dl', { class: 'drawer-meta' },
        app.hasStack ? [h('dt', null, 'Pull request'), h('dd', null, f.prs.length
          ? h('span', { class: 'chips' }, f.prs.map((id) => h('span', { class: 'pr-ref' }, ui.prChip(id), h('span', { class: 'pr-ref-title' }, (stack.byId.get(id) || {}).title || ''))))
          : 'Not tied to one PR')] : null,
        [h('dt', null, 'Raised by'), h('dd', null, f.reviewers.length
          ? h('span', { class: 'who' }, f.reviewers.map((name) => h('span', { class: 'who-item' }, ui.reviewerBadges([name]), name)))
          : 'Coordinator')],
        [h('dt', null, 'Confidence'), h('dd', null, confidence(f.confidence))],
        f.tags.length ? [h('dt', null, 'Tags'), h('dd', null, h('span', { class: 'chips' }, f.tags.map((t) => h('button', {
          type: 'button', class: 'tag-chip', 'aria-pressed': String(state.tag.has(t)), title: `Show only findings tagged ${t}`,
          onclick: () => app.setFacet('tag', [t]),
        }, t))))] : null)),
      ui.findingFields(f));
    drawer.replaceChildren(
      drawerHandle,
      h('div', { class: 'drawer-band' },
        h('span', { class: 'drawer-sev' }, f.severity),
        h('span', { class: 'drawer-sevtext' }, h('span', null, SEV_LABEL[f.severity]), h('span', { class: 'drawer-id' }, f.id),
          h('span', { class: 'drawer-stamp' }, 'Ignored')),
        h('span', { class: 'drawer-nav' }, step(-1, '↑', 'Previous finding'), h('span', { class: 'drawer-pos' }, at >= 0 ? `${at + 1}/${flat.length}` : '–'), step(1, '↓', 'Next finding')),
        h('span', { class: 'drawer-hint', 'aria-hidden': 'true' }, h('kbd', null, 'j'), h('kbd', null, 'k'), ' move · ', h('kbd', null, 'Esc'), ' leaves'),
        fullBtn,
        h('button', { type: 'button', class: 'drawer-close', 'aria-label': 'Close details (Esc)', title: 'Close (Esc)', dataset: { focusKey: 'drawer-close' }, onclick: () => app.select(null) }, '×')),
      scroll);
    drawer.hidden = false;
    if (prevScroll) scroll.scrollTop = prevScroll;
    drawerFor = f.id;
    syncFull();
  }

  /* ── Footer ── */
  function buildFooter() {
    return h('footer', { class: 'foot' },
      h('span', null, h('b', null, 'Multi-agent review'), ` · generated ${data.generated_at}`),
      hasFindings ? h('span', { class: 'foot-note' }, 'Every finding is set to Fix unless the coordinator rejected it. Your answers, comments, and pins are saved in this browser only and shared by every design of this report; they never change the report.') : null,
      hasFindings ? ui.shortcuts() : null);
  }

  /* ── Mount ── */
  const map = app.hasStack ? buildStackMap() : null;
  const strip = hasFindings ? buildStrip() : null;
  const main = h('main', { class: 'page', id: 'main' },
    buildMasthead(), buildMetrics(),
    map ? map.section : null,
    strip ? strip.el : null,
    buildBoardSection(),
    hasFindings ? h('section', { class: 'section', dataset: { section: 'matrix' }, 'aria-labelledby': 'sec-matrix' },
      secHead('sec-matrix', 'Who found what', 'Rows follow the current filters. Filled dots mark the reviewers that raised a finding.'), matrixHost) : null,
    buildTeam(), buildDetails());
  document.getElementById('app').append(buildTopbar(), main, buildFooter(), drawer);

  app.subscribe((reason) => {
    if (reason === 'open' || reason === 'sections') return;
    if (reason === 'layout') { syncFull(); focusIntoFullDrawer(); return; } // full screen toggled: no re-render
    if (reason !== 'select') {
      refreshHero();
      if (map) map.render();
      if (hasFindings) { renderBoard(); renderMatrix(); strip.refresh(); }
    }
    renderDrawer();
    focusIntoFullDrawer();
  });
  app.start();
})();
</script>
</body>
</html>
