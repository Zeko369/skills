<style>
/* ── Board: a Swiss planning board. Black grotesk, strict grid, signal colors only for meaning. ── */
:root{
  --ink:#0a0a0a;--paper:#fff;--wash:#f3f3f0;--wash-2:#e8e8e3;--line:#d6d6cf;--muted:#56564f;--faint:#8b8b84;
  --p0:#e5202e;--p1:#ff6a00;--p2:#ffc400;--p3:#2f6bff;
  --purple:#7b2fff;--grey:#b4b4ac;--grey-lt:#e4e4de;--green:#00b25a;--amber:#ffb000;--wire-off:#d3d3cc;
  --sans:"Helvetica Neue",Helvetica,Arial,system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --pad:clamp(16px,2.8vw,40px);
  --strip-h:0px;
  --hatch-ink:repeating-linear-gradient(-45deg,var(--ink) 0 1.5px,transparent 1.5px 4.5px);
  --hatch-soft:repeating-linear-gradient(-45deg,rgba(10,10,10,.075) 0 2px,transparent 2px 9px);
  --hazard:repeating-linear-gradient(-45deg,var(--ink) 0 10px,var(--p2) 10px 20px);
  color-scheme:light;
}
[data-severity="P0"]{--sevc:var(--p0);--sevi:#fff}
[data-severity="P1"]{--sevc:var(--p1);--sevi:var(--ink)}
[data-severity="P2"]{--sevc:var(--p2);--sevi:var(--ink)}
[data-severity="P3"]{--sevc:var(--p3);--sevi:#fff}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:calc(var(--strip-h) + 72px)}
body{margin:0;background:var(--paper);color:var(--ink);font:400 15px/1.45 var(--sans);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
h1,h2,h3,p,figure{margin:0}
button,input,select{font:inherit;color:inherit}
button{border-radius:0}
a{color:inherit;text-decoration-thickness:2px;text-underline-offset:3px}
a:hover{text-decoration-color:var(--p1)}
code,pre,kbd{font-family:var(--mono)}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.kicker{display:block;font:800 10.5px/1.15 var(--sans);letter-spacing:.14em;text-transform:uppercase}
.muted{color:var(--muted)}
noscript{display:block;padding:24px;font-weight:700}

/* Buttons */
.btn,.reset,.copy,.print,.expand-all,.collapse-all,.action,.bulk-answer,.view-pop>summary,.rv-output>summary{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;padding:0 12px;border:2px solid var(--ink);
  background:var(--paper);color:var(--ink);font:800 11px/1 var(--sans);letter-spacing:.08em;text-transform:uppercase;cursor:pointer;white-space:nowrap;text-decoration:none;user-select:none}
:is(.btn,.reset,.copy,.print,.expand-all,.collapse-all,.action,.bulk-answer,.view-pop>summary,.rv-output>summary):hover:not(:disabled){background:var(--ink);color:var(--paper)}
.btn-solid{background:var(--ink);color:var(--paper)}
.btn-solid:hover:not(:disabled){background:var(--paper)!important;color:var(--ink)!important}
.action[aria-pressed="true"],.btn[aria-expanded="true"]{background:var(--ink);color:var(--paper)}
.badge:empty{display:none}
.badge{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 4px;background:var(--p2);color:var(--ink);font:900 10.5px/1 var(--sans);letter-spacing:0}

/* ── Top bar ── */
.topbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 22px;padding:10px var(--pad);border-bottom:2px solid var(--ink);font:800 11px/1.2 var(--sans);letter-spacing:.13em;text-transform:uppercase}
.brand{display:inline-flex;align-items:center;gap:10px}
.brand-mark{display:inline-grid;grid-template-columns:repeat(4,6px);gap:2px}
.brand-mark i{height:16px;background:var(--sevc)}
.topbar-meta{color:var(--muted)}
.topbar-snap{font:600 11.5px/1.2 var(--mono);letter-spacing:0;text-transform:none;color:var(--muted)}
.topbar-tools{margin-left:auto;display:flex;gap:8px}
.view-pop{position:relative}
.view-pop>summary{list-style:none;height:28px}
.view-pop>summary::-webkit-details-marker{display:none}
.view-pop>summary::after{content:"";border:4px solid transparent;border-top:5px solid currentColor;margin:4px 0 0 2px}
.view-panel{position:absolute;right:0;top:calc(100% + 8px);z-index:70;display:grid;gap:14px;min-width:230px;padding:14px 16px 16px;background:var(--paper);border:2px solid var(--ink);box-shadow:6px 6px 0 var(--ink);text-transform:none;letter-spacing:0;font-weight:500}
.section-toggles{display:grid;gap:9px}
.section-toggles .facet-legend{margin-bottom:4px}

/* ── Masthead ── */
.masthead{display:grid;grid-template-columns:minmax(250px,25%) minmax(0,1fr);border-bottom:2px solid var(--ink)}
.status-tile{container-type:inline-size;position:relative;display:flex;flex-direction:column;gap:16px;min-height:330px;padding:26px 24px 24px;border-right:2px solid var(--ink);overflow:hidden;--status-max:86px}
.status-word{font-size:min(var(--status-max),calc(146cqi / var(--len)));font-weight:900;line-height:.84;letter-spacing:-.055em;text-transform:uppercase;margin-top:auto}
.status-note{font:600 13.5px/1.42 var(--sans);max-width:34ch}
.status-tile[data-status="complete"]{background:var(--green)}
.status-tile[data-status="incomplete"]{background:var(--p2);padding-top:48px}
.status-tile[data-status="incomplete"]::before{content:"";position:absolute;left:0;right:0;top:0;height:22px;background:var(--hazard);border-bottom:2px solid var(--ink)}
.status-tile[data-status="setup"]{background:var(--paper) var(--hatch-soft)}
.status-tile[data-status="setup"] .status-word{background:var(--paper);align-self:flex-start;padding:.06em .08em .02em 0;box-shadow:0 0 0 0 var(--paper)}
.status-tile[data-status="setup"] .status-note{background:var(--paper);padding:2px 4px 2px 0}
.mast-main{display:flex;flex-direction:column;gap:20px;min-width:0;padding:28px var(--pad) 30px 36px}
.mast-title{font:800 13px/1.35 var(--sans);letter-spacing:.1em;text-transform:uppercase;max-width:90ch;overflow-wrap:anywhere}
.verdict{font-size:clamp(30px,3.7vw,58px);font-weight:900;line-height:.98;letter-spacing:-.042em;max-width:21em;text-wrap:balance;overflow-wrap:anywhere}
.summary{font-size:17px;line-height:1.5;max-width:68ch;color:#2b2b28;margin-top:auto}

/* ── Metric tiles ── */
.metrics{display:grid;grid-template-columns:minmax(250px,25%) minmax(0,1fr) minmax(0,1fr) minmax(0,2.4fr);border-bottom:2px solid var(--ink)}
.metric{position:relative;display:flex;flex-direction:column;gap:12px;min-width:0;padding:22px 24px 22px;border-right:2px solid var(--ink)}
.metric:last-child{border-right:0}
.metric-value{font-size:clamp(60px,6.6vw,108px);font-weight:900;line-height:.8;letter-spacing:-.065em;font-variant-numeric:tabular-nums;white-space:nowrap}
.metric-value small{font-size:.4em;letter-spacing:-.03em;color:var(--muted);margin-left:.06em}
.metric-note{margin-top:auto;font-size:13px;line-height:1.35;color:var(--muted)}
.metric[data-warn]{padding-top:30px}
.metric[data-warn]::before{content:"";position:absolute;left:0;right:0;top:0;height:10px;background:var(--hazard)}
.metric[data-hatch]{background:var(--hatch-soft)}
.metric[data-hatch] .metric-value{background:var(--paper);align-self:flex-start;padding-right:.05em}
.metric-sev{display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-rows:auto 1fr;column-gap:26px;row-gap:12px}
.metric-sev .kicker{grid-column:1/-1}
.metric-sev .metric-value{align-self:end}
.sev-block{display:flex;flex-direction:column;gap:10px;min-width:0;align-self:end}
.herobar{display:flex;height:56px;border:2px solid var(--ink);background:var(--paper)}
.herobar-seg{flex:1 1 0;min-width:40px;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;padding:6px 8px;border:0;border-right:2px solid var(--ink);background:var(--sevc);color:var(--sevi);cursor:pointer;text-align:left}
.herobar-seg:last-child{border-right:0}
.herobar-seg .n{font:900 24px/.85 var(--sans);letter-spacing:-.04em}
.herobar-seg .k{font:800 10px/1 var(--sans);letter-spacing:.12em}
.herobar[data-filtered] .herobar-seg[aria-pressed="false"]{background:repeating-linear-gradient(-45deg,var(--sevc) 0 3px,var(--paper) 3px 8px);color:var(--ink)}
.herobar[data-filtered] .herobar-seg[aria-pressed="false"] :is(.n,.k){background:var(--paper);padding:1px 2px}
.herobar-seg[aria-pressed="true"]{box-shadow:inset 0 -7px 0 var(--ink)}
.herobar-seg:focus-visible{outline-offset:-6px;outline-color:var(--ink)}
.herobar.is-empty{align-items:center;justify-content:center;background:var(--hatch-soft);font:800 11px/1 var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.hero-legend{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.hero-legend li{display:grid;grid-template-columns:12px minmax(0,1fr);column-gap:6px;align-items:baseline;font-size:12px;line-height:1.2}
.hero-legend .sw{width:12px;height:12px;background:var(--sevc);align-self:center}
.hero-legend b{font-weight:900}
.hero-legend .lbl{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hero-legend .lbl b{color:var(--ink);margin-right:4px}

/* ── Sections ── */
.page{counter-reset:sec}
.section{counter-increment:sec;padding:46px var(--pad) 54px;border-bottom:2px solid var(--ink);min-width:0}
.sec-head{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px 18px;margin-bottom:26px}
.sec-num{display:inline-flex;align-items:center;justify-content:center;min-width:46px;height:46px;padding:0 6px;background:var(--ink);color:var(--paper);font:900 18px/1 var(--sans);letter-spacing:-.02em}
.sec-num::before{content:counter(sec,decimal-leading-zero)}
.sec-title{font-size:clamp(34px,4vw,62px);font-weight:900;line-height:.82;letter-spacing:-.055em}
.sec-aside{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;gap:3px;max-width:62ch;text-align:right;font-size:13px;line-height:1.35;color:var(--muted)}
.sec-aside code{font-size:12px;color:var(--ink);font-weight:700}
.board-showing{font-weight:800;color:var(--ink)}
.filter-summary{margin:0}

/* ── Stack map ── */
.map-tools{display:flex;flex-wrap:wrap;align-items:center;gap:10px 20px;margin:-6px 0 18px}
.map-hint{margin-right:auto;font-size:13px;color:var(--muted)}
.map-tools .toggle{font:800 12px/1 var(--sans)}
.map-scroll{overflow-x:auto;overscroll-behavior-x:contain;padding:8px 10px 18px 8px;margin:0 -10px 0 -8px;scroll-snap-type:x proximity;scrollbar-width:thin}
.map-grid{--gx:64px;--gy:22px;--trunk-w:104px;--card-min:226px;--card-max:350px;position:relative;display:grid;grid-auto-rows:1fr;column-gap:var(--gx);row-gap:var(--gy);justify-content:start;width:100%;min-width:min-content}
.map-node{position:relative;display:flex;min-width:0;scroll-snap-align:start;scroll-margin-left:12px}
.trunk-tile{position:relative;z-index:1;flex:1;display:flex;flex-direction:column;justify-content:center;gap:6px;padding:14px 12px;background:var(--ink);color:var(--paper);min-width:0}
.trunk-name{font:900 24px/1 var(--sans);letter-spacing:-.04em;overflow-wrap:anywhere}
[data-wire="on"]{--wire:var(--ink)}
[data-wire="off"]{--wire:var(--wire-off)}
.stub{position:absolute;top:calc(50% - 1.5px);height:3px;background:var(--wire,var(--ink));z-index:0}
.stub-in{right:100%;width:calc(var(--gx) / 2)}
.stub-out{left:100%;width:calc(var(--gx) / 2)}
.port{position:absolute;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:var(--paper);border:3px solid var(--wire,var(--ink));z-index:3;pointer-events:none}
.port-in{left:0}
.port-out{left:100%}
.map-elbow{position:relative;justify-self:start;width:0;pointer-events:none;z-index:0}
.elbow-line{position:absolute;right:0;width:calc(var(--gx) / 2);border-left:3px solid var(--wire,var(--ink));border-bottom:3px solid var(--wire,var(--ink));border-bottom-left-radius:18px}
.map-card{position:relative;z-index:1;flex:1;min-width:0;display:flex;flex-direction:column;gap:6px;padding:14px 16px 14px;background:var(--paper);border:2px solid var(--ink);color:var(--ink);text-align:left;cursor:pointer;transition:transform .12s ease,box-shadow .12s ease,background-color .12s ease}
.map-card:hover{transform:translate(-2px,-2px);box-shadow:5px 5px 0 var(--ink)}
.map-card[aria-pressed="true"]{background:var(--ink);color:var(--paper);box-shadow:6px 6px 0 var(--p2);transform:translate(-2px,-2px)}
.map-node[data-pr]:has(.map-card[aria-pressed="true"]) .port{background:var(--ink)}
.mc-top{display:flex;align-items:center;gap:8px;min-width:0;padding-right:30px}
.mc-num{font:900 32px/.82 var(--sans);letter-spacing:-.05em}
.mc-status{margin-left:auto;padding:4px 6px 3px;border:2px solid currentColor;font:800 9.5px/1 var(--sans);letter-spacing:.12em;text-transform:uppercase}
.mc-status[data-status="draft"]{border-style:dashed}
.mc-flag{padding:4px 6px 3px;background:var(--p2);color:var(--ink);font:900 9.5px/1 var(--sans);letter-spacing:.1em;text-transform:uppercase}
.mc-title{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.56em;margin-top:4px;font:700 14.5px/1.28 var(--sans);letter-spacing:-.01em}
.mc-line{font:500 11.5px/1.35 var(--mono);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.map-card[aria-pressed="true"] .mc-line{color:#c4c4bc}
.mc-foot{display:flex;align-items:center;gap:10px;margin-top:auto;padding-top:8px}
.mc-total{font:900 26px/.8 var(--sans);letter-spacing:-.05em;min-width:1.1em;text-align:right;font-variant-numeric:tabular-nums}
.map-card[data-empty] .mc-foot{opacity:.55}
.map-node[data-included] .map-card{outline:3px dashed var(--ink);outline-offset:5px}
.map-link{position:absolute;top:12px;right:12px;z-index:2;display:flex;align-items:center;justify-content:center;width:26px;height:26px;border:2px solid var(--ink);background:var(--paper);color:var(--ink);font:900 14px/1 var(--sans);text-decoration:none}
.map-link:hover{background:var(--ink);color:var(--paper)}

/* Segmented severity bars */
.segbar{display:flex;flex:1;min-width:0;height:22px;gap:2px}
.segbar-seg{flex:1 1 0;min-width:18px;display:flex;align-items:center;justify-content:center;background:var(--sevc);color:var(--sevi);font:900 11px/1 var(--sans);font-variant-numeric:tabular-nums}
.segbar-none{flex:1;display:flex;align-items:center;padding:0 6px;background:var(--hatch-soft);font:800 9.5px/1 var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--faint);white-space:nowrap;overflow:hidden}
.map-card[aria-pressed="true"] .segbar-none{color:#9a9a92;background:repeating-linear-gradient(-45deg,rgba(255,255,255,.18) 0 2px,transparent 2px 9px)}
.segbar-sm{height:12px}
.segbar-sm .segbar-seg{font-size:0;min-width:8px}

/* ── Filter strip ── */
.strip{position:sticky;top:0;z-index:40;padding:10px var(--pad) 10px;background:rgba(255,255,255,.97);border-top:3px solid var(--ink);border-bottom:3px solid var(--ink)}
@supports (backdrop-filter:blur(6px)){.strip{background:rgba(255,255,255,.9);backdrop-filter:blur(8px) saturate(1.1)}}
.strip-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;min-width:0}
.strip-body .strip-row{margin-top:10px}
.strip-spacer{flex:1 1 0}
.strip-toggle{display:none}
.strip-out,.strip-view{display:flex;align-items:center;gap:8px}
.strip-view{gap:12px}
.strip-a .reset{margin-left:-6px}
.copy-answers{display:inline-flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:3px;height:36px;padding:0 12px;border:2px solid var(--ink);background:var(--ink);color:var(--paper);text-align:left;white-space:nowrap;user-select:none}
.copy-answers-label{font:800 11px/1 var(--sans);letter-spacing:.08em;text-transform:uppercase}
.copy-answers-label::after{content:"  ⧉";letter-spacing:0}
.copy-answers-count{font:700 10.5px/1 var(--sans);letter-spacing:.02em;color:var(--p2);font-variant-numeric:tabular-nums}
.copy-answers:hover:not(:disabled){background:var(--paper);color:var(--ink);box-shadow:4px 4px 0 var(--ink);transform:translate(-2px,-2px)}
.copy-answers:hover:not(:disabled) .copy-answers-count{color:var(--muted)}
.copy-answers:active:not(:disabled){transform:none;box-shadow:none}
.facet-answer .facet-swatch{display:inline-flex;align-items:center;justify-content:center;width:14px;height:14px;border:2px solid currentColor;font:900 9px/1 var(--sans)}
.facet-answer[data-value="fix"] .facet-swatch::before{content:"✓"}
.facet-answer[data-value="ignore"] .facet-swatch{background:var(--hatch-ink)}
.facet-answer[data-value="ignore"][aria-pressed="true"] .facet-swatch{background:repeating-linear-gradient(-45deg,var(--paper) 0 1.5px,transparent 1.5px 4.5px)}
.strip-b .facet[data-facet="answer"] .facet-legend{color:var(--ink)}
.strip-b{column-gap:22px}
.strip-b .facet{flex-direction:column;align-items:flex-start;gap:5px}
.search-input{-webkit-appearance:none;appearance:none;height:36px;width:clamp(190px,20vw,320px);min-width:0;padding:0 12px;border:2px solid var(--ink);border-radius:0;background:var(--paper);font:600 14px/1 var(--sans)}
.search-input::placeholder{color:var(--faint);font-weight:500}
.search-input::-webkit-search-cancel-button{filter:grayscale(1) brightness(.2);cursor:pointer}
.presets{display:flex;flex-wrap:wrap}
.preset{height:36px;padding:0 12px;margin-right:-2px;border:2px solid var(--ink);background:var(--paper);font:800 11px/1 var(--sans);letter-spacing:.08em;text-transform:uppercase;cursor:pointer;position:relative}
.preset:hover{background:var(--wash-2)}
.preset[aria-pressed="true"]{background:var(--ink);color:var(--paper);z-index:1}
.preset:focus-visible{z-index:2}
.result-count{margin:0;font:800 13px/1 var(--sans);font-variant-numeric:tabular-nums;white-space:nowrap}
.facet{display:flex;align-items:center;gap:8px;min-width:0}
.facet-legend{float:left;padding:0;margin:0;font:800 10px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.facet-options{row-gap:4px;min-width:0}
.facet-option{position:relative;display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 0 0 9px;margin-right:-2px;border:2px solid var(--ink);background:var(--paper);font:700 12px/1 var(--sans);white-space:nowrap;max-width:100%}
.facet-option:hover{background:var(--wash-2);z-index:1}
.facet-option:focus-visible{z-index:2}
.facet-option[aria-pressed="true"]{background:var(--ink);color:var(--paper);z-index:1}
.facet-swatch{width:10px;height:10px;flex:none;display:none}
.facet-label{overflow:hidden;text-overflow:ellipsis}
.facet-hint{max-width:15em;overflow:hidden;text-overflow:ellipsis;font-weight:500;color:var(--muted)}
.facet-option[aria-pressed="true"] .facet-hint{color:#c9c9c1}
.facet-count{align-self:stretch;display:inline-flex;align-items:center;justify-content:center;min-width:28px;padding:0 6px;margin-left:2px;border-left:2px solid currentColor;font-weight:900;font-variant-numeric:tabular-nums}
.facet-option[aria-pressed="true"] .facet-count{border-left-color:rgba(255,255,255,.4)}
.facet-severity .facet-swatch{display:block;background:var(--sevc);width:12px;height:12px}
.facet-severity[aria-pressed="true"]{background:var(--sevc);color:var(--sevi)}
.facet-severity[aria-pressed="true"] .facet-swatch{outline:2px solid currentColor;outline-offset:1px}
.facet-severity[aria-pressed="true"] .facet-count{border-left-color:currentColor}
.facet-disposition .facet-swatch,.facet-reviewer .facet-swatch{display:block}
.facet-reviewer .facet-swatch{width:12px;height:12px;border:2px solid currentColor}
.facet-reviewer[data-rv="0"] .facet-swatch{background:currentColor}
.facet-reviewer[data-rv="2"] .facet-swatch{background:#c5c5bd}
.facet-reviewer[data-rv="3"] .facet-swatch{background:currentColor;box-shadow:inset 0 0 0 2px var(--paper)}
.facet-reviewer[data-rv="4"] .facet-swatch{background:#6f6f68}
.facet-reviewer[data-rv="5"] .facet-swatch{border-style:dashed}
.toggle{font:700 12px/1 var(--sans);white-space:nowrap}
.toggle input{width:16px;height:16px;margin:0;accent-color:var(--ink);cursor:pointer}
.toggle-count:not(:empty){display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:18px;padding:0 5px;background:var(--ink);color:var(--paper);font:900 10.5px/1 var(--sans)}
.select{display:inline-flex;align-items:center;gap:8px}
.select-label{font:800 10px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.select select{-webkit-appearance:none;appearance:none;height:30px;padding:0 30px 0 10px;border:2px solid var(--ink);border-radius:0;font:700 12px/1 var(--sans);cursor:pointer;
  background:var(--paper) no-repeat;background-image:linear-gradient(45deg,transparent 50%,var(--ink) 50%),linear-gradient(135deg,var(--ink) 50%,transparent 50%);background-position:calc(100% - 15px) 52%,calc(100% - 10px) 52%;background-size:5px 5px}
.more-panel{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:18px 30px;margin-top:12px;padding-top:14px;border-top:2px solid var(--ink)}
.more-panel .facet{flex-direction:column;align-items:flex-start;gap:8px}
.more-panel .facet[data-facet="pr"]{grid-column:span 2}
.more-group{display:flex;flex-direction:column;align-items:flex-start;gap:10px}
.more-answers{grid-column:span 2}
.more-note{max-width:52ch;font-size:12px;line-height:1.4;color:var(--muted)}
.bulk-answers{gap:6px}
.bulk-answer{height:30px;padding:0 10px;font-size:10.5px}
.bulk-reset{border-style:dashed}
.expand-controls{display:flex;gap:6px}
.expand-controls button{height:28px;padding:0 9px;font-size:10.5px}

/* Disposition swatches: solid, hatched, purple, grey struck */
.disp-sw{display:inline-block;width:14px;height:14px;flex:none;border:2px solid var(--ink)}
:is(.disp-sw,.facet-disposition .facet-swatch){width:13px;height:13px;border:2px solid currentColor}
[data-disposition="confirmed"]>.facet-swatch,.disp-sw[data-disposition="confirmed"]{background:currentColor}
[data-disposition="needs validation"]>.facet-swatch,.disp-sw[data-disposition="needs validation"]{background:repeating-linear-gradient(-45deg,currentColor 0 1.5px,transparent 1.5px 4px)}
[data-disposition="disputed"]>.facet-swatch,.disp-sw[data-disposition="disputed"]{background:var(--purple);border-color:var(--purple)}
[data-disposition="rejected"]>.facet-swatch,.disp-sw[data-disposition="rejected"]{border-color:var(--grey);background:linear-gradient(to top right,transparent calc(50% - 1.2px),currentColor calc(50% - 1.2px) calc(50% + 1.2px),transparent calc(50% + 1.2px)),var(--grey-lt)}
.facet-option[aria-pressed="true"][data-disposition="disputed"]{background:var(--purple);border-color:var(--purple)}
.facet-option[aria-pressed="true"][data-disposition="disputed"] .facet-swatch{border-color:var(--paper)}

/* Reviewer badges: monochrome so color stays reserved for severity */
.rv-badges{display:inline-flex;gap:3px}
.rv{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:20px;padding:0 3px;border:2px solid var(--ink);background:var(--paper);color:var(--ink);font:900 9px/1 var(--sans);letter-spacing:.04em}
.rv[data-rv="0"]{background:var(--ink);color:var(--paper)}
.rv[data-rv="2"]{background:#c5c5bd}
.rv[data-rv="3"]{background:var(--ink);color:var(--paper);box-shadow:inset 0 0 0 2px var(--paper)}
.rv[data-rv="4"]{background:#6f6f68;border-color:#6f6f68;color:var(--paper)}
.rv[data-rv="5"]{border-style:dashed}

/* ── Board ── */
.board{--fold:66px}
.board-head{position:sticky;top:var(--strip-h);z-index:30;display:grid;grid-template-columns:var(--cols);background:var(--paper);border-top:3px solid var(--ink);border-bottom:3px solid var(--ink)}
.col-head{display:flex;align-items:center;gap:10px;min-width:0;padding:12px 10px 12px 14px;border-left:2px solid var(--ink)}
.col-head:first-child{border-left:0}
.col-head .disp-sw{width:16px;height:16px}
.col-label{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:900 15px/1.05 var(--sans);letter-spacing:-.015em}
.col-count{margin-left:auto;font:900 32px/.78 var(--sans);letter-spacing:-.06em;font-variant-numeric:tabular-nums}
.col-toggle{flex:none;height:24px;padding:0 7px;border:2px solid var(--ink);background:var(--paper);font:800 9.5px/1 var(--sans);letter-spacing:.1em;text-transform:uppercase;cursor:pointer}
.col-toggle:hover{background:var(--ink);color:var(--paper)}
.col-head[data-folded]{justify-content:center;padding:10px 4px;background:var(--hatch-soft)}
.col-head[data-folded] :is(.disp-sw,.col-label,.col-count){display:none}
.col-head[data-folded] .col-toggle{font-size:12px;letter-spacing:0;padding:0 8px;height:28px;background:var(--paper)}
.lane{border-bottom:2px solid var(--ink)}
.board[data-bare] .lane{border-bottom:0}
.lane-head{display:flex;align-items:center;gap:14px;width:100%;min-width:0;padding:10px 14px 10px 10px;border:0;background:var(--wash);color:var(--ink);text-align:left;cursor:pointer}
button.lane-head:hover{background:var(--wash-2)}
.lane-tile{flex:none;display:inline-flex;align-items:center;justify-content:center;min-width:66px;height:42px;padding:0 10px;background:var(--ink);color:var(--paper);font:900 20px/1 var(--sans);letter-spacing:-.04em}
.lane-tile[data-severity]{background:var(--sevc);color:var(--sevi)}
.lane-tile[data-kind="cross"]{background:var(--paper);color:var(--ink);border:3px double var(--ink);font-size:11px;letter-spacing:.12em;text-transform:uppercase}
.lane-tile[data-kind="none"]{background:var(--paper);color:var(--ink);border:2px dashed var(--ink)}
.lane-text{display:flex;flex-direction:column;gap:4px;flex:1;min-width:0}
.lane-label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:800 17px/1.1 var(--sans);letter-spacing:-.02em}
.lane-meta{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:500 11.5px/1.2 var(--mono);color:var(--muted)}
.lane-bar{display:flex;width:clamp(80px,14vw,220px)}
.lane-count{min-width:1.3em;text-align:right;font:900 28px/.8 var(--sans);letter-spacing:-.05em;font-variant-numeric:tabular-nums}
.lane-chev{flex:none;display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border:2px solid var(--ink);background:var(--paper);font:900 14px/1 var(--sans)}
.lane[data-empty] .lane-head{padding-block:7px;background:var(--paper);color:var(--faint);cursor:default}
.lane[data-empty] .lane-tile{min-width:52px;height:30px;font-size:14px;background:var(--grey-lt);color:var(--muted);border:0}
.lane[data-empty] .lane-label{font-size:14px;font-weight:700}
.lane[data-empty] .lane-meta{display:none}
.lane[data-empty] .lane-count{font-size:18px}
.lane-empty{font:800 10px/1 var(--sans);letter-spacing:.12em;text-transform:uppercase}
.lane[data-collapsed] .lane-cells{display:none}
.lane-cells{display:grid;grid-template-columns:var(--cols)}
.cell{display:flex;flex-direction:column;gap:12px;min-width:0;padding:14px 14px 16px;border-left:1px solid var(--line)}
.cell:first-child{border-left:0}
.cell-label{display:none;align-items:center;gap:8px;font:800 10.5px/1 var(--sans);letter-spacing:.12em;text-transform:uppercase}
.cell-n{margin-left:auto;font-weight:900}
.cell[data-folded]{align-items:center;padding:14px 0;background:var(--hatch-soft)}
.cell[data-folded]>.card{display:none}
.cell-fold{display:inline-flex;align-items:center;justify-content:center;min-width:28px;height:28px;background:var(--paper);border:2px solid var(--grey);color:var(--muted);font:900 13px/1 var(--sans)}

/* Cards */
.card{position:relative;display:grid;grid-template-columns:42px minmax(0,1fr);background:var(--paper);border:2px solid var(--ink);transition:transform .12s ease,box-shadow .12s ease,opacity .12s ease}
.card:hover{transform:translate(-2px,-2px);box-shadow:4px 4px 0 var(--ink)}
.card[data-selected]{transform:translate(-3px,-3px);box-shadow:8px 8px 0 var(--ink)}
.card-sev{display:flex;flex-direction:column;align-items:center;gap:8px;padding:8px 0 10px;background:var(--sevc);color:var(--sevi);border-right:2px solid var(--ink)}
.card-sev-code{font:900 15px/1 var(--sans);letter-spacing:-.03em}
.card-sev-name{writing-mode:vertical-rl;transform:rotate(180deg);font:800 9px/1 var(--sans);letter-spacing:.16em;text-transform:uppercase}
.card[data-disposition="needs validation"]{border-style:dashed}
.card[data-disposition="needs validation"] .card-sev{padding-top:0;background:repeating-linear-gradient(-45deg,var(--sevc) 0 4px,var(--paper) 4px 8px);color:var(--ink)}
.card[data-disposition="needs validation"] .card-sev-code{align-self:stretch;text-align:center;padding:8px 0 6px;background:var(--sevc);color:var(--sevi)}
.card[data-disposition="needs validation"] .card-sev-name{background:var(--paper);padding:5px 2px}
.card[data-disposition="disputed"]{border-color:var(--purple);border-top-width:6px}
.card[data-disposition="disputed"] .card-sev{border-right-color:var(--purple)}
.card[data-disposition="disputed"]:hover,.card[data-disposition="disputed"][data-selected]{box-shadow:6px 6px 0 var(--purple)}
.card[data-disposition="rejected"]{border-color:var(--grey);color:#5c5c56}
.card[data-disposition="rejected"] .card-sev{background:var(--grey-lt);color:#5c5c56;border-right-color:var(--grey)}
.card[data-disposition="rejected"] .card-open{text-decoration:line-through;text-decoration-thickness:2px;text-decoration-color:rgba(10,10,10,.55)}
.card[data-disposition="rejected"]:hover,.card[data-disposition="rejected"][data-selected]{box-shadow:6px 6px 0 var(--grey)}
.card[data-ignored]{background:var(--paper) var(--hatch-soft)}
.card[data-ignored] :is(.card-sev,.card-id,.card-body>.card-top .conf,.card-title,.card-loc,.card-comment,.card-foot .pr-chip,.card-foot .rv-badges,.card-details){opacity:.42;transition:opacity .12s ease}
.card[data-ignored]:is(:hover,:focus-within,[data-selected]) :is(.card-sev,.card-id,.card-body>.card-top .conf,.card-title,.card-loc,.card-comment,.card-foot .pr-chip,.card-foot .rv-badges,.card-details){opacity:.9}
.card-body{display:flex;flex-direction:column;gap:6px;min-width:0;padding:9px 11px 0}
.card-top{display:flex;align-items:center;gap:6px;min-height:18px}
.card-id{font:700 11px/1 var(--mono);color:var(--muted)}
.card-flags{display:inline-flex;gap:4px}
.card[data-pinned] .card-flags::before{content:"Pinned";padding:3px 5px 2px;background:var(--ink);color:var(--paper);font:900 9px/1 var(--sans);letter-spacing:.12em;text-transform:uppercase}
.card[data-ignored] .card-flags::after{content:"Ignored";padding:2px 4px 1px;border:2px solid var(--ink);background:var(--paper);color:var(--ink);font:900 9px/1 var(--sans);letter-spacing:.12em;text-transform:uppercase}
.card[data-pinned]::before{content:"";position:absolute;top:-2px;right:-2px;border-style:solid;border-width:0 18px 18px 0;border-color:transparent var(--ink) transparent transparent;z-index:2}
.conf{margin-left:auto;display:inline-flex;align-items:center;gap:5px;font:800 9.5px/1 var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.conf-bars{display:inline-flex;align-items:flex-end;gap:2px}
.conf-bars i{width:4px;background:var(--line)}
.conf-bars i:nth-child(1){height:5px}.conf-bars i:nth-child(2){height:8px}.conf-bars i:nth-child(3){height:11px}
.conf-bars i.on{background:var(--ink)}
.card-title{font:700 14.5px/1.27 var(--sans);letter-spacing:-.01em}
.card-open{display:block;width:100%;padding:0;margin:0;border:0;background:none;color:inherit;font:inherit;text-align:left;cursor:pointer}
.card-open::after{content:"";position:absolute;inset:-2px;z-index:1}
.card-open:focus-visible{outline:none}
.card-open:focus-visible::after{outline:3px solid var(--ink);outline-offset:4px}
.card-loc{font:500 11px/1.35 var(--mono);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-foot{display:flex;flex-wrap:wrap;align-items:center;gap:5px;margin-top:2px}
.card-foot .rv-badges{margin-left:auto}
.card .finding-actions{position:relative;z-index:2;display:flex;gap:4px}
.card .action{height:22px;padding:0 7px;font-size:9.5px;letter-spacing:.1em;gap:4px}
.card .action-ignore::before{content:"✕";font-size:10px;letter-spacing:0}
.card .action-ignore[aria-pressed="false"]{border-color:var(--ink);color:var(--ink)}
.card .action-ignore[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.card .action-ignore[aria-pressed="true"]:hover{background:var(--paper);color:var(--ink)}
.card-comment{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 7px;align-items:baseline;margin:2px 0 0;padding:5px 7px;border-left:4px solid var(--p2);background:#fff8d6;font-size:12.5px;line-height:1.35}
.card-comment-label{font:900 8.5px/1.4 var(--sans);letter-spacing:.14em;text-transform:uppercase}
.card-comment-text{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere;white-space:pre-line}
.pr-chip{position:relative;z-index:2;display:inline-flex;align-items:center;height:20px;padding:0 6px;border:2px solid var(--ink);background:var(--paper);color:var(--ink);font:700 11px/1 var(--mono);cursor:pointer}
.pr-chip:hover{background:var(--ink);color:var(--paper)}
.card-details{position:relative;z-index:2;margin:6px -11px 0;border-top:1px solid var(--line)}
.card-details>summary{display:flex;align-items:center;justify-content:space-between;padding:6px 11px;list-style:none;font:800 9.5px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);cursor:pointer}
.card-details>summary::-webkit-details-marker{display:none}
.card-details>summary::after{content:"+";font:900 14px/1 var(--sans);color:var(--ink)}
.card-details[open]>summary::after{content:"−"}
.card-details>summary:hover{color:var(--ink);background:var(--wash)}
.card-details>.finding-fields{padding:0 11px 12px}
.card-details .finding-fields dd{font-size:12.5px}
.finding-fields{margin:0}
.finding-fields dt{margin-top:10px;font:800 9.5px/1.1 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.finding-fields dd{margin:4px 0 0;font-size:13.5px;line-height:1.45}
.finding-fields code{font:500 12px/1.4 var(--mono);overflow-wrap:anywhere}
.finding-fields pre{padding:9px 11px;background:var(--wash);border-left:4px solid var(--ink);font:500 11.5px/1.5 var(--mono)}
.nomatch{display:flex;flex-direction:column;align-items:flex-start;gap:14px;padding:44px 40px;border:3px dashed var(--ink);background:var(--hatch-soft)}
.nomatch>*{background:var(--paper)}
.nomatch-big{font-size:clamp(34px,4.4vw,64px);font-weight:900;line-height:.86;letter-spacing:-.05em}
.nomatch-why{font-size:14px;color:var(--muted);padding:2px 4px 2px 0}
.nomatch-actions{display:flex;flex-wrap:wrap;gap:8px;background:none}
.empty-state{display:grid;grid-template-columns:minmax(220px,25%) minmax(0,1fr);border:3px solid var(--ink);background:var(--paper)}
.empty-zero{display:flex;align-items:flex-end;padding:20px 28px 26px;border-right:3px solid var(--ink);background:var(--hatch-soft);font-size:clamp(150px,16vw,250px);font-weight:900;line-height:.72;letter-spacing:-.08em}
.empty-copy{display:flex;flex-direction:column;justify-content:flex-end;gap:16px;padding:32px 36px 30px}
.empty-copy .kicker{color:var(--muted)}
.empty-msg{font-size:clamp(28px,3.2vw,50px);font-weight:900;line-height:1;letter-spacing:-.04em;max-width:24ch;text-wrap:balance}
.empty-sub{font-size:15px;line-height:1.45;color:#33332f;max-width:62ch}

/* ── Drawer ── */
.drawer{position:fixed;top:0;right:0;bottom:0;z-index:60;display:flex;flex-direction:column;width:min(var(--drawer-width,520px),100%);background:var(--paper);border-left:3px solid var(--ink);box-shadow:-18px 0 0 rgba(10,10,10,.07)}
.drawer-band{position:relative;display:flex;align-items:center;gap:14px;min-height:92px;padding:14px 14px 14px 22px;background:var(--sevc);color:var(--sevi);border-bottom:3px solid var(--ink)}
.drawer[data-disposition="needs validation"] .drawer-band{padding-bottom:26px}
.drawer[data-disposition="needs validation"] .drawer-band::after{content:"";position:absolute;left:0;right:0;bottom:0;height:12px;background:repeating-linear-gradient(-45deg,var(--ink) 0 2px,transparent 2px 7px);border-top:2px solid var(--ink)}
.drawer[data-disposition="disputed"] .drawer-band{box-shadow:inset 0 -12px 0 var(--purple);padding-bottom:26px}
.drawer[data-disposition="rejected"] .drawer-band{background:var(--grey-lt);color:var(--ink)}
.drawer-sev{font:900 56px/.78 var(--sans);letter-spacing:-.06em}
.drawer-sevtext{display:flex;flex-direction:column;gap:6px;font:800 11px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase}
.drawer-id{font:700 12px/1 var(--mono);letter-spacing:0;text-transform:none}
.drawer-nav{margin-left:auto;display:flex;align-items:center;gap:4px}
.drawer-step{width:34px;height:34px;border:2px solid currentColor;background:transparent;color:inherit;font:900 15px/1 var(--sans);cursor:pointer}
.drawer-step:hover:not(:disabled){background:var(--ink);color:var(--paper);border-color:var(--ink)}
.drawer-pos{min-width:46px;text-align:center;font:900 12px/1 var(--sans);font-variant-numeric:tabular-nums}
.drawer-close{flex:none;width:42px;height:42px;border:0;background:var(--ink);color:var(--paper);font:300 30px/1 var(--sans);cursor:pointer}
.drawer-close:hover{background:var(--paper);color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink)}
.drawer-scroll{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:22px 24px 56px}
.drawer-note{margin-bottom:14px;padding:8px 10px;background:var(--p2);font:800 12px/1.3 var(--sans)}
.drawer-title{font:800 26px/1.12 var(--sans);letter-spacing:-.03em}
.drawer-title:focus{outline:none}
.drawer[data-disposition="rejected"] .drawer-title{text-decoration:line-through;text-decoration-thickness:2px;text-decoration-color:rgba(10,10,10,.5)}
.drawer-disp{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin:14px 0 18px}
.drawer-disp-label{display:inline-flex;align-items:center;gap:8px;font:900 12px/1 var(--sans);letter-spacing:.12em;text-transform:uppercase}
.drawer-disp .finding-actions{margin-left:auto}
.drawer-stamp{display:none;align-self:flex-start;padding:4px 6px 3px;background:var(--ink);color:var(--paper);font:900 10px/1 var(--sans);letter-spacing:.14em}
.drawer[data-ignored] .drawer-stamp{display:inline-block}
.drawer[data-ignored] .drawer-band{background-image:repeating-linear-gradient(-45deg,rgba(255,255,255,.28) 0 3px,transparent 3px 9px)}
.drawer[data-ignored] .drawer-title{color:#4a4a44}

/* Answer block: the one decision this drawer asks for */
.answer{margin:0 0 24px;padding:14px 16px 16px;border:3px solid var(--ink);background:var(--paper)}
.answer[data-answer="ignore"]{background:var(--paper) var(--hatch-soft)}
.answer-head{gap:10px 14px}
.answer-legend{flex:1 1 auto;font:900 19px/1 var(--sans);letter-spacing:-.02em}
.answer-choice{flex:none}
.answer-option{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 16px 0 10px;margin-left:-2px;border:2px solid var(--ink);background:var(--paper);color:var(--ink);font:800 12px/1 var(--sans);letter-spacing:.1em;text-transform:uppercase}
.answer-option:first-child{margin-left:0}
.answer-option:hover{background:var(--wash-2)}
.answer-option:focus-visible{position:relative;z-index:1}
.answer-mark{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border:2px solid currentColor;font:900 12px/1 var(--sans);letter-spacing:0;color:transparent}
.answer-option[aria-pressed="true"]{background:var(--ink);color:var(--paper);box-shadow:inset 0 -5px 0 var(--p2)}
.answer-option[data-answer-value="fix"][aria-pressed="true"] .answer-mark{background:var(--green);border-color:var(--green);color:var(--ink)}
.answer-option[data-answer-value="ignore"][aria-pressed="true"] .answer-mark{background:var(--paper);border-color:var(--paper);color:var(--ink)}
.answer-option[aria-pressed="true"]:hover{background:#262623}
.answer-note{flex-basis:100%;font:600 12.5px/1.35 var(--sans);color:var(--muted)}
.answer-comment{margin-top:14px;gap:6px}
.answer-comment-label{font:800 9.5px/1.1 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.answer-input{min-height:5.2em;padding:10px 12px;border:2px solid var(--ink);border-radius:0;background:var(--paper);color:var(--ink);font:500 14.5px/1.45 var(--sans)}
.answer-input::placeholder{color:var(--faint)}
.answer-input:focus{outline:none;box-shadow:5px 5px 0 var(--p2),5px 5px 0 2px var(--ink)}

/* Full-screen toggle (key f) and its band hint */
.drawer-full{flex:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-width:34px;height:34px;padding:0 8px;border:2px solid currentColor;background:transparent;color:inherit;font:800 11px/1 var(--sans);letter-spacing:.1em;text-transform:uppercase;cursor:pointer}
.drawer-full:hover{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.drawer-full-icon{position:relative;flex:none;width:14px;height:14px;border:2px solid currentColor}
.drawer-full-icon::after{content:"";position:absolute;top:-2px;right:-2px;width:7px;height:7px;background:currentColor}
.drawer-full[aria-pressed="true"] .drawer-full-icon::after{top:auto;right:auto;left:1px;bottom:1px;width:6px;height:6px}
.drawer-full-label{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.drawer-full[aria-pressed="true"]{padding:0 12px;background:var(--ink);color:var(--paper);border-color:var(--ink)}
.drawer-full[aria-pressed="true"] .drawer-full-label{position:static;width:auto;height:auto;overflow:visible;clip:auto}
.drawer-full[aria-pressed="true"]:hover{background:var(--paper);color:var(--ink)}
.drawer-hint{display:none;align-items:center;gap:4px;font:800 10.5px/1 var(--sans);letter-spacing:.1em;text-transform:uppercase;white-space:nowrap}
.drawer-hint kbd{min-width:20px;padding:2px 4px;border-color:currentColor;background:transparent;color:inherit;font-size:10.5px}

/* Full screen: the drawer becomes a reading page with a centred column; j/k still move through findings */
html[data-drawer-full] body{overflow:hidden}
html[data-drawer-full] .drawer{--gutter:max(24px,calc((100% - 1000px) / 2));border-left:0;box-shadow:none}
html[data-drawer-full] .drawer-band{min-height:108px;padding-inline:var(--gutter)}
html[data-drawer-full] .drawer-sev{font-size:72px}
html[data-drawer-full] .drawer-nav{margin-left:auto}
html[data-drawer-full] .drawer-hint{display:inline-flex;margin-left:auto}
html[data-drawer-full] .drawer-hint+.drawer-full{margin-left:0}
html[data-drawer-full] .drawer-nav+.drawer-hint{margin-left:18px}
html[data-drawer-full] .drawer-scroll{padding:36px var(--gutter) 96px}
html[data-drawer-full] .drawer-title{font-size:clamp(30px,3.2vw,46px);line-height:1.02;letter-spacing:-.045em;max-width:24em}
html[data-drawer-full] .drawer-disp{margin:18px 0 26px}
html[data-drawer-full] .drawer .finding-fields{grid-template-columns:190px minmax(0,1fr);margin-top:34px;border-top-width:6px}
html[data-drawer-full] .drawer .finding-fields dt,html[data-drawer-full] .drawer .finding-fields dd{padding:16px 0}
html[data-drawer-full] .drawer .finding-fields dd{font-size:16.5px;line-height:1.55}
html[data-drawer-full] .drawer .finding-fields pre{padding:14px 18px;font-size:13px;line-height:1.6}
html[data-drawer-full] .answer-input{min-height:7em}
@media screen and (min-width:1000px){
  html[data-drawer-full] .drawer-lead{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:0 36px;align-items:start}
  html[data-drawer-full] .drawer-lead>.answer{margin:0}
  html[data-drawer-full] .drawer-lead>.drawer-meta{margin:0}
}

/* Resize grip: a black tab on the drawer's left rule */
.drawer>.resize-handle{left:-10px;width:16px;color:var(--ink)}
.drawer>.resize-handle::after{left:3px;width:10px;height:64px;margin-top:-32px;border-radius:0;opacity:1;background:var(--ink)}
.drawer>.resize-handle::before{content:"";position:absolute;top:50%;left:7px;width:2px;height:28px;margin-top:-14px;background:var(--paper);z-index:1}
.drawer>.resize-handle:hover::after,.drawer>.resize-handle:focus-visible::after,.is-resizing .drawer>.resize-handle::after{background:var(--p2);box-shadow:inset 0 0 0 2px var(--ink)}
.drawer>.resize-handle:hover::before,.drawer>.resize-handle:focus-visible::before,.is-resizing .drawer>.resize-handle::before{background:var(--ink)}
.drawer>.resize-handle:focus-visible::after{outline:3px solid var(--ink);outline-offset:2px}
.drawer-meta{display:grid;grid-template-columns:112px minmax(0,1fr);margin:0 0 18px;border-top:3px solid var(--ink)}
.drawer-meta dt,.drawer-meta dd{margin:0;padding:10px 0;border-bottom:1px solid var(--line)}
.drawer-meta dt{font:800 9.5px/1.6 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.drawer-meta dd{font-size:14px;line-height:1.4;min-width:0}
.chips{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px}
.pr-ref{display:inline-flex;align-items:center;gap:8px;min-width:0}
.pr-ref-title{font-size:13px;color:var(--muted)}
.who{display:flex;flex-wrap:wrap;gap:6px 14px}
.who-item{display:inline-flex;align-items:center;gap:6px;font-weight:700}
.tag-chip{height:24px;padding:0 8px;border:2px solid var(--ink);background:var(--paper);font:700 11.5px/1 var(--mono);cursor:pointer}
.tag-chip:hover,.tag-chip[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.drawer .finding-actions{display:flex;gap:8px}
.drawer .finding-fields{display:grid;grid-template-columns:112px minmax(0,1fr);border-top:3px solid var(--ink);margin-top:14px}
.drawer .finding-fields dt,.drawer .finding-fields dd{margin:0;padding:12px 0;border-bottom:1px solid var(--line)}
.drawer .finding-fields dt{line-height:1.6}
.drawer .finding-fields dd{font-size:14.5px;line-height:1.5}
.drawer .finding-fields dd[data-field="impact"],.drawer .finding-fields dd[data-field="recommendation"]{font-weight:700}
.drawer .conf{margin:0;font-size:11px;color:var(--ink)}

/* ── Matrix ── */
.mx-summary{display:flex;flex-wrap:wrap;margin-bottom:22px;border:2px solid var(--ink);background:var(--ink);gap:2px}
.mx-stat{flex:1 1 150px;display:flex;align-items:flex-end;gap:12px;padding:14px 16px;background:var(--paper)}
.mx-stat b{font:900 52px/.78 var(--sans);letter-spacing:-.06em;font-variant-numeric:tabular-nums}
.mx-stat span{font:800 10.5px/1.25 var(--sans);letter-spacing:.12em;text-transform:uppercase}
.mx-stat[data-k="all"]{background:var(--ink);color:var(--paper)}
.mx-scroll{overflow-x:auto}
.matrix{width:100%;min-width:620px;border-collapse:collapse;table-layout:fixed}
.matrix th,.matrix td{padding:0;border-bottom:1px solid var(--line);vertical-align:middle;font-weight:inherit}
.matrix thead th{padding:10px 8px 12px;border-bottom:3px solid var(--ink);font:800 10.5px/1.2 var(--sans);letter-spacing:.12em;text-transform:uppercase;text-align:center;vertical-align:bottom}
.matrix thead th:first-child{text-align:left;padding-left:0}
.mx-h-rv{width:140px}
.mx-h-agree{width:112px}
.mx-rv{display:inline-flex;flex-direction:column;align-items:center;gap:7px}
.mx-rv-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:130px}
.mx-fin{display:flex;align-items:center;gap:10px;min-width:0;padding:9px 10px 9px 0}
.sev-tag{flex:none;display:inline-flex;align-items:center;justify-content:center;width:32px;height:22px;background:var(--sevc);color:var(--sevi);font:900 11px/1 var(--sans)}
.mx-id{flex:none;font:700 11px/1 var(--mono);color:var(--muted)}
.mx-open{min-width:0;padding:0;border:0;background:none;color:inherit;font:700 14px/1.3 var(--sans);text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.mx-open:hover{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px}
.mx-row .disp-sw{margin-left:auto}
.mx-row[data-disposition="rejected"] .mx-open{text-decoration:line-through;color:var(--muted)}
.mx-cell{text-align:center;position:relative}
.mx-dot{position:relative;z-index:1;display:inline-block;width:20px;height:20px;border-radius:50%;background:var(--ink);vertical-align:middle}
.mx-none{display:inline-block;width:12px;height:3px;background:var(--line);vertical-align:middle}
.mx-agree{text-align:right}
.mx-agree-tag{display:inline-flex;align-items:center;height:24px;padding:0 8px;border:2px solid var(--ink);font:900 11.5px/1 var(--sans);letter-spacing:.06em;text-transform:uppercase;font-variant-numeric:tabular-nums}
.mx-row.is-solo .mx-agree-tag{border-color:var(--line);color:var(--muted)}
.mx-row.is-all>*{background:var(--ink);color:var(--paper);border-bottom-color:#3a3a36}
.mx-row.is-all .mx-id{color:#bdbdb5}
.mx-row.is-all .mx-dot{background:var(--p2);box-shadow:0 0 0 3px var(--ink),0 0 0 5px var(--p2)}
.mx-row.is-all .mx-agree-tag{background:var(--p2);border-color:var(--p2);color:var(--ink)}
.mx-row.is-all .mx-fin{padding-left:10px}
.mx-row.is-all .disp-sw[data-disposition="confirmed"]{border-color:var(--paper);background:var(--paper)}
.mx-row[data-selected]>th{box-shadow:inset 6px 0 0 var(--p2)}
.mx-row[data-selected] .mx-fin{padding-left:14px}
.mx-row[data-selected]>*{background:var(--wash-2)}
.mx-row.is-all[data-selected]>*{background:#262623}
.mx-row[data-ignored]>*{opacity:.42}
.mx-row[data-ignored] .mx-id::before{content:"Ignored · ";font:900 9px/1 var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--ink)}
.mx-row[data-commented] .mx-fin::after{content:"✎";flex:none;font:900 13px/1 var(--sans)}
.mx-row[data-pinned] .mx-id::after{content:" ▲";color:var(--ink)}
.mx-row.is-all[data-pinned] .mx-id::after{color:var(--p2)}
.matrix tfoot th,.matrix tfoot td{padding:12px 8px;border-bottom:0;border-top:3px solid var(--ink);vertical-align:top}
.matrix tfoot th{text-align:left;padding-left:0;font:800 10.5px/1.2 var(--sans);letter-spacing:.12em;text-transform:uppercase}
.mx-total{text-align:center}
.mx-total b{display:block;font:900 30px/.85 var(--sans);letter-spacing:-.05em}
.mx-total span{font:700 11px/1.4 var(--sans);color:var(--muted)}

/* ── Team ── */
.team{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));border-top:2px solid var(--ink);border-left:2px solid var(--ink)}
.rv-card{display:flex;flex-direction:column;min-width:0;background:var(--paper);border-right:2px solid var(--ink);border-bottom:2px solid var(--ink)}
.rv-status{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:46px;padding:10px 18px;font:900 14px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase}
.rv-status small{font:700 11px/1.2 var(--sans);letter-spacing:.02em;text-transform:none;text-align:right}
.rv-card[data-tone="ok"] .rv-status{background:var(--ink);color:var(--paper)}
.rv-card[data-tone="bad"] .rv-status{background:var(--p0);color:#fff}
.rv-card[data-tone="warn"] .rv-status{background:var(--amber);color:var(--ink)}
.rv-card[data-tone="idle"] .rv-status{background:var(--grey-lt) var(--hatch-soft);color:var(--ink)}
.rv-inner{display:flex;flex-direction:column;gap:14px;flex:1;padding:20px 18px 22px}
.rv-head{display:flex;align-items:center;gap:10px}
.rv-head .rv{min-width:30px;height:28px;font-size:11px}
.rv-name{font:900 30px/.92 var(--sans);letter-spacing:-.045em}
.rv-model{font:600 12.5px/1.35 var(--mono);overflow-wrap:anywhere}
.rv-stats{display:flex;border:2px solid var(--ink)}
.rv-stat{flex:1;display:flex;align-items:flex-end;gap:8px;padding:8px 10px}
.rv-stat+.rv-stat{border-left:2px solid var(--ink)}
.rv-stat b{font:900 30px/.8 var(--sans);letter-spacing:-.05em}
.rv-stat span{font:800 9.5px/1.2 var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.rv-kv{display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:16px;margin:0;border-top:3px solid var(--ink)}
.rv-kv dt,.rv-kv dd{margin:0;padding:7px 0;border-bottom:1px solid var(--line)}
.rv-kv dt{font:800 9.5px/1.7 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.rv-kv dd{font:500 12.5px/1.4 var(--mono);overflow-wrap:anywhere}
.rv-prov{font-size:13.5px;line-height:1.45}
.rv-prov .kicker,.rv-limits .kicker{margin-bottom:5px;color:var(--muted)}
.rv-limits{padding:10px 12px;border-left:6px solid var(--amber);background:#fff6dc;font-size:13.5px;line-height:1.45}
.rv-output{margin-top:auto}
.rv-output>summary{list-style:none;height:28px;width:max-content}
.rv-output>summary::-webkit-details-marker{display:none}
.rv-output>summary::before{content:"+";font-size:14px}
.rv-output[open]>summary::before{content:"−"}
.rv-output pre{margin:10px 0 0;max-height:320px;overflow:auto;padding:12px 14px;background:var(--ink);color:#efefea;font:500 12px/1.55 var(--mono);white-space:pre-wrap;overflow-wrap:anywhere}

/* ── Scope & follow-up ── */
.target{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));margin-bottom:40px;border-top:2px solid var(--ink);border-left:2px solid var(--ink)}
.kv-tile{display:flex;flex-direction:column;gap:9px;min-width:0;padding:14px 16px 18px;background:var(--paper);border-right:2px solid var(--ink);border-bottom:2px solid var(--ink)}
.kv-tile .kicker{color:var(--muted)}
.kv-val{font:700 15.5px/1.38 var(--sans);letter-spacing:-.01em;overflow-wrap:anywhere}
.lists{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:6px solid var(--ink)}
.list-col{position:relative;min-width:0;padding:18px 26px 6px 0}
.list-col+.list-col{padding-left:26px;border-left:2px solid var(--ink)}
.list-col[data-kind="gaps"]::before{content:"";position:absolute;left:0;right:0;top:-6px;height:6px;background:var(--hazard)}
.list-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:14px}
.list-head h3{font:900 26px/1 var(--sans);letter-spacing:-.04em}
.list-n{font:900 26px/1 var(--sans);letter-spacing:-.04em;color:var(--faint)}
.list-col ol{list-style:none;margin:0;padding:0;counter-reset:li}
.list-col li{counter-increment:li;display:grid;grid-template-columns:32px minmax(0,1fr);gap:8px;padding:11px 0;border-top:1px solid var(--line);font-size:14.5px;line-height:1.45}
.list-col li::before{content:counter(li,decimal-leading-zero);font:900 13px/1.6 var(--sans)}
.list-none{padding:11px 0;border-top:1px solid var(--line);font-size:14px;color:var(--faint)}
.notes{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:24px;margin-top:44px}
.note{padding-top:14px;border-top:6px solid var(--ink)}
.note h3{margin-bottom:8px;font:900 19px/1.15 var(--sans);letter-spacing:-.02em}
.note p{font-size:14.5px;line-height:1.5;color:#2b2b28}
.sources{margin-top:44px}
.sources ul{list-style:none;margin:10px 0 0;padding:0;border-top:2px solid var(--ink)}
.sources li{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px;padding:10px 0;border-bottom:1px solid var(--line)}
.sources a{font-weight:800}
.sources a::after{content:" ↗"}
.src-url{font:500 11.5px/1.3 var(--mono);color:var(--muted);overflow-wrap:anywhere;min-width:0}

/* ── Footer ── */
.foot{display:flex;flex-wrap:wrap;align-items:flex-start;gap:12px 30px;padding:22px var(--pad) 44px;font-size:12px;color:var(--muted)}
.foot b{color:var(--ink)}
.foot-note{max-width:62ch}
.shortcuts{margin-left:auto;max-width:100%}
.shortcuts>summary{cursor:pointer;font:800 10.5px/1.6 var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--ink)}
.shortcuts[open]{flex:1 1 100%;margin-left:0}
.shortcuts .shortcut-groups{margin-top:12px;color:var(--ink)}
.shortcuts-open{display:inline-flex;align-items:center;height:28px;padding:0 10px;margin-top:14px;border:2px solid var(--ink);background:var(--paper);color:var(--ink);font:800 10.5px/1 var(--sans);letter-spacing:.08em;text-transform:uppercase}
.shortcuts-open:hover{background:var(--ink);color:var(--paper)}

/* ── Keyboard cheatsheet (core modal, key ?) ── */
.shortcut-overlay{background:rgba(10,10,10,.42) var(--hatch-soft)}
.shortcut-sheet{width:min(780px,100%);padding:0;border:3px solid var(--ink);background:var(--paper);color:var(--ink);box-shadow:12px 12px 0 var(--ink);font-family:var(--sans)}
.shortcut-head{margin:0;padding:16px 16px 16px 24px;background:var(--ink);color:var(--paper)}
.shortcut-title{font:900 clamp(28px,4vw,40px)/.9 var(--sans);letter-spacing:-.05em}
.shortcut-close{width:42px;height:42px;background:var(--paper);color:var(--ink);font:300 30px/1 var(--sans)}
.shortcut-close:hover{background:var(--p2)}
.shortcut-close:focus-visible{outline:3px solid var(--p2);outline-offset:2px}
.shortcut-sheet .shortcut-groups{padding:22px 24px 6px;gap:22px 34px}
.shortcut-group{border-top:6px solid var(--ink);padding-top:10px}
.shortcut-group-title{margin-bottom:6px;font:800 10.5px/1.2 var(--sans);letter-spacing:.14em;text-transform:uppercase;opacity:1}
.shortcut-group dl{gap:0 14px}
.shortcut-group dt,.shortcut-group dd{padding:7px 0;border-bottom:1px solid var(--line)}
.shortcut-group dd{font-size:14px;line-height:1.3}
.shortcut-group kbd{min-width:26px}
.kbd-or{font:800 9.5px/1 var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);opacity:1}
.shortcut-foot{margin:0;padding:12px 24px 20px;font-size:12.5px;color:var(--muted);opacity:1}

<script>/* multi-agent-review shared runtime, inlined into every theme.
 * Owns filter state, faceted counts, the PR stack hierarchy, answers (fix by default, ignore, comment),
 * pins, URL state, keyboard shortcuts, panel resizing, and safe DOM builders. state.view (URL `view=`)
 * is a free slot for theme view modes. Themes call MultiAgentReview.create(), build their layout with
 * app.h()/app.ui.*, render findings from app.view(), and finish with app.start().
 * Report text is inserted with textContent only; never route report data through innerHTML. */
(function () {
  'use strict';

  const SEVERITIES = ['P0', 'P1', 'P2', 'P3'];
  const SEVERITY_LABELS = { P0: 'Critical', P1: 'High', P2: 'Medium', P3: 'Low' };
  const DISPOSITIONS = ['confirmed', 'needs validation', 'disputed', 'rejected'];
  const CONFIDENCES = ['high', 'medium', 'low'];
  /* Every finding is approved for fixing unless the coordinator rejected it; the user ignores the rest. */
  const ANSWERS = ['fix', 'ignore'];
  const ANSWER_LABELS = { fix: 'Fix', ignore: 'Ignore' };
  const FACETS = ['severity', 'disposition', 'reviewer', 'pr', 'confidence', 'tag', 'answer'];
  const FACET_LABELS = { severity: 'Severity', disposition: 'Disposition', reviewer: 'Raised by', pr: 'Pull request', confidence: 'Confidence', tag: 'Tags', answer: 'Your answer' };
  const HASH_KEYS = { severity: 'sev', disposition: 'disp', reviewer: 'rev', pr: 'pr', confidence: 'conf', tag: 'tag', answer: 'ans' };
  const ANSWERS_FORMAT = 'multi-agent-review/answers@1';
  const ANSWERS_INSTRUCTIONS = 'Fix every finding in `fix`, bottom of the stack first when `stack` is present. A `comment` is the reviewer\'s own instruction and overrides `recommendation`. '
    + 'Confirm `needs validation` and `disputed` findings before changing code, and report any that do not reproduce instead of fixing them. '
    + 'Do not change code for findings in `ignore`. Afterwards, report what changed per finding id and which checks ran.';
  const NO_PR = '(none)';
  const CROSS_PR = '(cross)';
  const PRESETS = {
    actionable: { label: 'Actionable', hint: 'P0–P2 that are not rejected', severity: ['P0', 'P1', 'P2'], disposition: ['confirmed', 'needs validation', 'disputed'] },
    blocking: { label: 'Blocking', hint: 'P0–P1 that are confirmed or still need validation', severity: ['P0', 'P1'], disposition: ['confirmed', 'needs validation'] },
    disagreements: { label: 'Disagreements', hint: 'Disputed and rejected candidates', disposition: ['disputed', 'rejected'] },
    all: { label: 'Everything', hint: 'Clear every filter' },
  };
  const FIELDS = [
    ['location', 'Location'], ['trigger', 'Trigger'], ['impact', 'Impact'], ['evidence', 'Evidence'],
    ['recommendation', 'Suggested correction'], ['decision', 'Coordinator decision'], ['validation', 'Validation limits'],
  ];
  const GROUPS = { none: 'No grouping', pr: 'Pull request', severity: 'Severity', disposition: 'Disposition' };
  const SORTS = { severity: 'Severity', disposition: 'Disposition', pr: 'Stack order', id: 'ID' };

  const unique = (values) => Array.from(new Set(values));
  const norm = (value) => String(value == null ? '' : value).trim().toLowerCase();
  const capitalize = (value) => value.charAt(0).toUpperCase() + value.slice(1);
  const byNumericId = (a, b) => String(a.id).localeCompare(String(b.id), undefined, { numeric: true });

  function safeUrl(value) {
    try { return ['http:', 'https:'].includes(new URL(String(value)).protocol); } catch (_) { return false; }
  }

  /** Drop null, undefined, and empty-string values so exported JSON stays compact. */
  function compact(obj) {
    const out = {};
    for (const [key, value] of Object.entries(obj)) if (value != null && value !== '') out[key] = value;
    return out;
  }

  /** Rendered and not inside a closed <details> or [hidden] ancestor (getClientRects alone misses closed details in Chrome). */
  function isShown(el) {
    if (!el || !el.getClientRects().length) return false;
    return typeof el.checkVisibility === 'function' ? el.checkVisibility() : !el.closest('details:not([open]) > :not(summary), [hidden]');
  }
  /** Prefer the visible element when a control is rendered twice (e.g. inline row details and the drawer). */
  function byFocusKey(key) {
    const all = Array.from(document.querySelectorAll(`[data-focus-key="${CSS.escape(key)}"]`));
    return all.find(isShown) || null;
  }

  async function copyText(text) {
    try { await navigator.clipboard.writeText(text); return true; } catch (_) {
      const area = h('textarea', { style: 'position:fixed;top:0;left:0;opacity:0' }, text);
      document.body.append(area); area.select();
      let ok = false; try { ok = document.execCommand('copy'); } catch (__) { ok = false; }

    }
  }

  /** Build an element. Children may be nodes, strings, numbers, arrays, or null. */
  function h(tag, props, ...children) {
    const el = document.createElement(tag);
    for (const [key, value] of Object.entries(props || {})) {
      if (value == null || value === false) continue;
      if (key === 'class') el.className = value;
      else if (key === 'text') el.textContent = value;
      else if (key === 'dataset') { for (const [k, v] of Object.entries(value)) if (v != null) el.dataset[k] = v; }
      else if (key === 'style') el.style.cssText = value;
      else if (key.startsWith('on') && typeof value === 'function') el.addEventListener(key.slice(2), value);
      else if (key === 'href') { if (safeUrl(value) || String(value).startsWith('#')) el.setAttribute('href', value); }

    for (const child of children.flat(Infinity)) {
      if (child == null || child === false) continue;
      el.append(child instanceof Node ? child : document.createTextNode(String(child)));

  }

  /* Stack layout: depth is true distance from the trunk; lane is a git-graph row where the first
     child continues its parent's lane and later siblings fork into new lanes; indent counts forks. */
  function buildStack(entries) {
    const byId = new Map(entries.map((entry, index) => [entry.id, Object.assign({}, entry, { index, children: [] })]));
    const roots = [];
    for (const node of byId.values()) {
      node.parentEntry = node.parent != null ? byId.get(node.parent) || null : null;
      (node.parentEntry ? node.parentEntry.children : roots).push(node);
    }
    const order = [];
    let lanes = 0;
    const walk = (node, depth, trail, lane, indent, forked) => {
      Object.assign(node, { depth, trail, lane, indent, forked, order: order.length });
      order.push(node);
      node.children.forEach((child, i) => {
        child.isLast = i === node.children.length - 1;
        walk(child, depth + 1, depth === 0 ? [] : trail.concat(!node.isLast), i === 0 ? lane : ++lanes, indent + (i === 0 ? 0 : 1), i > 0);
      });
    };
    roots.forEach((root, i) => { root.isLast = i === roots.length - 1; walk(root, 0, [], i === 0 ? 0 : ++lanes, 0, false); });
    const ancestors = (id) => { const out = []; let node = byId.get(id); while (node && node.parentEntry) { node = node.parentEntry; out.push(node.id); } return out; };
    const descendants = (id) => { const out = []; const visit = (node) => node.children.forEach((c) => { out.push(c.id); visit(c); }); const n = byId.get(id); if (n) visit(n); return out; };
    const trunk = unique(roots.map((r) => r.base).filter(Boolean)).join(', ') || 'trunk';
    return { order, byId, roots, ancestors, descendants, trunk, maxDepth: Math.max(0, ...order.map((n) => n.depth)), laneCount: lanes + 1 };
  }

  function create() {
    const data = JSON.parse(document.getElementById('report-data').textContent);
    const findings = data.findings;
    const byId = new Map(findings.map((f) => [f.id, f]));
    const stack = buildStack(data.stack || []);
    /* One PR is a single review target, not a stack: stack views, the PR facet, and PR grouping need at least two. */
    const hasStack = stack.order.length > 1;
    const soloPR = stack.order.length === 1 ? stack.order[0] : null;
    const reviewerNames = unique(data.reviewers.map((r) => r.name).concat(...findings.map((f) => f.reviewers)));
    const reviewerIndex = (name) => Math.max(0, reviewerNames.indexOf(name)) % 6;
    const prLabel = (id) => { const n = stack.byId.get(id); if (!n) return id === NO_PR ? 'No PR' : String(id); return n.number != null ? `#${n.number}` : n.id; };
    const searchText = new Map(findings.map((f) => [f.id, norm([
      f.id, f.title, f.severity, f.disposition, f.confidence, f.reviewers.join(' '), f.tags.join(' '),
      f.prs.map((p) => `${prLabel(p)} ${(stack.byId.get(p) || {}).title || ''}`).join(' '),
      ...FIELDS.map(([key]) => f[key] || ''),
    ].join(' '))]));

    const confidences = unique(findings.map((f) => norm(f.confidence)).filter(Boolean));
    confidences.sort((a, b) => (CONFIDENCES.indexOf(a) + 1 || 99) - (CONFIDENCES.indexOf(b) + 1 || 99) || a.localeCompare(b));
    const options = {
      severity: SEVERITIES.map((v) => ({ value: v, label: v, hint: SEVERITY_LABELS[v] })),
      disposition: DISPOSITIONS.map((v) => ({ value: v, label: capitalize(v) })),
      reviewer: reviewerNames.map((v) => ({ value: v, label: v })),
      pr: hasStack ? stack.order.map((n) => ({ value: n.id, label: prLabel(n.id), hint: n.title, node: n }))
        .concat(findings.some((f) => !f.prs.length) ? [{ value: NO_PR, label: 'No PR', hint: 'Findings not tied to one pull request' }] : []) : [],
      confidence: confidences.map((v) => ({ value: v, label: capitalize(v) })),
      tag: unique(findings.flatMap((f) => f.tags)).sort().map((v) => ({ value: v, label: v })),
      answer: findings.length ? [
        { value: 'fix', label: 'Fix', hint: 'Approved for fixing; included in the copied answers' },
        { value: 'ignore', label: 'Ignore', hint: 'Left out of the fix list' },
      ] : [],
    };

    /* Local state is keyed by report, so every design rendered from one report.json shares it. */
    const storeKey = `multi-agent-review:${data.meta.key}`;
    let saved = {};
    try { saved = JSON.parse(localStorage.getItem(storeKey) || '{}') || {}; } catch (_) { saved = {}; }
    const pinned = new Set((saved.pinned || []).filter((id) => byId.has(id)));
    const answers = {};
    for (const [id, value] of Object.entries(saved.answers || {})) if (byId.has(id) && ANSWERS.includes(value)) answers[id] = value;
    for (const id of saved.hidden || []) if (byId.has(id) && !answers[id]) answers[id] = 'ignore'; // hides saved before answers existed
    const comments = {};
    for (const [id, text] of Object.entries(saved.comments || {})) if (byId.has(id) && typeof text === 'string' && text.trim()) comments[id] = text;
    const sections = Object.assign({}, saved.sections);
    const sectionDefaults = {};
    const sizes = Object.assign({}, saved.sizes);
    const themeStore = Object.assign({}, saved.theme);
    const persist = () => {
      try { localStorage.setItem(storeKey, JSON.stringify({ pinned: [...pinned], answers, comments, sections, sizes, theme: themeStore })); } catch (_) { /* storage blocked: keep state in memory */ }
    };
    const defaultAnswer = (f) => (f.disposition === 'rejected' ? 'ignore' : 'fix');
    const answerOf = (id) => answers[id] || (byId.has(id) ? defaultAnswer(byId.get(id)) : 'fix');
    const commentOf = (id) => (comments[id] || '').trim();
    function answerNote(id) {
      const f = byId.get(id);
      if (!answers[id]) return f.disposition === 'rejected' ? 'Ignored by default: the coordinator rejected it' : 'Approved by default';
      return answers[id] === 'ignore' ? 'Ignored by you' : 'Fix requested by you, although the coordinator rejected it';
    }

    const valuesOf = (f, facet) => {
      switch (facet) {
        case 'severity': return [f.severity];
        case 'disposition': return [f.disposition];
        case 'reviewer': return f.reviewers;
        case 'pr': return f.prs.length ? f.prs : [NO_PR];
        case 'confidence': return [norm(f.confidence)];
        case 'answer': return [answerOf(f.id)];
        default: return f.tags;
      }
    };

    const defaults = () => ({
      q: '', severity: new Set(), disposition: new Set(), reviewer: new Set(), pr: new Set(), confidence: new Set(), tag: new Set(), answer: new Set(),
      pinnedOnly: false, prInherited: false, groupBy: hasStack ? 'pr' : 'severity', sort: 'severity', selected: null, view: '', drawerFull: false,
    });
    const state = defaults();
    const open = new Set();
    const listeners = [];
    const refreshers = [];
    let searchInput = null;
    let focusAfterChange = null;
    /* Key specs: 'j / k' is a pair, 'i or r' are alternatives. Answer keys act only while a finding's answer block is on screen. */
    const SHORTCUTS = [
      { group: 'Move', keys: [['j / k', 'Next / previous finding'], ['f', 'Full-screen the open finding (toggle)'], ['o', 'Expand or collapse inline details'], ['/', 'Search'], ['Esc', 'Leave a text field, exit full screen, then close the finding']] },
      { group: 'Answer the open finding', keys: [['a', 'Fix (the default)'], ['i or r', 'Ignore (reject)'], ['x', 'Toggle fix / ignore'], ['c', 'Comment'], ['p', 'Pin']] },
      { group: 'Help', keys: [['?', 'Show this cheatsheet']] },
    ];
    const extraShortcuts = [];
    const shortcutGroups = () => SHORTCUTS.slice(0, 2).concat(extraShortcuts, SHORTCUTS.slice(2));
    const keyCaps = (spec) => spec.split(/\s+(or|\/)\s+/).map((part, i) => (i % 2 ? h('span', { class: 'kbd-or' }, ` ${part} `) : h('kbd', null, part)));
    const shortcutList = (groups) => groups.map((g) => h('section', { class: 'shortcut-group' }, h('h3', { class: 'shortcut-group-title' }, g.group),
      h('dl', null, g.keys.map(([spec, text]) => [h('dt', null, keyCaps(spec)), h('dd', null, text)]))));
    let sheet = null;
    let sheetReturn = null;
    function openSheet() {
      if (sheet) return;
      sheetReturn = document.activeElement;
      const close = h('button', { type: 'button', class: 'shortcut-close', 'aria-label': 'Close keyboard shortcuts', onclick: () => closeSheet() }, '×');
      sheet = h('div', { class: 'shortcut-overlay', onclick: (event) => { if (event.target === sheet) closeSheet(); } },
        h('div', { class: 'shortcut-sheet', role: 'dialog', 'aria-modal': 'true', 'aria-labelledby': 'shortcut-title' },
          h('div', { class: 'shortcut-head' }, h('h2', { class: 'shortcut-title', id: 'shortcut-title' }, 'Keyboard shortcuts'), close),
          h('div', { class: 'shortcut-groups' }, shortcutList(shortcutGroups())),
          h('p', { class: 'shortcut-foot' }, 'Shortcuts pause while you type in a field; Esc leaves it. Press ? or Esc to close.')));
      document.body.append(sheet);
      close.focus();
    }
    function closeSheet() {
      if (!sheet) return;
      sheet.remove();
      sheet = null;
      if (sheetReturn && sheetReturn.isConnected) sheetReturn.focus({ preventScroll: true });
      sheetReturn = null;
    }
    /* While the cheatsheet is open it owns the keyboard; this capture listener runs before any theme listener. */
    window.addEventListener('keydown', (event) => {
      if (!sheet) return;
      if (event.key === 'Escape' || event.key === '?') closeSheet();
      else if (event.key === 'Tab') sheet.querySelector('.shortcut-close').focus();
      else if (event.metaKey || event.ctrlKey) return;
      event.preventDefault();
      event.stopImmediatePropagation();
    }, true);

    function readHash() {
      const params = new URLSearchParams(location.hash.replace(/^#/, ''));
      Object.assign(state, defaults());
      state.q = params.get('q') || '';
      for (const facet of FACETS) {
        const allowed = new Set(options[facet].map((o) => o.value));
        state[facet] = new Set(params.getAll(HASH_KEYS[facet]).filter((v) => allowed.has(v)));
      }
      state.pinnedOnly = params.get('pinned') === '1';
      state.prInherited = params.get('inherit') === '1';
      if (GROUPS[params.get('group')] && (params.get('group') !== 'pr' || hasStack)) state.groupBy = params.get('group');
      if (SORTS[params.get('sort')]) state.sort = params.get('sort');
      if (byId.has(params.get('f'))) { state.selected = params.get('f'); open.add(state.selected); }
      if (/^[a-z][a-z0-9-]{0,31}$/.test(params.get('view') || '')) state.view = params.get('view');
      state.drawerFull = Boolean(state.selected) && params.get('full') === '1';
    }
    function writeHash() {
      const params = new URLSearchParams();
      if (state.q) params.set('q', state.q);
      for (const facet of FACETS) state[facet].forEach((v) => params.append(HASH_KEYS[facet], v));
      if (state.pinnedOnly) params.set('pinned', '1');
      if (state.prInherited) params.set('inherit', '1');
      if (state.groupBy !== defaults().groupBy) params.set('group', state.groupBy);
      if (state.sort !== 'severity') params.set('sort', state.sort);
      if (state.selected) params.set('f', state.selected);
      if (state.view) params.set('view', state.view);
      if (state.drawerFull) params.set('full', '1');
      const hash = params.toString();
      try { history.replaceState(null, '', hash ? `#${hash}` : location.pathname + location.search); } catch (_) { /* some file:// contexts reject replaceState */ }
    }

    function matches(f, except) {
      if (state.pinnedOnly && !pinned.has(f.id)) return false;
      if (state.q) { const text = searchText.get(f.id); if (!norm(state.q).split(/\s+/).every((term) => text.includes(term))) return false; }
      for (const facet of FACETS) {
        if (facet === except || !state[facet].size) continue;
        let selected = state[facet];
        if (facet === 'pr' && state.prInherited) selected = new Set([...selected].flatMap((id) => [id, ...stack.ancestors(id)]));
        if (!valuesOf(f, facet).some((v) => selected.has(v))) return false;
      }
      return true;
    }
    function counts(facet) {
      const out = new Map();
      for (const f of findings) if (matches(f, facet)) for (const v of valuesOf(f, facet)) out.set(v, (out.get(v) || 0) + 1);
      return out;
    }
    /** Per-PR severity breakdown under every filter except the PR filter itself. */
    function prBreakdown() {
      const out = new Map(stack.order.map((n) => [n.id, { total: 0, P0: 0, P1: 0, P2: 0, P3: 0 }]));
      for (const f of findings) {
        if (!matches(f, 'pr')) continue;
        for (const id of f.prs) { const row = out.get(id); if (row) { row.total += 1; row[f.severity] += 1; } }
      }
      return out;
    }

    const rank = (list, value) => { const i = list.indexOf(value); return i < 0 ? list.length : i; };
    const prOrder = (f) => (f.prs.length ? Math.min(...f.prs.map((p) => (stack.byId.get(p) || { order: 999 }).order)) + (f.prs.length > 1 ? 0.5 : 0) : 1000);
    const SORTERS = {
      severity: (a, b) => rank(SEVERITIES, a.severity) - rank(SEVERITIES, b.severity) || rank(DISPOSITIONS, a.disposition) - rank(DISPOSITIONS, b.disposition) || prOrder(a) - prOrder(b) || byNumericId(a, b),
      disposition: (a, b) => rank(DISPOSITIONS, a.disposition) - rank(DISPOSITIONS, b.disposition) || rank(SEVERITIES, a.severity) - rank(SEVERITIES, b.severity) || byNumericId(a, b),
      pr: (a, b) => prOrder(a) - prOrder(b) || rank(SEVERITIES, a.severity) - rank(SEVERITIES, b.severity) || byNumericId(a, b),
      id: byNumericId,
    };
    function groupDefs() {
      if (state.groupBy === 'severity') return SEVERITIES.map((v) => ({ key: v, label: `${v} · ${SEVERITY_LABELS[v]}`, severity: v, canonical: true, test: (f) => f.severity === v }));
      if (state.groupBy === 'disposition') return DISPOSITIONS.map((v) => ({ key: v, label: capitalize(v), disposition: v, canonical: true, test: (f) => f.disposition === v }));

      /** Full answer block for a detail view: Fix / Ignore, where the answer came from, and a comment for the fixer. */
      answer(f, opts) {
        opts = opts || {};
        const value = answerOf(f.id);
        const option = (v) => h('button', {
          type: 'button', class: 'answer-option', 'aria-pressed': String(v === value), dataset: { answerValue: v, focusKey: `answer:${v}:${f.id}` },
          title: v === 'fix' ? 'Approve for fixing' : 'Leave out of the fix list (x)', onclick: (e) => { e.stopPropagation(); app.setAnswer(f.id, v); },

          placeholder: opts.placeholder || 'Comment for the fix (optional): what to do differently, or why to ignore it',

          oninput: () => app.setComment(f.id, area.value, area),
          onclick: (e) => e.stopPropagation(),
        });
        area.value = comments[f.id] || '';
        return h('section', { class: 'answer', 'aria-label': `Your answer for ${f.id}`, dataset: { answerFor: f.id, answer: value } },
          h('div', { class: 'answer-head' },
            h('span', { class: 'answer-legend' }, opts.legend || 'Your answer'),
            h('div', { class: 'answer-choice', role: 'group', 'aria-label': 'Fix or ignore' }, ANSWERS.map(option)),
            h('span', { class: 'answer-note' }, answerNote(f.id))),
          h('label', { class: 'answer-comment' }, h('span', { class: 'answer-comment-label' }, 'Comment'), area));
      },
      /** Copies app.answersJSON(); the count stays live. */
      copyAnswers(label) {
        label = label || 'Copy answers JSON';
        const text = h('span', { class: 'copy-answers-label' }, label);
        const count = h('span', { class: 'copy-answers-count' });
        const button = h('button', {
          type: 'button', class: 'copy-answers', dataset: { focusKey: 'copy-answers' },
          title: 'Copy every answer as JSON: the findings to fix (with your comments) and the ones to ignore. Paste it to the agent that fixes them.',
          onclick: async () => {
            const ok = await app.copyAnswers();
            text.textContent = ok ? 'Copied ✓' : 'Copy failed';
            setTimeout(() => { text.textContent = label; }, 1600);
          },
        }, text, count);
        refreshers.push(() => { const c = app.answerCounts(); count.textContent = `${c.fix} fix · ${c.ignore} ignore`; button.disabled = !findings.length; });

      },
      answerSummary() {
        const el = h('p', { class: 'answer-summary', 'aria-live': 'polite' });

      },
      /** Answer every finding in the current view at once, plus a two-step reset of all answers and comments. */
      bulkAnswer() {
        const make = (value) => h('button', {

          onclick: () => app.setAnswers(view().flat.map((f) => f.id), value),

        const reset = h('button', {
          type: 'button', class: 'bulk-answer bulk-reset', dataset: { focusKey: 'bulk:reset' }, title: 'Restore every default answer and delete your comments',
          onclick: () => {
            if (armed) { clearTimeout(armed); armed = null; app.resetAnswers(); return; }
            reset.textContent = 'Click again to reset';
            armed = setTimeout(() => { armed = null; reset.textContent = 'Reset answers'; }, 3000);
          },
        }, 'Reset answers');
        refreshers.push(() => {
          const shown = view().flat;
          fix.textContent = `Fix ${shown.length} shown`;
          ignore.textContent = `Ignore ${shown.length} shown`;
          fix.disabled = !shown.some((f) => answerOf(f.id) !== 'fix');
          ignore.disabled = !shown.some((f) => answerOf(f.id) !== 'ignore');

        });
