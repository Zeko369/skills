/* Top bar */
.topbar{position:sticky;top:0;z-index:20;height:var(--top);display:flex;align-items:center;gap:14px;padding:0 16px;background:rgba(10,12,15,.9);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}

/* Sidebar panels and facets */
.side-block{margin:0 0 20px}

.facet-option:hover{background:var(--hover);color:var(--text)}
.facet-option[aria-pressed="true"]{background:var(--accent-weak);color:var(--text);box-shadow:inset 2px 0 var(--accent)}
.facet-label{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.facet-hint{display:none}

.facet-swatch{width:10px;height:10px;flex:none;border-radius:3px;background:var(--dim)}
.facet-severity .facet-swatch{width:8px;height:14px;border-radius:2px}
[data-severity="P0"]{--sev:var(--p0)}[data-severity="P1"]{--sev:var(--p1)}[data-severity="P2"]{--sev:var(--p2)}[data-severity="P3"]{--sev:var(--p3)}

/* ? cheatsheet (core-built modal) */
.shortcut-overlay{background:rgba(3,5,8,.7);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}

/* Disposition glyphs: shape as well as color */

/* Summary */
.summary{position:relative;border:1px solid var(--line);border-radius:14px;padding:20px 22px 18px;background:radial-gradient(120% 140% at 100% 0%,rgba(126,224,195,.07),transparent 55%),linear-gradient(180deg,#11161d,#0d1116);margin-bottom:22px;overflow:hidden}
.summary.status-incomplete{border-color:rgba(255,181,71,.45);background:radial-gradient(120% 140% at 100% 0%,rgba(255,181,71,.10),transparent 55%),linear-gradient(180deg,#14130f,#0f0f0d)}
.summary:has(> [data-section="summary"][hidden]):has(> [data-section="team"][hidden]){display:none}
.summary-head{display:flex;flex-wrap:wrap;gap:8px 16px;justify-content:space-between;align-items:center}
.verdict{font-size:clamp(19px,2vw,24px);line-height:1.3;font-weight:650;letter-spacing:-.015em;margin:10px 0 8px;max-width:62ch;text-wrap:balance}
.status-note{margin:0;color:var(--soft);font-size:13px}
.summary.status-incomplete .status-note{color:var(--warn)}
.summary-text{margin:8px 0 0;color:var(--muted);font-size:13px;max-width:80ch}
.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;margin-top:18px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--line)}
.metric{background:var(--panel);padding:12px 14px;min-width:0}
.metric-value{font:600 22px/1.2 var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.metric-value small{font-size:13px;color:var(--dim)}
.metric-label{font-size:12px;color:var(--muted);margin-top:2px}
.sevbar{display:flex;gap:2px;height:6px;margin-top:9px;border-radius:3px;overflow:hidden;background:var(--line)}
.sevbar span{background:var(--sev)}
.sevlegend{display:flex;gap:8px;margin-top:6px;font:11px var(--mono);color:var(--muted)}
.sevlegend b{color:var(--sev);font-weight:600}
.team{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px;margin-top:14px}
.team-chip{display:flex;align-items:center;gap:10px;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:rgba(255,255,255,.015);text-align:left;min-width:0}
.team-chip:hover{border-color:var(--line2);background:var(--raised)}
.team-chip[aria-pressed="true"]{border-color:var(--accent-line);background:var(--accent-weak)}
.team-text{display:flex;flex-direction:column;min-width:0}
.team-name{font-weight:600;font-size:13px}
.team-model{font:11.5px var(--mono);color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.state{font:700 10px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;padding:4px 6px;border-radius:4px;margin-left:auto;flex:none;color:var(--ok);background:rgba(61,220,151,.1)}
.team-chip .state-completed{font-size:0;width:8px;height:8px;padding:0;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px rgba(61,220,151,.15)}
.state-failed,.state-timed_out,.state-unavailable,.state-cancelled{color:var(--bad);background:rgba(255,107,107,.12)}
.state-stale,.state-running{color:var(--warn);background:rgba(255,181,71,.12)}
.state-not_run{color:var(--muted);background:rgba(255,255,255,.05)}

/* Reviewer badges */
.rv-badges{display:inline-flex;flex:none}
.rv{display:inline-grid;place-items:center;flex:none;width:22px;height:22px;border-radius:50%;font:700 9px/1 var(--mono);color:#0a0c0f;background:var(--rv);box-shadow:0 0 0 2px var(--bg)}
.rv-badges .rv+.rv{margin-left:-5px}

/* List */
.list-toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:0 0 12px;border-bottom:1px solid var(--line)}
.list-title{font-size:15px;font-weight:650;letter-spacing:-.01em}
.result-count{margin:0;font:12px var(--mono);color:var(--muted)}
.answer-summary{margin:0;font:12px var(--mono);color:var(--soft)}
/* A widened detail pane leaves the list narrow; keep the summary metrics readable */
@container (max-width:560px){.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}.team{grid-template-columns:minmax(0,1fr)}}
.filter-summary{display:none}
.toolbar-right{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-left:auto}
.select{flex-direction:row;align-items:center;display:flex;gap:6px;font-size:12px;color:var(--muted)}
.select select{height:30px;border-radius:7px;border:1px solid var(--line2);background:var(--raised);color:var(--text);padding:0 8px}
.expand-controls{display:none;gap:6px}
.active-filters{display:flex;flex-wrap:wrap;gap:6px;width:100%}
.active-filters:empty{display:none}
.filter-chip{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 6px 0 10px;border-radius:999px;border:1px solid var(--accent-line);background:var(--accent-weak);color:var(--text);font-size:12px}
.filter-chip b{font-weight:500;color:var(--muted)}
.filter-chip::after{content:"×";font-size:15px;line-height:1;color:var(--muted);padding:0 4px}
.filter-chip:hover::after{color:var(--text)}
.group{margin-top:14px}
.group-head{position:sticky;top:var(--top);z-index:4;display:flex;align-items:center;gap:10px;padding:10px 4px 8px;background:linear-gradient(var(--bg) 80%,rgba(10,12,15,0))}
.group-toggle{display:flex;align-items:center;gap:10px;min-width:0;flex:1;border:0;background:none;padding:0;text-align:left}
.caret{width:0;height:0;border-left:5px solid var(--dim);border-top:4px solid transparent;border-bottom:4px solid transparent;transition:transform .12s;flex:none}
.group-toggle[aria-expanded="true"] .caret{transform:rotate(90deg)}
.group-label{display:flex;align-items:baseline;gap:8px;min-width:0;font-weight:600}
.group-label .stack-num{font-size:13px}
.group-title{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.group-meta{font:11.5px var(--mono);color:var(--dim);white-space:nowrap}
.group-count{font:11.5px var(--mono);color:var(--muted);padding:2px 7px;border-radius:999px;background:var(--raised);flex:none}
.group-link{font:12px var(--mono);white-space:nowrap}
.group-sev{font:700 11px/1 var(--mono);padding:3px 6px;border-radius:4px;color:#0a0c0f;background:var(--sev)}
.rows{display:flex;flex-direction:column;gap:2px}
.row{position:relative;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:start;gap:4px 12px;padding:10px 12px;border-radius:9px;border:1px solid transparent;cursor:pointer}
.row:hover{background:var(--raised)}
.row[data-selected]{background:var(--raised);border-color:var(--line2);box-shadow:inset 3px 0 var(--accent)}
.row[data-pinned]{background:linear-gradient(90deg,rgba(126,224,195,.06),transparent 40%)}
/* Ignored: still listed, but visibly out of the fix list */
.row[data-ignored]>:not(.row-details){opacity:.5;transition:opacity .12s}
.row[data-ignored]:hover>:not(.row-details),.row[data-ignored]:focus-within>:not(.row-details),.row[data-ignored][data-selected]>:not(.row-details){opacity:.85}
.row[data-ignored] .sev{background:transparent;color:var(--sev);box-shadow:inset 0 0 0 1px var(--sev)}
.row[data-ignored] .row-title-text{color:var(--muted);font-weight:500}
.sev{display:inline-block;margin-top:1px;font:700 11px/1 var(--mono);padding:4px 6px;border-radius:4px;color:#0a0c0f;background:var(--sev);letter-spacing:.02em}
.row-main{all:unset;display:flex;flex-direction:column;gap:4px;min-width:0;cursor:pointer;border-radius:4px}
.row-main:focus-visible{outline:2px solid var(--accent);outline-offset:4px}
.row-title{display:flex;align-items:center;gap:9px;font-weight:550;line-height:1.35;color:var(--text)}
.row-title-text{min-width:0}
.row[data-disposition="rejected"] .row-title-text{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--dim)}
.row[data-severity="P3"]:not([data-selected]) .row-title{font-weight:500;color:var(--soft)}
.row-sub{display:flex;flex-wrap:wrap;align-items:center;gap:3px 12px;font-size:12px;color:var(--muted)}
.row-sub code{font-size:11.5px;color:var(--soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:min(52ch,100%)}
.row-sub .disp-label{color:var(--disp)}
.row-id{font:11px var(--mono);color:var(--dim)}
.tag{font:11px var(--mono);color:var(--dim)}
.tag::before{content:"#"}
.flag{font:700 9.5px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;padding:3px 5px;border-radius:3px;border:1px solid currentColor;flex:none}
.flag-pin{color:var(--accent)}
.flag-ignored,.flag-comment{display:none}
.row[data-ignored] .flag-ignored{display:inline-block;color:var(--soft);border-color:var(--dim)}
.row[data-commented] .flag-comment{display:inline-flex;align-items:center;gap:4px;color:var(--rv3)}
.bubble{position:relative;width:9px;height:7px;border:1.5px solid currentColor;border-radius:2px}
.bubble::after{content:"";position:absolute;left:1px;bottom:-4px;border:2px solid transparent;border-top-color:currentColor;border-left-color:currentColor}
.row-side{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.pr-chip{height:22px;padding:0 6px;border-radius:5px;border:1px solid var(--accent-line);background:var(--accent-weak);color:var(--accent);font:600 11px var(--mono)}
.pr-chip:hover{background:rgba(126,224,195,.2)}
.finding-actions{display:flex;gap:4px}
.action{height:24px;padding:0 8px;border-radius:6px;border:1px solid var(--line2);background:transparent;color:var(--muted);font-size:12px}
.action:hover{color:var(--text);border-color:var(--dim)}
.action[aria-pressed="true"]{color:var(--accent);border-color:var(--accent-line);background:var(--accent-weak)}
.action-ignore[aria-pressed="true"]{color:#0a0c0f;border-color:var(--soft);background:var(--soft)}
.action-ignore[aria-pressed="true"]::before{content:"✕ " / "";font-weight:700}
@media (hover:hover){.row .finding-actions{opacity:0;transition:opacity .12s}.row:hover .finding-actions,.row:focus-within .finding-actions,.row[data-selected] .finding-actions{opacity:1}}
.row-details{grid-column:1/-1;display:none;margin-top:6px;border-top:1px solid var(--line);padding-top:8px}
.row-details summary{cursor:pointer;font-size:12.5px;font-weight:600;color:var(--accent)}
.row-details .answer{margin:10px 0 4px}

/* Answer block: Fix / Ignore segmented control, where the answer came from, and a comment for the fixer */
.answer{padding:12px 14px 14px;border:1px solid var(--line2);border-radius:10px;background:linear-gradient(180deg,#121820,#0f141a);box-shadow:inset 3px 0 var(--accent)}
.answer[data-answer="ignore"]{box-shadow:inset 3px 0 var(--soft);background:#101317}
.answer-legend{font:600 10.5px/1.2 var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--dim)}
.answer-choice{padding:2px;gap:2px;border:1px solid var(--line2);border-radius:8px;background:var(--bg)}
.answer-option{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 13px;border:0;border-radius:6px;background:transparent;color:var(--muted);font-size:13px;font-weight:600}
.answer-option:hover{color:var(--text);background:var(--hover)}
.answer-mark{font-size:12px;opacity:.55}
.answer-option[aria-pressed="true"] .answer-mark{opacity:1}
.answer-option[data-answer-value="fix"][aria-pressed="true"]{background:var(--accent);color:#04120d}
.answer-option[data-answer-value="ignore"][aria-pressed="true"]{background:var(--soft);color:#0a0c0f}
.answer-note{flex:1 1 160px;font-size:12px;color:var(--muted)}
.answer-comment{margin-top:12px}
.answer-comment-label{font:600 10.5px/1.2 var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--dim)}
.answer-input{min-height:78px;max-height:60vh;padding:9px 11px;border:1px solid var(--line2);border-radius:8px;background:#06080b;color:var(--text);font-size:13px;line-height:1.5;outline:none}
.answer-input::placeholder{color:var(--dim)}
.answer-input:focus{border-color:var(--accent-line);box-shadow:0 0 0 3px var(--accent-weak)}
.pane-answer{margin:0 0 4px}
.empty{margin:28px 0;padding:28px;border:1px dashed var(--line2);border-radius:12px;color:var(--muted);text-align:center}
.empty strong{display:block;color:var(--text);font-size:15px;margin-bottom:4px}
.empty .btn{margin-top:12px}

/* Detail pane */
.detail-tabs{position:sticky;top:0;z-index:3;display:flex;gap:2px;padding:10px 14px;background:rgba(14,18,23,.94);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.detail-tabs{align-items:center}
.tab-list{display:flex;gap:2px}
.tab{border:0;background:none;color:var(--muted);padding:6px 10px;border-radius:7px;font-size:12.5px;font-weight:600}
.tab[aria-selected="true"]{color:var(--text);background:var(--raised)}
.tab:disabled{opacity:.4}
.full-btn{display:inline-flex;align-items:center;gap:7px;margin-left:auto;height:28px;padding:0 10px;border-radius:7px;border:1px solid var(--line2);background:transparent;color:var(--muted);font-size:12px;font-weight:600;white-space:nowrap}
.full-btn:hover:not(:disabled){color:var(--text);border-color:var(--dim)}
.full-btn[aria-pressed="true"]{color:var(--accent);border-color:var(--accent-line);background:var(--accent-weak)}
.full-icon{position:relative;width:11px;height:11px;flex:none}
.full-icon::before,.full-icon::after{content:"";position:absolute;width:4px;height:4px;border:1.5px solid currentColor}
.full-icon::before{top:0;left:0;border-right:0;border-bottom:0}
.full-icon::after{right:0;bottom:0;border-left:0;border-top:0}
.full-btn[aria-pressed="true"] .full-icon::before{top:auto;bottom:0;left:0;border:1.5px solid currentColor;border-left:0;border-bottom:0}
.full-btn[aria-pressed="true"] .full-icon::after{top:0;bottom:auto;right:0;border:1.5px solid currentColor;border-right:0;border-top:0}
.full-btn kbd{font-size:10px;padding:0 4px}

/* Full-screen reading mode (f): the detail pane takes over below the top bar; j/k keep moving through findings */
html[data-drawer-full] .shell{display:block}
html[data-drawer-full] .sidebar,html[data-drawer-full] .main,html[data-drawer-full] .filters-btn{display:none!important}
html[data-drawer-full] .detail{position:sticky;top:var(--top);height:calc(100vh - var(--top));border:0;background:var(--bg)}
html[data-drawer-full] .detail-scroll{height:100%;overflow:auto}
html[data-drawer-full] .detail-tabs{display:flex!important;padding-inline:max(16px,calc((100% - 980px) / 2 + 16px))}
html[data-drawer-full] .detail[data-tab="finding"] .finding-pane{display:block!important}
html[data-drawer-full] .detail[data-tab="finding"] .report-pane{display:none!important}
html[data-drawer-full] .finding-pane,html[data-drawer-full] .report-pane{max-width:980px;margin:0 auto;padding:26px 32px 96px}
html[data-drawer-full] .pane-title{font-size:clamp(22px,2.4vw,28px);max-width:40ch}
html[data-drawer-full] .finding-fields pre{max-height:none}
@media (min-width:900px){
  html[data-drawer-full] .finding-fields{display:grid;grid-template-columns:150px minmax(0,1fr);gap:18px 24px;margin-top:22px}
  html[data-drawer-full] .finding-fields dt{margin:3px 0 0}
  html[data-drawer-full] .finding-fields dd{margin:0}
}
.detail[data-tab="report"] .finding-pane,.detail[data-tab="finding"] .report-pane{display:none}
.finding-pane,.report-pane{padding:18px 20px 64px}
.finding-pane .finding-actions{margin-top:2px}
.pane-nav{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pane-nav .sev{font-size:11.5px;padding:5px 8px}
.disp-tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--disp);padding:3px 8px;border-radius:999px;border:1px solid var(--line2)}
.pane-id{font:12px var(--mono);color:var(--dim)}
.pane-arrows{display:flex;gap:4px;margin-left:auto}
.pane-title{font-size:20px;line-height:1.3;font-weight:650;letter-spacing:-.015em;margin:14px 0 12px;text-wrap:balance}
.pane-meta{display:flex;flex-direction:column;gap:10px;padding:12px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-bottom:14px}
.pane-prs{display:flex;flex-direction:column;gap:6px}
.pane-pr{display:flex;align-items:center;gap:8px;min-width:0;font-size:13px}
.pane-pr span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--soft)}
.pane-people{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:12.5px;color:var(--soft)}
.person{display:inline-flex;align-items:center;gap:6px}
.person .rv{width:20px;height:20px;box-shadow:none}
.finding-fields{margin:16px 0 0}
.finding-fields dt{font:600 10.5px/1.2 var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--dim);margin-top:16px}
.finding-fields dt:first-child{margin-top:0}
.finding-fields dd{margin:6px 0 0;color:var(--soft)}
.finding-fields dd[data-field="impact"]{color:var(--text);font-size:15px;line-height:1.5}
.finding-fields dd[data-field="location"] code{font-size:12.5px;color:var(--accent);word-break:break-all}
.finding-fields pre{font-size:12.5px;line-height:1.65;background:#06080b;border:1px solid var(--line);border-radius:9px;padding:12px 14px;color:#d3dfeb;max-height:440px;overflow:auto;box-shadow:inset 3px 0 var(--line2)}
.finding-fields dd[data-field="recommendation"]{border-left:2px solid var(--accent);padding:2px 0 2px 12px;color:var(--text)}
.finding-fields dd[data-field="decision"]{padding:10px 12px;border-radius:8px;background:var(--raised);color:var(--text)}
.finding-fields dd[data-field="validation"]{color:var(--warn)}
.pane-empty{padding:40px 8px;text-align:center;color:var(--muted)}
.report-pane h2{font:600 10.5px/1.2 var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--dim);margin:0 0 10px}
.rp-block{padding:0 0 20px;margin:0 0 20px;border-bottom:1px solid var(--line)}
.rp-block:last-child{border-bottom:0}
.rp-block h2+h2,.rp-block ul+h2,.rp-block ol+h2,.rp-block p+h2{margin-top:18px}
.rp-block ul,.rp-block ol{color:var(--soft);font-size:13px}
.kv{display:grid;grid-template-columns:minmax(90px,auto) 1fr;gap:6px 14px;margin:0;font-size:12.5px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;color:var(--soft);overflow-wrap:anywhere}
.rv-card{padding:12px;border:1px solid var(--line);border-radius:10px;margin-bottom:10px;background:rgba(255,255,255,.012)}
.rv-card header{display:flex;align-items:center;gap:10px}
.rv-card header div{display:flex;flex-direction:column;min-width:0}
.rv-card header code{font-size:11.5px;color:var(--muted);overflow-wrap:anywhere}
.rv-card p{margin:8px 0 0;font-size:12.5px;color:var(--muted)}
.rv-card .kv{margin-top:8px;font-size:12px}
.rv-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.rv-tags span{font:11px var(--mono);padding:2px 7px;border-radius:4px;background:var(--raised);color:var(--soft)}
.raw{margin-top:8px}
.raw summary{cursor:pointer;font-size:12px;color:var(--accent)}
.raw pre{font-size:11.5px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere;background:#06080b;border:1px solid var(--line);border-radius:8px;padding:10px;color:var(--soft);max-height:320px;overflow:auto}
.note{margin-bottom:12px}
.note strong{display:block;font-size:13px}
.note p{margin:4px 0 0;color:var(--muted);font-size:12.5px}
.footnote{font:11px var(--mono);color:var(--dim);margin-top:8px}

/* Below 1600px the top bar also carries the answers button, so the least-used preset steps aside */
@media (max-width:1599px){
  .presets .preset[data-preset="disagreements"]{display:none}
}
/* Medium: list + sidebar; detail pane flows below and rows expand inline */
@media (max-width:1179px){
  .shell{grid-template-columns:256px minmax(0,1fr)}
  .detail{position:static;height:auto;grid-column:2;border-left:0;border-top:1px solid var(--line)}
  .detail-scroll{height:auto;overflow:visible}
  .detail .resize-handle{display:none}
  .detail-tabs,.finding-pane{display:none!important}
  /* Two-row top bar: title + answers button, then search + quick views */
  :root{--top:96px}
  .topbar{flex-wrap:wrap;align-content:center;row-gap:8px;padding:8px 16px}
  .brand{flex:1 1 0;max-width:none}
  .top-search{order:5;flex:1 1 60%;max-width:none}
  .presets{order:6}
  .detail .report-pane{display:block!important}
  .row-details{display:block}
  .expand-controls{display:flex}
}
/* Small: sidebar becomes a drawer */
@media (max-width:759px){
  :root{--top:auto}
  /* No backdrop-filter here: it would become the containing block of the fixed action dock */
  .topbar{position:static;height:auto;flex-wrap:wrap;padding:10px 12px;gap:10px;background:var(--bg);backdrop-filter:none;-webkit-backdrop-filter:none}
  .brand{max-width:none;flex:1}
  .top-search{order:5;flex-basis:100%;max-width:none}
  .presets{order:6;max-width:100%;overflow-x:auto}
  .top-actions .copy,.top-actions .print{display:none}
  /* The topbar scrolls away on phones, so its actions dock to the bottom edge to stay in reach */

  function create() {
    const data = JSON.parse(document.getElementById('report-data').textContent);
    const findings = data.findings;
    const byId = new Map(findings.map((f) => [f.id, f]));
    const stack = buildStack(data.stack || []);
    /* One PR is a single review target, not a stack: stack views, the PR facet, and PR grouping need at least two. */
    const hasStack = stack.order.length > 1;
    const soloPR = stack.order.length === 1 ? stack.order[0] : null;
    const reviewerNames = unique(data.reviewers.map((r) => r.name).concat(...findings.map((f) => f.reviewers)));
    const reviewerIndex = (name) => Math.max(0, reviewerNames.indexOf(name)) % 6;
    const prLabel = (id) => { const n = stack.byId.get(id); if (!n) return id === NO_PR ? 'No PR' : String(id); return n.number != null ? `#${n.number}` : n.id; };
    const searchText = new Map(findings.map((f) => [f.id, norm([
      f.id, f.title, f.severity, f.disposition, f.confidence, f.reviewers.join(' '), f.tags.join(' '),
      f.prs.map((p) => `${prLabel(p)} ${(stack.byId.get(p) || {}).title || ''}`).join(' '),
      ...FIELDS.map(([key]) => f[key] || ''),
    ].join(' '))]));

    const confidences = unique(findings.map((f) => norm(f.confidence)).filter(Boolean));
    confidences.sort((a, b) => (CONFIDENCES.indexOf(a) + 1 || 99) - (CONFIDENCES.indexOf(b) + 1 || 99) || a.localeCompare(b));
    const options = {
      severity: SEVERITIES.map((v) => ({ value: v, label: v, hint: SEVERITY_LABELS[v] })),
      disposition: DISPOSITIONS.map((v) => ({ value: v, label: capitalize(v) })),
      reviewer: reviewerNames.map((v) => ({ value: v, label: v })),
      pr: hasStack ? stack.order.map((n) => ({ value: n.id, label: prLabel(n.id), hint: n.title, node: n }))
        .concat(findings.some((f) => !f.prs.length) ? [{ value: NO_PR, label: 'No PR', hint: 'Findings not tied to one pull request' }] : []) : [],
      confidence: confidences.map((v) => ({ value: v, label: capitalize(v) })),
      tag: unique(findings.flatMap((f) => f.tags)).sort().map((v) => ({ value: v, label: v })),
      answer: findings.length ? [
        { value: 'fix', label: 'Fix', hint: 'Approved for fixing; included in the copied answers' },
        { value: 'ignore', label: 'Ignore', hint: 'Left out of the fix list' },
      ] : [],
    };

    /* Local state is keyed by report, so every design rendered from one report.json shares it. */
    const storeKey = `multi-agent-review:${data.meta.key}`;
    let saved = {};
    try { saved = JSON.parse(localStorage.getItem(storeKey) || '{}') || {}; } catch (_) { saved = {}; }
    const pinned = new Set((saved.pinned || []).filter((id) => byId.has(id)));
    const answers = {};
    for (const [id, value] of Object.entries(saved.answers || {})) if (byId.has(id) && ANSWERS.includes(value)) answers[id] = value;
    for (const id of saved.hidden || []) if (byId.has(id) && !answers[id]) answers[id] = 'ignore'; // hides saved before answers existed
    const comments = {};
    for (const [id, text] of Object.entries(saved.comments || {})) if (byId.has(id) && typeof text === 'string' && text.trim()) comments[id] = text;
    const sections = Object.assign({}, saved.sections);
    const sectionDefaults = {};
    const sizes = Object.assign({}, saved.sizes);
    const themeStore = Object.assign({}, saved.theme);
    const persist = () => {
      try { localStorage.setItem(storeKey, JSON.stringify({ pinned: [...pinned], answers, comments, sections, sizes, theme: themeStore })); } catch (_) { /* storage blocked: keep state in memory */ }
    };
    const defaultAnswer = (f) => (f.disposition === 'rejected' ? 'ignore' : 'fix');
    const answerOf = (id) => answers[id] || (byId.has(id) ? defaultAnswer(byId.get(id)) : 'fix');
    const commentOf = (id) => (comments[id] || '').trim();
    function answerNote(id) {
      const f = byId.get(id);

      return answers[id] === 'ignore' ? 'Ignored by you' : 'Fix requested by you, although the coordinator rejected it';

    const valuesOf = (f, facet) => {

    let sheetReturn = null;

    function readHash() {

        state[facet] = new Set(params.getAll(HASH_KEYS[facet]).filter((v) => allowed.has(v)));
      }

      state.prInherited = params.get('inherit') === '1';
      if (GROUPS[params.get('group')] && (params.get('group') !== 'pr' || hasStack)) state.groupBy = params.get('group');
      if (SORTS[params.get('sort')]) state.sort = params.get('sort');

      if (state.prInherited) params.set('inherit', '1');
      if (state.groupBy !== defaults().groupBy) params.set('group', state.groupBy);
      if (state.sort !== 'severity') params.set('sort', state.sort);
      if (state.selected) params.set('f', state.selected);
      if (state.view) params.set('view', state.view);
      if (state.drawerFull) params.set('full', '1');
      const hash = params.toString();
      try { history.replaceState(null, '', hash ? `#${hash}` : location.pathname + location.search); } catch (_) { /* some file:// contexts reject replaceState */ }
    }

    function matches(f, except) {
      if (state.pinnedOnly && !pinned.has(f.id)) return false;
      if (state.q) { const text = searchText.get(f.id); if (!norm(state.q).split(/\s+/).every((term) => text.includes(term))) return false; }
      for (const facet of FACETS) {
        if (facet === except || !state[facet].size) continue;
        let selected = state[facet];
        if (facet === 'pr' && state.prInherited) selected = new Set([...selected].flatMap((id) => [id, ...stack.ancestors(id)]));

    }
    function counts(facet) {
      const out = new Map();
      for (const f of findings) if (matches(f, facet)) for (const v of valuesOf(f, facet)) out.set(v, (out.get(v) || 0) + 1);
      return out;
    }
    /** Per-PR severity breakdown under every filter except the PR filter itself. */
    function prBreakdown() {

      for (const f of findings) {

        for (const id of f.prs) { const row = out.get(id); if (row) { row.total += 1; row[f.severity] += 1; } }
      }
      return out;
    }

    const rank = (list, value) => { const i = list.indexOf(value); return i < 0 ? list.length : i; };
    const prOrder = (f) => (f.prs.length ? Math.min(...f.prs.map((p) => (stack.byId.get(p) || { order: 999 }).order)) + (f.prs.length > 1 ? 0.5 : 0) : 1000);

      disposition: (a, b) => rank(DISPOSITIONS, a.disposition) - rank(DISPOSITIONS, b.disposition) || rank(SEVERITIES, a.severity) - rank(SEVERITIES, b.severity) || byNumericId(a, b),
      pr: (a, b) => prOrder(a) - prOrder(b) || rank(SEVERITIES, a.severity) - rank(SEVERITIES, b.severity) || byNumericId(a, b),
      id: byNumericId,
    };
    function groupDefs() {
      if (state.groupBy === 'severity') return SEVERITIES.map((v) => ({ key: v, label: `${v} · ${SEVERITY_LABELS[v]}`, severity: v, canonical: true, test: (f) => f.severity === v }));
      if (state.groupBy === 'disposition') return DISPOSITIONS.map((v) => ({ key: v, label: capitalize(v), disposition: v, canonical: true, test: (f) => f.disposition === v }));
      if (state.groupBy === 'pr' && hasStack) {
        return stack.order.map((n) => ({ key: n.id, label: `${prLabel(n.id)} ${n.title}`, pr: n, canonical: true, test: (f) => f.prs.length === 1 && f.prs[0] === n.id }))
          .concat({ key: CROSS_PR, label: 'Spans several PRs', test: (f) => f.prs.length > 1 }, { key: NO_PR, label: 'Not tied to a PR', test: (f) => !f.prs.length });

    /** Visible findings, sorted (pinned first) and grouped. keepEmpty keeps canonical groups with no items. */

      return { groups, flat: groups.flatMap((g) => g.items), visible, total: findings.length };
    }

    function notify(reason, detail, opts) {
      const active = document.activeElement;
      const focusKey = active && active.dataset ? active.dataset.focusKey : null;
      if (!state.selected) state.drawerFull = false;
      document.documentElement.toggleAttribute('data-drawer-full', state.drawerFull);
      if (reason !== 'open') { writeHash(); refreshers.forEach((fn) => fn()); }
      listeners.forEach((fn) => fn(reason, detail));
      syncFindingElements(reason === 'select' && !(opts && opts.scroll === false));
      const next = focusAfterChange;
      focusAfterChange = null;
      if (focusKey && (!document.activeElement || document.activeElement === document.body)) {
        // A finding that left the view took its controls along; move focus to the same control on the next finding.
        const sameControl = next && focusKey.includes(':') ? `${focusKey.slice(0, focusKey.lastIndexOf(':'))}:${next}` : null;
        const target = (sameControl && byFocusKey(sameControl))
          || byFocusKey(focusKey)
          || (next && findingElement(next) && findingElement(next).querySelector('button,[href],[tabindex]:not([tabindex="-1"])'));
        if (target) target.focus({ preventScroll: true });
      }
    }
    /** First rendered element for a finding; themes may render a finding more than once (e.g. board + matrix). */
    function findingElement(id) {
      if (!id) return null;
      const all = Array.from(document.querySelectorAll(`[data-finding-id="${CSS.escape(id)}"]`));
      return all.find((el) => el.getClientRects().length) || all[0] || null;
    }
    /* Finding elements get data-selected, data-pinned, data-answer="fix|ignore", data-ignored, and

    function syncFindingElements(scroll) {

        const id = el.dataset.findingId;
        const answer = answerOf(id);
        el.toggleAttribute('data-selected', id === state.selected);
        el.toggleAttribute('data-pinned', pinned.has(id));
        el.dataset.answer = answer;
        el.toggleAttribute('data-ignored', answer === 'ignore');
        el.toggleAttribute('data-commented', Boolean(commentOf(id)));
      });

      document.querySelectorAll('[data-pin-for]').forEach((el) => {
        const on = pinned.has(el.dataset.pinFor);
        el.setAttribute('aria-pressed', String(on));
        el.textContent = on ? 'Unpin' : 'Pin';
      });
      document.querySelectorAll('details[data-open-for]').forEach((el) => { el.open = open.has(el.dataset.openFor); });
      if (scroll) { const el = findingElement(state.selected); if (el) el.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); }
    }
    function syncAnswerControls() {
      document.querySelectorAll('[data-answer-for]').forEach((el) => {

        const answer = answerOf(id);
        el.dataset.answer = answer;

        el.querySelectorAll('[data-answer-value]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.answerValue === answer)));

        if (note) note.textContent = answerNote(id);
      });
    }
    /** Apply answers, keeping selection and focus on a neighbour when a finding leaves the filtered view. */
    function changeAnswers(ids, value) {
      ids = ids.filter((id) => byId.has(id));
      if (!ids.length) return;
      const before = view().flat;
      for (const id of ids) {
        if (value == null || value === defaultAnswer(byId.get(id))) delete answers[id];
        else answers[id] = value;
      }
      persist();
      const gone = (id) => !matches(byId.get(id));
      const neighbour = (id) => {
        const at = before.findIndex((f) => f.id === id);
        if (at < 0) return null;
        for (let i = at + 1; i < before.length; i += 1) if (!gone(before[i].id)) return before[i].id;
        for (let i = at - 1; i >= 0; i -= 1) if (!gone(before[i].id)) return before[i].id;

    }
    function answersReport() {
      const prRef = (id) => { const n = stack.byId.get(id); return n ? compact({ id: n.id, number: n.number, branch: n.branch, title: n.title }) : { id }; };
      const ordered = findings.slice().sort(SORTERS.pr);
      const base = (f) => compact({
        id: f.id, title: f.title, severity: f.severity, disposition: f.disposition, confidence: f.confidence,
        prs: f.prs.length ? f.prs.map(prRef) : null, location: f.location,
      });
      const fix = ordered.filter((f) => answerOf(f.id) === 'fix').map((f) => compact(Object.assign(base(f), {

        comment: commentOf(f.id), decided_by: answers[f.id] ? 'you' : null,

        format: ANSWERS_FORMAT,
        instructions: ANSWERS_INSTRUCTIONS,
        answered_at: new Date().toISOString(),
        report: compact({
          title: data.title, verdict: data.verdict, status: data.status, generated_at: data.generated_at, snapshot_id: data.snapshot_id,
          key: data.meta.key, target: data.target.length ? Object.fromEntries(data.target) : null,
        }),
        stack: stack.order.length ? stack.order.map((n) => compact({ id: n.id, number: n.number, title: n.title, branch: n.branch, base: n.base, parent: n.parent, head: n.head })) : null,
        counts: { fix: fix.length, ignore: ignore.length, comments: Object.keys(comments).filter((id) => commentOf(id)).length },
        fix, ignore,

    }
    document.addEventListener('toggle', (event) => {
      const el = event.target;
      if (!el.dataset || !el.dataset.openFor || el.open === open.has(el.dataset.openFor)) return;
      if (el.open) open.add(el.dataset.openFor); else open.delete(el.dataset.openFor);
    }, true);

    const app = {
      data, findings, byId, stack, hasStack, soloPR, options, state, h,
      constants: { SEVERITIES, SEVERITY_LABELS, DISPOSITIONS, ANSWERS, ANSWER_LABELS, ANSWERS_FORMAT, FACETS, FACET_LABELS, PRESETS, FIELDS, GROUPS, SORTS, NO_PR, CROSS_PR },

      /** Re-apply data-selected/-pinned/-answer/-ignored/-commented and details state after a theme-local re-render. */
      sync: () => syncFindingElements(false),
      subscribe(fn) { listeners.push(fn); return app; },
      toggle(facet, value, solo) {

        else if (set.has(value)) set.delete(value); else set.add(value);
        notify('filter');
      },
      setFacet(facet, values) { state[facet] = new Set(values); notify('filter'); },
      set(key, value) { state[key] = value; notify(key === 'selected' ? 'select' : 'filter'); },
      applyPreset(name) {
        const preset = PRESETS[name];
        FACETS.forEach((facet) => { state[facet] = new Set(preset[facet] || []); });
        if (name === 'all') { state.q = ''; state.pinnedOnly = false; state.prInherited = false; }
        notify('filter');
      },
      presetActive(name) {
        const preset = PRESETS[name];
        return FACETS.every((facet) => { const want = preset[facet] || []; return state[facet].size === want.length && want.every((v) => state[facet].has(v)); })
          && (name !== 'all' || (!state.q && !state.pinnedOnly));
      },
      reset() { const keep = { groupBy: state.groupBy, sort: state.sort, selected: state.selected, view: state.view }; Object.assign(state, defaults(), keep); notify('filter'); },
      isFiltered() { return Boolean(state.q || state.pinnedOnly || FACETS.some((f) => state[f].size)); },
      /** Select a finding (null clears). Pass { scroll: false } to keep the page where it is. */
      select(id, opts) { state.selected = id && byId.has(id) ? id : null; notify('select', state.selected, opts); },
      /**

      setDrawerFull(value) {

          state.selected = first.id;

        }

      /** Add theme keys to the ? cheatsheet and the inline legend: addShortcuts('View', [['v', 'Cycle views']]). */

      openShortcuts: () => openSheet(),
      move(delta) {
        const flat = view().flat;
        if (!flat.length) return;
        const at = flat.findIndex((f) => f.id === state.selected);
        const next = at < 0 ? (delta > 0 ? 0 : flat.length - 1) : Math.min(flat.length - 1, Math.max(0, at + delta));

      isOpen: (id) => open.has(id),
      setOpen(id, value) { if (value) open.add(id); else open.delete(id); notify('open', id); },
      expandAll(value) { open.clear(); if (value) view().flat.forEach((f) => open.add(f.id)); notify('open'); },
      isPinned: (id) => pinned.has(id),
      pinnedCount: () => pinned.size,
      togglePinned(id) { if (pinned.has(id)) pinned.delete(id); else pinned.add(id); persist(); notify('filter'); },
      clearPins() { pinned.clear(); persist(); notify('filter'); },
      /* Answers: 'fix' (the default) or 'ignore' (the default for coordinator-rejected findings), plus a free-text comment. */
      answer: answerOf,
      isIgnored: (id) => answerOf(id) === 'ignore',
      /** True when the user chose this answer rather than inheriting the default. */
      answerChanged: (id) => Boolean(answers[id]),

  // The scroller sits inside the sticky pane so the resize handle stays put while the content scrolls.
  // Full-screen reading mode (core key f). aria-label stays constant for the toggle; the visible text names the way out.
  const fullText = h('span', null, 'Full screen');
  const fullButton = h('button', {
    type: 'button', class: 'full-btn', 'aria-pressed': 'false', 'aria-label': 'Full screen', title: 'Full screen (f)',
    onclick: () => app.toggleDrawerFull(),
  }, h('span', { class: 'full-icon', 'aria-hidden': 'true' }), fullText, h('kbd', { 'aria-hidden': 'true' }, 'f'));
  function syncFull() {
    const on = app.isDrawerFull();
    fullButton.setAttribute('aria-pressed', String(on));
    fullText.textContent = on ? 'Exit full screen' : 'Full screen';
  }
  const detailScroll = h('div', { class: 'detail-scroll' },
    h('div', { class: 'detail-tabs' }, h('div', { class: 'tab-list', role: 'tablist', 'aria-label': 'Detail pane' }, tabFinding, tabReport), hasFindings ? fullButton : null), findingPane, reportPane);
  const detail = h('aside', { class: 'detail', id: 'detail', 'aria-label': 'Finding and report details' }, detailScroll);
  // Sidebar (276px) + a 420px minimum for the list; the grid column clamps the same way in CSS.
  detail.append(ui.resizer(detail, { key: 'triage-drawer', min: 360, gutter: 696, label: 'Resize the detail pane' }));

  function renderPane() {
    const f = app.byId.get(state.selected);
    detail.dataset.tab = f ? tab : 'report';
    tabFinding.disabled = !f;
    tabFinding.setAttribute('aria-selected', String(detail.dataset.tab === 'finding'));
    tabReport.setAttribute('aria-selected', String(detail.dataset.tab === 'report'));
    if (!f) { findingPane.replaceChildren(h('div', { class: 'pane-empty' }, 'Select a finding.')); return; }
    const flat = app.view().flat;
    const at = flat.findIndex((x) => x.id === f.id);
    findingPane.replaceChildren(
      h('div', { class: 'pane-nav' },
        h('span', { class: 'sev', dataset: { severity: f.severity } }, `${f.severity} · ${SEVERITY_LABELS[f.severity]}`),
        h('span', { class: 'disp-tag', dataset: { disposition: f.disposition } }, h('span', { class: 'disp', dataset: { disposition: f.disposition }, 'aria-hidden': 'true' }), f.disposition),
        h('span', { class: 'pane-id' }, f.id),
        h('span', { class: 'pane-arrows' },
          h('button', { type: 'button', class: 'icon-btn', title: 'Previous (k)', 'aria-label': 'Previous finding', disabled: at <= 0, onclick: () => app.move(-1) }, '↑'),
          h('button', { type: 'button', class: 'icon-btn', title: 'Next (j)', 'aria-label': 'Next finding', disabled: at < 0 || at >= flat.length - 1, onclick: () => app.move(1) }, '↓'),
          h('button', { type: 'button', class: 'icon-btn', title: 'Close (Esc)', 'aria-label': 'Close finding', onclick: () => app.select(null) }, '✕'))),
      h('h2', { class: 'pane-title' }, f.title),
      h('div', { class: 'pane-meta' },
        app.hasStack && f.prs.length ? h('div', { class: 'pane-prs' }, f.prs.map((id) => h('div', { class: 'pane-pr' }, ui.prChip(id), h('span', null, (stack.byId.get(id) || {}).title || '')))) : null,
        h('div', { class: 'pane-people' },
          f.reviewers.map((name) => h('span', { class: 'person' }, h('span', { class: 'rv', dataset: { rv: String(app.reviewerIndex(name)) } }, app.initials(name)), name)),
          h('span', { class: 'muted' }, `· ${f.confidence} confidence`),
          f.tags.map((t) => h('span', { class: 'tag' }, t))),
        ui.findingActions(f, { answer: false })),
      h('div', { class: 'pane-answer' }, ui.answer(f, { rows: 4 })),
      ui.findingFields(f));
  }

  /* ---------- Assemble ---------- */
  const main = h('main', { class: 'main' }, summary, toolbar, list);
  root.append(topbar, h('div', { class: 'shell' }, sidebar, main, detail), h('div', { class: 'scrim', onclick: () => setDrawer(false) }));
  // Esc closes the phone filter drawer first; claiming the event keeps core from also closing the finding.
  document.addEventListener('keydown', (event) => {
    if (event.key === 'Escape' && root.hasAttribute('data-drawer')) { setDrawer(false); filtersButton.focus(); event.preventDefault(); }
  }, true);
  // Print the answer and comment under each finding; core opens every <details> before printing, so reopen re-rendered ones.
  const rerender = () => { renderList(); renderPane(); app.sync(); if (printing) list.querySelectorAll('details').forEach((el) => { el.open = true; }); };
  wide.addEventListener('change', rerender);
  window.addEventListener('beforeprint', () => { printing = true; rerender(); });
  window.addEventListener('afterprint', () => { printing = false; rerender(); });

  app.subscribe((reason) => {
    if (reason === 'open' || reason === 'sections') return;
    syncFull();
    if (reason === 'layout') {
      // Full screen only swaps CSS; just make sure the open finding (not the report) is what fills it.
      if (app.isDrawerFull() && tab !== 'finding') { tab = 'finding'; renderPane(); }
      detailScroll.scrollTop = 0;
      if (app.isDrawerFull()) { if (phone.matches) window.scrollTo(0, 0); } else {
        const el = app.findingElement(state.selected);
        if (el) el.scrollIntoView({ block: 'center' });
      }
      return;
    }
    if (reason === 'select') {
      tab = state.selected ? 'finding' : 'report';
      const group = app.view().groups.find((g) => g.items.some((f) => f.id === state.selected));
      if (group && collapsed.has(group.key)) { collapsed.delete(group.key); renderList(); }
      renderPane();
      detailScroll.scrollTop = 0;
      if (app.isDrawerFull() && phone.matches) window.scrollTo(0, 0);
      return;
    }
    // A pane control (Fix / Ignore / Pin) keeps focus inside the pane even when the rows carry their own copy of it.
    const active = document.activeElement;
    const paneKey = active && detail.contains(active) && active.dataset.focusKey;
    clearPins.disabled = !app.pinnedCount();
    const rows = app.prBreakdown();
    stackRefresh.forEach((fn) => fn(rows));
    teamRefresh.forEach((fn) => fn());
    renderActiveFilters();
    renderList();
    renderPane();
    if (paneKey) {
      const control = paneKey.includes(':') ? `${paneKey.slice(0, paneKey.lastIndexOf(':'))}:${state.selected}` : paneKey;
      const target = detail.querySelector(`[data-focus-key="${CSS.escape(paneKey)}"]`) || detail.querySelector(`[data-focus-key="${CSS.escape(control)}"]`);
      if (target) target.focus({ preventScroll: true });
    }
  });
  app.start();
})();
</script>
</body>
