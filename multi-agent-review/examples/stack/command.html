payments"],"location":"app/controllers/payments_controller.rb:31-58 @ 7be0d14","trigger":"Two POST /payments requests with the same Idempotency-Key arrive within the gateway round-trip (client retry on timeout).","impact":"Both requests miss the lookup, both call the gateway, and the customer is charged twice.","evidence":"key = IdempotencyKey.find_by(key: header)\nreturn replay(key) if key\nresult = Gateway.charge!(params)   # no row exists yet\nIdempotencyKey.create!(key: header, response: result)","recommendation":"Insert the key row in a `processing` state first (INSERT … ON CONFLICT DO NOTHING) and only call the gateway when this request won the insert.","confidence":"high","reviewers":["Codex","Claude Code"],"decision":"Confirmed by coordinator with a two-thread reproduction against the demo schema.","prs":["pr-413"]},{"id":"F-002","title":"Unique index omits merchant_id, so keys collide across merchants","severity":"P1","disposition":"confirmed","tags":["data-model"],"location":"db/migrate/20261001_create_idempotency_keys.rb:12","trigger":"Two merchants independently send the same UUID-like key (common with client libraries that hash request bodies).","impact":"The second merchant receives the first merchant's cached response, leaking payment metadata across tenants.","evidence":"add_index :idempotency_keys, :key, unique: true","recommendation":"Scope the unique index and all lookups to (merchant_id, key).","confidence":"high","reviewers":["Claude Code","Cursor Agent"],"decision":"Confirmed; every lookup in #413 also omits merchant_id.","prs":["pr-412"]},{"id":"F-013","title":"Each retry sends a fresh idempotency key to the gateway","severity":"P1","disposition":"confirmed","tags":["payments","concurrency"],"location":"app/workers/capture_retry_worker.rb:22-40 @ c90f5a7","trigger":"A capture times out after the gateway accepted it, then the worker retries.","impact":"Gateway-side deduplication is defeated, so a slow-but-successful capture can be captured again.","evidence":"gateway.capture(payment.id, idempotency_key: SecureRandom.uuid)","recommendation":"Derive the gateway key from the payment and attempt series (for example `capture:#{payment.id}`) and reuse it on every retry.","confidence":"high","reviewers":["Codex","Claude Code","Cursor Agent"],"decision":"Confirmed; all three reviewers found it independently.","prs":["pr-414"]},{"id":"F-003","title":"Retry job can capture after the payment was voided","severity":"P1","disposition":"needs validation","tags":["concurrency"],"location":"app/workers/capture_retry_worker.rb:15-21","trigger":"A merchant voids the payment while a retry is waiting in backoff.","impact":"The worker does not reload the payment before capturing, so a voided payment may still be captured.","evidence":"def perform(payment_id, attempt)\n  payment = Payment.find(payment_id)   # loaded once before sleep_for(attempt)\n  sleep_for(attempt)\n  capture!(payment)","recommendation":"Reload with a row lock after the backoff and skip unless the payment is still `authorized`.","confidence":"medium","reviewers":["Cursor Agent"],"decision":"Plausible from inspection; whether the gateway rejects captures on voided authorizations is unverified.","validation":"No gateway sandbox run. Needs a check against the gateway's void semantics.","prs":["pr-414"]},{"id":"F-004","title":"Cached 5xx responses are replayed forever","severity":"P1","disposition":"disputed","tags":["error-handling"],"location":"app/controllers/payments_controller.rb:60-74","trigger":"The gateway returns 503 once; the client retries with the same key.","impact":"Codex: the stored 503 is replayed on every retry, so the payment can never succeed with that key.","evidence":"Codex cites `IdempotencyKey.create!(response: result)` storing any status. Claude Code cites `ensure key.release! if result.server_error?` deleting 5xx rows.","recommendation":"Store only terminal 2xx/4xx responses, and release the row explicitly on 5xx, including after crashes.","confidence":"medium","reviewers":["Codex"],"decision":"Disputed. The ensure block releases rows on normal 5xx returns, but not when the process is killed mid-request; then the `processing` row never expires.","validation":"Round 2: Claude Code disagreed, Cursor timed out. Needs a crash-injection test.","prs":["pr-413"]},{"id":"F-005","title":"TTL cleanup deletes keys that are still processing","severity":"P2","disposition":"confirmed","prs":["pr-412","pr-413"],"tags":["data-model","concurrency"],"location":"app/jobs/expire_idempotency_keys_job.rb:8 (#412) · payments_controller.rb:31 (#413)","trigger":"A request remains in `processing` for longer than the 24-hour TTL (stuck worker, gateway outage).","impact":"The cleanup job in #412 deletes the row that #413 uses as its lock, reopening the duplicate-charge window.","evidence":"IdempotencyKey.where('created_at \u003c ?', 24.hours.ago).delete_all","recommendation":"Only expire rows in a terminal state, and alert on rows stuck in `processing`.","confidence":"high","reviewers":["Codex"],"decision":"Confirmed; the problem appears only when #412 and #413 are combined."},{"id":"F-006","title":"Retry exhaustion leaves captures in `retrying` without an alert","severity":"P2","disposition":"confirmed","tags":["observability"],"location":"app/workers/capture_retry_worker.rb:44-52","trigger":"All eight retry attempts fail.","impact":"The payment stays in `retrying` and nobody is notified; funds remain authorized until the hold expires.","evidence":"return if attempt \u003e= MAX_ATTEMPTS   # silent exit","recommendation":"Move the payment to `capture_failed`, emit a metric, and page on a nonzero rate.","confidence":"high","reviewers":["Claude Code","Codex"],"decision":"Confirmed.","prs":["pr-414"]},{"id":"F-007","title":"Request fingerprint depends on JSON key order","severity":"P2","disposition":"needs validation","tags":["api-contract"],"location":"app/services/request_fingerprint.rb:5","trigger":"A client retries with the same body, serialized with a different key order.","impact":"The retry is rejected with 422 `key reused with different payload` even though the payload is identical.","evidence":"Digest::SHA256.hexdigest(request.raw_post)","recommendation":"Fingerprint a canonicalized parsed body, or document byte-identical retries as a requirement.","confidence":"medium","reviewers":["Cursor Agent"],"decision":"Likely real; impact depends on which SDKs reorder keys.","validation":"Not exercised against the official client SDKs.","prs":["pr-413"]},{"id":"F-008","title":"Runbook tells on-call to delete idempotency rows by hand","severity":"P2","disposition":"confirmed","tags":["docs","ops"],"location":"docs/runbooks/idempotency.md:41-48","trigger":"On-call follows the `stuck payment` procedure.","impact":"Manually deleting a `processing` row reopens the F-001 duplicate-charge window for in-flight retries.","evidence":"\u003e If a payment is stuck, run `IdempotencyKey.where(key: ...).delete_all` and ask the merchant to retry.","recommendation":"Replace the deletion with a state transition that refuses rows younger than the gateway timeout.","confidence":"high","reviewers":["Claude Code"],"decision":"Confirmed.","prs":["pr-416"]},{"id":"F-009","title":"Missing Idempotency-Key returns 400 without a problem+json body","severity":"P3","disposition":"confirmed","tags":["api-contract"],"location":"app/controllers/payments_controller.rb:24","trigger":"A client omits the header.","impact":"The response is inconsistent with every other 4xx in the API, which breaks typed client error handling.","evidence":"head :bad_request unless header.present?","recommendation":"Render the standard problem+json error with a stable `type` URI.","confidence":"high","reviewers":["Codex"],"decision":"Confirmed; low impact.","prs":["pr-413"]},{"id":"F-012","title":"Alert threshold uses p50 rather than p99 latency","severity":"P3","disposition":"needs validation","tags":["docs","observability"],"location":"docs/runbooks/idempotency.md:12","trigger":"Gateway latency degrades for a minority of requests.","impact":"Tail latency that causes client timeouts and retries would not page anyone.","evidence":"alert: payments_gateway_latency_p50 \u003e 2s for 5m","recommendation":"Alert on p99 (or the client timeout budget) instead.","confidence":"low","reviewers":["Cursor Agent"],"decision":"Unvalidated; the alert definition lives outside this repository.","validation":"The alerting repository was not in scope.","prs":["pr-416"]},{"id":"F-010","title":"Built-in and custom retries double-schedule jobs","severity":"P3","disposition":"rejected","tags":["concurrency"],"location":"app/workers/capture_retry_worker.rb:3","trigger":"A capture raises inside perform.","impact":"Cursor Agent: the queue's automatic retry and the custom backoff would both enqueue a retry.","evidence":"ApplicationWorker sets `sidekiq_options retry: false`; CaptureRetryWorker inherits it.","recommendation":"None required.","confidence":"high","reviewers":["Cursor Agent"],"decision":"Rejected: the base class disables built-in retries, and Codex and Claude Code agreed in round 2.","prs":["pr-414"]},{"id":"F-011","title":"Migration locks the payments table","severity":"P2","disposition":"rejected","tags":["data-model"],"location":"db/migrate/20261001_create_idempotency_keys.rb","trigger":"Deploying during peak traffic.","impact":"Codex: adding a foreign key to payments would take a lock that blocks writes.","evidence":"add_reference :idempotency_keys, :payment, foreign_key: { validate: false }","recommendation":"None required.","confidence":"high","reviewers":["Codex"],"decision":"Rejected: the foreign key is created NOT VALID, which does not scan or block payments writes.","prs":["pr-412"]}],"checks":["Coordinator static inspection of all four PR diffs and touched callers (illustrative).","Two-thread reproduction of F-001 against a local copy of the demo schema (illustrative).","No CI, gateway sandbox, or deployed checks were run for this demo."],"gaps":["Demo data: every finding, check, and reviewer run on this page is illustrative.","Cursor Agent did not complete the targeted round 2, so F-004 has two of three reviewer opinions.","Alert definitions for F-012 live in a separate repository that was not reviewed."],"next_steps":["Fix F-001 and F-002 in #412/#413 before rebasing the rest of the stack.","Reuse a stable gateway key in #414 (F-013), then re-review the worker.","Add a crash-injection test to settle F-004.","Rewrite the stuck-payment procedure in #416 (F-008)."],"notes":[{"title":"Read the stack bottom-up","body":"Fixes in #412 change what #413, #414, and #416 inherit. Use “Include lower PRs” to see every finding that affects a PR you are about to merge."},{"title":"Answer, then copy","body":"Every finding starts as Fix. Ignore the ones you do not want fixed, comment where needed, then use Copy answers to hand the JSON to the agent. Answers and pins stay in this browser and never change the report file."}],"sources":[{"title":"Example stack (fictional)","url":"https://github.com/acme/checkout/pulls"}],"meta":{"key":"104830d1a7f0be7f","status_note":"Setup walkthrough only. This page does not claim a completed project review.","empty_message":"No findings recorded. This is not evidence of a clean completed review.","completed":3,"confirmed":7,"unresolved":4}}</script>
<script>/* multi-agent-review shared runtime, inlined into every theme.
 * Owns filter state, faceted counts, the PR stack hierarchy, answers (fix by default, ignore, comment),
 * pins, URL state, keyboard shortcuts, panel resizing, and safe DOM builders. state.view (URL `view=`)
 * is a free slot for theme view modes. Themes call MultiAgentReview.create(), build their layout with
 * app.h()/app.ui.*, render findings from app.view(), and finish with app.start().
 * Report text is inserted with textContent only; never route report data through innerHTML. */
(function () {
  'use strict';

  const SEVERITIES = ['P0', 'P1', 'P2', 'P3'];
  const SEVERITY_LABELS = { P0: 'Critical', P1: 'High', P2: 'Medium', P3: 'Low' };
  const DISPOSITIONS = ['confirmed', 'needs validation', 'disputed', 'rejected'];
  const CONFIDENCES = ['high', 'medium', 'low'];
  /* Every finding is approved for fixing unless the coordinator rejected it; the user ignores the rest. */
  const ANSWERS = ['fix', 'ignore'];
  const ANSWER_LABELS = { fix: 'Fix', ignore: 'Ignore' };
  const FACETS = ['severity', 'disposition', 'reviewer', 'pr', 'confidence', 'tag', 'answer'];
  const FACET_LABELS = { severity: 'Severity', disposition: 'Disposition', reviewer: 'Raised by', pr: 'Pull request', confidence: 'Confidence', tag: 'Tags', answer: 'Your answer' };
  const HASH_KEYS = { severity: 'sev', disposition: 'disp', reviewer: 'rev', pr: 'pr', confidence: 'conf', tag: 'tag', answer: 'ans' };
  const ANSWERS_FORMAT = 'multi-agent-review/answers@1';
  const ANSWERS_INSTRUCTIONS = 'Fix every finding in `fix`, bottom of the stack first when `stack` is present. A `comment` is the reviewer\'s own instruction and overrides `recommendation`. '
    + 'Confirm `needs validation` and `disputed` findings before changing code, and report any that do not reproduce instead of fixing them. '
    + 'Do not change code for findings in `ignore`. Afterwards, report what changed per finding id and which checks ran.';
  const NO_PR = '(none)';
  const CROSS_PR = '(cross)';
  const PRESETS = {
    actionable: { label: 'Actionable', hint: 'P0–P2 that are not rejected', severity: ['P0', 'P1', 'P2'], disposition: ['confirmed', 'needs validation', 'disputed'] },
    blocking: { label: 'Blocking', hint: 'P0–P1 that are confirmed or still need validation', severity: ['P0', 'P1'], disposition: ['confirmed', 'needs validation'] },
    disagreements: { label: 'Disagreements', hint: 'Disputed and rejected candidates', disposition: ['disputed', 'rejected'] },
    all: { label: 'Everything', hint: 'Clear every filter' },
  };
  const FIELDS = [
    ['location', 'Location'], ['trigger', 'Trigger'], ['impact', 'Impact'], ['evidence', 'Evidence'],
    ['recommendation', 'Suggested correction'], ['decision', 'Coordinator decision'], ['validation', 'Validation limits'],
  ];
  const GROUPS = { none: 'No grouping', pr: 'Pull request', severity: 'Severity', disposition: 'Disposition' };
  const SORTS = { severity: 'Severity', disposition: 'Disposition', pr: 'Stack order', id: 'ID' };

  const unique = (values) => Array.from(new Set(values));
  const norm = (value) => String(value == null ? '' : value).trim().toLowerCase();
  const capitalize = (value) => value.charAt(0).toUpperCase() + value.slice(1);
  const byNumericId = (a, b) => String(a.id).localeCompare(String(b.id), undefined, { numeric: true });

  function safeUrl(value) {
    try { return ['http:', 'https:'].includes(new URL(String(value)).protocol); } catch (_) { return false; }
  }

  /** Drop null, undefined, and empty-string values so exported JSON stays compact. */
  function compact(obj) {
    const out = {};
    for (const [key, value] of Object.entries(obj)) if (value != null && value !== '') out[key] = value;
    return out;
  }

  /** Rendered and not inside a closed <details> or [hidden] ancestor (getClientRects alone misses closed details in Chrome). */
  function isShown(el) {
    if (!el || !el.getClientRects().length) return false;
    return typeof el.checkVisibility === 'function' ? el.checkVisibility() : !el.closest('details:not([open]) > :not(summary), [hidden]');
  }
  /** Prefer the visible element when a control is rendered twice (e.g. inline row details and the drawer). */
  function byFocusKey(key) {
    const all = Array.from(document.querySelectorAll(`[data-focus-key="${CSS.escape(key)}"]`));
    return all.find(isShown) || null;
  }

  async function copyText(text) {
    try { await navigator.clipboard.writeText(text); return true; } catch (_) {
      const area = h('textarea', { style: 'position:fixed;top:0;left:0;opacity:0' }, text);
      document.body.append(area); area.select();
      let ok = false; try { ok = document.execCommand('copy'); } catch (__) { ok = false; }
      area.remove(); return ok;
    }
  }

  /** Build an element. Children may be nodes, strings, numbers, arrays, or null. */
  function h(tag, props, ...children) {
    const el = document.createElement(tag);
    for (const [key, value] of Object.entries(props || {})) {
      if (value == null || value === false) continue;
      if (key === 'class') el.className = value;
      else if (key === 'text') el.textContent = value;
      else if (key === 'dataset') { for (const [k, v] of Object.entries(value)) if (v != null) el.dataset[k] = v; }
      else if (key === 'style') el.style.cssText = value;
      else if (key.startsWith('on') && typeof value === 'function') el.addEventListener(key.slice(2), value);
      else if (key === 'href') { if (safeUrl(value) || String(value).startsWith('#')) el.setAttribute('href', value); }
      else el.setAttribute(key, value === true ? '' : String(value));
    }
    for (const child of children.flat(Infinity)) {
      if (child == null || child === false) continue;
      el.append(child instanceof Node ? child : document.createTextNode(String(child)));
    }
    return el;
  }

  /* Stack layout: depth is true distance from the trunk; lane is a git-graph row where the first
     child continues its parent's lane and later siblings fork into new lanes; indent counts forks. */
  function buildStack(entries) {
    const byId = new Map(entries.map((entry, index) => [entry.id, Object.assign({}, entry, { index, children: [] })]));
    const roots = [];
    for (const node of byId.values()) {
      node.parentEntry = node.parent != null ? byId.get(node.parent) || null : null;
      (node.parentEntry ? node.parentEntry.children : roots).push(node);
    }
    const order = [];
    let lanes = 0;
    const walk = (node, depth, trail, lane, indent, forked) => {
      Object.assign(node, { depth, trail, lane, indent, forked, order: order.length });
      order.push(node);
      node.children.forEach((child, i) => {
        child.isLast = i === node.children.length - 1;
        walk(child, depth + 1, depth === 0 ? [] : trail.concat(!node.isLast), i === 0 ? lane : ++lanes, indent + (i === 0 ? 0 : 1), i > 0);
      });
    };
    roots.forEach((root, i) => { root.isLast = i === roots.length - 1; walk(root, 0, [], i === 0 ? 0 : ++lanes, 0, false); });
    const ancestors = (id) => { const out = []; let node = byId.get(id); while (node && node.parentEntry) { node = node.parentEntry; out.push(node.id); } return out; };
    const descendants = (id) => { const out = []; const visit = (node) => node.children.forEach((c) => { out.push(c.id); visit(c); }); const n = byId.get(id); if (n) visit(n); return out; };
    const trunk = unique(roots.map((r) => r.base).filter(Boolean)).join(', ') || 'trunk';
    return { order, byId, roots, ancestors, descendants, trunk, maxDepth: Math.max(0, ...order.map((n) => n.depth)), laneCount: lanes + 1 };
  }

  function create() {
    const data = JSON.parse(document.getElementById('report-data').textContent);
    const findings = data.findings;
    const byId = new Map(findings.map((f) => [f.id, f]));
    const stack = buildStack(data.stack || []);
    /* One PR is a single review target, not a stack: stack views, the PR facet, and PR grouping need at least two. */
    const hasStack = stack.order.length > 1;
    const soloPR = stack.order.length === 1 ? stack.order[0] : null;
    const reviewerNames = unique(data.reviewers.map((r) => r.name).concat(...findings.map((f) => f.reviewers)));
    const reviewerIndex = (name) => Math.max(0, reviewerNames.indexOf(name)) % 6;
    const prLabel = (id) => { const n = stack.byId.get(id); if (!n) return id === NO_PR ? 'No PR' : String(id); return n.number != null ? `#${n.number}` : n.id; };
    const searchText = new Map(findings.map((f) => [f.id, norm([
      f.id, f.title, f.severity, f.disposition, f.confidence, f.reviewers.join(' '), f.tags.join(' '),
      f.prs.map((p) => `${prLabel(p)} ${(stack.byId.get(p) || {}).title || ''}`).join(' '),
      ...FIELDS.map(([key]) => f[key] || ''),
    ].join(' '))]));

    const confidences = unique(findings.map((f) => norm(f.confidence)).filter(Boolean));
    confidences.sort((a, b) => (CONFIDENCES.indexOf(a) + 1 || 99) - (CONFIDENCES.indexOf(b) + 1 || 99) || a.localeCompare(b));
    const options = {
      severity: SEVERITIES.map((v) => ({ value: v, label: v, hint: SEVERITY_LABELS[v] })),
      disposition: DISPOSITIONS.map((v) => ({ value: v, label: capitalize(v) })),
      reviewer: reviewerNames.map((v) => ({ value: v, label: v })),
      pr: hasStack ? stack.order.map((n) => ({ value: n.id, label: prLabel(n.id), hint: n.title, node: n }))
        .concat(findings.some((f) => !f.prs.length) ? [{ value: NO_PR, label: 'No PR', hint: 'Findings not tied to one pull request' }] : []) : [],
      confidence: confidences.map((v) => ({ value: v, label: capitalize(v) })),
      tag: unique(findings.flatMap((f) => f.tags)).sort().map((v) => ({ value: v, label: v })),
      answer: findings.length ? [
        { value: 'fix', label: 'Fix', hint: 'Approved for fixing; included in the copied answers' },
        { value: 'ignore', label: 'Ignore', hint: 'Left out of the fix list' },
      ] : [],
    };

    /* Local state is keyed by report, so every design rendered from one report.json shares it. */
    const storeKey = `multi-agent-review:${data.meta.key}`;
    let saved = {};
    try { saved = JSON.parse(localStorage.getItem(storeKey) || '{}') || {}; } catch (_) { saved = {}; }
    const pinned = new Set((saved.pinned || []).filter((id) => byId.has(id)));
    const answers = {};
    for (const [id, value] of Object.entries(saved.answers || {})) if (byId.has(id) && ANSWERS.includes(value)) answers[id] = value;
    for (const id of saved.hidden || []) if (byId.has(id) && !answers[id]) answers[id] = 'ignore'; // hides saved before answers existed
    const comments = {};
    for (const [id, text] of Object.entries(saved.comments || {})) if (byId.has(id) && typeof text === 'string' && text.trim()) comments[id] = text;
    const sections = Object.assign({}, saved.sections);
    const sectionDefaults = {};
    const sizes = Object.assign({}, saved.sizes);
    const themeStore = Object.assign({}, saved.theme);
    const persist = () => {
      try { localStorage.setItem(storeKey, JSON.stringify({ pinned: [...pinned], answers, comments, sections, sizes, theme: themeStore })); } catch (_) { /* storage blocked: keep state in memory */ }
    };
    const defaultAnswer = (f) => (f.disposition === 'rejected' ? 'ignore' : 'fix');
    const answerOf = (id) => answers[id] || (byId.has(id) ? defaultAnswer(byId.get(id)) : 'fix');
    const commentOf = (id) => (comments[id] || '').trim();
    function answerNote(id) {
      const f = byId.get(id);
      if (!answers[id]) return f.disposition === 'rejected' ? 'Ignored by default: the coordinator rejected it' : 'Approved by default';
      return answers[id] === 'ignore' ? 'Ignored by you' : 'Fix requested by you, although the coordinator rejected it';
    }

    const valuesOf = (f, facet) => {
      switch (facet) {
        case 'severity': return [f.severity];
        case 'disposition': return [f.disposition];
        case 'reviewer': return f.reviewers;
        case 'pr': return f.prs.length ? f.prs : [NO_PR];
        case 'confidence': return [norm(f.confidence)];
        case 'answer': return [answerOf(f.id)];
        default: return f.tags;
      }
    };

          else if (event.key === 'ArrowRight') apply(width - step * dir, true);
          else if (event.key === 'Home') apply(maxWidth(), true);
          else if (event.key === 'End') apply(min, true);
          else if (event.key === 'Enter') apply(null, true);

        });

    { key: '', id: 'list', label: 'List', hint: 'Dense rows, grouped' },

  const findings = app.findings;

  const reviewerNames = app.options.reviewer.map((o) => o.value);
  const human = (value) => String(value).replace(/_/g, ' ');
  const plural = (n, one, many) => `${n} ${n === 1 ? one : many || `${one}s`}`;

      h('div', { class: 'rp-sub', dataset: { kind: 'next' } }, rpHead('Next steps', data.next_steps.length), numbered(data.next_steps))),
    data.notes.length || data.sources.length ? h('section', { class: 'rp-block', dataset: { section: 'notes' } },
      data.notes.length ? h('div', { class: 'rp-sub' }, rpHead('Notes'), data.notes.map((n) => h('div', { class: 'note' }, n.title ? h('strong', null, n.title) : null, h('p', null, n.body || '')))) : null,
      data.sources.length ? h('div', { class: 'rp-sub' }, rpHead('Sources'), h('ul', { class: 'sources' }, data.sources.map((s) => h('li', null, h('a', { href: s.url, target: '_blank', rel: 'noopener noreferrer' }, s.title || s.url))))) : null) : null,
    h('p', { class: 'footnote' }, 'Standalone HTML · no network requests · answers, comments and pins are saved in this browser only and shared by every design of this report.'));
  /* The pane scrolls inside a fixed frame so each resize handle stays on the frame's edge instead of scrolling away. */
  const findingScroll = h('div', { class: 'finding-scroll' });
  findingPane.append(ui.resizer(findingPane, { key: 'command-drawer', label: 'Resize finding panel', min: 360 }), findingScroll);
  const detail = h('aside', { class: 'detail', id: 'detail', 'aria-label': 'Finding and report details' },
    h('div', { class: 'detail-scroll' },
      h('div', { class: 'detail-tabs', role: 'tablist', 'aria-label': 'Detail' }, tabFinding, tabReport), findingPane, reportPane));
  /* Docked column (1180px and up): keep --main-min for the findings, so the cap follows the sidebar's width. */
  detail.append(ui.resizer(detail, {
    key: 'command-drawer', label: 'Resize detail panel', min: 320,
    get gutter() { return sidebar.getBoundingClientRect().width + (parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--main-min')) || 480); },
  }));

  function renderPane() {
    const f = app.byId.get(state.selected);
    detail.dataset.tab = f ? tab : 'report';
    tabFinding.disabled = !f;
    tabFinding.setAttribute('aria-selected', String(detail.dataset.tab === 'finding'));
    tabReport.setAttribute('aria-selected', String(detail.dataset.tab === 'report'));
    if (!f) {
      delete findingPane.dataset.severity; delete findingPane.dataset.disposition;
      findingPane.removeAttribute('data-ignored');
      findingScroll.replaceChildren(h('div', { class: 'pane-empty' }, 'Select a finding.'));
      return;
    }
    const flat = app.view().flat;
    const at = flat.findIndex((x) => x.id === f.id);
    const step = (dir, glyph, label) => h('button', {
      type: 'button', class: 'pane-step', 'aria-label': label, title: `${label} (${dir > 0 ? 'j' : 'k'})`,
      disabled: at < 0 || (dir < 0 ? at === 0 : at === flat.length - 1), dataset: { focusKey: `pane-${dir > 0 ? 'next' : 'prev'}` }, onclick: () => app.move(dir),
    }, glyph);
    const ignored = app.isIgnored(f.id);
    const outByAnswer = state.answer.size > 0 && !state.answer.has(app.answer(f.id));
    findingPane.dataset.severity = f.severity;
    findingPane.dataset.disposition = f.disposition;
    findingPane.toggleAttribute('data-ignored', ignored);
    findingScroll.replaceChildren(
      h('div', { class: 'pane-band' },
        h('span', { class: 'pane-sev' }, f.severity),
        h('span', { class: 'pane-sevtext' }, h('span', null, `${SEVERITY_LABELS[f.severity]}${ignored ? ' · Ignored' : ''}`), h('span', { class: 'pane-id' }, f.id)),
        h('span', { class: 'pane-nav' }, step(-1, '↑', 'Previous finding'), h('span', { class: 'pane-pos' }, at >= 0 ? `${at + 1}/${flat.length}` : '–'), step(1, '↓', 'Next finding')),
        fullButton(),
        h('button', { type: 'button', class: 'pane-close', 'aria-label': 'Close finding (Esc)', title: 'Close (Esc)', dataset: { focusKey: 'pane-close' }, onclick: () => app.select(null) }, '×')),
      h('div', { class: 'pane-body' },
        at < 0 ? h('p', { class: 'pane-note' }, outByAnswer
          ? `Your answer is ${ANSWER_LABELS[app.answer(f.id)]}, so the “Your answer” filter leaves it out of the current view.`
          : 'Not in the current filtered view.') : null,
        h('h2', { class: 'pane-title', id: 'pane-title', tabindex: '-1', dataset: { focusKey: 'pane-title' } }, f.title),
        h('div', { class: 'pane-line' },
          h('p', { class: 'pane-disp', dataset: { disposition: f.disposition } }, dispGlyph(f.disposition), DISP_LABEL[f.disposition]),
          ui.findingActions(f, { answer: false })),
        h('div', { class: 'pane-side' },
          h('dl', { class: 'pane-meta' },
            app.hasStack ? [h('dt', null, f.prs.length > 1 ? 'Pull requests' : 'Pull request'), h('dd', null, f.prs.length
              ? h('span', { class: 'chips' }, f.prs.map((id) => h('span', { class: 'pr-ref' }, ui.prChip(id), h('span', { class: 'pr-ref-title' }, (stack.byId.get(id) || {}).title || ''))))
              : 'Not tied to one PR')] : null,
            [h('dt', null, 'Raised by'), h('dd', null, f.reviewers.length ? h('span', { class: 'people' }, f.reviewers.map((name) => h('span', { class: 'person' }, rvTile(name), name))) : 'Coordinator')],
            [h('dt', null, 'Confidence'), h('dd', null, confidence(f.confidence))],
            f.tags.length ? [h('dt', null, 'Tags'), h('dd', null, h('span', { class: 'chips' }, f.tags.map((t) => h('button', {
              type: 'button', class: 'tag-chip', 'aria-pressed': String(state.tag.has(t)), title: `Show only findings tagged ${t}`, onclick: () => app.setFacet('tag', [t]),
            }, t))))] : null),
          ui.answer(f)),
        ui.findingFields(f)));
  }

  /* Full screen (core's f / html[data-drawer-full]) and the overlay sheet (board/matrix below 1180px) both turn the
     finding pane into a modal surface; the band's toggle mirrors core's state without re-rendering the pane. */
  function fullButton() {
    const on = app.isDrawerFull();
    return h('button', {
      type: 'button', class: 'pane-full', 'aria-pressed': String(on), 'aria-label': 'Full screen', title: on ? 'Exit full screen (f)' : 'Full screen (f)',
      dataset: { focusKey: 'pane-full' }, onclick: () => app.toggleDrawerFull(),
    }, h('span', { class: 'full-icon', 'aria-hidden': 'true' }), h('span', { class: 'pane-full-label' }, 'Exit full screen'));
  }
  function syncFull() {
    const on = app.isDrawerFull();
    findingPane.querySelectorAll('.pane-full').forEach((b) => { b.setAttribute('aria-pressed', String(on)); b.title = on ? 'Exit full screen (f)' : 'Full screen (f)'; });
    if (on && tab !== 'finding') { tab = 'finding'; renderPane(); }
  }
  /** The visible list row / card / matrix row button for a finding, to hand keyboard focus back to. */
  const findingControl = (id) => (id ? ['row', 'card', 'who'].map((k) => document.querySelector(`[data-focus-key="${CSS.escape(`${k}:${id}`)}"]`)).find((el) => el && app.isShown(el)) : null);
  let overlayOpen = false;
  let opener = null;
  let lastSelected = null;
  function syncSheet() {
    const full = app.isDrawerFull() && !printing;
    const sheet = Boolean(state.selected) && !wide.matches && viewId() !== 'list' && !printing;
    const open = full || sheet;
    const was = overlayOpen;
    overlayOpen = open;
    root.toggleAttribute('data-sheet', sheet && !full);
    document.documentElement.toggleAttribute('data-lock', open);
    if (open) {
      findingPane.setAttribute('role', 'dialog');
      findingPane.setAttribute('aria-modal', 'true');
      findingPane.setAttribute('aria-labelledby', 'pane-title');
      findingPane.removeAttribute('aria-label');
    } else {
      findingPane.setAttribute('role', 'tabpanel');
      findingPane.removeAttribute('aria-modal');
      findingPane.removeAttribute('aria-labelledby');
      findingPane.setAttribute('aria-label', 'Selected finding');
    }
    if (open && !was) {
      const active = document.activeElement;
      const outside = !findingPane.contains(active);
      opener = active && active.dataset && active.dataset.focusKey && outside ? active.dataset.focusKey : null;
      const title = outside && findingPane.querySelector('.pane-title');
      if (title) title.focus({ preventScroll: true });
    }
    if (!open && was) {
      const active = document.activeElement;
      const lost = !active || active === document.body || (findingPane.contains(active) && !app.isShown(findingPane));
      const id = state.selected;
      if (lost) {
        const back = findingControl(id) || (opener && document.querySelector(`[data-focus-key="${CSS.escape(opener)}"]`));
        if (back) back.focus({ preventScroll: true });
      }
      /* Leaving full screen after j/k: bring the finding you ended on into view in the list. */
      if (id) { const el = app.findingElement(id); if (el) el.scrollIntoView({ block: 'nearest' }); }
      opener = null;
    }
  }
  const sheetScrim = h('div', { class: 'sheet-scrim', 'aria-hidden': 'true', onclick: () => app.select(null) });

  /* ---------- Assemble ---------- */
  const main = h('main', { class: 'main', id: 'main' }, assessment, toolbar, host);
  root.append(topbar, h('div', { class: 'shell' }, sidebar, main, detail), h('div', { class: 'scrim', onclick: () => setDrawer(false) }), sheetScrim);

  app.subscribe((reason) => {
    if (reason === 'open' || reason === 'sections') return;
    if (reason === 'layout') { syncFull(); syncSheet(); return; }
    if (reason === 'select') {
      tab = state.selected ? 'finding' : 'report';
      const f = app.byId.get(state.selected);
      if (f && viewId() === 'list') {
        const group = app.view().groups.find((g) => g.items.some((x) => x.id === f.id));
        if (group && collapsedGroups.has(group.key)) { collapsedGroups.delete(group.key); renderList(); }
      }
      const wasIn = lastSelected && !state.selected && (!document.activeElement || document.activeElement === document.body || findingPane.contains(document.activeElement));
      renderPane();
      syncSheet();
      /* Closing the docked pane (Esc / ×) hands focus back to the finding in the list. */
      if (wasIn && (!document.activeElement || document.activeElement === document.body)) { const el = findingControl(lastSelected); if (el) el.focus({ preventScroll: true }); }
      lastSelected = state.selected;
      return;
    }
    const rows = app.prBreakdown();
    sideRefresh.forEach((fn) => fn(rows));
    teamRefresh.forEach((fn) => fn());
    refreshHero();
    renderActiveFilters();
    render();
    renderPane();
    syncSheet();
    lastSelected = state.selected;
  });

  document.addEventListener('keydown', (event) => {
    if (event.key === 'Escape' && root.hasAttribute('data-drawer')) { setDrawer(false); return; }
    if (event.defaultPrevented || event.metaKey || event.ctrlKey || event.altKey || event.shiftKey || event.key !== 'v') return;
    const target = event.target;
    if (/^(INPUT|SELECT|TEXTAREA)$/.test(target.tagName) || target.isContentEditable) return;
    event.preventDefault();
    const at = VIEWS.findIndex((v) => v.key === currentView());
    app.set('view', VIEWS[(at + 1) % VIEWS.length].key);
  });
  wide.addEventListener('change', () => { keepFocus(render); renderPane(); syncSheet(); });
  small.addEventListener('change', () => { if (!small.matches) setDrawer(false); if (viewId() === 'board') fitBoard(); });
  /* Print always shows the readable list with every field, whichever view is on screen. */
  window.addEventListener('beforeprint', () => { printing = true; render(); syncSheet(); });
  window.addEventListener('afterprint', () => { printing = false; render(); app.sync(); syncSheet(); });

  app.start();
})();
</script>
</body>
</html>
