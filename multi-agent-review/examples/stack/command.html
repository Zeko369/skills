<style>
/* command: triage's dark three-pane console with board's Swiss confidence.
   Sidebar = git-graph stack rail + facets; center = List | Board | Matrix; right = finding / report detail. */
:root{color-scheme:dark;
  --bg:#08090c;--panel:#0d1015;--raised:#141920;--hover:#1a212a;--line:#1c232b;--line2:#2a323d;--rule:#3a4451;
  --text:#eef2f6;--soft:#c2cbd5;--muted:#8893a1;--dim:#5c6775;--ink:#07080a;
  --accent:#7ee0c3;--accent-weak:rgba(126,224,195,.11);--accent-line:rgba(126,224,195,.42);
  --p0:#ff4f64;--p1:#ff8b2b;--p2:#ffd23a;--p3:#5c9dff;--violet:#b58cff;--ok:#3ddc97;--warn:#ffb547;--bad:#ff5f5f;--grey:#3a4350;
  --rv0:#7ee0c3;--rv1:#f0a6ff;--rv2:#ffcf70;--rv3:#8ab4ff;--rv4:#ff8f8f;--rv5:#b6f09c;
  --sans:Inter,ui-sans-serif,system-ui,-apple-system,"SF Pro Text","Segoe UI",sans-serif;
  --display:"Helvetica Neue",Helvetica,Inter,Arial,ui-sans-serif,system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
  --top:56px;--bar-h:92px;--fold:46px;--main-min:480px;
  --hatch:repeating-linear-gradient(-45deg,rgba(255,255,255,.07) 0 2px,transparent 2px 8px);
  --hazard:repeating-linear-gradient(-45deg,#07080a 0 8px,var(--warn) 8px 16px)}
[data-severity="P0"]{--sev:var(--p0)}[data-severity="P1"]{--sev:var(--p1)}[data-severity="P2"]{--sev:var(--p2)}[data-severity="P3"]{--sev:var(--p3)}
[data-rv="0"]{--rv:var(--rv0)}[data-rv="1"]{--rv:var(--rv1)}[data-rv="2"]{--rv:var(--rv2)}[data-rv="3"]{--rv:var(--rv3)}[data-rv="4"]{--rv:var(--rv4)}[data-rv="5"]{--rv:var(--rv5)}
[data-disposition="confirmed"]{--disp:var(--text)}[data-disposition="needs validation"]{--disp:var(--p2)}[data-disposition="disputed"]{--disp:var(--violet)}[data-disposition="rejected"]{--disp:var(--muted)}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:calc(var(--top) + var(--bar-h) + 52px)}
html[data-lock]{overflow:hidden}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{border-radius:0}
a{color:var(--accent);text-decoration-color:var(--accent-line);text-underline-offset:3px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
code,kbd,pre{font-family:var(--mono)}
kbd{display:inline-block;min-width:20px;font-size:11px;line-height:1.3;padding:1px 5px;border:1px solid var(--rule);border-bottom-width:2px;color:var(--soft);background:var(--raised);text-align:center}
h1,h2,h3,p{margin:0}
ul,ol{margin:0;padding-left:18px}
li{margin:0 0 6px}
li::marker{color:var(--dim)}
.muted{color:var(--muted)}
.kicker{display:block;font:800 10.5px/1.2 var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
noscript{display:block;padding:24px}

/* Buttons */
.btn,.copy,.print,.reset,.expand-all,.collapse-all,.icon-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:30px;padding:0 11px;border:1px solid var(--rule);background:var(--raised);color:var(--soft);font:700 11px/1 var(--display);letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;cursor:pointer}
:is(.btn,.copy,.print,.reset,.expand-all,.collapse-all,.icon-btn):hover:not(:disabled){color:var(--ink);background:var(--text);border-color:var(--text)}
.btn-solid{background:var(--text);color:var(--ink);border-color:var(--text)}
.btn-solid:hover:not(:disabled){background:var(--accent)!important;border-color:var(--accent)!important}
.icon-btn{width:30px;padding:0;font:700 14px/1 var(--sans);letter-spacing:0}
.badge:empty{display:none}
.badge{display:inline-grid;place-items:center;min-width:17px;height:17px;padding:0 4px;background:var(--accent);color:var(--ink);font:800 10px/1 var(--display);letter-spacing:0}

/* Top bar */
.topbar{position:sticky;top:0;z-index:30;height:var(--top);display:flex;align-items:center;gap:14px;padding:0 16px;background:rgba(8,9,12,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:2px solid var(--rule)}
.app.status-incomplete .topbar::after{content:"";position:absolute;left:0;right:0;bottom:-6px;height:4px;background:var(--hazard)}
.brand{display:flex;align-items:center;gap:9px;min-width:0;flex:0 1 auto;max-width:24vw;overflow:hidden}
.brand-mark{display:inline-grid;grid-template-columns:repeat(4,4px);gap:2px;flex:none}
.brand-mark i{height:16px;background:var(--sev)}
.brand-name{font:800 12px var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--soft)}
.brand-sep{color:var(--dim)}
.brand-title{font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status-pill{flex:none;display:inline-flex;align-items:center;gap:7px;height:26px;padding:0 10px;font:800 10.5px/1 var(--display);letter-spacing:.14em;text-transform:uppercase;border:1px solid var(--rule);color:var(--soft);background:var(--hatch)}
.status-pill::before{content:"";width:7px;height:7px;background:currentColor}
.status-pill.status-complete{background:var(--ok);border-color:var(--ok);color:var(--ink)}
.status-pill.status-incomplete{background:var(--warn);border-color:var(--warn);color:var(--ink)}
.status-pill.status-incomplete::before{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.2}}
.top-search{position:relative;flex:1 1 260px;max-width:460px;min-width:180px}
.search-input{width:100%;height:34px;padding:0 34px;border:1px solid var(--rule);border-radius:0;background:var(--panel);color:var(--text);outline:none}
.search-input::placeholder{color:var(--dim)}
.search-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-weak)}
.top-search::before{content:"";position:absolute;left:12px;top:11px;width:9px;height:9px;border:1.5px solid var(--dim);border-radius:50%}
.top-search::after{content:"";position:absolute;left:21px;top:20px;width:5px;height:1.5px;background:var(--dim);transform:rotate(45deg)}
.search-kbd{position:absolute;right:8px;top:7px;pointer-events:none}
.search-input:focus+.search-kbd{display:none}
.presets{display:flex;flex:none;border:1px solid var(--rule)}
.preset{border:0;border-right:1px solid var(--rule);background:transparent;color:var(--muted);padding:0 11px;height:32px;font:700 11px/1 var(--display);letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}
.preset:last-child{border-right:0}
.preset:hover{color:var(--text);background:var(--hover)}
.preset[aria-pressed="true"]{background:var(--text);color:var(--ink)}
.top-actions{display:flex;gap:6px;margin-left:auto;flex:none}
.filters-btn{display:none}

/* Primary export: copy the answers as JSON */
.copy-answers{display:inline-flex;align-items:stretch;flex:none;height:32px;padding:0;border:1px solid var(--accent);background:var(--accent);color:var(--ink);font:800 11px/1 var(--display);letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}
.copy-answers-label{display:inline-flex;align-items:center;padding:0 12px}
.copy-answers-label::before{content:"";width:9px;height:11px;margin-right:8px;border:1.5px solid currentColor;box-shadow:2px -2px 0 -1px var(--accent),2px -2px 0 .5px currentColor}
.copy-answers-count{display:inline-flex;align-items:center;padding:0 10px;background:var(--ink);color:var(--accent);font:700 11px/1 var(--mono);letter-spacing:0;text-transform:none}
.copy-answers:hover:not(:disabled){background:var(--text);border-color:var(--text)}
.copy-answers:hover:not(:disabled) .copy-answers-label::before{box-shadow:2px -2px 0 -1px var(--text),2px -2px 0 .5px currentColor}
.answer-summary{margin:0;font:700 12px var(--mono);color:var(--soft);white-space:nowrap}
.answer-summary::before{content:"";display:inline-block;width:7px;height:7px;margin-right:7px;background:var(--accent);vertical-align:1px}

/* Shell. The detail column follows the resizer's --drawer-width but always leaves --main-min for the findings. */
.shell{display:grid;grid-template-columns:264px minmax(0,1fr) clamp(360px,var(--drawer-width,420px),max(360px,100vw - 264px - var(--main-min)));min-height:calc(100vh - var(--top))}
.app:is([data-view="board"],[data-view="matrix"]) .shell{grid-template-columns:240px minmax(0,1fr) clamp(320px,var(--drawer-width,clamp(320px,28vw,384px)),max(320px,100vw - 240px - var(--main-min)))}
.sidebar{position:sticky;top:var(--top);height:calc(100vh - var(--top));overflow:auto;border-right:2px solid var(--rule);padding:16px 10px 48px;background:var(--panel);scrollbar-width:thin}
.main{min-width:0;padding:20px 22px 96px}
.detail{position:sticky;top:var(--top);height:calc(100vh - var(--top));display:flex;flex-direction:column;min-width:0;border-left:2px solid var(--rule);background:var(--panel)}
.detail-scroll{flex:1;min-height:0;overflow:auto;scrollbar-width:thin}
.scrim,.sheet-scrim{display:none}

/* Resize handle: a console rail that lights up in accent while you drag */
.resize-handle{color:var(--soft)}
.resize-handle::before{content:"";position:absolute;top:0;bottom:0;left:5px;width:2px;background:var(--accent);opacity:0;transition:opacity .12s}
.resize-handle::after{left:3px;width:6px;height:40px;margin-top:-20px;border-radius:0;background:repeating-linear-gradient(180deg,currentColor 0 2px,transparent 2px 5px);opacity:.35}
.resize-handle:hover::before,.resize-handle:focus-visible::before,.is-resizing .resize-handle::before{opacity:1}
.resize-handle:hover::after,.resize-handle:focus-visible::after,.is-resizing .resize-handle::after{color:var(--accent);opacity:1}
/* Two handles share one width: the docked column (wide) and the overlay sheet (board/matrix below 1180px). */
@media (min-width:1180px){.finding-pane>.resize-handle{display:none}}

/* Sidebar */
.side-block{margin:0 0 22px}
.side-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 8px 8px;margin-bottom:6px;border-bottom:1px solid var(--line2)}
.side-clear{height:22px;padding:0 7px;border:1px solid var(--rule);background:transparent;color:var(--muted);font:700 10px/1 var(--display);letter-spacing:.08em;text-transform:uppercase;cursor:pointer}
.side-clear:hover{color:var(--ink);background:var(--text)}
.facet{margin:0 0 22px}
.facet-legend{display:block;width:100%;font:800 10.5px/1.2 var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--dim);padding:0 8px 8px;margin-bottom:4px;border-bottom:1px solid var(--line2)}
.facet-options{flex-direction:column;gap:1px}
.facet-option{display:flex;align-items:center;gap:10px;width:100%;padding:6px 8px;border:0;background:transparent;color:var(--soft);text-align:left;font-size:13px}
.facet-option:hover{background:var(--hover);color:var(--text)}
.facet-option[aria-pressed="true"]{background:var(--accent-weak);color:var(--text);box-shadow:inset 3px 0 var(--accent)}
.facet-label{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.facet-hint{display:none}
.facet-count{font:700 12px var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
.facet-option[aria-pressed="true"] .facet-count{color:var(--accent)}
.facet-swatch{width:10px;height:10px;flex:none;background:var(--dim)}
.facet-severity .facet-swatch{width:10px;height:14px;background:var(--sev)}
.facet-reviewer .facet-swatch{background:var(--rv)}
.facet-tag .facet-swatch{background:none;width:auto;height:auto;color:var(--dim);font:12px var(--mono)}
.facet-tag .facet-swatch::before{content:"#"}
.facet-confidence .facet-swatch{background:none;border:1.5px solid var(--soft)}
.facet-confidence[data-value="high"] .facet-swatch{background:var(--soft)}
.facet-confidence[data-value="medium"] .facet-swatch{background:linear-gradient(90deg,var(--soft) 50%,transparent 50%)}
.toggle{padding:5px 8px;color:var(--soft);font-size:13px}
.toggle:hover{background:var(--hover)}
.toggle input{accent-color:var(--accent);margin:0}
.toggle-label{flex:1}
.toggle-count{font:700 12px var(--mono);color:var(--muted)}

/* Your answers block: answer facet, bulk answers, pins */
.side-answers .facet{margin:0 0 8px}
.facet-answer .facet-swatch{display:inline-grid;place-items:center;width:14px;height:14px;font:800 10px/1 var(--display)}
.facet-answer[data-value="fix"] .facet-swatch{background:var(--accent);color:var(--ink)}
.facet-answer[data-value="fix"] .facet-swatch::before{content:"✓"}
.facet-answer[data-value="ignore"] .facet-swatch{background:var(--hatch);border:1.5px solid var(--muted);color:var(--soft);font-size:9px}
.facet-answer[data-value="ignore"] .facet-swatch::before{content:"✕"}
.bulk-answers{gap:4px;padding:0 8px}
.bulk-answer{flex:1 1 auto;height:28px;padding:0 8px;border:1px solid var(--rule);background:transparent;color:var(--soft);font:700 10px/1 var(--display);letter-spacing:.05em;text-transform:uppercase;white-space:nowrap}
.bulk-answer:hover:not(:disabled){background:var(--text);border-color:var(--text);color:var(--ink)}
.bulk-fix:hover:not(:disabled){background:var(--accent);border-color:var(--accent)}
.bulk-reset{flex-basis:100%;border-style:dashed;color:var(--muted)}
.bulk-reset:not(:disabled):hover{background:var(--bad);border-color:var(--bad)}
.side-pins{display:flex;align-items:center;gap:6px;margin-top:10px;padding-top:6px;border-top:1px solid var(--line)}
.side-pins .toggle{flex:1;min-width:0;padding-right:4px}
.side-pins .toggle-label{white-space:nowrap}
.pins-clear{flex:none;margin-right:8px;padding:0 7px}
.side-note{margin:8px 8px 0;font-size:11.5px;line-height:1.4;color:var(--dim)}
.section-toggles{margin:0 0 22px}
.shortcuts{margin:8px 8px 0;color:var(--muted);font-size:12.5px}
.shortcuts summary{cursor:pointer;font:800 10.5px/1.2 var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--dim);list-style:none}
.shortcuts summary::-webkit-details-marker{display:none}
.shortcuts summary::before{content:"▸ "}.shortcuts[open] summary::before{content:"▾ "}

/* Disposition glyphs: shape as well as color */
.disp{display:inline-block;flex:none;width:10px;height:10px;border-radius:50%;vertical-align:baseline}
.disp[data-disposition="confirmed"],.facet-disposition[data-disposition="confirmed"] .facet-swatch{background:var(--text);border-radius:50%}
.disp[data-disposition="needs validation"],.facet-disposition[data-disposition="needs validation"] .facet-swatch{background:none;border:1.5px dashed var(--p2);border-radius:50%}
.disp[data-disposition="disputed"],.facet-disposition[data-disposition="disputed"] .facet-swatch{background:linear-gradient(90deg,var(--violet) 50%,transparent 50%);border:1.5px solid var(--violet);border-radius:50%}
.disp[data-disposition="rejected"],.facet-disposition[data-disposition="rejected"] .facet-swatch{background:linear-gradient(135deg,transparent 44%,var(--muted) 44%,var(--muted) 56%,transparent 56%);border:1.5px solid var(--muted);border-radius:50%}

/* Severity tags and pips: solid blocks with text */
.sev{display:inline-grid;place-items:center;flex:none;min-width:28px;height:21px;padding:0 5px;font:800 11px/1 var(--display);letter-spacing:.02em;color:var(--ink);background:var(--sev)}
.sev-pips{flex:none}
.sev-pip{font:800 10px/1 var(--display);padding:2px 4px;color:var(--ink);background:var(--sev);font-variant-numeric:tabular-nums}

/* Git-graph stack rail */
.stack-list{list-style:none;margin:0;padding:0}
.stack-list li{margin:0}
.stack-row{display:flex;align-items:stretch;gap:8px;width:100%;padding:0 8px;border:0;background:transparent;color:var(--soft);text-align:left;cursor:pointer}
.stack-row:hover{background:var(--hover);color:var(--text)}
.stack-row[aria-pressed="true"]{background:var(--accent-weak);color:var(--text);box-shadow:inset 3px 0 var(--accent)}
.stack-row[aria-pressed="true"] .g-dot{box-shadow:0 0 0 3px var(--accent-weak),0 0 0 1.5px var(--accent)}
.stack-row[data-empty]:not([aria-pressed="true"]) .stack-text{opacity:.5}
.g{position:relative;flex:none;align-self:stretch}
.g-v,.g-top,.g-bot{position:absolute;width:2px;margin-left:-1px;background:var(--rule)}
.g-v{top:0;bottom:0}.g-top{top:0;height:50%}.g-bot{top:50%;bottom:0}
.g-fork{position:absolute;top:calc(50% - 1px);bottom:0;border-top:2px solid var(--rule);border-right:2px solid var(--rule);border-top-right-radius:9px}
.g-dot{position:absolute;top:50%;width:11px;height:11px;margin:-5.5px 0 0 -5.5px;border-radius:50%;background:var(--panel);border:2px solid var(--dim);z-index:1}
.g-dot[data-worst]{background:var(--sev);border-color:var(--sev)}
.g-dot.trunk{border-color:var(--soft);border-radius:0;background:var(--soft)}
.stack-text{flex:1;min-width:0;padding:7px 0}
.stack-line{display:flex;align-items:baseline;gap:7px;min-width:0}
.stack-num{font:800 12.5px var(--display);color:var(--accent);flex:none;letter-spacing:-.01em}
.stack-title{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.stack-count{font:800 13px var(--display);color:var(--soft);flex:none;font-variant-numeric:tabular-nums}
.stack-sub{display:flex;align-items:center;gap:8px;margin-top:3px;font:11px var(--mono);color:var(--dim);min-width:0}
.stack-sub .stack-branch{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.stack-sub .sev-pips{margin-left:auto}
.trunk-row{color:var(--muted);cursor:default}
.trunk-row:hover{background:transparent;color:var(--muted)}
.trunk-row .stack-title{font:700 12px var(--mono)}
.stack-inherit{padding:6px 0 0}

/* Assessment */
.assess{border:2px solid var(--rule);background:var(--panel);margin-bottom:22px}
.assess:has(> [data-section="summary"][hidden]):has(> [data-section="team"][hidden]){display:none}
.assess-top{display:grid;grid-template-columns:200px minmax(0,1fr)}
.status-tile{container-type:inline-size;position:relative;display:flex;flex-direction:column;gap:12px;min-height:210px;padding:16px 16px 18px;border-right:2px solid var(--rule);background:var(--hatch);overflow:hidden}
.status-word{margin-top:auto;font:800 min(48px,calc(138cqi / var(--len)))/0.86 var(--display);letter-spacing:-.05em;text-transform:uppercase}
.status-note{font:600 12.5px/1.4 var(--sans);color:var(--soft)}
.status-tile[data-status="complete"]{background:var(--ok);color:var(--ink)}
.status-tile[data-status="complete"] :is(.kicker,.status-note){color:var(--ink)}
.status-tile[data-status="incomplete"]{background:var(--warn);color:var(--ink);padding-top:34px}
.status-tile[data-status="incomplete"]::before{content:"";position:absolute;left:0;right:0;top:0;height:16px;background:var(--hazard);border-bottom:2px solid var(--ink)}
.status-tile[data-status="incomplete"] :is(.kicker,.status-note){color:var(--ink)}
.status-tile[data-status="setup"] .status-word{color:var(--text)}
.assess-main{display:flex;flex-direction:column;gap:10px;min-width:0;padding:16px 20px 18px}
.assess-head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 16px}
.assess-title{color:var(--soft);overflow-wrap:anywhere}
.verdict{font:800 clamp(21px,2.1vw,29px)/1.08 var(--display);letter-spacing:-.03em;max-width:30ch;text-wrap:balance;overflow-wrap:anywhere}
.summary-text{color:var(--muted);font-size:13px;max-width:78ch;margin-top:auto}
.metrics{grid-column:1/-1;display:grid;grid-template-columns:200px minmax(0,1fr) minmax(0,1fr) minmax(0,2.3fr);border-top:2px solid var(--rule)}
.metric{position:relative;display:flex;flex-direction:column;gap:8px;min-width:0;padding:14px 16px;border-right:2px solid var(--rule)}
.metric:last-child{border-right:0}
.metric-value{font:800 44px/.82 var(--display);letter-spacing:-.06em;font-variant-numeric:tabular-nums;white-space:nowrap}
.metric-value small{font-size:.42em;letter-spacing:-.02em;color:var(--dim);margin-left:.06em}
.metric-note{margin-top:auto;font-size:12px;line-height:1.35;color:var(--muted)}
.metric[data-warn]{padding-top:22px}
.metric[data-warn]::before{content:"";position:absolute;left:0;right:0;top:0;height:7px;background:var(--hazard)}
.metric[data-warn] .metric-value{color:var(--warn)}
.metric[data-hatch]{background:var(--hatch)}
.metric-sev{display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-rows:auto 1fr;column-gap:18px;row-gap:8px}
.metric-sev .kicker{grid-column:1/-1}
.metric-sev .metric-value{align-self:end}
.herobar{display:flex;align-self:end;height:44px;gap:2px;min-width:0}
.herobar-seg{flex:1 1 0;min-width:34px;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;padding:5px 7px;border:0;background:var(--sev);color:var(--ink);cursor:pointer;text-align:left}
.herobar-seg .n{font:800 19px/.85 var(--display);letter-spacing:-.04em}
.herobar-seg .k{font:800 9.5px/1 var(--display);letter-spacing:.12em}
.herobar[data-filtered] .herobar-seg[aria-pressed="false"]{background:repeating-linear-gradient(-45deg,var(--sev) 0 2px,var(--panel) 2px 7px);color:var(--text)}
.herobar[data-filtered] .herobar-seg[aria-pressed="false"] :is(.n,.k){background:var(--panel);padding:1px 2px}
.herobar-seg[aria-pressed="true"]{box-shadow:inset 0 -5px 0 var(--ink)}
.herobar-seg:focus-visible{outline-offset:-4px;outline-color:var(--ink)}
.herobar.is-empty{align-items:center;justify-content:center;background:var(--hatch);border:1px dashed var(--rule);font:800 10px/1 var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.team{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));border-top:2px solid var(--rule)}
.team-chip{display:flex;align-items:center;gap:10px;padding:10px 14px;border:0;border-right:1px solid var(--line2);background:transparent;text-align:left;min-width:0;cursor:pointer}
.team-chip:last-child{border-right:0}
.team-chip:hover{background:var(--hover)}
.team-chip[aria-pressed="true"]{background:var(--accent-weak);box-shadow:inset 0 -3px var(--accent)}
.team-text{display:flex;flex-direction:column;min-width:0}
.team-name{font-weight:700;font-size:13px}
.team-model{font:11.5px var(--mono);color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.state{flex:none;margin-left:auto;font:800 9.5px/1 var(--display);letter-spacing:.12em;text-transform:uppercase;padding:5px 6px;color:var(--ok);border:1px solid rgba(61,220,151,.4)}
.team-chip .state-completed{font-size:0;width:9px;height:9px;padding:0;border:0;background:var(--ok);box-shadow:0 0 0 3px rgba(61,220,151,.16)}
.state-failed,.state-timed_out,.state-unavailable,.state-cancelled{color:var(--ink);background:var(--bad);border-color:var(--bad)}
.state-stale,.state-running{color:var(--ink);background:var(--warn);border-color:var(--warn)}
.state-not_run{color:var(--muted);border-color:var(--rule);background:var(--hatch)}

/* Reviewer badges: squared tiles */
.rv-badges{display:inline-flex;gap:2px;flex:none}
.rv{display:inline-grid;place-items:center;flex:none;min-width:22px;height:20px;padding:0 3px;font:800 9px/1 var(--display);letter-spacing:.04em;color:var(--ink);background:var(--rv)}

/* Toolbar + view switcher */
.toolbar{position:sticky;top:var(--top);z-index:12;display:flex;flex-direction:column;gap:8px;margin:0 -22px;padding:12px 22px 10px;background:var(--bg);border-bottom:2px solid var(--rule)}
.tb-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;min-width:0}
.tb-row :is(.reset,.copy,.print){height:28px}
.tb-spacer{flex:1 1 0}
.viewswitch{display:inline-flex;flex:none;border:1px solid var(--rule);background:var(--panel)}
.view-btn{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 15px;border:0;border-right:1px solid var(--rule);background:transparent;color:var(--muted);font:800 11.5px/1 var(--display);letter-spacing:.12em;text-transform:uppercase;cursor:pointer}
.view-btn:last-child{border-right:0}
.view-btn:hover{color:var(--text);background:var(--hover)}
.view-btn[aria-pressed="true"]{background:var(--text);color:var(--ink)}
.view-btn:focus-visible{outline-offset:-4px}
.view-icon{display:grid;gap:2px;width:14px;height:12px;flex:none}
.view-icon i{display:block;background:currentColor;min-width:0;min-height:0}
.view-btn[data-view="list"] .view-icon{grid-template-rows:repeat(4,1fr);gap:1.5px}
.view-btn[data-view="board"] .view-icon{grid-template-columns:repeat(4,1fr);align-items:start}
.view-btn[data-view="board"] .view-icon i:nth-child(1){height:12px}.view-btn[data-view="board"] .view-icon i:nth-child(2){height:8px}.view-btn[data-view="board"] .view-icon i:nth-child(3){height:10px}.view-btn[data-view="board"] .view-icon i:nth-child(4){height:5px}
.view-btn[data-view="matrix"] .view-icon{grid-template:repeat(2,1fr)/repeat(2,1fr)}
.view-btn[data-view="matrix"] .view-icon i:nth-child(2),.view-btn[data-view="matrix"] .view-icon i:nth-child(3){opacity:.45}
.result-count{margin:0;font:700 12px var(--mono);color:var(--muted);white-space:nowrap}
.filter-summary{display:none}
.select{display:flex;align-items:center;gap:6px}
.select-label{font:800 10px/1 var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.select select{height:30px;border:1px solid var(--rule);border-radius:0;background:var(--raised);color:var(--text);padding:0 6px;font-size:12.5px}
.expand-controls{display:none;gap:6px}
.active-filters{display:flex;flex-wrap:wrap;gap:6px;min-width:0}
.active-filters:empty{display:none}
.filter-chip{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 4px 0 8px;border:1px solid var(--accent-line);background:var(--accent-weak);color:var(--text);font-size:12px;cursor:pointer;max-width:100%}
.filter-chip b{font:800 9.5px/1 var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.filter-chip::after{content:"×";font-size:15px;line-height:1;color:var(--muted);padding:0 4px}
.filter-chip:hover::after{color:var(--text)}
.view-host{padding-top:14px}

/* List */
.group{margin-top:10px}
.group+.group{margin-top:22px}
.group-head{position:sticky;top:calc(var(--top) + var(--bar-h));z-index:4;display:flex;align-items:center;gap:10px;padding:10px 0 8px;background:var(--bg);border-bottom:2px solid var(--rule)}
.group-toggle{display:flex;align-items:center;gap:10px;min-width:0;flex:1;border:0;background:none;padding:0;text-align:left;cursor:pointer}
.caret{width:0;height:0;border-left:5px solid var(--dim);border-top:4px solid transparent;border-bottom:4px solid transparent;transition:transform .12s;flex:none}
.group-toggle[aria-expanded="true"] .caret{transform:rotate(90deg)}
.group-label{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.tile{flex:none;display:inline-grid;place-items:center;min-width:46px;height:26px;padding:0 7px;background:var(--text);color:var(--ink);font:800 13.5px/1 var(--display);letter-spacing:-.02em}
.tile[data-severity]{background:var(--sev)}
.tile[data-kind="cross"]{background:transparent;color:var(--text);border:3px double var(--soft);font-size:10px;letter-spacing:.12em;text-transform:uppercase}
.tile[data-kind="none"]{background:transparent;color:var(--soft);border:1px dashed var(--soft)}
.tile[data-kind="disp"]{background:transparent;border:1px solid var(--rule);min-width:26px}
.group-title{font:700 15px/1.2 var(--display);letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.group-meta{font:11.5px var(--mono);color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:0 6 auto}
.group-count{flex:none;margin-left:auto;font:800 22px/.8 var(--display);letter-spacing:-.05em;font-variant-numeric:tabular-nums}
.group-link{font:700 11px var(--display);letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;text-decoration:none;border:1px solid var(--accent-line);padding:5px 7px}
.group-link:hover{background:var(--accent);color:var(--ink)}
.rows{display:flex;flex-direction:column}
.row{position:relative;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:start;gap:4px 12px;padding:11px 12px 11px 10px;border-bottom:1px solid var(--line);cursor:pointer}
.row:hover{background:var(--raised)}
.row[data-selected]{background:var(--raised);box-shadow:inset 3px 0 var(--accent)}
.row[data-pinned]{background:linear-gradient(90deg,rgba(126,224,195,.07),transparent 45%)}
.row[data-ignored] .sev,.who-row[data-ignored] .sev{background:var(--grey);color:var(--soft)}
.row[data-ignored] .row-title-text{color:var(--muted)}
.row[data-ignored] :is(.row-sub,.rv-badges,.pr-chip){opacity:.55}
.row-main{all:unset;display:flex;flex-direction:column;gap:5px;min-width:0;cursor:pointer}
.row-main:focus-visible{outline:2px solid var(--accent);outline-offset:4px}
.row-title{display:flex;align-items:center;gap:9px;font-weight:600;line-height:1.35;color:var(--text)}
.row-title-text{min-width:0}
.row[data-disposition="rejected"] .row-title-text{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--dim)}
.row-sub{display:flex;flex-wrap:wrap;align-items:center;gap:3px 12px;font-size:12px;color:var(--muted)}
.row-sub code{font-size:11.5px;color:var(--soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:min(52ch,100%)}
.disp-label{color:var(--disp);font:800 10px/1 var(--display);letter-spacing:.12em;text-transform:uppercase}
.row-id{font:11px var(--mono);color:var(--dim)}
.tag{font:11px var(--mono);color:var(--dim)}
.tag::before{content:"#"}
/* Flags follow core's data-pinned / data-ignored / data-commented, so comment typing updates them in place. */
.flags{display:inline-flex;gap:4px;flex:none}
.flag{display:none;align-items:center;gap:4px;height:15px;padding:0 5px;font:800 9px/1 var(--display);letter-spacing:.12em;text-transform:uppercase;white-space:nowrap}
[data-pinned] .flag-pin,[data-ignored] .flag-ignored,[data-commented] .flag-comment{display:inline-flex}
.flag-pin{background:var(--accent);color:var(--ink)}
.flag-ignored{border:1px solid var(--muted);color:var(--soft);background:var(--hatch)}
.flag-ignored::before{content:"✕";font-size:8px;letter-spacing:0}
.flag-comment{border:1px solid var(--accent-line);color:var(--accent)}
.flag-comment::before{content:"";width:8px;height:6px;border:1.5px solid currentColor;border-radius:1px 1px 1px 0;box-shadow:-1px 3px 0 -1px currentColor}
.row-side{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.pr-chip{position:relative;z-index:2;display:inline-flex;align-items:center;height:20px;padding:0 6px;border:1px solid var(--accent-line);background:var(--accent-weak);color:var(--accent);font:700 11px var(--mono);cursor:pointer}
.pr-chip:hover{background:var(--accent);color:var(--ink)}
.finding-actions{display:flex;gap:4px}
.action{height:24px;padding:0 8px;border:1px solid var(--rule);background:transparent;color:var(--muted);font:700 10.5px/1 var(--display);letter-spacing:.08em;text-transform:uppercase}
.action:hover{color:var(--ink);background:var(--text);border-color:var(--text)}
.action[aria-pressed="true"]{color:var(--accent);border-color:var(--accent-line);background:var(--accent-weak)}
.action-ignore[aria-pressed="true"]{color:var(--ink);border-color:var(--soft);background:var(--soft)}
.action-ignore[aria-pressed="true"]::before{content:"✕ "}
.action-ignore[aria-pressed="true"]:hover{background:var(--accent);border-color:var(--accent)}
@media (hover:hover){
  :is(.row,.card,.who-row) .finding-actions{opacity:0;transition:opacity .12s}
  :is(.row,.card,.who-row):is(:hover,:focus-within,[data-selected]) .finding-actions{opacity:1}
}
.row-details{grid-column:1/-1;display:none;margin-top:6px;border-top:1px solid var(--line2);padding-top:8px}
.row-details .answer{margin:8px 0 14px}
.row-details .finding-fields dt:first-child{border-top:0;padding-top:0}
.row-details summary{cursor:pointer;font:800 10.5px/1.6 var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}

/* Board */
.board-scroll[data-scroll]{overflow-x:auto;scrollbar-width:thin;padding-bottom:6px}
.board-scroll[data-scroll] .board{min-width:var(--need)}
.board-head{position:sticky;top:calc(var(--top) + var(--bar-h));z-index:6;display:grid;grid-template-columns:var(--cols);background:var(--bg);border-bottom:2px solid var(--rule)}
.board-scroll[data-scroll] .board-head{position:static}
.col-head{display:flex;align-items:center;gap:8px;min-width:0;padding:10px 8px 10px 10px;border-left:1px solid var(--line2)}
.col-head:first-child{border-left:0}
.col-label{min-width:0;overflow:hidden;font:800 10.5px/1.15 var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--disp)}
.col-count{margin-left:auto;font:800 26px/.8 var(--display);letter-spacing:-.06em;font-variant-numeric:tabular-nums}
.col-toggle{flex:none;display:inline-grid;place-items:center;min-width:24px;height:24px;padding:0 5px;border:1px solid var(--rule);background:transparent;color:var(--muted);font:800 12px/1 var(--display);cursor:pointer}
.col-toggle:hover{background:var(--text);color:var(--ink)}
.col-head[data-folded]{flex-direction:column;justify-content:center;gap:6px;padding:8px 4px;background:var(--hatch)}
.col-head[data-folded] :is(.col-label,.col-count){display:none}
.col-head[data-folded] .col-toggle{background:var(--panel);font-size:11px}
.lane{border-bottom:1px solid var(--line2)}
.lane-head{display:flex;align-items:center;gap:12px;width:100%;min-width:0;padding:10px 10px 10px 0;border:0;background:transparent;color:var(--text);text-align:left;cursor:pointer}
button.lane-head:hover{background:var(--panel)}
.lane-head .tile{min-width:54px;height:30px;font-size:16px}
.lane-text{display:flex;flex-direction:column;gap:3px;flex:1;min-width:0}
.lane-label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:700 14.5px/1.15 var(--display);letter-spacing:-.01em}
.lane-meta{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:11px/1.2 var(--mono);color:var(--dim)}
.lane-bar{display:flex;width:clamp(70px,10vw,150px)}
.lane-count{min-width:1.2em;text-align:right;font:800 24px/.8 var(--display);letter-spacing:-.05em;font-variant-numeric:tabular-nums}
.lane-chev{flex:none;display:inline-grid;place-items:center;width:22px;height:22px;border:1px solid var(--rule);font:800 13px/1 var(--display);color:var(--muted)}
.lane[data-empty] .lane-head{padding-block:6px;cursor:default;color:var(--dim)}
.lane[data-empty] .tile{min-width:44px;height:22px;font-size:12px;background:var(--raised);color:var(--muted)}
.lane[data-empty] .lane-label{font-size:13px;font-weight:600}
.lane[data-empty] .lane-meta{display:none}
.lane[data-empty] .lane-count{font-size:15px;color:var(--dim)}
.lane-empty{font:800 9.5px/1 var(--display);letter-spacing:.12em;text-transform:uppercase}
.lane[data-collapsed] .lane-cells{display:none}
.lane-cells{display:grid;grid-template-columns:var(--cols);padding-bottom:12px}
.cell{display:flex;flex-direction:column;gap:9px;min-width:0;padding:4px 9px 4px;border-left:1px solid var(--line)}
.cell:first-child{border-left:0;padding-left:0}
.cell:last-child{padding-right:0}
.cell-label{display:none;align-items:center;gap:8px;font:800 10px/1 var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--disp)}
.cell-n{margin-left:auto;color:var(--text)}
.cell[data-folded]{align-items:center;padding:6px 0;background:var(--hatch)}
.cell[data-folded]>.card{display:none}
.cell-fold{display:inline-grid;place-items:center;min-width:26px;height:24px;border:1px solid var(--rule);background:var(--panel);color:var(--muted);font:800 12px/1 var(--display)}
.board[data-bare] .lane-cells{padding-top:12px}

/* Cards */
.card{position:relative;display:grid;grid-template-columns:22px minmax(0,1fr);background:var(--panel);border:1px solid var(--line2);transition:transform .12s ease,box-shadow .12s ease,border-color .12s ease}
.card:hover{transform:translate(-2px,-2px);box-shadow:4px 4px 0 var(--rule)}
.card[data-selected]{transform:translate(-2px,-2px);border-color:var(--accent);box-shadow:5px 5px 0 var(--accent)}
.card-sev{display:flex;flex-direction:column;align-items:center;background:var(--sev);color:var(--ink)}
.card-sev-code{align-self:stretch;text-align:center;padding:6px 0 5px;font:800 10.5px/1 var(--display);letter-spacing:-.01em}
.card[data-disposition="needs validation"]{border-style:dashed;border-color:#6b7684}
.card[data-disposition="needs validation"] .card-sev{background:repeating-linear-gradient(-45deg,var(--sev) 0 3px,transparent 3px 7px)}
.card[data-disposition="needs validation"] .card-sev-code{background:var(--sev)}
.card[data-disposition="disputed"]{border-color:var(--violet);border-top-width:4px;background:linear-gradient(180deg,rgba(181,140,255,.08),transparent 60%),var(--panel)}
.card[data-disposition="disputed"]:hover{box-shadow:4px 4px 0 rgba(181,140,255,.5)}
.card[data-disposition="rejected"]{border-color:var(--line2);background:var(--bg);color:var(--muted)}
.card[data-disposition="rejected"] .card-sev{background:var(--grey);color:var(--soft)}
.card[data-disposition="rejected"] .card-open{text-decoration:line-through;text-decoration-thickness:1.5px;text-decoration-color:var(--dim);color:var(--muted)}
.card[data-disposition][data-selected]{border-color:var(--accent);box-shadow:5px 5px 0 var(--accent)}
.card[data-ignored]{border-style:dashed;border-color:var(--rule);background:var(--hatch),var(--bg)}
.card[data-ignored] .card-sev{background:var(--grey);color:var(--soft)}
.card[data-ignored] :is(.card-title,.card-loc){color:var(--muted)}
.card[data-ignored] :is(.conf,.card-foot .rv-badges,.card-foot .pr-chip){opacity:.55}
.card .finding-actions{position:relative;z-index:2;flex-basis:100%;margin-top:2px}
.card .action{height:20px;padding:0 6px;font-size:9.5px}
.card[data-pinned]::before{content:"";position:absolute;top:-1px;right:-1px;border-style:solid;border-width:0 14px 14px 0;border-color:transparent var(--accent) transparent transparent;z-index:2}
.card-body{display:flex;flex-direction:column;gap:5px;min-width:0;padding:7px 9px 8px}
.card-top{display:flex;align-items:center;gap:6px;min-height:16px}
.card-id{font:700 10.5px/1 var(--mono);color:var(--dim);white-space:nowrap}
.card-body{container-type:inline-size}
@container (max-width:128px){.card-top .conf-word{display:none}}
.conf{margin-left:auto;display:inline-flex;align-items:center;gap:5px;font:800 9px/1 var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.conf-bars{display:inline-flex;align-items:flex-end;gap:2px}
.conf-bars i{width:3px;background:var(--line2)}
.conf-bars i:nth-child(1){height:5px}.conf-bars i:nth-child(2){height:8px}.conf-bars i:nth-child(3){height:11px}
.conf-bars i.on{background:var(--soft)}
.card-title{font:650 13px/1.3 var(--sans)}
.card-open{display:block;width:100%;padding:0;margin:0;border:0;background:none;color:inherit;font:inherit;text-align:left;cursor:pointer}
.card-open::after{content:"";position:absolute;inset:-1px;z-index:1}
.card-open:focus-visible{outline:none}
.card-open:focus-visible::after{outline:2px solid var(--accent);outline-offset:3px}
.card-loc{font:11px/1.35 var(--mono);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-foot{display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin-top:2px}
.card-foot .rv-badges{margin-left:auto}
.card .rv{min-width:20px;height:17px;font-size:8.5px}
.segbar{display:flex;flex:1;min-width:0;height:10px;gap:2px}
.segbar-seg{flex:1 1 0;min-width:6px;background:var(--sev)}

/* Matrix */
.mx-panel+.mx-panel{margin-top:34px}
.mx-head{display:flex;flex-wrap:wrap;align-items:flex-end;gap:6px 14px;padding-bottom:10px;margin-bottom:14px;border-bottom:2px solid var(--rule)}
.sec-num{display:inline-grid;place-items:center;min-width:34px;height:34px;padding:0 4px;background:var(--text);color:var(--ink);font:800 14px/1 var(--display);letter-spacing:-.02em}
.mx-title{font:800 26px/.9 var(--display);letter-spacing:-.045em}
.mx-note{flex:1 1 220px;margin-left:auto;text-align:right;font-size:12px;line-height:1.35;color:var(--muted);max-width:52ch}
.mx-scroll{overflow-x:auto;scrollbar-width:thin}
.heat{width:100%;min-width:520px;border-collapse:separate;border-spacing:0;table-layout:fixed}
.heat th,.heat td{padding:0;font-weight:inherit;vertical-align:middle}
.heat thead th{padding:0 2px 8px;text-align:center;vertical-align:bottom}
.heat thead th:first-child{text-align:left;padding-left:0}
.heat-col{width:13%}
.heat-col-total{width:12%}
.heat-colbtn{display:inline-flex;flex-direction:column;align-items:center;gap:5px;width:100%;padding:4px 0;border:0;background:none;color:var(--muted);font:800 9.5px/1 var(--display);letter-spacing:.12em;text-transform:uppercase;cursor:pointer}
.heat-colbtn .sev{min-width:34px}
.heat-colbtn:hover{color:var(--text)}
.heat-colbtn[aria-pressed="true"]{color:var(--text);box-shadow:inset 0 -3px var(--accent)}
.heat-total-h{font:800 9.5px/1 var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.heat-rowh{height:46px;text-align:left}
.heat-rowbtn{display:flex;align-items:stretch;gap:8px;width:100%;height:46px;padding:0 10px 0 4px;border:0;background:transparent;color:var(--soft);text-align:left;cursor:pointer;min-width:0}
.heat-rowbtn:hover{background:var(--hover);color:var(--text)}
.heat-rowbtn[aria-pressed="true"]{background:var(--accent-weak);color:var(--text);box-shadow:inset 3px 0 var(--accent)}
.heat-rowtext{display:flex;align-items:center;gap:8px;min-width:0;flex:1}
.heat-rowtext .stack-title{font-weight:600}
.heat-rowtext .tile{min-width:40px;height:22px;font-size:12px}
.heat-trunk th{height:30px}
.heat-trunk .heat-rowbtn{height:30px;cursor:default;color:var(--muted)}
.heat-trunk .heat-rowbtn:hover{background:transparent}
.heat-trunk td{font:11px var(--mono);color:var(--dim);padding-left:10px}
.heat .heat-sep th,.heat .heat-sep td{height:12px;border:0}
.heat td{border:1px solid var(--bg);height:46px}
.heat-cell{display:grid;place-items:center;width:100%;height:44px;border:0;background:color-mix(in oklab,var(--sev) var(--mix),var(--panel));color:var(--text);font:800 19px/1 var(--display);letter-spacing:-.04em;font-variant-numeric:tabular-nums;cursor:pointer;transition:box-shadow .1s}
.heat-cell[data-strong]{color:var(--ink)}
.heat-cell{position:relative}
.heat-ign{position:absolute;top:3px;right:3px;padding:2px 3px;background:var(--ink);color:var(--soft);font:800 9px/1 var(--display);letter-spacing:.02em}
.heat-legend .heat-ign{position:static;display:inline-block;margin-right:6px}
.heat-cell:hover{box-shadow:inset 0 0 0 2px var(--text)}
.heat-cell[aria-pressed="true"]{box-shadow:inset 0 0 0 3px var(--accent),inset 0 0 0 5px var(--ink)}
.heat-zero{display:grid;place-items:center;height:44px;background:var(--panel);color:var(--line2);font:700 14px/1 var(--display)}
.heat-cell-total{background:var(--raised);color:var(--text)}
.heat [data-out] .heat-cell,.heat td[data-out] .heat-cell,.heat td[data-out] .heat-zero{opacity:.35}
.heat tr[data-out] .heat-rowbtn{opacity:.5}
.heat tfoot th,.heat tfoot td{border-top:2px solid var(--rule)}
.heat tfoot th{height:46px;padding-left:12px;font:800 10px/1 var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.heat-foot{display:grid;place-items:center;width:100%;height:44px;border:0;background:transparent;color:var(--text);font:800 19px/1 var(--display);letter-spacing:-.04em;cursor:pointer}
.heat-foot:hover{background:var(--hover)}
.heat-foot[aria-pressed="true"]{box-shadow:inset 0 -3px var(--accent)}
.heat-legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:10px;font-size:11.5px;color:var(--muted)}
.heat-scale{display:inline-flex;align-items:center;gap:6px}
.heat-scale i{width:16px;height:10px;background:color-mix(in oklab,var(--p1) var(--mix),var(--panel))}
.who-stats{display:flex;flex-wrap:wrap;gap:2px;margin-bottom:14px;background:var(--rule);border:2px solid var(--rule)}
.who-stat{flex:1 1 130px;display:flex;align-items:flex-end;gap:10px;padding:10px 12px;background:var(--panel)}
.who-stat b{font:800 36px/.8 var(--display);letter-spacing:-.06em;font-variant-numeric:tabular-nums}
.who-stat span{font:800 9.5px/1.25 var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.who-stat[data-k="all"]{background:var(--accent);color:var(--ink)}
.who-stat[data-k="all"] span{color:var(--ink)}
.who{width:100%;min-width:500px;border-collapse:collapse;table-layout:fixed}
.who th,.who td{padding:0;border-bottom:1px solid var(--line);vertical-align:middle;font-weight:inherit}
.who thead th{padding:4px 4px 10px;border-bottom:2px solid var(--rule);text-align:center;vertical-align:bottom;font:800 9.5px/1.2 var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.who thead th:first-child{text-align:left;padding-left:0}
.who-h-rv{width:96px}
.who-h-agree{width:82px}
.who-rvh{display:inline-flex;flex-direction:column;align-items:center;gap:6px;max-width:100%}
.who-rvh span:last-child{max-width:92px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who-row{cursor:pointer}
.who-row:hover>*{background:var(--raised)}
.who-fin{display:flex;align-items:center;gap:9px;min-width:0;padding:8px 8px 8px 6px}
.who-id{flex:none;font:700 11px/1 var(--mono);color:var(--dim)}
.who-open{min-width:0;flex:1;padding:0;border:0;background:none;color:inherit;font:600 13px/1.3 var(--sans);text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.who-row[data-disposition="rejected"] .who-open{text-decoration:line-through;color:var(--muted)}
.who-cell{text-align:center}
.who-dot{display:inline-block;width:16px;height:16px;border-radius:50%;background:var(--rv);vertical-align:middle}
.who-none{display:inline-block;width:10px;height:2px;background:var(--line2);vertical-align:middle}
.who-agree{text-align:right;padding-right:4px!important}
.who-tag{display:inline-flex;align-items:center;height:22px;padding:0 7px;border:1px solid var(--rule);font:800 11px/1 var(--display);letter-spacing:.06em;text-transform:uppercase;font-variant-numeric:tabular-nums;color:var(--soft)}
.who-row.is-solo .who-tag{border-color:var(--line);color:var(--dim)}
.who-row.is-all>*{background:rgba(126,224,195,.07)}
.who-row.is-all>th{box-shadow:inset 3px 0 var(--accent)}
.who-row.is-all .who-dot{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--accent)}
.who-row.is-all .who-tag{background:var(--accent);border-color:var(--accent);color:var(--ink)}
.who-row[data-selected]>*{background:var(--raised)}
.who-row[data-selected]>th{box-shadow:inset 4px 0 var(--text)}
.who-row[data-ignored] .who-open{color:var(--muted)}
.who-row[data-ignored] :is(.who-dot,.who-tag){opacity:.5}
.who-fin .flags{flex:none}
.who-fin .finding-actions{flex:none}
.who-row[data-pinned] .who-id::after{content:" ▲";color:var(--accent)}
.who tfoot th,.who tfoot td{padding:10px 4px;border-bottom:0;border-top:2px solid var(--rule);vertical-align:top}
.who tfoot th{text-align:left;padding-left:0;font:800 9.5px/1.2 var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.who-total{text-align:center}
.who-total b{display:block;font:800 24px/.85 var(--display);letter-spacing:-.05em}
.who-total span{font:700 10.5px/1.4 var(--sans);color:var(--muted)}

/* Empty states */
.nomatch{display:flex;flex-direction:column;align-items:flex-start;gap:12px;margin-top:6px;padding:30px 28px;border:2px dashed var(--rule);background:var(--hatch)}
.nomatch>*{background:var(--bg)}
.nomatch-big{font:800 clamp(26px,3vw,40px)/.9 var(--display);letter-spacing:-.045em;padding:2px 4px 2px 0}
.nomatch-why{font-size:13px;color:var(--muted);padding:2px 4px 2px 0}
.nomatch-actions{display:flex;flex-wrap:wrap;gap:8px;background:none}
.empty-state{display:grid;grid-template-columns:minmax(150px,26%) minmax(0,1fr);margin-top:6px;border:2px solid var(--rule);background:var(--panel)}
.empty-zero{display:flex;align-items:flex-end;padding:14px 20px 18px;border-right:2px solid var(--rule);background:var(--hatch);font:800 clamp(110px,11vw,170px)/.72 var(--display);letter-spacing:-.08em}
.empty-copy{display:flex;flex-direction:column;justify-content:flex-end;gap:12px;padding:24px 26px}
.empty-msg{font:800 clamp(20px,2.2vw,30px)/1.08 var(--display);letter-spacing:-.03em;max-width:28ch;text-wrap:balance}
.empty-sub{font-size:13px;line-height:1.5;color:var(--muted);max-width:64ch}

/* Detail pane */
.detail-tabs{position:sticky;top:0;z-index:3;display:flex;background:var(--panel);border-bottom:2px solid var(--rule)}
.tab{flex:1;height:44px;border:0;border-right:1px solid var(--line2);background:none;color:var(--muted);font:800 11px/1 var(--display);letter-spacing:.12em;text-transform:uppercase;cursor:pointer}
.tab:last-child{border-right:0}
.tab:hover:not(:disabled){color:var(--text);background:var(--hover)}
.tab[aria-selected="true"]{color:var(--text);box-shadow:inset 0 -3px var(--accent)}
.detail[data-tab="report"] .finding-pane,.detail[data-tab="finding"] .report-pane{display:none}
.report-pane{padding:18px 20px 64px}
.pane-band{position:relative;display:flex;align-items:center;gap:10px;min-height:76px;padding:12px 12px 12px 18px;background:var(--sev);color:var(--ink)}
.finding-pane[data-disposition="needs validation"] .pane-band{padding-bottom:22px}
.finding-pane[data-disposition="needs validation"] .pane-band::after{content:"";position:absolute;left:0;right:0;bottom:0;height:10px;background:repeating-linear-gradient(-45deg,var(--ink) 0 2px,transparent 2px 6px)}
.finding-pane[data-disposition="disputed"] .pane-band{box-shadow:inset 0 -10px 0 var(--violet);padding-bottom:22px}
.finding-pane[data-disposition="rejected"] .pane-band{background:var(--grey);color:var(--text)}
.pane-sev{font:800 46px/.78 var(--display);letter-spacing:-.06em}
.pane-sevtext{display:flex;flex-direction:column;gap:5px;min-width:0;font:800 10.5px/1 var(--display);letter-spacing:.14em;text-transform:uppercase}
.pane-id{font:700 12px/1 var(--mono);letter-spacing:0;text-transform:none}
.pane-nav{margin-left:auto;display:flex;align-items:center;gap:4px}
.pane-step{width:30px;height:30px;border:2px solid currentColor;background:transparent;color:inherit;font:800 14px/1 var(--display);cursor:pointer}
.pane-step:hover:not(:disabled){background:var(--ink);color:var(--text);border-color:var(--ink)}
.pane-pos{min-width:38px;text-align:center;font:800 11px/1 var(--display);font-variant-numeric:tabular-nums}
.pane-full{flex:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-width:30px;height:30px;padding:0 7px;border:2px solid currentColor;background:transparent;color:inherit;font:800 10.5px/1 var(--display);letter-spacing:.12em;text-transform:uppercase;white-space:nowrap;cursor:pointer}
.pane-full:hover{background:var(--ink);color:var(--text);border-color:var(--ink)}
.pane-full[aria-pressed="true"]{background:var(--ink);color:var(--text);border-color:var(--ink)}
.full-icon{flex:none;width:12px;height:12px;background:
  linear-gradient(currentColor,currentColor) 0 0/5px 2px,linear-gradient(currentColor,currentColor) 0 0/2px 5px,
  linear-gradient(currentColor,currentColor) 100% 0/5px 2px,linear-gradient(currentColor,currentColor) 100% 0/2px 5px,
  linear-gradient(currentColor,currentColor) 0 100%/5px 2px,linear-gradient(currentColor,currentColor) 0 100%/2px 5px,
  linear-gradient(currentColor,currentColor) 100% 100%/5px 2px,linear-gradient(currentColor,currentColor) 100% 100%/2px 5px;background-repeat:no-repeat}
.pane-full-label{display:none}
.pane-close{flex:none;width:36px;height:36px;border:0;background:var(--ink);color:var(--text);font:300 24px/1 var(--sans);cursor:pointer}
.pane-close:hover{background:var(--text);color:var(--ink)}
.pane-band :focus-visible{outline-color:var(--ink)}
.finding-pane[data-disposition="rejected"] .pane-band :focus-visible{outline-color:var(--accent)}
.pane-body{padding:18px 20px 64px}
.pane-note{margin-bottom:12px;padding:7px 10px;background:var(--warn);color:var(--ink);font:700 12px/1.35 var(--sans)}
.pane-title{font:800 21px/1.15 var(--display);letter-spacing:-.025em;text-wrap:balance}
.pane-title:focus{outline:none}
.finding-pane[data-disposition="rejected"] .pane-title{text-decoration:line-through;text-decoration-thickness:2px;text-decoration-color:var(--dim)}
.finding-pane[data-ignored] .pane-band{background:repeating-linear-gradient(-45deg,rgba(7,8,10,.2) 0 2px,transparent 2px 8px),var(--sev)}
.finding-pane[data-ignored][data-disposition="rejected"] .pane-band{background:repeating-linear-gradient(-45deg,rgba(255,255,255,.07) 0 2px,transparent 2px 8px),var(--grey)}
.pane-line{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin:12px 0 14px}
.pane-line .finding-actions{margin-left:auto}
.pane-disp{display:flex;align-items:center;gap:8px;font:800 11px/1 var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--disp)}

/* Answer block: Fix / Ignore + where it came from + a comment for the fixer */
.answer{margin:0 0 6px;border:2px solid var(--rule);background:var(--bg);box-shadow:inset 4px 0 var(--accent)}
.answer[data-answer="ignore"]{box-shadow:inset 4px 0 var(--soft);background:var(--hatch),var(--bg)}
.answer-head{padding:11px 12px 10px 16px;border-bottom:1px solid var(--line2)}
.answer-legend{font:800 10.5px/1.2 var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.answer-choice{border:1px solid var(--rule);background:var(--panel)}
.answer-option{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 15px;border:0;border-right:1px solid var(--rule);background:transparent;color:var(--muted);font:800 11.5px/1 var(--display);letter-spacing:.12em;text-transform:uppercase}
.answer-option:last-child{border-right:0}
.answer-option:hover{color:var(--text);background:var(--hover)}
.answer-option:focus-visible{outline-offset:-4px}
.answer-mark{display:inline-grid;place-items:center;width:15px;height:15px;border:1.5px solid currentColor;font-size:10px;line-height:1}
.answer-option[data-answer-value="fix"][aria-pressed="true"]{background:var(--accent);color:var(--ink)}
.answer-option[data-answer-value="ignore"][aria-pressed="true"]{background:var(--text);color:var(--ink)}
.answer-option[aria-pressed="true"] .answer-mark{background:var(--ink);border-color:var(--ink);color:var(--text)}
.answer-option[aria-pressed="true"]:focus-visible{outline-color:var(--ink)}
.answer-note{flex:1 1 100%;font-size:12px;line-height:1.35;color:var(--muted)}
.answer[data-answer="ignore"] .answer-note{color:var(--soft)}
.answer-comment{padding:10px 12px 12px 16px}
.answer-comment-label{font:800 9.5px/1.2 var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.answer-input{min-height:84px;max-height:50vh;field-sizing:content;padding:9px 11px;border:1px solid var(--line2);border-radius:0;background:#05060a;color:var(--text);font:13px/1.5 var(--sans)}
.answer-input::placeholder{color:var(--dim)}
.answer-input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-weak)}
.pane-meta{display:grid;grid-template-columns:96px minmax(0,1fr);margin:0 0 14px;border-top:2px solid var(--rule)}
.pane-meta dt,.pane-meta dd{margin:0;padding:9px 0;border-bottom:1px solid var(--line2)}
.pane-meta dt{font:800 9.5px/1.7 var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.pane-meta dd{font-size:13px;min-width:0;color:var(--soft)}
.chips{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px}
.pr-ref{display:inline-flex;align-items:center;gap:8px;min-width:0}
.pr-ref-title{font-size:12.5px;color:var(--muted)}
.people{display:flex;flex-wrap:wrap;gap:6px 14px}
.person{display:inline-flex;align-items:center;gap:6px;font-weight:600;color:var(--text)}
.tag-chip{height:22px;padding:0 7px;border:1px solid var(--rule);background:transparent;color:var(--soft);font:11.5px var(--mono);cursor:pointer}
.tag-chip:hover,.tag-chip[aria-pressed="true"]{background:var(--text);color:var(--ink)}
.pane-meta .conf{margin:0;font-size:10px;color:var(--soft)}
.finding-fields{margin:16px 0 0}
.finding-fields dt{font:800 9.5px/1.2 var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin-top:18px;padding-top:10px;border-top:1px solid var(--line2)}
.finding-fields dt:first-child{margin-top:0}
.finding-fields dd{margin:7px 0 0;color:var(--soft)}
.finding-fields dd[data-field="impact"]{color:var(--text);font-size:15px;line-height:1.5;font-weight:500}
.finding-fields dd[data-field="location"] code{font-size:12.5px;color:var(--accent);word-break:break-all}
.finding-fields pre{font-size:12.5px;line-height:1.65;background:#05060a;border:1px solid var(--line2);border-left:3px solid var(--rule);padding:12px 14px;color:#d3dfeb;max-height:440px;overflow:auto}
.finding-fields dd[data-field="recommendation"]{border-left:3px solid var(--accent);padding:2px 0 2px 12px;color:var(--text)}
.finding-fields dd[data-field="decision"]{padding:10px 12px;background:var(--raised);color:var(--text)}
.finding-fields dd[data-field="validation"]{color:var(--warn)}
.pane-empty{padding:40px 20px;text-align:center;color:var(--muted)}
.rp-block{padding:0 0 22px;margin:0 0 22px;border-bottom:2px solid var(--rule)}
.rp-block:last-of-type{border-bottom:0}
.rp-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:0 0 10px}
.rp-h h2{font:800 17px/1 var(--display);letter-spacing:-.025em}
.rp-n{font:800 17px/1 var(--display);color:var(--dim);font-variant-numeric:tabular-nums}
.rp-sub+.rp-sub{margin-top:18px}
.kv{display:grid;grid-template-columns:minmax(92px,auto) 1fr;margin:0;font-size:12.5px;border-top:1px solid var(--line2)}
.kv dt,.kv dd{margin:0;padding:7px 0;border-bottom:1px solid var(--line)}
.kv dt{color:var(--muted);padding-right:12px}
.kv dd{color:var(--soft);overflow-wrap:anywhere}
.numbered{list-style:none;margin:0;padding:0;counter-reset:li;border-top:1px solid var(--line2)}
.numbered li{counter-increment:li;display:grid;grid-template-columns:26px minmax(0,1fr);gap:6px;margin:0;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px;color:var(--soft)}

.rv-card[data-tone="warn"] .rv-status{background:var(--warn);color:var(--ink);border-color:var(--warn)}
.rv-card[data-tone="idle"] .rv-status{background:var(--hatch);color:var(--muted)}
.rv-inner{display:flex;flex-direction:column;gap:10px;padding:12px}

.rv-name{font:800 19px/1 var(--display);letter-spacing:-.03em}
.rv-model{font:12px/1.35 var(--mono);color:var(--muted);overflow-wrap:anywhere}

/* Assessment metrics reflow by their own width, so a wide detail column never crushes them */
.assess{container-type:inline-size}
@container (max-width:660px){
