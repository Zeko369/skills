  }

  /* Stack layout: depth is true distance from the trunk; lane is a git-graph row where the first
     child continues its parent's lane and later siblings fork into new lanes; indent counts forks. */
  function buildStack(entries) {
    const byId = new Map(entries.map((entry, index) => [entry.id, Object.assign({}, entry, { index, children: [] })]));
    const roots = [];
    for (const node of byId.values()) {
      node.parentEntry = node.parent != null ? byId.get(node.parent) || null : null;
      (node.parentEntry ? node.parentEntry.children : roots).push(node);
    }
    const order = [];
    let lanes = 0;
    const walk = (node, depth, trail, lane, indent, forked) => {
      Object.assign(node, { depth, trail, lane, indent, forked, order: order.length });
      order.push(node);
      node.children.forEach((child, i) => {
        child.isLast = i === node.children.length - 1;
        walk(child, depth + 1, depth === 0 ? [] : trail.concat(!node.isLast), i === 0 ? lane : ++lanes, indent + (i === 0 ? 0 : 1), i > 0);
      });
    };
    roots.forEach((root, i) => { root.isLast = i === roots.length - 1; walk(root, 0, [], i === 0 ? 0 : ++lanes, 0, false); });
    const ancestors = (id) => { const out = []; let node = byId.get(id); while (node && node.parentEntry) { node = node.parentEntry; out.push(node.id); } return out; };
    const descendants = (id) => { const out = []; const visit = (node) => node.children.forEach((c) => { out.push(c.id); visit(c); }); const n = byId.get(id); if (n) visit(n); return out; };
    const trunk = unique(roots.map((r) => r.base).filter(Boolean)).join(', ') || 'trunk';
    return { order, byId, roots, ancestors, descendants, trunk, maxDepth: Math.max(0, ...order.map((n) => n.depth)), laneCount: lanes + 1 };
  }

  function create() {
    const data = JSON.parse(document.getElementById('report-data').textContent);
    const findings = data.findings;
    const byId = new Map(findings.map((f) => [f.id, f]));
    const stack = buildStack(data.stack || []);
    /* One PR is a single review target, not a stack: stack views, the PR facet, and PR grouping need at least two. */
    const hasStack = stack.order.length > 1;
    const soloPR = stack.order.length === 1 ? stack.order[0] : null;
    const reviewerNames = unique(data.reviewers.map((r) => r.name).concat(...findings.map((f) => f.reviewers)));
    const reviewerIndex = (name) => Math.max(0, reviewerNames.indexOf(name)) % 6;
    const prLabel = (id) => { const n = stack.byId.get(id); if (!n) return id === NO_PR ? 'No PR' : String(id); return n.number != null ? `#${n.number}` : n.id; };
    const searchText = new Map(findings.map((f) => [f.id, norm([
      f.id, f.title, f.severity, f.disposition, f.confidence, f.reviewers.join(' '), f.tags.join(' '),
      f.prs.map((p) => `${prLabel(p)} ${(stack.byId.get(p) || {}).title || ''}`).join(' '),
      ...FIELDS.map(([key]) => f[key] || ''),
    ].join(' '))]));

    const confidences = unique(findings.map((f) => norm(f.confidence)).filter(Boolean));
    confidences.sort((a, b) => (CONFIDENCES.indexOf(a) + 1 || 99) - (CONFIDENCES.indexOf(b) + 1 || 99) || a.localeCompare(b));
    const options = {
      severity: SEVERITIES.map((v) => ({ value: v, label: v, hint: SEVERITY_LABELS[v] })),
      disposition: DISPOSITIONS.map((v) => ({ value: v, label: capitalize(v) })),
      reviewer: reviewerNames.map((v) => ({ value: v, label: v })),
      pr: hasStack ? stack.order.map((n) => ({ value: n.id, label: prLabel(n.id), hint: n.title, node: n }))
        .concat(findings.some((f) => !f.prs.length) ? [{ value: NO_PR, label: 'No PR', hint: 'Findings not tied to one pull request' }] : []) : [],
      confidence: confidences.map((v) => ({ value: v, label: capitalize(v) })),
      tag: unique(findings.flatMap((f) => f.tags)).sort().map((v) => ({ value: v, label: v })),
      answer: findings.length ? [
        { value: 'fix', label: 'Fix', hint: 'Approved for fixing; included in the copied answers' },
        { value: 'ignore', label: 'Ignore', hint: 'Left out of the fix list' },
      ] : [],
    };

    /* Local state is keyed by report, so every design rendered from one report.json shares it. */
    const storeKey = `multi-agent-review:${data.meta.key}`;
    let saved = {};
    try { saved = JSON.parse(localStorage.getItem(storeKey) || '{}') || {}; } catch (_) { saved = {}; }
    const pinned = new Set((saved.pinned || []).filter((id) => byId.has(id)));
    const answers = {};
    for (const [id, value] of Object.entries(saved.answers || {})) if (byId.has(id) && ANSWERS.includes(value)) answers[id] = value;
    for (const id of saved.hidden || []) if (byId.has(id) && !answers[id]) answers[id] = 'ignore'; // hides saved before answers existed
    const comments = {};
    for (const [id, text] of Object.entries(saved.comments || {})) if (byId.has(id) && typeof text === 'string' && text.trim()) comments[id] = text;
    const sections = Object.assign({}, saved.sections);
    const sectionDefaults = {};
    const sizes = Object.assign({}, saved.sizes);
    const themeStore = Object.assign({}, saved.theme);
    const persist = () => {
      try { localStorage.setItem(storeKey, JSON.stringify({ pinned: [...pinned], answers, comments, sections, sizes, theme: themeStore })); } catch (_) { /* storage blocked: keep state in memory */ }
    };
    const defaultAnswer = (f) => (f.disposition === 'rejected' ? 'ignore' : 'fix');
    const answerOf = (id) => answers[id] || (byId.has(id) ? defaultAnswer(byId.get(id)) : 'fix');
    const commentOf = (id) => (comments[id] || '').trim();
    function answerNote(id) {
      const f = byId.get(id);
      if (!answers[id]) return f.disposition === 'rejected' ? 'Ignored by default: the coordinator rejected it' : 'Approved by default';
      return answers[id] === 'ignore' ? 'Ignored by you' : 'Fix requested by you, although the coordinator rejected it';
    }

    const valuesOf = (f, facet) => {
      switch (facet) {
        case 'severity': return [f.severity];
        case 'disposition': return [f.disposition];
        case 'reviewer': return f.reviewers;
        case 'pr': return f.prs.length ? f.prs : [NO_PR];
        case 'confidence': return [norm(f.confidence)];
        case 'answer': return [answerOf(f.id)];
        default: return f.tags;
      }
    };

    const defaults = () => ({
      q: '', severity: new Set(), disposition: new Set(), reviewer: new Set(), pr: new Set(), confidence: new Set(), tag: new Set(), answer: new Set(),
      pinnedOnly: false, prInherited: false, groupBy: hasStack ? 'pr' : 'severity', sort: 'severity', selected: null, view: '', drawerFull: false,
    });
    const state = defaults();
    const open = new Set();
    const listeners = [];
    const refreshers = [];
    let searchInput = null;
    let focusAfterChange = null;
    /* Key specs: 'j / k' is a pair, 'i or r' are alternatives. Answer keys act only while a finding's answer block is on screen. */
    const SHORTCUTS = [
      { group: 'Move', keys: [['j / k', 'Next / previous finding'], ['f', 'Full-screen the open finding (toggle)'], ['o', 'Expand or collapse inline details'], ['/', 'Search'], ['Esc', 'Leave a text field, exit full screen, then close the finding']] },
      { group: 'Answer the open finding', keys: [['a', 'Fix (the default)'], ['i or r', 'Ignore (reject)'], ['x', 'Toggle fix / ignore'], ['c', 'Comment'], ['p', 'Pin']] },
      { group: 'Help', keys: [['?', 'Show this cheatsheet']] },
    ];
    const extraShortcuts = [];
    const shortcutGroups = () => SHORTCUTS.slice(0, 2).concat(extraShortcuts, SHORTCUTS.slice(2));
    const keyCaps = (spec) => spec.split(/\s+(or|\/)\s+/).map((part, i) => (i % 2 ? h('span', { class: 'kbd-or' }, ` ${part} `) : h('kbd', null, part)));
    const shortcutList = (groups) => groups.map((g) => h('section', { class: 'shortcut-group' }, h('h3', { class: 'shortcut-group-title' }, g.group),
      h('dl', null, g.keys.map(([spec, text]) => [h('dt', null, keyCaps(spec)), h('dd', null, text)]))));
    let sheet = null;
    let sheetReturn = null;
    function openSheet() {
      if (sheet) return;
      sheetReturn = document.activeElement;
      const close = h('button', { type: 'button', class: 'shortcut-close', 'aria-label': 'Close keyboard shortcuts', onclick: () => closeSheet() }, '×');
      sheet = h('div', { class: 'shortcut-overlay', onclick: (event) => { if (event.target === sheet) closeSheet(); } },
        h('div', { class: 'shortcut-sheet', role: 'dialog', 'aria-modal': 'true', 'aria-labelledby': 'shortcut-title' },
          h('div', { class: 'shortcut-head' }, h('h2', { class: 'shortcut-title', id: 'shortcut-title' }, 'Keyboard shortcuts'), close),
          h('div', { class: 'shortcut-groups' }, shortcutList(shortcutGroups())),
          h('p', { class: 'shortcut-foot' }, 'Shortcuts pause while you type in a field; Esc leaves it. Press ? or Esc to close.')));
      document.body.append(sheet);
      close.focus();
    }
    function closeSheet() {
      if (!sheet) return;
      sheet.remove();
      sheet = null;
      if (sheetReturn && sheetReturn.isConnected) sheetReturn.focus({ preventScroll: true });
      sheetReturn = null;
    }
    /* While the cheatsheet is open it owns the keyboard; this capture listener runs before any theme listener. */
    window.addEventListener('keydown', (event) => {
      if (!sheet) return;
      if (event.key === 'Escape' || event.key === '?') closeSheet();
      else if (event.key === 'Tab') sheet.querySelector('.shortcut-close').focus();
      else if (event.metaKey || event.ctrlKey) return;
      event.preventDefault();
      event.stopImmediatePropagation();
    }, true);

    function readHash() {
      const params = new URLSearchParams(location.hash.replace(/^#/, ''));
      Object.assign(state, defaults());
      state.q = params.get('q') || '';
      for (const facet of FACETS) {
        const allowed = new Set(options[facet].map((o) => o.value));
        state[facet] = new Set(params.getAll(HASH_KEYS[facet]).filter((v) => allowed.has(v)));
      }
      state.pinnedOnly = params.get('pinned') === '1';
      state.prInherited = params.get('inherit') === '1';
      if (GROUPS[params.get('group')] && (params.get('group') !== 'pr' || hasStack)) state.groupBy = params.get('group');
      if (SORTS[params.get('sort')]) state.sort = params.get('sort');
      if (byId.has(params.get('f'))) { state.selected = params.get('f'); open.add(state.selected); }
      if (/^[a-z][a-z0-9-]{0,31}$/.test(params.get('view') || '')) state.view = params.get('view');
      state.drawerFull = Boolean(state.selected) && params.get('full') === '1';
    }
    function writeHash() {
      const params = new URLSearchParams();
      if (state.q) params.set('q', state.q);
      for (const facet of FACETS) state[facet].forEach((v) => params.append(HASH_KEYS[facet], v));
      if (state.pinnedOnly) params.set('pinned', '1');
      if (state.prInherited) params.set('inherit', '1');
      if (state.groupBy !== defaults().groupBy) params.set('group', state.groupBy);
      if (state.sort !== 'severity') params.set('sort', state.sort);
      if (state.selected) params.set('f', state.selected);
      if (state.view) params.set('view', state.view);
      if (state.drawerFull) params.set('full', '1');
      const hash = params.toString();
      try { history.replaceState(null, '', hash ? `#${hash}` : location.pathname + location.search); } catch (_) { /* some file:// contexts reject replaceState */ }
    }

    function matches(f, except) {
      if (state.pinnedOnly && !pinned.has(f.id)) return false;
      if (state.q) { const text = searchText.get(f.id); if (!norm(state.q).split(/\s+/).every((term) => text.includes(term))) return false; }
      for (const facet of FACETS) {
        if (facet === except || !state[facet].size) continue;
        let selected = state[facet];
        if (facet === 'pr' && state.prInherited) selected = new Set([...selected].flatMap((id) => [id, ...stack.ancestors(id)]));
        if (!valuesOf(f, facet).some((v) => selected.has(v))) return false;
      }
      return true;
    }
    function counts(facet) {
      const out = new Map();
      for (const f of findings) if (matches(f, facet)) for (const v of valuesOf(f, facet)) out.set(v, (out.get(v) || 0) + 1);
      return out;
    }
    /** Per-PR severity breakdown under every filter except the PR filter itself. */
    function prBreakdown() {
      const out = new Map(stack.order.map((n) => [n.id, { total: 0, P0: 0, P1: 0, P2: 0, P3: 0 }]));
      for (const f of findings) {
        if (!matches(f, 'pr')) continue;
        for (const id of f.prs) { const row = out.get(id); if (row) { row.total += 1; row[f.severity] += 1; } }
      }
      return out;
    }

    const rank = (list, value) => { const i = list.indexOf(value); return i < 0 ? list.length : i; };
    const prOrder = (f) => (f.prs.length ? Math.min(...f.prs.map((p) => (stack.byId.get(p) || { order: 999 }).order)) + (f.prs.length > 1 ? 0.5 : 0) : 1000);
    const SORTERS = {
      severity: (a, b) => rank(SEVERITIES, a.severity) - rank(SEVERITIES, b.severity) || rank(DISPOSITIONS, a.disposition) - rank(DISPOSITIONS, b.disposition) || prOrder(a) - prOrder(b) || byNumericId(a, b),
      disposition: (a, b) => rank(DISPOSITIONS, a.disposition) - rank(DISPOSITIONS, b.disposition) || rank(SEVERITIES, a.severity) - rank(SEVERITIES, b.severity) || byNumericId(a, b),
      pr: (a, b) => prOrder(a) - prOrder(b) || rank(SEVERITIES, a.severity) - rank(SEVERITIES, b.severity) || byNumericId(a, b),
      id: byNumericId,
    };
    function groupDefs() {
      if (state.groupBy === 'severity') return SEVERITIES.map((v) => ({ key: v, label: `${v} · ${SEVERITY_LABELS[v]}`, severity: v, canonical: true, test: (f) => f.severity === v }));
      if (state.groupBy === 'disposition') return DISPOSITIONS.map((v) => ({ key: v, label: capitalize(v), disposition: v, canonical: true, test: (f) => f.disposition === v }));

      /**

       * The width goes to a CSS custom property (default --drawer-width on <html>) so the theme's CSS stays in charge:
       * width: min(var(--drawer-width, 520px), 100vw). Double-click resets. Arrow keys resize. Persisted per key.
       * side 'left' (default) means the handle sits on the panel's left edge, for a panel docked to the right.

      resizer(panel, opts) {
        opts = opts || {};
        const key = opts.key || 'drawer';
        const prop = opts.property || '--drawer-width';
        const target = opts.target || document.documentElement;

        handle.addEventListener('lostpointercapture', end);

<script>
(() => {
  'use strict';
  const app = MultiAgentReview.create();
  const { h, ui, data, state, stack } = app;
  const C = app.constants;
  const SEVS = C.SEVERITIES;
  const SEV_LABEL = C.SEVERITY_LABELS;
  const DISPS = C.DISPOSITIONS;
  const DISP_LABEL = { confirmed: 'Confirmed', 'needs validation': 'Needs validation', disputed: 'Disputed', rejected: 'Rejected' };
  const findings = app.findings;
  const hasFindings = findings.length > 0;
  const hasStack = app.hasStack;
  const soloPR = app.soloPR; // a one-PR review: no train, the PR is the review target
  const BAD = ['failed', 'timed_out', 'unavailable', 'cancelled'];
  const WARN = ['stale', 'running'];
  const TARGET = '(target)';
  const NOT_A_DECISION = 'Derived from review findings, not a merge decision.';
  const LEVEL = {
    blocked: { label: 'Blocked', lead: 'Blocked by' },
    attention: { label: 'Attention', lead: 'Needs attention' },
    clear: { label: 'Clear', lead: 'Clear' },
    none: { label: 'No findings recorded', lead: 'No findings recorded' },
  };
  const HARD = new Set(['confirmed', 'needs validation']);

  const plural = (n, one, many) => `${n} ${n === 1 ? one : (many || `${one}s`)}`;
  const lower = (v) => String(v == null ? '' : v).trim().toLowerCase();
  const kicker = (text) => h('span', { class: 'kicker' }, text);
  const swatch = (d) => h('span', { class: 'disp-sw', dataset: { disposition: d }, 'aria-hidden': 'true' });
  const statusText = (s) => String(s).replace(/_/g, ' ');
  const rankIn = (list, v) => { const i = list.indexOf(v); return i < 0 ? list.length : i; };
  const bySeverity = (a, b) => rankIn(SEVS, a.severity) - rankIn(SEVS, b.severity) || rankIn(DISPS, a.disposition) - rankIn(DISPS, b.disposition)
    || String(a.id).localeCompare(String(b.id), undefined, { numeric: true });
  const tally = (list) => { const row = { total: 0, P0: 0, P1: 0, P2: 0, P3: 0 }; list.forEach((f) => { row.total += 1; row[f.severity] += 1; }); return row; };
  const prLabel = (id) => (id === TARGET ? (soloPR ? app.prLabel(soloPR.id) : 'Target') : app.prLabel(id));
  const labels = (ids) => ids.map(prLabel).join(' · ');
  const selectedPRs = () => [...state.pr].filter((id) => stack.byId.has(id));
  const OTHER_FACETS = C.FACETS.filter((k) => k !== 'pr');
  const otherFilters = () => Boolean(state.q || state.pinnedOnly || OTHER_FACETS.some((k) => state[k].size));

  /* The review target when there is no stack; its dossier stands in for the train. */
  const target = (() => {
    const prefer = ['repository', 'repo', 'artifact', 'workspace', 'project', 'document', 'plan', 'branch', 'scope', 'target'];
    for (const key of prefer) {
      const hit = data.target.find(([k]) => lower(k) === key) || data.target.find(([k]) => lower(k).startsWith(key));
      if (hit) return { kind: hit[0], label: hit[1] };
    }
    return { kind: 'Review target', label: data.title };
  })();

  /* ── Readiness: every finding the user has not ignored, ignoring filters; rejected never counts ── */
  function classify(f) {
    if (f.disposition === 'rejected') return null;
    if ((f.severity === 'P0' || f.severity === 'P1') && HARD.has(f.disposition)) return 'blocked';
    if (f.disposition === 'disputed' || (f.severity === 'P2' && HARD.has(f.disposition))) return 'attention';
    return 'open';
  }
  let ready = new Map();
  function summarize(list, source) {
    const reason = (f) => ({ f, kind: classify(f), from: source(f) });
    const order = (a, b) => bySeverity(a.f, b.f) || (a.from ? 1 : 0) - (b.from ? 1 : 0);
    const blockers = list.filter((f) => classify(f) === 'blocked').map(reason).sort(order);
    const attention = list.filter((f) => classify(f) === 'attention').map(reason).sort(order);
    const level = !hasFindings ? 'none' : blockers.length ? 'blocked' : attention.length ? 'attention' : 'clear';
    return {
      level, blockers, attention,
      own: list.filter((f) => !source(f)), inherited: list.filter((f) => source(f)),
      reasons: level === 'blocked' ? blockers : level === 'attention' ? attention : [],
    };
  }
  function computeReadiness() {
    ready = new Map();
    const live = findings.filter((f) => !app.isIgnored(f.id) && f.disposition !== 'rejected');
    if (!hasStack) { ready.set(TARGET, summarize(live, () => null)); return; }
    for (const n of stack.order) {
      const below = stack.ancestors(n.id);
      const lineage = new Set([n.id, ...below]);
      const source = (f) => (f.prs.includes(n.id) ? null : below.find((a) => f.prs.includes(a)) || null);
      ready.set(n.id, summarize(live.filter((f) => f.prs.some((p) => lineage.has(p))), source));
    }
  }
  const reasonText = (r) => `${r.f.id} (${r.f.severity} ${r.f.disposition}, ${r.from ? `from ${prLabel(r.from)}` : 'own'})`;
  function describe(id) {
    const r = ready.get(id);

      ? `${LEVEL[r.level].label}: ${r.reasons.map(reasonText).join(', ')}.`
      : r.level === 'clear' ? 'Clear: no blocking or attention findings here or below.' : 'No findings recorded.';
    return `${lead} ${plural(r.own.length, 'own open finding')}, ${r.inherited.length} inherited. ${NOT_A_DECISION}`;
  }
  const signal = () => h('span', { class: 'signal', 'aria-hidden': 'true' }, h('i'), h('i'), h('i'));
  const levelChip = (level, extra) => h('span', { class: 'rd-chip', dataset: { level }, title: `${LEVEL[level].label}. ${extra ? `${extra} ` : ''}${NOT_A_DECISION}` },
    signal(), h('span', { class: 'rd-label' }, LEVEL[level].label));
  const legendItems = () => [
    h('li', null, levelChip('blocked'), h('span', null, 'P0/P1 confirmed or unvalidated')),
    h('li', null, levelChip('attention'), h('span', null, 'disputed, or P2 confirmed/unvalidated')),
    h('li', null, levelChip('clear'), h('span', null, hasStack ? 'neither, here or below' : 'neither'))];
  function alarm() {
    if (data.status !== 'incomplete') return null;
    const short = data.reviewers.filter((r) => r.status !== 'completed');
    return h('div', { class: 'train-alarm', role: 'note' }, h('p', null, `Review incomplete. Readiness reflects only the findings recorded so far${short.length ? `; not completed: ${short.map((r) => `${r.name} (${statusText(r.status)})`).join(', ')}` : ''}. A clear signal is not clearance.`));
  }

  /** Re-render a region outside core's notify() while keeping keyboard focus on the same control. */
  function keepFocus(fn) {
    const active = document.activeElement;
    const key = active && active.dataset ? active.dataset.focusKey : null;
    fn();
    app.sync();
    if (key && (!document.activeElement || document.activeElement === document.body)) {
      const el = document.querySelector(`[data-focus-key="${CSS.escape(key)}"]`);
      if (el) el.focus({ preventScroll: true });
    }
  }

  function confidence(value) {
    const v = lower(value);
    const level = v === 'high' ? 3 : v === 'medium' ? 2 : v === 'low' ? 1 : 0;
    return h('span', { class: 'conf', title: `${value} confidence` },
      h('span', { class: 'conf-bars', 'aria-hidden': 'true' }, [1, 2, 3].map((i) => h('i', { class: i <= level ? 'on' : null }))),
      h('span', null, value || 'Unknown'), h('span', { class: 'sr-only' }, ' confidence'));
  }
  const secHead = (id, title, aside) => h('div', { class: 'sec-head' },
    h('span', { class: 'sec-num', 'aria-hidden': 'true' }),
    h('h2', { class: 'sec-title', id, tabindex: '-1' }, title),
    aside ? h('div', { class: 'sec-aside' }, aside) : null);

  /* ── Station selection: one PR plus everything below it; shift-click compares ── */
  let deckSection = null;
  function selectStation(id, event, opts) {
    const add = event && (event.shiftKey || event.altKey);
    const current = selectedPRs();
    let next;
    if (add) next = current.includes(id) ? current.filter((x) => x !== id) : current.concat(id);
    else next = current.length === 1 && current[0] === id ? [] : [id];
    if (next.length) state.prInherited = true;
    app.setFacet('pr', next);
    if (opts && opts.reveal && !add && next.length && deckSection) {
      const top = deckSection.getBoundingClientRect().top;
      if (top > innerHeight * 0.55) {
        deckTitle.focus({ preventScroll: true });
        const smooth = !matchMedia('(prefers-reduced-motion: reduce)').matches;
        deckSection.scrollIntoView({ behavior: smooth ? 'smooth' : 'auto', block: 'start' });
        // Some embedded or background browsers never run the smooth animation; jump if it did not start.
        if (smooth) setTimeout(() => { if (Math.abs(deckSection.getBoundingClientRect().top - top) < 4) deckSection.scrollIntoView({ block: 'start' }); }, 450);
      }
    }
  }
  const wholeStack = () => { state.prInherited = false; app.setFacet('pr', []); };
  const prChip = (id) => {
    const node = stack.byId.get(id);
    return h('button', { type: 'button', class: 'pr-chip', title: node ? `${node.title} — open this station` : 'Open this station', dataset: { pr: id },
      onclick: (e) => { e.stopPropagation(); selectStation(id, e); } }, prLabel(id));
  };

  /* ── Top bar ── */
  function buildTopbar() {
    let pop = null;
    if (!hasFindings) {
      pop = h('details', { class: 'view-pop no-print' }, h('summary', null, 'View'),
        h('div', { class: 'view-panel' }, ui.sections(sectionDefs), ui.print('Print / PDF')));
      document.addEventListener('click', (event) => { if (pop.open && !pop.contains(event.target)) pop.open = false; });
      document.addEventListener('keydown', (event) => { if (event.key === 'Escape' && pop.open) pop.open = false; });

  /* ── Hero: status tile, verdict, slim metric tiles ── */
  let heroBar = null;

  /* ── Station explainer (hover / focus) ── */

    const w = why.offsetWidth;

  /* ── Train: x = depth, y = lane; connectors are CSS borders so they reflow and print ── */
  function buildTrain() {
    const grid = h('div', { class: 'map-grid' });

    const whole = h('button', { type: 'button', class: 'btn', 'aria-pressed': 'true', dataset: { focusKey: 'whole-stack' }, onclick: wholeStack }, 'Whole stack');
    const legend = h('ul', { class: 'legend', 'aria-label': 'Readiness legend' }, legendItems());
    const printList = h('ol', { class: 'print-train print-only' });
    const section = h('section', { class: 'section section-train', dataset: { section: 'train' }, 'aria-labelledby': 'sec-train' },
      secHead('sec-train', 'Merge train', h('span', null, `${plural(stack.order.length, 'pull request')} on `, h('code', null, stack.trunk), ' · merges bottom-up, left to right')),
      alarm(),
      h('div', { class: 'train-tools no-print' }, h('p', { class: 'train-hint', dataset: { swipe: stack.maxDepth > 0 ? '' : null } }, 'Select a station for its dossier. Shift-click to compare.'), whole, hasFindings ? legend : null),
      scroller, printList,

    scroller.addEventListener('scroll', hideWhy, { passive: true });

    function station(n, o) {
      const id = n.id;
      const r = ready.get(id);
      const label = prLabel(id);
      const diff = [n.additions != null ? `+${n.additions}` : null, n.deletions != null ? `−${n.deletions}` : null].filter(Boolean).join(' ');

      const own = tally(r.own);
      const whyIds = r.reasons.slice(0, 2).map((x) => x.f.id).join(' · ') + (r.reasons.length > 2 ? ` +${r.reasons.length - 2}` : '');
      const body = [
        h('span', { class: 'st-band' }, signal(), h('span', { class: 'st-level' }, LEVEL[r.level].label), whyIds ? h('span', { class: 'st-why' }, whyIds) : null),

            h('span', { class: 'st-num' }, label),
            o.included ? h('span', { class: 'st-flag', title: 'Included because a higher PR is selected with “Include lower PRs”' }, 'Below') : null,
            n.status ? h('span', { class: 'st-status', dataset: { status: lower(n.status) } }, n.status) : null),
          h('span', { class: 'st-title' }, n.title),
          branchLine ? h('span', { class: 'st-line' }, branchLine) : null,
          n.forked && n.parent ? h('span', { class: 'st-line' }, `forks from ${prLabel(n.parent)}`) : null,
          diffLine ? h('span', { class: 'st-line' }, diffLine) : null,
          !hasFindings ? null : h('span', { class: 'st-foot' },
            h('span', { class: 'st-n', dataset: { zero: r.own.length ? null : '' } }, h('b', null, String(r.own.length)), 'own'),

      const card = h('button', {
        type: 'button', class: 'st-card', 'aria-pressed': String(state.pr.has(id)),

        dataset: { focusKey: `station:${id}` },
        onclick: (event) => { hideWhy(); selectStation(id, event, { reveal: true }); },
      }, body);
      card.addEventListener('mouseenter', () => showWhy(card, id));
      card.addEventListener('mouseleave', hideWhy);
      card.addEventListener('focus', () => showWhy(card, id));
      card.addEventListener('blur', hideWhy);
      return h('div', {
        class: 'station', style: `grid-column:${o.col};grid-row:${n.lane + 1}`,
        dataset: { pr: id, level: r.level, wire: o.wire, included: o.included ? '' : null },
      },
      o.joined ? null : h('span', { class: 'stub stub-in', 'aria-hidden': 'true' }),
      h('span', { class: 'port port-in', 'aria-hidden': 'true' }),
      card,
      n.url ? h('a', { class: 'st-link', href: n.url, target: '_blank', rel: 'noopener noreferrer', title: `Open ${label} in a new tab`, 'aria-label': `Open ${label} in a new tab` }, '↗') : null,
      h('span', { class: 'sr-only', id: descId }, describe(id)),

        h('span', { class: 'stub stub-out', 'aria-hidden': 'true', dataset: { wire: o.outWire } }),
        h('span', { class: 'port port-out', 'aria-hidden': 'true', dataset: { wire: o.outWire } }),
      ] : null);
    }

    function render() {
      hideWhy();
      whole.setAttribute('aria-pressed', String(!state.pr.size));
      const rows = otherFilters() ? app.prBreakdown() : null;
      const focus = new Set();
      state.pr.forEach((id) => { if (stack.byId.has(id)) { focus.add(id); stack.ancestors(id).forEach((a) => focus.add(a)); } });
      const lit = (id) => !focus.size || focus.has(id);
      const included = new Set();
      if (state.prInherited) state.pr.forEach((id) => { if (stack.byId.has(id)) stack.ancestors(id).forEach((a) => { if (!state.pr.has(a)) included.add(a); }); });
      grid.style.gridTemplateColumns = `var(--trunk-w) repeat(${stack.maxDepth + 1}, minmax(var(--card-min), var(--card-max)))`;
      const trunkWire = stack.roots.some((rt) => lit(rt.id)) ? 'on' : 'off';
      const items = [h('div', { class: 'station station-trunk', style: 'grid-column:1;grid-row:1' },
        h('button', { type: 'button', class: 'trunk-tile', 'aria-pressed': String(!state.pr.size), title: 'Whole stack: show every PR', dataset: { focusKey: 'trunk' }, onclick: wholeStack },
          kicker('Trunk'), h('span', { class: 'trunk-name' }, stack.trunk), h('span', { class: 'trunk-hint' }, state.pr.size ? '← Whole stack' : 'Whole stack')),
        h('span', { class: 'stub stub-out', 'aria-hidden': 'true', dataset: { wire: trunkWire } }),
        h('span', { class: 'port port-out', 'aria-hidden': 'true', dataset: { wire: trunkWire } }))];
      for (const n of stack.order) {

      printList.replaceChildren(...stack.order.map((n) => {
        const r = ready.get(n.id);
        return h('li', null, h('span', { class: 'pt-num' }, prLabel(n.id)), h('span', null, n.title), h('b', null, LEVEL[r.level].label.toUpperCase()),

  /* ── Filter strip ── */
  let stripOpen = false;

  /* Core presets and reset also clear the PR facet. Here the station is navigation, not a filter: keep it. */
  function keepStation(el) {

    el.addEventListener('click', () => {
      const k = keep;
      keep = null;

  }
  const presetOn = (name) => {
    const p = C.PRESETS[name];

  function buildStrip() {

    const moreBtn = h('button', { type: 'button', class: 'btn more-toggle', 'aria-expanded': 'false', 'aria-controls': 'more-panel', onclick: () => { moreOpen = !moreOpen; app.store.set('moreOpen', moreOpen); sync(); } }, 'More', moreBadge);
    const more = h('div', { class: 'more-panel', id: 'more-panel' },
      ui.facet('confidence'), ui.facet('tag'),

    function sync() {

    return { el, refresh };
  }

  /* ── Rows (triage density, board's disposition encoding) ── */
  let drawerFor = null;
  let opener = null;
  let order = [];
  function openFinding(id, opts) {

  /* ── Deck: rail + list. Whole stack = merge plan + grouped findings; station = dossier ── */
  const rail = h('aside', { class: 'rail', 'aria-label': 'Merge plan and dossier' });
  const deckMain = h('div', { class: 'deck-main' });

  const deckShowing = h('b');

  /* Station switcher and merge-plan toggle sit above the deck, so hiding the plan frees the whole width. */
  const deckBar = h('div', { class: 'deck-bar no-print' });
  function renderDeckBar(sel) {
    if (!hasStack) { deckBar.hidden = true; return; }

  function switcher(sel) {

      h('button', { type: 'button', class: 'sw-btn', dataset: { whole: '', focusKey: 'sw:whole' }, 'aria-pressed': String(!sel.length), onclick: wholeStack }, 'Whole stack'),

            ? h('span', { class: 'who' }, f.reviewers.map((name) => h('span', { class: 'who-item' }, ui.reviewerBadges([name]), name)))
            : 'Coordinator')],
          [h('dt', null, 'Confidence'), h('dd', null, confidence(f.confidence))],
          f.tags.length ? [h('dt', null, 'Tags'), h('dd', null, h('span', { class: 'chips' }, f.tags.map((t) => h('button', {
            type: 'button', class: 'tag-chip', 'aria-pressed': String(state.tag.has(t)), title: `Show only findings tagged ${t}`,
            onclick: () => app.setFacet('tag', [t]),
          }, t))))] : null),
        ui.findingActions(f, { answer: false }),
        ui.findingFields(f)),
      h('div', { class: 'drawer-dock' }, ui.answer(f, { rows: 2 })));
    drawer.hidden = false;
    drawerFor = f.id;
  }

  /* ── Footer ── */
  function buildFooter() {
    return h('footer', { class: 'foot' },
      h('span', null, h('b', null, 'Multi-agent review'), ` · generated ${data.generated_at}`),
      hasFindings ? h('span', null, 'Answers, comments and pins are saved in this browser only and shared by every design of this report; they never change the report.') : null,
      h('span', null, NOT_A_DECISION));
  }

  /* ── Mount ── */
  const sectionDefs = [hasStack ? ['train', 'Merge train'] : null, hasStack && hasFindings ? ['plan', 'Merge plan'] : null, ['team', 'Reviewers'], ['scope', 'Scope & follow-up']].filter(Boolean);
  app.sectionDefaults({ plan: false });
  computeReadiness();
  const train = hasStack ? buildTrain() : null; // one station is not a train
  const strip = hasFindings ? buildStrip() : null;
  const main = h('main', { class: 'page', id: 'main' },
    buildHero(), train ? train.section : null,
    strip ? strip.el : null,
    buildDeck(),
    buildTeam(), buildDetails());
  document.getElementById('app').append(buildTopbar(), main, buildFooter(), drawer, why);

  app.subscribe((reason, detail) => {
    if (reason === 'open') return;
    if (reason === 'sections') { if (detail === 'plan' && hasFindings) keepFocus(renderDeck); return; }
    if (reason === 'layout') { renderDrawer(); return; }
    if (reason === 'select') {
      const group = state.selected && state.groupBy !== 'none' && !selectedPRs().length ? app.view().groups.find((g) => g.items.some((f) => f.id === state.selected)) : null;
      if (group && collapsed.has(group.key)) { collapsed.delete(group.key); app.store.set('collapsed', [...collapsed]); renderDeck(); }
      renderDrawer();
      return;
    }
    computeReadiness();
    refreshHero();
    if (train) train.render();
    if (hasFindings) { renderDeck(); strip.refresh(); }
    renderDrawer();
  });
  app.start();
})();
</script>
</body>
</html>
