<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'">
<meta name="generator" content="multi-agent-review · @@THEME@@">
<title>@@TITLE@@</title>
<style>@@CORE_CSS@@</style>
<style>
/* ── Train: stack-first merge readiness. Board's Swiss language, triage's density. ── */
:root{
  --ink:#0a0a0a;--paper:#fff;--wash:#f3f3f0;--wash-2:#e8e8e3;--line:#d6d6cf;--muted:#56564f;--faint:#8b8b84;
  --p0:#e5202e;--p1:#ff6a00;--p2:#ffc400;--p3:#2f6bff;
  --purple:#7b2fff;--grey:#b4b4ac;--grey-lt:#e4e4de;--green:#00b25a;--amber:#ffb000;--wire-off:#d3d3cc;
  --sans:"Helvetica Neue",Helvetica,Arial,system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --pad:clamp(16px,2.8vw,40px);
  --strip-h:0px;
  --hatch-soft:repeating-linear-gradient(-45deg,rgba(10,10,10,.075) 0 2px,transparent 2px 9px);
  --hatch-warn:repeating-linear-gradient(-45deg,rgba(10,10,10,.2) 0 2px,transparent 2px 8px);
  --hazard:repeating-linear-gradient(-45deg,var(--ink) 0 10px,var(--p2) 10px 20px);
  --barrier:repeating-linear-gradient(-45deg,#fff 0 6px,var(--p0) 6px 12px);
  color-scheme:light;
}
[data-severity="P0"]{--sevc:var(--p0);--sevi:#fff}
[data-severity="P1"]{--sevc:var(--p1);--sevi:var(--ink)}
[data-severity="P2"]{--sevc:var(--p2);--sevi:var(--ink)}
[data-severity="P3"]{--sevc:var(--p3);--sevi:#fff}
/* Readiness: color + pattern + signal position + text label */
[data-level="blocked"]{--lvc:var(--p0);--lvi:#fff;--lvbg:var(--p0)}
[data-level="attention"]{--lvc:var(--p2);--lvi:var(--ink);--lvbg:var(--hatch-warn),var(--p2)}
[data-level="clear"]{--lvc:var(--green);--lvi:var(--ink);--lvbg:var(--green)}
[data-level="none"]{--lvc:var(--grey-lt);--lvi:var(--muted);--lvbg:var(--hatch-soft),var(--paper)}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:calc(var(--strip-h) + 24px)}
body{margin:0;background:var(--paper);color:var(--ink);font:400 15px/1.45 var(--sans);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
h1,h2,h3,h4,p,figure{margin:0}
button,input,select{font:inherit;color:inherit}
button{border-radius:0}
a{color:inherit;text-decoration-thickness:2px;text-underline-offset:3px}
code,pre,kbd{font-family:var(--mono)}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.kicker{display:block;font:800 10.5px/1.15 var(--sans);letter-spacing:.14em;text-transform:uppercase}
.muted{color:var(--muted)}
noscript{display:block;padding:24px;font-weight:700}
.print-only{display:none}

/* Buttons */
.btn,.reset,.copy,.print,.expand-all,.collapse-all,.action,.bulk-answer,.view-pop>summary,.rv-output>summary{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;padding:0 12px;border:2px solid var(--ink);
  background:var(--paper);color:var(--ink);font:800 11px/1 var(--sans);letter-spacing:.08em;text-transform:uppercase;cursor:pointer;white-space:nowrap;text-decoration:none;user-select:none}
:is(.btn,.reset,.copy,.print,.expand-all,.collapse-all,.action,.bulk-answer,.view-pop>summary,.rv-output>summary):hover:not(:disabled){background:var(--ink);color:var(--paper)}
.btn-solid,.btn[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.btn-solid:hover:not(:disabled){background:var(--paper)!important;color:var(--ink)!important}
.action[aria-pressed="true"],.btn[aria-expanded="true"]{background:var(--ink);color:var(--paper)}
.badge:empty{display:none}
.badge{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 4px;background:var(--p2);color:var(--ink);font:900 10.5px/1 var(--sans);letter-spacing:0}

/* Signal head and readiness chips */
.signal{display:inline-flex;flex-direction:column;gap:3px;flex:none;padding:4px;background:var(--ink);border-radius:8px}
.signal i{display:block;width:8px;height:8px;border-radius:50%;background:#3b3b37}
[data-level="blocked"] .signal i:nth-child(1){background:#ff4651;box-shadow:0 0 0 2px rgba(255,70,81,.28)}
[data-level="attention"] .signal i:nth-child(2){background:#ffd21f;box-shadow:0 0 0 2px rgba(255,210,31,.28)}
[data-level="clear"] .signal i:nth-child(3){background:#1ee47e;box-shadow:0 0 0 2px rgba(30,228,126,.28)}
.rd-chip{display:inline-flex;align-items:center;gap:7px;height:26px;padding:0 9px 0 3px;background:var(--lvbg);color:var(--lvi);border:2px solid var(--ink);font:900 10.5px/1 var(--sans);letter-spacing:.12em;text-transform:uppercase;white-space:nowrap;flex:none}
.rd-chip .signal{flex-direction:row;gap:2px;padding:3px;border-radius:6px}
.rd-chip .signal i{width:6px;height:6px}
.rd-chip[data-level="attention"] .rd-label,.rd-chip[data-level="none"] .rd-label{background:var(--lvc);padding:2px 3px;margin:-2px -3px}
.rd-chip[data-level="none"] .rd-label{background:var(--paper)}
.rd-chip[data-level="blocked"]{box-shadow:inset 0 -4px 0 rgba(255,255,255,.0)}

/* ── Top bar ── */
.topbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 22px;padding:10px var(--pad);border-bottom:2px solid var(--ink);font:800 11px/1.2 var(--sans);letter-spacing:.13em;text-transform:uppercase}
.brand{display:inline-flex;align-items:center;gap:10px}
.brand-mark{display:inline-flex;flex-direction:row;gap:2px;padding:3px;background:var(--ink);border-radius:6px}
.brand-mark i{width:7px;height:7px;border-radius:50%}
.brand-mark i:nth-child(1){background:#ff4651}.brand-mark i:nth-child(2){background:#ffd21f}.brand-mark i:nth-child(3){background:#1ee47e}
.topbar-meta{color:var(--muted)}
.topbar-snap{font:600 11.5px/1.2 var(--mono);letter-spacing:0;text-transform:none;color:var(--muted)}
.topbar-tools{margin-left:auto;display:flex;gap:8px}
.view-pop{position:relative}
.view-pop>summary{list-style:none;height:28px}
.view-pop>summary::-webkit-details-marker{display:none}
.view-pop>summary::after{content:"";border:4px solid transparent;border-top:5px solid currentColor;margin:4px 0 0 2px}
.view-panel{position:absolute;right:0;top:calc(100% + 8px);z-index:70;display:grid;gap:14px;min-width:230px;padding:14px 16px 16px;background:var(--paper);border:2px solid var(--ink);box-shadow:6px 6px 0 var(--ink);text-transform:none;letter-spacing:0;font-weight:500}
.section-toggles{display:grid;gap:9px}
.section-toggles .facet-legend{margin-bottom:4px}

/* ── Hero: compact; the train is the real hero ── */
.hero{display:grid;grid-template-columns:minmax(230px,21%) minmax(0,1fr);border-bottom:2px solid var(--ink)}
.status-tile{grid-row:1 / span 2;container-type:inline-size;position:relative;display:flex;flex-direction:column;gap:12px;padding:20px 22px 20px;border-right:2px solid var(--ink);overflow:hidden}
.status-word{margin-top:auto;font-size:min(64px,calc(132cqi / var(--len)));font-weight:900;line-height:.84;letter-spacing:-.055em;text-transform:uppercase}
.status-note{font:600 13px/1.4 var(--sans);max-width:36ch}
.status-tile[data-status="complete"]{background:var(--green)}
.status-tile[data-status="incomplete"]{background:var(--p2);padding-top:42px}
.status-tile[data-status="incomplete"]::before{content:"";position:absolute;left:0;right:0;top:0;height:22px;background:var(--hazard);border-bottom:2px solid var(--ink)}
.status-tile[data-status="incomplete"] .status-word{color:var(--ink)}
.status-tile[data-status="setup"]{background:var(--paper) var(--hatch-soft)}
.status-tile[data-status="setup"] :is(.status-word,.status-note,.kicker){background:var(--paper);align-self:flex-start;padding:2px 4px 2px 0}
.hero-main{display:flex;flex-direction:column;gap:10px;min-width:0;padding:20px var(--pad) 20px 28px}
.hero-title{font:800 12px/1.35 var(--sans);letter-spacing:.1em;text-transform:uppercase;max-width:100ch;overflow-wrap:anywhere}
.verdict{font-size:clamp(23px,2.45vw,38px);font-weight:900;line-height:1.02;letter-spacing:-.035em;max-width:30em;text-wrap:balance;overflow-wrap:anywhere}
.summary{font-size:14.5px;line-height:1.5;max-width:92ch;color:#33332f}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) minmax(0,2.3fr);border-top:2px solid var(--ink)}
.metric{position:relative;display:flex;flex-direction:column;gap:6px;min-width:0;padding:12px 18px 12px;border-right:2px solid var(--ink)}
.metric:first-child{padding-left:28px}
.metric:last-child{border-right:0}
.metric-row{display:flex;align-items:flex-end;gap:12px;min-width:0}
.metric-value{font-size:42px;font-weight:900;line-height:.8;letter-spacing:-.06em;font-variant-numeric:tabular-nums;white-space:nowrap}
.metric-value small{font-size:.48em;letter-spacing:-.03em;color:var(--muted);margin-left:.04em}
.metric-note{font-size:12px;line-height:1.3;color:var(--muted);min-width:0}
.metric[data-warn]{background:#fff6dc}
.metric[data-warn]::before{content:"";position:absolute;left:0;right:0;top:0;height:6px;background:var(--hazard)}
.metric[data-warn] .metric-note{color:var(--ink);font-weight:700}
.metric[data-hatch] .metric-value{background:var(--paper)}
.metric[data-hatch]{background:var(--hatch-soft)}
.metric-sev .metric-row{align-items:stretch}
.herobar{flex:1;display:flex;min-width:0;height:42px;border:2px solid var(--ink);background:var(--paper)}
.herobar-seg{flex:1 1 0;min-width:36px;display:flex;align-items:center;justify-content:space-between;gap:4px;padding:0 8px;border:0;border-right:2px solid var(--ink);background:var(--sevc);color:var(--sevi);cursor:pointer;text-align:left}
.herobar-seg:last-child{border-right:0}
.herobar-seg .n{font:900 20px/1 var(--sans);letter-spacing:-.04em}
.herobar-seg .k{font:800 10px/1 var(--sans);letter-spacing:.12em}
.herobar[data-filtered] .herobar-seg[aria-pressed="false"]{background:repeating-linear-gradient(-45deg,var(--sevc) 0 3px,var(--paper) 3px 8px);color:var(--ink)}
.herobar[data-filtered] .herobar-seg[aria-pressed="false"] :is(.n,.k){background:var(--paper);padding:1px 2px}
.herobar-seg[aria-pressed="true"]{box-shadow:inset 0 -6px 0 var(--ink)}
.herobar-seg:focus-visible{outline-offset:-6px}
.herobar.is-empty{align-items:center;justify-content:center;background:var(--hatch-soft);font:800 10.5px/1 var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}

/* ── Sections ── */
.page{counter-reset:sec}
.section{counter-increment:sec;padding:30px var(--pad) 40px;border-bottom:2px solid var(--ink);min-width:0}
.sec-head{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px 16px;margin-bottom:18px}
.sec-num{display:inline-flex;align-items:center;justify-content:center;min-width:40px;height:40px;padding:0 6px;background:var(--ink);color:var(--paper);font:900 16px/1 var(--sans);letter-spacing:-.02em}
.sec-num::before{content:counter(sec,decimal-leading-zero)}
.sec-title{font-size:clamp(30px,3.3vw,50px);font-weight:900;line-height:.84;letter-spacing:-.055em}
.sec-title:focus{outline:none}
.sec-aside{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;gap:3px;max-width:70ch;text-align:right;font-size:13px;line-height:1.35;color:var(--muted)}
.sec-aside code{font-size:12px;color:var(--ink);font-weight:700}
.sec-aside b{color:var(--ink)}
.filter-summary{margin:0}

/* ── Train ── */
.train-tools{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;margin:-4px 0 16px}
.train-hint{font-size:13px;color:var(--muted)}
.train-tools .btn{order:3}
.train-tools .legend{order:2;margin-left:auto}
.legend{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;margin:0;padding:0;list-style:none}
.legend li{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--muted)}
.legend .rd-chip{height:22px;font-size:9.5px}
.train-alarm{display:flex;align-items:center;gap:14px;margin:0 0 18px;padding:0 14px 0 0;border:3px solid var(--ink);background:var(--p2);font:800 13.5px/1.35 var(--sans)}
.train-alarm::before{content:"";align-self:stretch;width:46px;flex:none;background:var(--hazard);border-right:3px solid var(--ink)}
.train-alarm p{padding:10px 0}
.map-scroll{overflow-x:auto;overscroll-behavior-x:contain;padding:10px 12px 18px 10px;margin:0 -12px 0 -10px;scroll-snap-type:x proximity;scrollbar-width:thin}
.map-grid{--gx:58px;--gy:22px;--trunk-w:112px;--card-min:244px;--card-max:340px;--band-h:42px;position:relative;display:grid;grid-auto-rows:1fr;column-gap:var(--gx);row-gap:var(--gy);justify-content:start;width:100%;min-width:min-content}
.station{position:relative;display:flex;min-width:0;scroll-snap-align:start;scroll-margin-left:12px}
.trunk-tile{position:relative;z-index:1;flex:1;display:flex;flex-direction:column;justify-content:center;gap:6px;min-width:0;padding:14px 12px;border:0;background:var(--ink);color:var(--paper);text-align:left;cursor:pointer}
.trunk-tile:hover{box-shadow:5px 5px 0 var(--p2);transform:translate(-2px,-2px)}
.trunk-tile[aria-pressed="true"]{box-shadow:6px 6px 0 var(--p2)}
.trunk-name{font:900 24px/1 var(--sans);letter-spacing:-.04em;overflow-wrap:anywhere}
.trunk-hint{margin-top:6px;font:800 9.5px/1.2 var(--sans);letter-spacing:.12em;text-transform:uppercase;color:#bdbdb5}
.trunk-tile[aria-pressed="true"] .trunk-hint{color:var(--p2)}
[data-wire="on"]{--wire:var(--ink)}
[data-wire="off"]{--wire:var(--wire-off)}
.stub{position:absolute;top:calc(50% - 1.5px);height:3px;background:var(--wire,var(--ink));z-index:0}
.stub-in{right:100%;width:calc(var(--gx) / 2)}
.stub-out{left:100%;width:calc(var(--gx) / 2)}
.port{position:absolute;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:var(--paper);border:3px solid var(--wire,var(--ink));z-index:3;pointer-events:none}
.port-in{left:0}
.port-out{left:100%}
.map-elbow{position:relative;justify-self:start;width:0;pointer-events:none;z-index:0}
.elbow-line{position:absolute;right:0;width:calc(var(--gx) / 2);border-left:3px solid var(--wire,var(--ink));border-bottom:3px solid var(--wire,var(--ink));border-bottom-left-radius:18px}
.st-card{position:relative;z-index:1;flex:1;min-width:0;display:flex;flex-direction:column;padding:0;background:var(--paper);border:2px solid var(--ink);color:var(--ink);text-align:left;cursor:pointer;transition:transform .12s ease,box-shadow .12s ease}
.st-card:hover{transform:translate(-2px,-2px);box-shadow:5px 5px 0 var(--ink)}
.st-card[aria-pressed="true"]{transform:translate(-3px,-3px);box-shadow:8px 8px 0 var(--ink);border-width:3px;margin:-1px}
.st-card:focus-visible{outline-offset:4px}
.st-card[aria-pressed="true"] .st-body{background:var(--ink);color:var(--paper)}
.st-card[aria-pressed="true"] :is(.st-line,.st-n){color:#c4c4bc}
.st-card[aria-pressed="true"] .st-n b{color:var(--paper)}
.st-card[aria-pressed="true"] .st-n[data-zero] b{color:#8b8b84}
.st-card[aria-pressed="true"] .st-foot{border-top-color:#3a3a36}
.st-card[aria-pressed="true"] .st-flag{background:var(--paper);color:var(--ink)}
.st-band{position:relative;display:flex;align-items:center;gap:10px;min-height:var(--band-h);padding:6px 12px 6px 8px;background:var(--lvbg);color:var(--lvi);border-bottom:2px solid var(--ink)}
.station[data-level="blocked"] .st-band{padding-bottom:12px}
.station[data-level="blocked"] .st-band::after{content:"";position:absolute;left:0;right:0;bottom:0;height:6px;background:var(--barrier);border-top:2px solid var(--ink)}
.st-level{font:900 15px/1 var(--sans);letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}
.station[data-level="attention"] .st-level,.station[data-level="none"] .st-level{background:var(--lvc);padding:3px 4px;margin:-3px -4px}
.station[data-level="none"] .st-level{background:var(--paper);font-size:12px;letter-spacing:.1em}
.st-why{margin-left:auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:700 11px/1 var(--mono)}
.station[data-level="attention"] .st-why{background:var(--p2);padding:2px 3px}
.st-body{display:flex;flex-direction:column;gap:5px;flex:1;min-width:0;padding:11px 14px 12px}
.st-top{display:flex;align-items:center;gap:8px;min-width:0;padding-right:32px}
.st-num{font:900 30px/.82 var(--sans);letter-spacing:-.05em}
.st-status{margin-left:auto;padding:4px 6px 3px;border:2px solid currentColor;font:800 9.5px/1 var(--sans);letter-spacing:.12em;text-transform:uppercase}
.st-status[data-status="draft"]{border-style:dashed}
.st-flag{padding:4px 6px 3px;background:var(--ink);color:var(--paper);font:900 9.5px/1 var(--sans);letter-spacing:.1em;text-transform:uppercase}
.st-title{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.56em;margin-top:3px;font:700 14.5px/1.28 var(--sans);letter-spacing:-.01em}
.st-line{font:500 11.5px/1.35 var(--mono);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st-foot{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;margin-top:auto;padding-top:9px;border-top:1px solid var(--line)}
.st-foot>.st-match:only-of-type{margin-left:auto}
.st-n{display:inline-flex;align-items:baseline;gap:4px;font:800 10px/1 var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.st-n b{font:900 22px/.8 var(--sans);letter-spacing:-.05em;color:var(--ink);font-variant-numeric:tabular-nums}
.st-n[data-zero] b{color:var(--faint)}
.st-match{padding:3px 6px;background:var(--ink);color:var(--paper);font:800 9.5px/1 var(--sans);letter-spacing:.1em;text-transform:uppercase}
.st-match[data-zero]{background:var(--grey-lt);color:var(--muted)}
.st-pips{display:flex;margin-left:auto}
.st-pips:empty{display:none}
.sev-pip{display:inline-flex;align-items:center;height:18px;padding:0 5px;background:var(--sevc);color:var(--sevi);font:900 10.5px/1 var(--sans);letter-spacing:.02em;font-variant-numeric:tabular-nums}
.st-link{position:absolute;top:calc(var(--band-h) + 10px);right:10px;z-index:2;display:flex;align-items:center;justify-content:center;width:26px;height:26px;border:2px solid var(--ink);background:var(--paper);color:var(--ink);font:900 14px/1 var(--sans);text-decoration:none}
.station[data-level="blocked"] .st-link{top:calc(var(--band-h) + 16px)}
.st-link:hover{background:var(--ink);color:var(--paper)}
.station[data-included] .st-card{outline:3px dashed var(--ink);outline-offset:5px}
.legend-v{flex-direction:column;align-items:flex-start;gap:8px}
.legend-v li{font-size:13px;color:var(--ink)}
.legend-v .rd-chip{min-width:118px}
.rules-note{font-size:12.5px;line-height:1.4;color:var(--muted)}
.dos-rules{display:flex;flex-direction:column;gap:10px;padding-top:12px;border-top:2px solid var(--ink)}
.dos-rules .kicker{color:var(--muted)}
.train-foot{display:flex;flex-wrap:wrap;gap:4px 16px;margin-top:4px;font-size:12.5px;color:var(--muted)}
.train-foot b{color:var(--ink)}
.train-foot .mark{font-weight:900;color:var(--ink)}

/* Station hover/focus explainer */
.why{position:fixed;z-index:80;width:min(380px,calc(100vw - 16px));background:var(--paper);border:2px solid var(--ink);box-shadow:6px 6px 0 var(--ink);pointer-events:none}
.why-head{display:flex;align-items:center;gap:10px;padding:8px 10px;border-bottom:2px solid var(--ink);font:900 15px/1 var(--sans);letter-spacing:-.02em}
.why-lead{padding:9px 12px 4px;font:800 10px/1.2 var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.why ul{list-style:none;margin:0;padding:2px 12px 8px}
.why li{display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:8px;padding:5px 0;border-bottom:1px solid var(--line);font-size:12.5px;line-height:1.3}
.why li:last-child{border-bottom:0}
.why .wl-meta{grid-column:2;font:600 10.5px/1.3 var(--mono);color:var(--muted)}
.why-ok{padding:10px 12px;font-size:13px}
.why-foot{padding:7px 12px 9px;border-top:1px solid var(--line);font-size:11.5px;color:var(--muted)}
.sev-tag{flex:none;display:inline-flex;align-items:center;justify-content:center;min-width:28px;height:19px;padding:0 4px;background:var(--sevc);color:var(--sevi);font:900 10.5px/1 var(--sans)}

/* ── Filter strip ── */
.strip{position:sticky;top:0;z-index:40;padding:10px var(--pad) 10px;background:rgba(255,255,255,.97);border-bottom:3px solid var(--ink)}
@supports (backdrop-filter:blur(6px)){.strip{background:rgba(255,255,255,.92);backdrop-filter:blur(8px) saturate(1.1)}}
.strip-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;min-width:0}
.strip-body .strip-row{margin-top:10px}
.strip-spacer{flex:1 1 0}
.strip-toggle{display:none}
.strip-out{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.strip-b{column-gap:22px}
.strip-b .facet{flex-direction:column;align-items:flex-start;gap:5px}
.strip-ctx{display:inline-flex;align-items:center;gap:8px;min-width:0;font:800 11px/1 var(--sans);letter-spacing:.1em;text-transform:uppercase}
.strip-ctx .ctx-pr{display:inline-flex;align-items:center;height:30px;padding:0 9px;background:var(--ink);color:var(--paper);font:900 13px/1 var(--sans);letter-spacing:-.01em;text-transform:none}
.search-input{-webkit-appearance:none;appearance:none;height:36px;width:clamp(170px,15vw,280px);min-width:0;padding:0 12px;border:2px solid var(--ink);border-radius:0;background:var(--paper);font:600 14px/1 var(--sans)}
.search-input::placeholder{color:var(--faint);font-weight:500}
.search-input::-webkit-search-cancel-button{filter:grayscale(1) brightness(.2);cursor:pointer}
.presets{display:flex;flex-wrap:wrap}
.preset{height:36px;padding:0 12px;margin-right:-2px;border:2px solid var(--ink);background:var(--paper);font:800 11px/1 var(--sans);letter-spacing:.08em;text-transform:uppercase;cursor:pointer;position:relative}
.preset:hover{background:var(--wash-2)}
.preset[aria-pressed="true"]{background:var(--ink);color:var(--paper);z-index:1}
.preset:focus-visible{z-index:2}
.result-count{margin:0;font:800 13px/1 var(--sans);font-variant-numeric:tabular-nums;white-space:nowrap}
.facet{display:flex;align-items:center;gap:8px;min-width:0}
.facet-legend{float:left;padding:0;margin:0;font:800 10px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.facet-options{row-gap:4px;min-width:0}
.facet-option{position:relative;display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 0 0 9px;margin-right:-2px;border:2px solid var(--ink);background:var(--paper);font:700 12px/1 var(--sans);white-space:nowrap;max-width:100%}
.facet-option:hover{background:var(--wash-2);z-index:1}
.facet-option:focus-visible{z-index:2}
.facet-option[aria-pressed="true"]{background:var(--ink);color:var(--paper);z-index:1}
.facet-swatch{width:10px;height:10px;flex:none;display:none}
.facet-label{overflow:hidden;text-overflow:ellipsis}
.facet-hint{max-width:15em;overflow:hidden;text-overflow:ellipsis;font-weight:500;color:var(--muted)}
.facet-count{align-self:stretch;display:inline-flex;align-items:center;justify-content:center;min-width:28px;padding:0 6px;margin-left:2px;border-left:2px solid currentColor;font-weight:900;font-variant-numeric:tabular-nums}
.facet-option[aria-pressed="true"] .facet-count{border-left-color:rgba(255,255,255,.4)}
.facet-severity .facet-swatch{display:block;background:var(--sevc);width:12px;height:12px}
.facet-severity[aria-pressed="true"]{background:var(--sevc);color:var(--sevi)}
.facet-severity[aria-pressed="true"] .facet-swatch{outline:2px solid currentColor;outline-offset:1px}
.facet-severity[aria-pressed="true"] .facet-count{border-left-color:currentColor}
.facet-disposition .facet-swatch,.facet-reviewer .facet-swatch{display:block}
.facet-reviewer .facet-swatch{width:12px;height:12px;border:2px solid currentColor}
.facet-reviewer[data-rv="0"] .facet-swatch{background:currentColor}
.facet-reviewer[data-rv="2"] .facet-swatch{background:#c5c5bd}
.facet-reviewer[data-rv="3"] .facet-swatch{background:currentColor;box-shadow:inset 0 0 0 2px var(--paper)}
.facet-reviewer[data-rv="4"] .facet-swatch{background:#6f6f68}
.facet-reviewer[data-rv="5"] .facet-swatch{border-style:dashed}
.toggle{font:700 12px/1 var(--sans);white-space:nowrap}
.toggle input{width:16px;height:16px;margin:0;accent-color:var(--ink);cursor:pointer}
.toggle-count:not(:empty){display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:18px;padding:0 5px;background:var(--ink);color:var(--paper);font:900 10.5px/1 var(--sans)}
.select{display:inline-flex;align-items:center;gap:8px}
.select-label{font:800 10px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.select select{-webkit-appearance:none;appearance:none;height:30px;padding:0 30px 0 10px;border:2px solid var(--ink);border-radius:0;font:700 12px/1 var(--sans);cursor:pointer;
  background:var(--paper) no-repeat;background-image:linear-gradient(45deg,transparent 50%,var(--ink) 50%),linear-gradient(135deg,var(--ink) 50%,transparent 50%);background-position:calc(100% - 15px) 52%,calc(100% - 10px) 52%;background-size:5px 5px}
.more-panel{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px 30px;margin-top:12px;padding-top:14px;border-top:2px solid var(--ink)}
.more-panel .facet{flex-direction:column;align-items:flex-start;gap:8px}
.more-group{display:flex;flex-direction:column;align-items:flex-start;gap:10px;min-width:0}
.expand-controls{display:flex;gap:6px}
.expand-controls button{height:28px;padding:0 9px;font-size:10.5px}
.shortcuts>summary{cursor:pointer;font:800 10.5px/1.6 var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--ink)}
.shortcuts dl{font-size:12.5px;color:var(--ink)}
kbd{display:inline-block;min-width:22px;padding:2px 5px;border:2px solid var(--ink);background:var(--paper);color:var(--ink);font:700 11px/1.2 var(--mono);text-align:center}

/* Disposition swatches: solid, hatched, purple, grey struck */
.disp-sw,.facet-disposition .facet-swatch{display:inline-block;width:13px;height:13px;flex:none;border:2px solid currentColor}
[data-disposition="confirmed"]>.facet-swatch,.disp-sw[data-disposition="confirmed"]{background:currentColor}
[data-disposition="needs validation"]>.facet-swatch,.disp-sw[data-disposition="needs validation"]{background:repeating-linear-gradient(-45deg,currentColor 0 1.5px,transparent 1.5px 4px)}
[data-disposition="disputed"]>.facet-swatch,.disp-sw[data-disposition="disputed"]{background:var(--purple);border-color:var(--purple)}
[data-disposition="rejected"]>.facet-swatch,.disp-sw[data-disposition="rejected"]{border-color:var(--grey);background:linear-gradient(to top right,transparent calc(50% - 1.2px),currentColor calc(50% - 1.2px) calc(50% + 1.2px),transparent calc(50% + 1.2px)),var(--grey-lt)}
.facet-option[aria-pressed="true"][data-disposition="disputed"]{background:var(--purple);border-color:var(--purple)}
.facet-option[aria-pressed="true"][data-disposition="disputed"] .facet-swatch{border-color:var(--paper)}

/* Reviewer badges: monochrome so color stays reserved for severity and readiness */
.rv-badges{display:inline-flex;gap:3px}
.rv{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:20px;padding:0 3px;border:2px solid var(--ink);background:var(--paper);color:var(--ink);font:900 9px/1 var(--sans);letter-spacing:.04em}
.rv[data-rv="0"]{background:var(--ink);color:var(--paper)}
.rv[data-rv="2"]{background:#c5c5bd}
.rv[data-rv="3"]{background:var(--ink);color:var(--paper);box-shadow:inset 0 0 0 2px var(--paper)}
.rv[data-rv="4"]{background:#6f6f68;border-color:#6f6f68;color:var(--paper)}
.rv[data-rv="5"]{border-style:dashed}

/* ── Deck: rail (merge plan or dossier) + finding list ── */
.deck{display:grid;grid-template-columns:minmax(300px,370px) minmax(0,1fr);align-items:start;border-top:3px solid var(--ink)}
.deck:has(> .rail:empty){grid-template-columns:minmax(0,1fr)}
.deck:has(> .rail:empty)>.rail{display:none}
.rail{position:sticky;top:calc(var(--strip-h) + 0px);max-height:calc(100vh - var(--strip-h));overflow:auto;overscroll-behavior:contain;padding:20px 24px 32px 0;border-right:2px solid var(--ink);scrollbar-width:thin}
.deck-main{min-width:0;padding:20px 0 24px 28px}
.deck-main:only-child{padding-left:0}
.rail-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:14px}
.rail-title{font:900 24px/1 var(--sans);letter-spacing:-.04em}
.rail-sub{font-size:12.5px;color:var(--muted)}
.deck-bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;margin:0 0 14px}
.switcher{display:flex;flex-wrap:wrap;gap:6px;min-width:0}
.plan-toggle{margin-left:auto;height:30px}
.plan-toggle::before{content:"";width:12px;height:12px;border:2px solid currentColor;background:transparent}
.plan-toggle[aria-pressed="true"]::before{background:currentColor;box-shadow:inset 0 0 0 2px var(--ink)}
.sw-btn{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 9px 0 4px;border:2px solid var(--ink);background:var(--paper);font:900 12.5px/1 var(--sans);letter-spacing:-.01em;cursor:pointer}
.sw-btn .signal{flex-direction:row;gap:2px;padding:3px;border-radius:5px}
.sw-btn .signal i{width:5px;height:5px}
.sw-btn:hover{background:var(--wash-2)}
.sw-btn[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.sw-btn[data-whole]{padding-left:9px;font:800 10.5px/1 var(--sans);letter-spacing:.1em;text-transform:uppercase}
.sw-btn[data-lineage]:not([aria-pressed="true"]){box-shadow:inset 0 -4px 0 var(--ink)}

/* Merge plan */
.plan{list-style:none;margin:0;padding:0}
.step{position:relative;display:grid;grid-template-columns:40px minmax(0,1fr);column-gap:14px;padding-bottom:20px}
.step::before{content:"";position:absolute;left:18.5px;top:40px;bottom:0;width:3px;background:var(--ink)}
.step:last-child{padding-bottom:4px}
.step:last-child::before{display:none}
.step-num{display:flex;align-items:center;justify-content:center;width:40px;height:40px;background:var(--ink);color:var(--paper);font:900 15px/1 var(--sans);letter-spacing:-.02em}
.step-body{display:flex;flex-direction:column;gap:7px;min-width:0;padding-top:2px}
.step-head{display:flex;align-items:flex-start;gap:8px;min-width:0}
.step-pr{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;padding:0;border:0;background:none;text-align:left;cursor:pointer}
.step-pr b{font:900 19px/1 var(--sans);letter-spacing:-.04em}
.step-pr span{font:700 13px/1.25 var(--sans);overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.step-pr:hover span{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px}
.step-meta{font:500 11px/1.35 var(--mono);color:var(--muted)}
.checklist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.check{display:grid;grid-template-columns:14px auto minmax(0,1fr);align-items:start;column-gap:8px;row-gap:2px;width:100%;padding:7px 8px;border:2px solid var(--ink);background:var(--paper);text-align:left;cursor:pointer}
.check::before{content:"";grid-row:1 / span 2;width:14px;height:14px;margin-top:1px;border:2px solid var(--ink);background:var(--paper)}
.check[data-kind="attention"]{border-style:dashed}
.check:hover{background:var(--wash)}
.check-what{font:800 12.5px/1.25 var(--sans)}
.check-title{grid-column:2 / -1;font-size:12px;line-height:1.3;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.check .sev-tag{height:18px;font-size:10px}
.step-note{font-size:12.5px;line-height:1.35;color:var(--muted)}
.step-note b{color:var(--ink)}
.plan-foot{margin-top:14px;padding-top:12px;border-top:1px solid var(--line);font-size:12px;line-height:1.4;color:var(--muted)}

/* Dossier card in the rail */
.dossier{border:3px solid var(--ink);margin-bottom:16px}
.dossier+.dossier{margin-top:4px}
.dos-band{position:relative;display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--lvbg);color:var(--lvi);border-bottom:3px solid var(--ink)}
.dossier[data-level="blocked"] .dos-band{padding-bottom:20px}
.dossier[data-level="blocked"] .dos-band::after{content:"";position:absolute;left:0;right:0;bottom:0;height:8px;background:var(--barrier);border-top:2px solid var(--ink)}
.dos-band .signal{padding:5px;gap:4px;border-radius:10px}
.dos-band .signal i{width:11px;height:11px}
.dos-level{display:flex;flex-direction:column;gap:5px;min-width:0}
.dos-level b{font:900 30px/.85 var(--sans);letter-spacing:-.03em;text-transform:uppercase}
.dos-level span{font:700 11.5px/1.25 var(--sans)}
.dossier[data-level="attention"] .dos-level>*,.dossier[data-level="none"] .dos-level>*{background:var(--lvc);align-self:flex-start;padding:2px 4px;margin-left:-4px}
.dossier[data-level="none"] .dos-level>*{background:var(--paper)}
.dossier[data-level="none"] .dos-level b{font-size:20px}
.dos-body{display:flex;flex-direction:column;gap:12px;padding:14px 14px 16px}
.dos-id{display:flex;align-items:center;gap:8px}
.dos-num{font:900 34px/.82 var(--sans);letter-spacing:-.05em}
.dos-title{font:800 16px/1.25 var(--sans);letter-spacing:-.015em}
.dos-kv{display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:12px;margin:0;border-top:2px solid var(--ink)}
.dos-kv dt,.dos-kv dd{margin:0;padding:6px 0;border-bottom:1px solid var(--line)}
.dos-kv dt{font:800 9.5px/1.7 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.dos-kv dd{font:500 12px/1.4 var(--mono);overflow-wrap:anywhere;min-width:0}
.dos-counts{display:flex;border:2px solid var(--ink)}
.dos-count{flex:1;display:flex;align-items:flex-end;gap:8px;padding:8px 10px}
.dos-count+.dos-count{border-left:2px solid var(--ink)}
.dos-count b{font:900 30px/.8 var(--sans);letter-spacing:-.05em;font-variant-numeric:tabular-nums}
.dos-count span{font:800 9.5px/1.2 var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.dos-reasons .kicker{margin-bottom:6px;color:var(--muted)}
.dos-ok{font-size:13px;line-height:1.4}
.dos-link{align-self:flex-start}
.dos-note{font-size:12px;line-height:1.4;color:var(--muted)}

/* Finding list */
.list-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px;margin:0 0 10px}
.list-title{font:900 24px/1 var(--sans);letter-spacing:-.04em}
.list-title .n{margin-left:8px;color:var(--faint)}
.list-sub{font-size:12.5px;color:var(--muted)}
.block{margin-bottom:28px}
.block:last-child{margin-bottom:0}
.block-note{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:14px 16px;border:2px dashed var(--ink);background:var(--hatch-soft);font-size:13.5px}
.block-note>span{background:var(--paper);padding:1px 4px}
.sub-head{display:flex;align-items:center;gap:10px;padding:14px 0 8px;font:800 11px/1 var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.sub-head .pr-chip{font-size:11.5px}
.sub-head .c{margin-left:auto;font:900 18px/1 var(--sans);letter-spacing:-.04em;color:var(--ink)}
.sub-head .t{text-transform:none;letter-spacing:0;font:600 13px/1.2 var(--sans);color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.group{margin-bottom:18px}
.group:last-child{margin-bottom:0}
.group-head{display:flex;align-items:center;gap:12px;width:100%;min-width:0;padding:8px 12px 8px 8px;border:0;background:var(--wash);color:var(--ink);text-align:left;cursor:pointer}
.group-head:hover{background:var(--wash-2)}
.g-tile{flex:none;display:inline-flex;align-items:center;justify-content:center;min-width:58px;height:36px;padding:0 9px;background:var(--ink);color:var(--paper);font:900 17px/1 var(--sans);letter-spacing:-.04em}
.g-tile[data-severity]{background:var(--sevc);color:var(--sevi)}
.g-tile[data-kind="cross"]{background:var(--paper);color:var(--ink);border:3px double var(--ink);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase}
.g-tile[data-kind="none"]{background:var(--paper);color:var(--ink);border:2px dashed var(--ink)}
.g-tile[data-kind="disp"]{background:var(--paper);color:var(--ink);border:2px solid var(--ink);min-width:36px}
.g-text{display:flex;flex-direction:column;gap:3px;flex:1;min-width:0}
.g-label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:800 15.5px/1.15 var(--sans);letter-spacing:-.015em}
.g-meta{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:500 11px/1.2 var(--mono);color:var(--muted)}
.g-count{min-width:1.3em;text-align:right;font:900 24px/.8 var(--sans);letter-spacing:-.05em;font-variant-numeric:tabular-nums}
.g-chev{flex:none;display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border:2px solid var(--ink);background:var(--paper);font:900 13px/1 var(--sans)}
.rows{border-top:2px solid var(--ink)}
.group .rows{border-top:0}
.row{position:relative;display:grid;grid-template-columns:50px minmax(0,1fr) auto;column-gap:14px;border-bottom:1px solid var(--line);background:var(--paper);cursor:pointer}
.row:hover{background:var(--wash)}
.row[data-selected]{background:var(--wash-2);box-shadow:inset 0 0 0 2px var(--ink)}
.row-sev{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:8px 0;background:var(--sevc);color:var(--sevi)}
.row-sev b{font:900 15px/1 var(--sans);letter-spacing:-.03em}
.row-sev small{font:800 8px/1 var(--sans);letter-spacing:.12em;text-transform:uppercase}
.row[data-disposition="needs validation"] .row-sev{background:repeating-linear-gradient(-45deg,var(--sevc) 0 4px,var(--paper) 4px 8px);color:var(--ink);box-shadow:inset 0 0 0 2px var(--sevc)}
.row[data-disposition="needs validation"] .row-sev :is(b,small){background:var(--paper);padding:2px 3px}
.row[data-disposition="disputed"]{box-shadow:inset 5px 0 0 var(--purple)}
.row[data-disposition="disputed"] .row-sev{border-right:5px solid var(--purple)}
.row[data-disposition="disputed"][data-selected]{box-shadow:inset 0 0 0 2px var(--purple)}
.row[data-disposition="rejected"] .row-sev{background:var(--grey-lt);color:#5c5c56}
.row[data-disposition="rejected"] .row-title-text{text-decoration:line-through;text-decoration-thickness:2px;text-decoration-color:rgba(10,10,10,.5);color:#5c5c56}
.row[data-ignored]{background:var(--paper) var(--hatch-soft)}
.row[data-ignored]>:not(.row-details,.row-side){opacity:.5}
.row[data-ignored] .row-title-text{text-decoration:line-through;text-decoration-thickness:2px;text-decoration-color:rgba(10,10,10,.45)}
.row-main{all:unset;display:flex;flex-direction:column;gap:4px;min-width:0;padding:9px 0 9px;cursor:pointer}
.row-main:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.row-title{display:flex;align-items:flex-start;gap:8px;font:700 14.5px/1.3 var(--sans);letter-spacing:-.01em}
.row-title .disp-sw{margin-top:2px}
.row-title-text{min-width:0}
.row[data-severity="P3"] .row-title{font-weight:600}
.row-sub{display:flex;flex-wrap:wrap;align-items:center;gap:3px 12px;font-size:12px;color:var(--muted);min-width:0}
.row-sub code{font-size:11.5px;color:#33332f;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:min(54ch,100%)}
.disp-label{font:800 10px/1 var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--ink)}
.disp-label[data-disposition="disputed"]{color:var(--purple)}
.disp-label[data-disposition="rejected"]{color:var(--faint)}
.tag{font:11px var(--mono);color:var(--muted)}
.tag::before{content:"#"}
.row-id{font:700 11px var(--mono);color:var(--muted)}
.flag{flex:none;padding:3px 5px 2px;font:900 9px/1 var(--sans);letter-spacing:.12em;text-transform:uppercase;margin-top:1px}
.flag-pin{background:var(--ink);color:var(--paper)}
.flag-ignored,.flag-cmt{display:none;border:2px solid currentColor;padding:1px 4px 0}
.row[data-ignored] .flag-ignored{display:inline-block}
.row[data-commented] .flag-cmt{display:inline-block;border-color:var(--ink);background:var(--p2)}
.row-side{display:flex;align-items:center;justify-content:flex-end;flex-wrap:wrap;gap:6px 8px;padding:8px 46px 8px 0;min-width:0}
.pr-chip{position:relative;z-index:2;display:inline-flex;align-items:center;height:22px;padding:0 6px;border:2px solid var(--ink);background:var(--paper);color:var(--ink);font:700 11px/1 var(--mono);cursor:pointer;white-space:nowrap}
.pr-chip:hover{background:var(--ink);color:var(--paper)}
.finding-actions{display:flex;gap:4px}
.row .action{height:24px;padding:0 7px;font-size:9.5px;border-width:2px}
@media (hover:hover){.row .finding-actions{opacity:0;transition:opacity .12s}.row:hover .finding-actions,.row:focus-within .finding-actions,.row[data-selected] .finding-actions,.row[data-pinned] .finding-actions,.row[data-ignored] .finding-actions{opacity:1}}
.row-details{grid-column:1 / -1}
.row-details>summary{position:absolute;top:9px;right:10px;display:flex;align-items:center;justify-content:center;width:26px;height:26px;border:2px solid var(--ink);background:var(--paper);list-style:none;cursor:pointer;font:900 15px/1 var(--sans)}
.row-details>summary::-webkit-details-marker{display:none}
.row-details>summary::before{content:"+"}
.row-details[open]>summary::before{content:"−"}
.row-details>summary:hover{background:var(--ink);color:var(--paper)}
.row-details>.finding-fields{display:grid;grid-template-columns:150px minmax(0,1fr);column-gap:16px;margin:0 14px 14px 64px;border-top:2px solid var(--ink);cursor:auto}
.row-details .finding-fields dt,.row-details .finding-fields dd{margin:0;padding:8px 0;border-bottom:1px solid var(--line)}
.row-details .finding-fields dt{line-height:1.6}
.row-details .finding-fields dd{font-size:13.5px}
.finding-fields{margin:0}
.finding-fields dt{font:800 9.5px/1.1 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.finding-fields dd{font-size:13.5px;line-height:1.45}
.finding-fields code{font:500 12px/1.4 var(--mono);overflow-wrap:anywhere}
.finding-fields pre{padding:9px 11px;background:var(--wash);border-left:4px solid var(--ink);font:500 11.5px/1.5 var(--mono)}
.nomatch{display:flex;flex-direction:column;align-items:flex-start;gap:14px;padding:36px 34px;border:3px dashed var(--ink);background:var(--hatch-soft)}
.nomatch>*{background:var(--paper)}
.nomatch-big{font-size:clamp(30px,3.6vw,52px);font-weight:900;line-height:.88;letter-spacing:-.05em;padding:2px 4px 2px 0}
.nomatch-why{font-size:14px;color:var(--muted);padding:2px 4px 2px 0}
.nomatch-actions{display:flex;flex-wrap:wrap;gap:8px;background:none}
.empty-state{display:grid;grid-template-columns:minmax(200px,24%) minmax(0,1fr);border:3px solid var(--ink);background:var(--paper)}
.empty-zero{display:flex;align-items:flex-end;padding:18px 26px 22px;border-right:3px solid var(--ink);background:var(--hatch-soft);font-size:clamp(130px,14vw,220px);font-weight:900;line-height:.72;letter-spacing:-.08em}
.empty-copy{display:flex;flex-direction:column;justify-content:flex-end;gap:14px;padding:28px 32px 26px}
.empty-copy .kicker{color:var(--muted)}
.empty-msg{font-size:clamp(26px,2.9vw,44px);font-weight:900;line-height:1.02;letter-spacing:-.04em;max-width:26ch;text-wrap:balance}
.empty-sub{font-size:14.5px;line-height:1.45;color:#33332f;max-width:66ch}

/* ── Drawer ── */
.drawer{position:fixed;top:0;right:0;bottom:0;z-index:60;display:flex;flex-direction:column;width:min(var(--drawer-width,520px),100%);background:var(--paper);border-left:3px solid var(--ink);box-shadow:-18px 0 0 rgba(10,10,10,.07)}
.drawer-band{position:relative;display:flex;align-items:center;gap:14px;min-height:88px;padding:14px 14px 14px 22px;background:var(--sevc);color:var(--sevi);border-bottom:3px solid var(--ink)}
.drawer[data-disposition="needs validation"] .drawer-band{padding-bottom:26px}
.drawer[data-disposition="needs validation"] .drawer-band::after{content:"";position:absolute;left:0;right:0;bottom:0;height:12px;background:repeating-linear-gradient(-45deg,var(--ink) 0 2px,transparent 2px 7px);border-top:2px solid var(--ink)}
.drawer[data-disposition="disputed"] .drawer-band{box-shadow:inset 0 -12px 0 var(--purple);padding-bottom:26px}
.drawer[data-disposition="rejected"] .drawer-band{background:var(--grey-lt);color:var(--ink)}
.drawer-sev{font:900 54px/.78 var(--sans);letter-spacing:-.06em}
.drawer-sevtext{display:flex;flex-direction:column;gap:6px;font:800 11px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase}
.drawer-id{font:700 12px/1 var(--mono);letter-spacing:0;text-transform:none}
.drawer-nav{margin-left:auto;display:flex;align-items:center;gap:4px}
.drawer-step{width:34px;height:34px;border:2px solid currentColor;background:transparent;color:inherit;font:900 15px/1 var(--sans);cursor:pointer}
.drawer-step:hover:not(:disabled){background:var(--ink);color:var(--paper);border-color:var(--ink)}
.drawer-pos{min-width:46px;text-align:center;font:900 12px/1 var(--sans);font-variant-numeric:tabular-nums}
.drawer-close{flex:none;width:42px;height:42px;border:0;background:var(--ink);color:var(--paper);font:300 30px/1 var(--sans);cursor:pointer}
.drawer-close:hover{background:var(--paper);color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink)}
.drawer-scroll{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:22px 24px 56px}
.drawer-note{margin-bottom:14px;padding:8px 10px;background:var(--p2);font:800 12px/1.3 var(--sans)}
.drawer-title{font:800 25px/1.12 var(--sans);letter-spacing:-.03em}
.drawer-title:focus{outline:none}
.drawer[data-disposition="rejected"] .drawer-title{text-decoration:line-through;text-decoration-thickness:2px;text-decoration-color:rgba(10,10,10,.5)}
.drawer-disp{display:flex;align-items:center;gap:8px;margin:14px 0 18px;font:900 12px/1 var(--sans);letter-spacing:.12em;text-transform:uppercase}
.drawer-meta{display:grid;grid-template-columns:112px minmax(0,1fr);margin:0 0 18px;border-top:3px solid var(--ink)}
.drawer-meta dt,.drawer-meta dd{margin:0;padding:10px 0;border-bottom:1px solid var(--line)}
.drawer-meta dt{font:800 9.5px/1.6 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.drawer-meta dd{font-size:14px;line-height:1.4;min-width:0}
.chips{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px}
.pr-ref{display:inline-flex;align-items:center;gap:8px;min-width:0}
.pr-ref-title{font-size:13px;color:var(--muted)}
.impact{display:flex;flex-direction:column;gap:6px}
.impact-line{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.who{display:flex;flex-wrap:wrap;gap:6px 14px}
.who-item{display:inline-flex;align-items:center;gap:6px;font-weight:700}
.tag-chip{height:24px;padding:0 8px;border:2px solid var(--ink);background:var(--paper);font:700 11.5px/1 var(--mono);cursor:pointer}
.tag-chip:hover,.tag-chip[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.conf{display:inline-flex;align-items:center;gap:5px;font:800 10px/1 var(--sans);letter-spacing:.12em;text-transform:uppercase;white-space:nowrap}
.conf-bars{display:inline-flex;align-items:flex-end;gap:2px}
.conf-bars i{width:4px;background:var(--line)}
.conf-bars i:nth-child(1){height:5px}.conf-bars i:nth-child(2){height:8px}.conf-bars i:nth-child(3){height:11px}
.conf-bars i.on{background:var(--ink)}
.drawer .finding-actions{display:flex;gap:8px;margin-bottom:8px}
.drawer .finding-fields{display:grid;grid-template-columns:112px minmax(0,1fr);border-top:3px solid var(--ink);margin-top:14px}
.drawer .finding-fields dt,.drawer .finding-fields dd{margin:0;padding:12px 0;border-bottom:1px solid var(--line)}
.drawer .finding-fields dt{line-height:1.6}
.drawer .finding-fields dd{font-size:14.5px;line-height:1.5}
.drawer .finding-fields dd[data-field="impact"],.drawer .finding-fields dd[data-field="recommendation"]{font-weight:700}

/* Full screen (f): the drawer takes the viewport; content sits in a centred reading column */
html[data-drawer-full] body{overflow:hidden}
html[data-drawer-full] .drawer{--gutter:max(24px,calc(50% - 540px));border-left:0;box-shadow:none}
html[data-drawer-full] .drawer-band{min-height:96px;padding-left:var(--gutter);padding-right:var(--gutter)}
html[data-drawer-full] .drawer-scroll{padding:30px var(--gutter) 64px}
html[data-drawer-full] .drawer-dock{padding:14px var(--gutter) 16px}
html[data-drawer-full] .drawer-title{font-size:clamp(28px,2.6vw,38px);line-height:1.08;max-width:32em}
html[data-drawer-full] :is(.drawer-meta,.drawer .finding-fields){grid-template-columns:150px minmax(0,1fr)}
html[data-drawer-full] .drawer .finding-fields dd{font-size:15.5px}
html[data-drawer-full] .drawer .finding-fields pre{font-size:12.5px}
html[data-drawer-full] .drawer-dock .answer{display:grid;grid-template-columns:minmax(0,auto) minmax(0,1fr);align-items:start;gap:12px 24px}
html[data-drawer-full] .drawer-dock .answer-head{flex-direction:column;align-items:flex-start}
.drawer-full{position:relative}
.drawer-full::before{content:"";position:absolute;inset:8px;--c:currentColor;background:linear-gradient(var(--c),var(--c)) 0 0/5px 2px,linear-gradient(var(--c),var(--c)) 0 0/2px 5px,linear-gradient(var(--c),var(--c)) 100% 0/5px 2px,linear-gradient(var(--c),var(--c)) 100% 0/2px 5px,linear-gradient(var(--c),var(--c)) 0 100%/5px 2px,linear-gradient(var(--c),var(--c)) 0 100%/2px 5px,linear-gradient(var(--c),var(--c)) 100% 100%/5px 2px,linear-gradient(var(--c),var(--c)) 100% 100%/2px 5px;background-repeat:no-repeat}
.drawer-full[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}

/* Keyboard cheatsheet (?) */
.shortcut-overlay{background:rgba(10,10,10,.42)}
.shortcut-sheet{padding:0;border:3px solid var(--ink);background:var(--paper);color:var(--ink);box-shadow:12px 12px 0 var(--ink)}
.shortcut-head{margin:0;padding:12px 12px 12px 22px;border-bottom:3px solid var(--ink)}
.shortcut-title{font:900 28px/1 var(--sans);letter-spacing:-.04em}
.shortcut-close{width:40px;height:40px;background:var(--ink);color:var(--paper);font:300 28px/1 var(--sans)}
.shortcut-close:hover{background:var(--paper);color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink)}
.shortcut-sheet>.shortcut-groups{padding:18px 22px 4px}
.shortcut-group-title{font:800 10px/1.2 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);opacity:1;padding-bottom:6px;border-bottom:2px solid var(--ink)}
.shortcut-group dl{font-size:13.5px}
.shortcut-group dd{line-height:1.35}
.shortcut-foot{margin:0;padding:10px 22px 16px;font-size:12px;color:var(--muted);opacity:1}
.shortcuts .shortcut-group dl{font-size:12.5px}
.shortcuts-open{height:28px;padding:0 10px;border:2px solid var(--ink);background:var(--paper);font:800 10.5px/1 var(--sans);letter-spacing:.08em;text-transform:uppercase}
.shortcuts-open:hover{background:var(--ink);color:var(--paper)}

/* Answer dock: always visible at the foot of the drawer while the evidence scrolls */
.drawer-dock{flex:none;padding:12px 24px 14px;border-top:3px solid var(--ink);background:var(--paper)}
.answer{display:flex;flex-direction:column;gap:9px}
.answer-legend,.answer-comment-label{font:800 10px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.answer-comment-label{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.answer-choice{border:2px solid var(--ink)}
.answer-option{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 14px;border:0;background:var(--paper);color:var(--ink);font:900 12px/1 var(--sans);letter-spacing:.1em;text-transform:uppercase}
.answer-option+.answer-option{border-left:2px solid var(--ink)}
.answer-option:hover{background:var(--wash-2)}
.answer-option:focus-visible{outline-offset:-5px}
.answer-mark{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border:2px solid currentColor;font-size:10px}
.answer-option[aria-pressed="false"] .answer-mark{color:var(--faint)}
.answer-option[data-answer-value="fix"][aria-pressed="true"]{background:var(--green);color:var(--ink)}
.answer-option[data-answer-value="ignore"][aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.answer-note{font-size:12px;line-height:1.3;color:var(--muted)}
.answer[data-answer="ignore"] .answer-note{color:var(--ink);font-weight:700}
.answer-input{padding:8px 10px;border:2px solid var(--ink);border-radius:0;background:var(--paper);color:var(--ink);font:500 13.5px/1.4 var(--sans);max-height:32vh}
.answer-input::placeholder{color:var(--faint)}
.answer-input:focus{outline:3px solid var(--ink);outline-offset:0}
.answer-input:not(:placeholder-shown){background:#fffbe8}
.strip-a .copy-answers{margin-left:auto}
@media screen and (min-width:1181px){.strip-a .result-count{display:none}}
.copy-answers{display:inline-flex;align-items:center;gap:10px;height:36px;padding:0 12px;border:2px solid var(--ink);background:var(--ink);color:var(--paper);font:800 11px/1 var(--sans);letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}
.copy-answers:hover:not(:disabled){background:var(--paper);color:var(--ink)}
.copy-answers-count{padding-left:10px;border-left:2px solid currentColor;font-weight:900;letter-spacing:.02em;text-transform:none;font-variant-numeric:tabular-nums}
.answer-summary{font:800 13px/1.3 var(--sans);font-variant-numeric:tabular-nums}
.bulk-answers{gap:6px}
.bulk-answer{height:28px;padding:0 9px;font-size:10.5px}
.more-note{font-size:12px;line-height:1.35;color:var(--muted);max-width:32ch}
.facet-answer .facet-swatch{display:block;width:12px;height:12px;border:2px solid currentColor}
.facet-answer[data-value="fix"] .facet-swatch{background:var(--green)}
.facet-answer[data-value="ignore"] .facet-swatch{background:var(--hatch-warn),var(--grey-lt)}
.facet-answer[aria-pressed="true"][data-value="fix"]{background:var(--green);color:var(--ink)}
.resize-handle{color:var(--ink);left:-8px}
.resize-handle::after{opacity:.35}

/* ── Team ── */
.team{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));border-top:2px solid var(--ink);border-left:2px solid var(--ink)}
.rv-card{display:flex;flex-direction:column;min-width:0;background:var(--paper);border-right:2px solid var(--ink);border-bottom:2px solid var(--ink)}
.rv-status{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:44px;padding:10px 18px;font:900 14px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase}
.rv-status small{font:700 11px/1.2 var(--sans);letter-spacing:.02em;text-transform:none;text-align:right}
.rv-card[data-tone="ok"] .rv-status{background:var(--ink);color:var(--paper)}
.rv-card[data-tone="bad"] .rv-status{background:var(--p0);color:#fff}
.rv-card[data-tone="warn"] .rv-status{background:var(--amber);color:var(--ink)}
.rv-card[data-tone="idle"] .rv-status{background:var(--grey-lt) var(--hatch-soft);color:var(--ink)}
.rv-inner{display:flex;flex-direction:column;gap:14px;flex:1;padding:18px 18px 20px}
.rv-head{display:flex;align-items:center;gap:10px}
.rv-head .rv{min-width:30px;height:28px;font-size:11px}
.rv-name{font:900 28px/.92 var(--sans);letter-spacing:-.045em}
.rv-model{font:600 12.5px/1.35 var(--mono);overflow-wrap:anywhere}
.rv-stats{display:flex;border:2px solid var(--ink)}
.rv-stat{flex:1;display:flex;align-items:flex-end;gap:8px;padding:8px 10px}
.rv-stat+.rv-stat{border-left:2px solid var(--ink)}
.rv-stat b{font:900 28px/.8 var(--sans);letter-spacing:-.05em}
.rv-stat span{font:800 9.5px/1.2 var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.rv-kv{display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:16px;margin:0;border-top:3px solid var(--ink)}
.rv-kv dt,.rv-kv dd{margin:0;padding:7px 0;border-bottom:1px solid var(--line)}
.rv-kv dt{font:800 9.5px/1.7 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.rv-kv dd{font:500 12.5px/1.4 var(--mono);overflow-wrap:anywhere}
.rv-prov{font-size:13.5px;line-height:1.45}
.rv-prov .kicker,.rv-limits .kicker{margin-bottom:5px;color:var(--muted)}
.rv-limits{padding:10px 12px;border-left:6px solid var(--amber);background:#fff6dc;font-size:13.5px;line-height:1.45}
.rv-output{margin-top:auto}
.rv-output>summary{list-style:none;height:28px;width:max-content}
.rv-output>summary::-webkit-details-marker{display:none}
.rv-output>summary::before{content:"+";font-size:14px}
.rv-output[open]>summary::before{content:"−"}
.rv-output pre{margin:10px 0 0;max-height:320px;overflow:auto;padding:12px 14px;background:var(--ink);color:#efefea;font:500 12px/1.55 var(--mono);white-space:pre-wrap;overflow-wrap:anywhere}

/* ── Scope & follow-up ── */
.target{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));margin-bottom:36px;border-top:2px solid var(--ink);border-left:2px solid var(--ink)}
.kv-tile{display:flex;flex-direction:column;gap:8px;min-width:0;padding:13px 16px 16px;background:var(--paper);border-right:2px solid var(--ink);border-bottom:2px solid var(--ink)}
.kv-tile .kicker{color:var(--muted)}
.kv-val{font:700 15px/1.38 var(--sans);letter-spacing:-.01em;overflow-wrap:anywhere}
.lists{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:6px solid var(--ink)}
.list-col{position:relative;min-width:0;padding:18px 26px 6px 0}
.list-col+.list-col{padding-left:26px;border-left:2px solid var(--ink)}
.list-col[data-kind="gaps"]::before{content:"";position:absolute;left:0;right:0;top:-6px;height:6px;background:var(--hazard)}
.lc-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:14px}
.lc-head h3{font:900 24px/1 var(--sans);letter-spacing:-.04em}
.lc-n{font:900 24px/1 var(--sans);letter-spacing:-.04em;color:var(--faint)}
.list-col ol{list-style:none;margin:0;padding:0;counter-reset:li}
.list-col li{counter-increment:li;display:grid;grid-template-columns:32px minmax(0,1fr);gap:8px;padding:10px 0;border-top:1px solid var(--line);font-size:14px;line-height:1.45}
.list-col li::before{content:counter(li,decimal-leading-zero);font:900 13px/1.6 var(--sans)}
.list-none{padding:10px 0;border-top:1px solid var(--line);font-size:14px;color:var(--faint)}
.notes{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:24px;margin-top:40px}
.note{padding-top:14px;border-top:6px solid var(--ink)}
.note h3{margin-bottom:8px;font:900 18px/1.15 var(--sans);letter-spacing:-.02em}
.note p{font-size:14px;line-height:1.5;color:#2b2b28}
.sources{margin-top:40px}
.sources ul{list-style:none;margin:10px 0 0;padding:0;border-top:2px solid var(--ink)}
.sources li{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px;padding:10px 0;border-bottom:1px solid var(--line)}
.sources a{font-weight:800}
.sources a::after{content:" ↗"}
.src-url{font:500 11.5px/1.3 var(--mono);color:var(--muted);overflow-wrap:anywhere;min-width:0}

/* ── Footer ── */
.foot{display:flex;flex-wrap:wrap;align-items:flex-start;gap:12px 30px;padding:22px var(--pad) 44px;font-size:12px;color:var(--muted)}
.foot b{color:var(--ink)}
.foot .shortcuts{margin-left:auto}

/* ── Responsive ── */
@media screen and (max-width:1180px){
  .strip-toggle{display:inline-flex}
  .strip:not(.is-open) .strip-body{display:none}
  .strip.is-open .strip-body{max-height:calc(100vh - 150px);overflow:auto}
  .search-input{width:clamp(160px,22vw,260px)}
  .hero{grid-template-columns:minmax(220px,28%) minmax(0,1fr)}
  .tiles{grid-template-columns:repeat(3,minmax(0,1fr))}
  .metric:nth-child(3){border-right:0}
  .metric-sev{grid-column:1/-1;border-top:2px solid var(--ink);padding-left:28px}
  .map-grid{--gx:40px;--trunk-w:92px;--card-min:236px}
  .train-tools .btn{order:1;margin-left:auto}
  .train-tools .legend{order:2;width:100%;margin-left:0}
  .deck{grid-template-columns:minmax(0,1fr);border-top:0}
  .rail{position:static;max-height:none;overflow:visible;padding:20px 0 24px;border-right:0;border-bottom:2px solid var(--ink)}
  .deck-main{padding:20px 0 24px}
  .plan{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));column-gap:24px}
  .step::before{display:none}
  .step{padding-bottom:18px}
  .lists{grid-template-columns:repeat(2,minmax(0,1fr))}
  .list-col:nth-child(3){grid-column:1/-1;padding-left:0;border-left:0;border-top:2px solid var(--ink);margin-top:16px}
}
@media screen and (max-width:760px){
  body{font-size:14.5px}
  .topbar{gap:6px 14px}
  .topbar-meta{order:3;width:100%}
  .hero{grid-template-columns:1fr}
  .status-tile{grid-row:auto;padding:18px var(--pad);border-right:0;border-bottom:2px solid var(--ink)}
  .status-word{font-size:min(54px,calc(120cqi / var(--len)))}
  .status-tile[data-status="incomplete"]{padding-top:38px}
  .hero-main{padding:18px var(--pad) 20px}
  .tiles{grid-template-columns:repeat(3,minmax(0,1fr))}
  .metric,.metric:first-child{padding:12px 10px 12px;border-bottom:2px solid var(--ink)}
  .metric:first-child{padding-left:var(--pad)}
  .metric:nth-child(3){border-right:0}
  .metric .kicker{font-size:9px;letter-spacing:.1em}
  .metric-note{font-size:11px}
  .metric-sev{grid-column:1/-1;border-top:0;border-bottom:0;padding-left:var(--pad)!important;padding-right:var(--pad)}
  .metric-value{font-size:34px}
  .section{padding:26px var(--pad) 32px}
  .sec-aside{margin-left:0;align-items:flex-start;text-align:left;width:100%}
  .train-hint[data-swipe]::after{content:" Swipe sideways to see the whole stack."}
  .map-grid{--gx:30px;--gy:16px;--trunk-w:62px;--card-min:228px;--card-max:228px;--band-h:42px}
  .trunk-tile{padding:12px 8px}
  .trunk-name{font-size:15px}
  .trunk-hint{font-size:8.5px}
  .st-body{padding:10px 12px 11px}
  .st-num{font-size:26px}
  .st-level{font-size:13px}
  .train-alarm{font-size:12.5px}
  .train-alarm::before{width:22px}
  .strip{padding:8px var(--pad)}
  .strip:not(.is-open) .strip-presets{display:none}
  .strip-a{gap:8px}
  .strip-a>*{order:4}
  .strip-a .strip-toggle{order:1}
  .strip-a .strip-ctx{order:2;flex:1 1 auto}
  .strip-ctx>span:first-child{display:none}
  .strip-a .reset{order:3;height:32px}
  .strip-a .more-toggle{order:3}
  .strip-a :is(.btn,.reset){padding:0 9px}
  .strip-a .search-input{order:5;flex:1 1 180px;width:auto}
  .strip-a .result-count{order:6}
  .strip-a .strip-spacer{display:none}
  .strip-presets{order:5;width:100%}
  .presets{display:grid;grid-template-columns:1fr 1fr;gap:4px}
  .preset{margin:0;height:32px}
  .strip-b{flex-direction:column;align-items:stretch}
  .more-panel{grid-template-columns:1fr}
  .row{grid-template-columns:40px minmax(0,1fr);column-gap:10px}
  .row-sev{grid-row:1 / span 2}
  .row-sev small{display:none}
  .row-main{padding-right:40px}
  .row-side{grid-column:2;justify-content:flex-start;padding:0 8px 9px 0}
  .row-sub code{max-width:100%}
  .row-details>.finding-fields{grid-template-columns:1fr;margin:0 10px 12px 50px}
  .row-details .finding-fields dt{padding-bottom:0;border-bottom:0}
  .row-details .finding-fields dd{padding-top:4px}
  .g-tile{min-width:48px;height:32px;font-size:15px}
  .g-meta{display:none}
  .group-head{gap:8px}
  .group-head .rd-chip{height:22px;padding-right:6px;font-size:9px;letter-spacing:.08em}
  .group-head .rd-chip .signal{display:none}
  .group-head .rd-chip[data-level]{padding-left:6px}
  .drawer{width:100%;border-left:0}
  .drawer-band{padding-left:16px;gap:10px}
  .drawer-sev{font-size:42px}
  .drawer-scroll{padding:18px 16px 48px}
  .drawer-dock{padding:10px 16px 12px}
  html[data-drawer-full] .drawer-dock .answer{display:flex}
  html[data-drawer-full] :is(.drawer-meta,.drawer .finding-fields){grid-template-columns:1fr}
  .copy-answers{height:32px}
  .plan-toggle{margin-left:0}
  .drawer-meta,.drawer .finding-fields{grid-template-columns:1fr}
  .drawer-meta dt,.drawer .finding-fields dt{padding-bottom:0;border-bottom:0}
  .drawer-meta dd,.drawer .finding-fields dd{padding-top:4px}
  .lists{grid-template-columns:1fr}
  .list-col,.list-col+.list-col,.list-col:nth-child(3){padding:16px 0 6px;border-left:0;margin-top:0}
  .list-col+.list-col{border-top:2px solid var(--ink)}
  .empty-state{grid-template-columns:1fr}
  .empty-zero{border-right:0;border-bottom:3px solid var(--ink);padding:16px 20px 20px;font-size:110px}
  .empty-copy{padding:20px 20px 22px}
  .nomatch{padding:24px 20px}
  .foot .shortcuts{margin-left:0}
}

/* ── Print: the train as an ordered list, then every shown finding with full fields ── */
@media print{
  @page{margin:12mm}
  :root{--pad:0px}
  body{font-size:10pt}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .print-only{display:block}
  .strip,.drawer,.why,.view-pop,.train-tools,.map-scroll,.rail,.row-details>summary,.finding-actions,.foot .shortcuts,.nomatch-actions,.g-chev,.st-link{display:none!important}
  :focus,:focus-visible{outline:none!important}
  .topbar{padding:0 0 6px}
  .hero{grid-template-columns:28% minmax(0,1fr)}
  .status-tile{padding:12px}
  .hero-main{padding:12px 0 14px 16px}
  .verdict{font-size:20pt}
  .summary{font-size:10pt}
  .tiles{grid-template-columns:repeat(3,minmax(0,1fr))}
  .metric:nth-child(3){border-right:0}
  .metric-sev{grid-column:1/-1;border-top:2px solid var(--ink)}
  .metric-value{font-size:26pt}
  .section{padding:16px 0 18px;border-bottom:1.5pt solid #000}
  .sec-head{margin-bottom:10px;break-inside:avoid;break-after:avoid}
  .sec-title{font-size:22pt}
  .print-train{margin:0;padding:0;list-style:none;border-top:2px solid var(--ink);counter-reset:pt}
  .print-train li{counter-increment:pt;display:grid;grid-template-columns:28px 64px minmax(0,1fr) auto;gap:4px 10px;align-items:baseline;padding:6px 0;border-bottom:1px solid #999;break-inside:avoid}
  .print-train li::before{content:counter(pt,decimal-leading-zero);font-weight:900}
  .print-train .pt-num{font-weight:900;font-size:12pt}
  .print-train .pt-why{grid-column:3 / -1;font:9pt var(--mono);color:#333}
  .train-foot{margin-top:8px}
  .deck{display:block;border:0}
  .deck-main{padding:0}
  .group-head{background:none;padding:8px 0 4px;border-bottom:1.5pt solid #000;break-after:avoid}
  .row{break-inside:avoid;grid-template-columns:44px minmax(0,1fr) auto;box-shadow:none!important;background:none!important}
  .row[data-ignored]>:not(.row-details,.row-side){opacity:.6}
  .row-side{padding-right:6px}
  .row-sub code{white-space:normal}
  .row-details>.finding-fields{margin:0 0 8px 58px;grid-template-columns:120px minmax(0,1fr)}
  .finding-fields pre{background:#fff;border-left-width:2px}
  .block-note{background:none}
  .team,.target{border:0;gap:8px}
  .team{grid-template-columns:repeat(2,minmax(0,1fr))}
  .rv-card,.kv-tile{break-inside:avoid;border:1.5pt solid var(--ink)}
  .rv-output pre{max-height:none;background:#fff;color:#000;border:1px solid #000}
  .lists{grid-template-columns:1fr 1fr 1fr}
  .empty-zero{font-size:72pt;padding:10px 14px}
  .empty-copy{padding:14px 18px}
}
</style>
</head>
<body>
<noscript>This report renders with JavaScript. The full report data is embedded in this file.</noscript>
<div id="app"></div>
<script type="application/json" id="report-data">@@DATA@@</script>
<script>@@CORE_JS@@</script>
<script>
(() => {
  'use strict';
  const app = MultiAgentReview.create();
  const { h, ui, data, state, stack } = app;
  const C = app.constants;
  const SEVS = C.SEVERITIES;
  const SEV_LABEL = C.SEVERITY_LABELS;
  const DISPS = C.DISPOSITIONS;
  const DISP_LABEL = { confirmed: 'Confirmed', 'needs validation': 'Needs validation', disputed: 'Disputed', rejected: 'Rejected' };
  const findings = app.findings;
  const hasFindings = findings.length > 0;
  const hasStack = app.hasStack;
  const soloPR = app.soloPR; // a one-PR review: no train, the PR is the review target
  const BAD = ['failed', 'timed_out', 'unavailable', 'cancelled'];
  const WARN = ['stale', 'running'];
  const TARGET = '(target)';
  const NOT_A_DECISION = 'Derived from review findings, not a merge decision.';
  const LEVEL = {
    blocked: { label: 'Blocked', lead: 'Blocked by' },
    attention: { label: 'Attention', lead: 'Needs attention' },
    clear: { label: 'Clear', lead: 'Clear' },
    none: { label: 'No findings recorded', lead: 'No findings recorded' },
  };
  const HARD = new Set(['confirmed', 'needs validation']);

  const plural = (n, one, many) => `${n} ${n === 1 ? one : (many || `${one}s`)}`;
  const lower = (v) => String(v == null ? '' : v).trim().toLowerCase();
  const kicker = (text) => h('span', { class: 'kicker' }, text);
  const swatch = (d) => h('span', { class: 'disp-sw', dataset: { disposition: d }, 'aria-hidden': 'true' });
  const statusText = (s) => String(s).replace(/_/g, ' ');
  const rankIn = (list, v) => { const i = list.indexOf(v); return i < 0 ? list.length : i; };
  const bySeverity = (a, b) => rankIn(SEVS, a.severity) - rankIn(SEVS, b.severity) || rankIn(DISPS, a.disposition) - rankIn(DISPS, b.disposition)
    || String(a.id).localeCompare(String(b.id), undefined, { numeric: true });
  const tally = (list) => { const row = { total: 0, P0: 0, P1: 0, P2: 0, P3: 0 }; list.forEach((f) => { row.total += 1; row[f.severity] += 1; }); return row; };
  const prLabel = (id) => (id === TARGET ? (soloPR ? app.prLabel(soloPR.id) : 'Target') : app.prLabel(id));
  const labels = (ids) => ids.map(prLabel).join(' · ');
  const selectedPRs = () => [...state.pr].filter((id) => stack.byId.has(id));
  const OTHER_FACETS = C.FACETS.filter((k) => k !== 'pr');
  const otherFilters = () => Boolean(state.q || state.pinnedOnly || OTHER_FACETS.some((k) => state[k].size));

  /* The review target when there is no stack; its dossier stands in for the train. */
  const target = (() => {
    const prefer = ['repository', 'repo', 'artifact', 'workspace', 'project', 'document', 'plan', 'branch', 'scope', 'target'];
    for (const key of prefer) {
      const hit = data.target.find(([k]) => lower(k) === key) || data.target.find(([k]) => lower(k).startsWith(key));
      if (hit) return { kind: hit[0], label: hit[1] };
    }
    return { kind: 'Review target', label: data.title };
  })();

  /* ── Readiness: every finding the user has not ignored, ignoring filters; rejected never counts ── */
  function classify(f) {
    if (f.disposition === 'rejected') return null;
    if ((f.severity === 'P0' || f.severity === 'P1') && HARD.has(f.disposition)) return 'blocked';
    if (f.disposition === 'disputed' || (f.severity === 'P2' && HARD.has(f.disposition))) return 'attention';
    return 'open';
  }
  let ready = new Map();
  function summarize(list, source) {
    const reason = (f) => ({ f, kind: classify(f), from: source(f) });
    const order = (a, b) => bySeverity(a.f, b.f) || (a.from ? 1 : 0) - (b.from ? 1 : 0);
    const blockers = list.filter((f) => classify(f) === 'blocked').map(reason).sort(order);
    const attention = list.filter((f) => classify(f) === 'attention').map(reason).sort(order);
    const level = !hasFindings ? 'none' : blockers.length ? 'blocked' : attention.length ? 'attention' : 'clear';
    return {
      level, blockers, attention,
      own: list.filter((f) => !source(f)), inherited: list.filter((f) => source(f)),
      reasons: level === 'blocked' ? blockers : level === 'attention' ? attention : [],
    };
  }
  function computeReadiness() {
    ready = new Map();
    const live = findings.filter((f) => !app.isIgnored(f.id) && f.disposition !== 'rejected');
    if (!hasStack) { ready.set(TARGET, summarize(live, () => null)); return; }
    for (const n of stack.order) {
      const below = stack.ancestors(n.id);
      const lineage = new Set([n.id, ...below]);
      const source = (f) => (f.prs.includes(n.id) ? null : below.find((a) => f.prs.includes(a)) || null);
      ready.set(n.id, summarize(live.filter((f) => f.prs.some((p) => lineage.has(p))), source));
    }
  }
  const reasonText = (r) => `${r.f.id} (${r.f.severity} ${r.f.disposition}, ${r.from ? `from ${prLabel(r.from)}` : 'own'})`;
  function describe(id) {
    const r = ready.get(id);
    const lead = r.level === 'blocked' || r.level === 'attention'
      ? `${LEVEL[r.level].label}: ${r.reasons.map(reasonText).join(', ')}.`
      : r.level === 'clear' ? 'Clear: no blocking or attention findings here or below.' : 'No findings recorded.';
    return `${lead} ${plural(r.own.length, 'own open finding')}, ${r.inherited.length} inherited. ${NOT_A_DECISION}`;
  }
  const signal = () => h('span', { class: 'signal', 'aria-hidden': 'true' }, h('i'), h('i'), h('i'));
  const levelChip = (level, extra) => h('span', { class: 'rd-chip', dataset: { level }, title: `${LEVEL[level].label}. ${extra ? `${extra} ` : ''}${NOT_A_DECISION}` },
    signal(), h('span', { class: 'rd-label' }, LEVEL[level].label));
  const legendItems = () => [
    h('li', null, levelChip('blocked'), h('span', null, 'P0/P1 confirmed or unvalidated')),
    h('li', null, levelChip('attention'), h('span', null, 'disputed, or P2 confirmed/unvalidated')),
    h('li', null, levelChip('clear'), h('span', null, hasStack ? 'neither, here or below' : 'neither'))];
  function alarm() {
    if (data.status !== 'incomplete') return null;
    const short = data.reviewers.filter((r) => r.status !== 'completed');
    return h('div', { class: 'train-alarm', role: 'note' }, h('p', null, `Review incomplete. Readiness reflects only the findings recorded so far${short.length ? `; not completed: ${short.map((r) => `${r.name} (${statusText(r.status)})`).join(', ')}` : ''}. A clear signal is not clearance.`));
  }

  /** Re-render a region outside core's notify() while keeping keyboard focus on the same control. */
  function keepFocus(fn) {
    const active = document.activeElement;
    const key = active && active.dataset ? active.dataset.focusKey : null;
    fn();
    app.sync();
    if (key && (!document.activeElement || document.activeElement === document.body)) {
      const el = document.querySelector(`[data-focus-key="${CSS.escape(key)}"]`);
      if (el) el.focus({ preventScroll: true });
    }
  }

  function confidence(value) {
    const v = lower(value);
    const level = v === 'high' ? 3 : v === 'medium' ? 2 : v === 'low' ? 1 : 0;
    return h('span', { class: 'conf', title: `${value} confidence` },
      h('span', { class: 'conf-bars', 'aria-hidden': 'true' }, [1, 2, 3].map((i) => h('i', { class: i <= level ? 'on' : null }))),
      h('span', null, value || 'Unknown'), h('span', { class: 'sr-only' }, ' confidence'));
  }
  const secHead = (id, title, aside) => h('div', { class: 'sec-head' },
    h('span', { class: 'sec-num', 'aria-hidden': 'true' }),
    h('h2', { class: 'sec-title', id, tabindex: '-1' }, title),
    aside ? h('div', { class: 'sec-aside' }, aside) : null);

  /* ── Station selection: one PR plus everything below it; shift-click compares ── */
  let deckSection = null;
  function selectStation(id, event, opts) {
    const add = event && (event.shiftKey || event.altKey);
    const current = selectedPRs();
    let next;
    if (add) next = current.includes(id) ? current.filter((x) => x !== id) : current.concat(id);
    else next = current.length === 1 && current[0] === id ? [] : [id];
    if (next.length) state.prInherited = true;
    app.setFacet('pr', next);
    if (opts && opts.reveal && !add && next.length && deckSection) {
      const top = deckSection.getBoundingClientRect().top;
      if (top > innerHeight * 0.55) {
        deckTitle.focus({ preventScroll: true });
        const smooth = !matchMedia('(prefers-reduced-motion: reduce)').matches;
        deckSection.scrollIntoView({ behavior: smooth ? 'smooth' : 'auto', block: 'start' });
        // Some embedded or background browsers never run the smooth animation; jump if it did not start.
        if (smooth) setTimeout(() => { if (Math.abs(deckSection.getBoundingClientRect().top - top) < 4) deckSection.scrollIntoView({ block: 'start' }); }, 450);
      }
    }
  }
  const wholeStack = () => { state.prInherited = false; app.setFacet('pr', []); };
  const prChip = (id) => {
    const node = stack.byId.get(id);
    return h('button', { type: 'button', class: 'pr-chip', title: node ? `${node.title} — open this station` : 'Open this station', dataset: { pr: id },
      onclick: (e) => { e.stopPropagation(); selectStation(id, e); } }, prLabel(id));
  };

  /* ── Top bar ── */
  function buildTopbar() {
    let pop = null;
    if (!hasFindings) {
      pop = h('details', { class: 'view-pop no-print' }, h('summary', null, 'View'),
        h('div', { class: 'view-panel' }, ui.sections(sectionDefs), ui.print('Print / PDF')));
      document.addEventListener('click', (event) => { if (pop.open && !pop.contains(event.target)) pop.open = false; });
      document.addEventListener('keydown', (event) => { if (event.key === 'Escape' && pop.open) pop.open = false; });
    }
    const snap = data.snapshot_id
      ? h('span', { class: 'topbar-snap', title: 'Reviewed snapshot' }, `snapshot ${data.snapshot_id} · ${data.snapshot_verified === true ? 'verified' : 'unverified'}`)
      : null;
    return h('header', { class: 'topbar' },
      h('span', { class: 'brand' }, h('span', { class: 'brand-mark', 'aria-hidden': 'true' }, h('i'), h('i'), h('i')), 'Multi-agent review · Merge train'),
      h('span', { class: 'topbar-meta' }, `Generated ${data.generated_at}`),
      snap,
      pop ? h('span', { class: 'topbar-tools' }, pop) : null);
  }

  /* ── Hero: status tile, verdict, slim metric tiles ── */
  let heroBar = null;
  let heroSegs = [];
  function buildHero() {
    const word = { complete: 'Complete', incomplete: 'Incomplete', setup: 'Setup' }[data.status] || data.status;
    const total = data.reviewers.length;
    const done = data.meta.completed;
    const short = data.reviewers.filter((r) => r.status !== 'completed');
    const all = tally(findings);
    heroSegs = SEVS.filter((s) => all[s]).map((s) => h('button', {
      type: 'button', class: 'herobar-seg', 'aria-pressed': 'false', style: `flex-grow:${all[s]}`,
      title: `${all[s]} ${s} ${SEV_LABEL[s]}. Click to filter; shift-click to show only ${s}.`,
      dataset: { severity: s, focusKey: `hero:${s}` },
      onclick: (event) => app.toggle('severity', s, event.shiftKey || event.altKey),
    }, h('span', { class: 'k' }, s), h('span', { class: 'n' }, String(all[s]))));
    heroBar = all.total
      ? h('div', { class: 'herobar', role: 'group', 'aria-label': 'Findings by severity; click to filter' }, heroSegs)
      : h('div', { class: 'herobar is-empty' }, 'No findings recorded');
    const metric = (label, value, note, flags, extra) => h('div', { class: 'metric', dataset: flags || {} },
      kicker(label), h('div', { class: 'metric-row' }, h('div', { class: 'metric-value' }, value), extra || null), note ? h('p', { class: 'metric-note' }, note) : null);
    return h('div', { class: 'hero' },
      h('div', { class: 'status-tile', dataset: { status: data.status } },
        kicker('Review status'),
        h('p', { class: 'status-word', style: `--len:${Math.max(4.6, word.length)}` }, word),
        h('p', { class: 'status-note' }, data.meta.status_note)),
      h('div', { class: 'hero-main' },
        h('h1', { class: 'hero-title' }, data.title),
        h('p', { class: 'verdict' }, data.verdict),
        data.summary ? h('p', { class: 'summary' }, data.summary) : null),
      h('div', { class: 'tiles' },
        metric('Reviewers completed', [String(done), h('small', null, `/${total}`)],
          short.length ? `Not completed: ${short.map((r) => `${r.name} (${statusText(r.status)})`).join(', ')}` : 'Every requested reviewer finished.',
          done < total ? { warn: '' } : null),
        metric('Confirmed', String(data.meta.confirmed), hasFindings ? `of ${plural(findings.length, 'finding')}` : 'Nothing to confirm yet'),
        metric('Unresolved', String(data.meta.unresolved), 'Disputed or needs validation', data.meta.unresolved ? { hatch: '' } : null),
        h('div', { class: 'metric metric-sev' }, kicker('Findings by severity'),
          h('div', { class: 'metric-row' }, h('div', { class: 'metric-value' }, String(all.total)), heroBar))));
  }
  function refreshHero() {
    if (!heroBar) return;
    heroBar.toggleAttribute('data-filtered', state.severity.size > 0);
    heroSegs.forEach((b) => b.setAttribute('aria-pressed', String(state.severity.has(b.dataset.severity))));
  }

  /* ── Station explainer (hover / focus) ── */
  const why = h('div', { class: 'why no-print', 'aria-hidden': 'true', hidden: true });
  function whyContent(id) {
    const r = ready.get(id);
    const node = stack.byId.get(id);
    const name = node ? `${prLabel(id)} ${node.title}` : target.label;
    const items = r.reasons.slice(0, 5).map((x) => h('li', null,
      h('span', { class: 'sev-tag', dataset: { severity: x.f.severity } }, x.f.severity),
