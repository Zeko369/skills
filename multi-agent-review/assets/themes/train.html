      h('span', null, h('b', null, x.f.id), ' ', x.f.title),
      h('span', { class: 'wl-meta' }, `${x.f.disposition} · ${x.from ? `inherited from ${prLabel(x.from)}` : 'own'}`)));
    const more = r.reasons.length - items.length;
    return [
      h('div', { class: 'why-head' }, levelChip(r.level), h('span', null, node ? prLabel(id) : 'Target')),
      r.reasons.length ? [h('p', { class: 'why-lead' }, `${LEVEL[r.level].lead} ${plural(r.reasons.length, 'finding')}`), h('ul', null, items, more > 0 ? h('li', null, h('span'), h('span', null, `+${more} more`)) : null)]
        : h('p', { class: 'why-ok' }, r.level === 'none' ? 'No findings were recorded for this review.' : `No blocking or attention findings in ${name.split(' ')[0]}${node && node.parentEntry ? ' or the PRs below it' : ''}.`),
      h('p', { class: 'why-foot' }, `${r.own.length} own · ${r.inherited.length} inherited open findings. Ignored findings are excluded. ${NOT_A_DECISION}`),
    ];
  }
  function showWhy(anchor, id) {
    if (!ready.has(id)) return;
    why.dataset.level = ready.get(id).level;
    why.replaceChildren(...whyContent(id).flat());
    why.hidden = false;
    const a = anchor.getBoundingClientRect();
    const w = why.offsetWidth;
    const hh = why.offsetHeight;

        h('p', { class: 'dos-title' }, n ? n.title : target.label),
        n ? h('dl', { class: 'dos-kv' },
          kv('Branch', n.branch), kv('Into', n.base || (n.parentEntry ? n.parentEntry.branch : stack.trunk)), kv('Head', n.head),
          solo ? null : kv('Below it', below ? stack.ancestors(id).map(prLabel).join(' → ') + ` → ${stack.trunk}` : stack.trunk),
          kv('Diff', diff)) : null,
        h('div', { class: 'dos-counts' },
          h('div', { class: 'dos-count' }, h('b', null, String(r.own.length)), h('span', null, solo ? 'Open' : 'Own open')),
          solo ? null : h('div', { class: 'dos-count' }, h('b', null, String(r.inherited.length)), h('span', null, 'Inherited'))),
        h('div', { class: 'dos-reasons' },
          kicker(r.level === 'blocked' ? 'Blocked by' : r.level === 'attention' ? 'Needs attention' : 'Readiness'),
          reasons.length ? h('ul', { class: 'checklist' }, reasons) : h('p', { class: 'dos-ok' }, r.level === 'none' ? data.meta.empty_message : `Nothing blocks ${n ? label : 'the target'}${below ? ' or the PRs below it' : ''}.`)),
        n && n.url ? h('a', { class: 'btn dos-link', href: n.url, target: '_blank', rel: 'noopener noreferrer' }, `Open ${label} ↗`) : null,
        solo ? h('div', { class: 'dos-rules' }, kicker('How readiness is derived'),
          h('ul', { class: 'legend legend-v', 'aria-label': 'Readiness legend' }, legendItems()),
          h('p', { class: 'rules-note' }, 'Rejected and ignored findings never count. Filters do not change readiness.')) : null,
        h('p', { class: 'dos-note' }, NOT_A_DECISION)));
  }

  function blockHead(title, count, sub) {
    return h('div', { class: 'list-head' }, h('h3', { class: 'list-title' }, title, h('span', { class: 'n' }, String(count))), sub ? h('span', { class: 'list-sub' }, sub) : null);
  }

  function renderDossierMain(sel) {
    const v = app.view();
    const selSet = new Set(sel);
    const belowSet = new Set(sel.flatMap((id) => stack.ancestors(id)).filter((id) => !selSet.has(id)));
    const below = stack.order.filter((n) => belowSet.has(n.id)).reverse().map((n) => n.id);
    const intro = v.flat.filter((f) => f.prs.some((p) => selSet.has(p)));
    const inher = v.flat.filter((f) => !f.prs.some((p) => selSet.has(p)));
    if (!intro.length && !inher.length && otherFilters()) {
      deckMain.replaceChildren(noMatch(labels(sel)));
      return;
    }
    const introBlock = h('section', { class: 'block', dataset: { block: 'introduced' } },
      blockHead(`Introduced in ${labels(sel)}`, intro.length, 'Root cause lives in this PR'),
      intro.length ? h('div', { class: 'rows' }, intro.map((f) => row(f)))
        : h('div', { class: 'block-note' }, h('span', null, otherFilters() ? `Nothing introduced in ${labels(sel)} matches the filters.` : `No findings are attributed to ${labels(sel)}.`)));
    let inherBody;
    if (!below.length) inherBody = h('div', { class: 'block-note' }, h('span', null, `${labels(sel)} sits directly on ${stack.trunk}; nothing is inherited.`));
    else if (!state.prInherited) {
      inherBody = h('div', { class: 'block-note' }, h('span', null, `Lower PRs are excluded from this view.`),
        h('button', { type: 'button', class: 'btn btn-solid', onclick: () => app.set('prInherited', true) }, 'Include lower PRs'));
    } else if (!inher.length) inherBody = h('div', { class: 'block-note' }, h('span', null, otherFilters() ? 'Nothing inherited matches the filters.' : 'Nothing is inherited from the PRs below.'));
    else {
      const nearest = (f) => below.find((id) => f.prs.includes(id)) || below[0];
      const groups = below.map((id) => ({ id, items: inher.filter((f) => nearest(f) === id) })).filter((g) => g.items.length);
      inherBody = groups.length > 1
        ? groups.map((g) => h('div', { class: 'sub' },
          h('div', { class: 'sub-head' }, 'from', prChip(g.id), h('span', { class: 't' }, stack.byId.get(g.id).title), h('span', { class: 'c', 'aria-label': plural(g.items.length, 'finding') }, String(g.items.length))),
          h('div', { class: 'rows' }, g.items.map((f) => row(f, { chips: 'always' })))))
        : h('div', { class: 'rows' }, inher.map((f) => row(f, { chips: 'always' })));
    }
    const inherBlock = h('section', { class: 'block', dataset: { block: 'inherited' } },
      blockHead(below.length ? `Inherited from ${labels(below)}` : 'Inherited', inher.length, below.length ? 'Lands with this PR when it merges' : null),
      inherBody);
    deckMain.replaceChildren(introBlock, inherBlock);
  }

  function groupHead(g, isCollapsed) {
    let tile = 'All';
    let kind = null;
    let label = g.label;
    let meta = null;
    let level = null;
    if (g.pr) {
      tile = prLabel(g.pr.id);
      label = g.pr.title;
      meta = [g.pr.branch, g.pr.forked && g.pr.parent ? `forks from ${prLabel(g.pr.parent)}` : null, g.pr.status].filter(Boolean).join(' · ');
      level = ready.get(g.pr.id).level;
    } else if (g.key === C.CROSS_PR) { tile = 'Multi'; kind = 'cross'; meta = 'Root cause spans more than one PR'; }
    else if (g.key === C.NO_PR) { tile = '—'; kind = 'none'; }
    else if (g.severity) { tile = g.severity; label = SEV_LABEL[g.severity]; }
    else if (g.disposition) { tile = swatch(g.disposition); kind = 'disp'; }
    return h('button', {
      type: 'button', class: 'group-head', 'aria-expanded': String(!isCollapsed), dataset: { focusKey: `group:${g.key}` },
      title: isCollapsed ? 'Expand this group' : 'Collapse this group',
      onclick: () => {
        if (collapsed.has(g.key)) collapsed.delete(g.key); else collapsed.add(g.key);
        app.store.set('collapsed', [...collapsed]);
        keepFocus(renderDeck);
      },
    },
    h('span', { class: 'g-tile', dataset: { severity: g.severity || null, kind } }, tile),
    h('span', { class: 'g-text' }, h('span', { class: 'g-label' }, label), meta ? h('span', { class: 'g-meta' }, meta) : null),
    level ? levelChip(level) : null,
    h('span', { class: 'g-count' }, String(g.items.length)),
    h('span', { class: 'g-chev', 'aria-hidden': 'true' }, isCollapsed ? '+' : '−'));
  }

  function renderWholeMain() {
    const v = app.view();
    if (!v.flat.length) { deckMain.replaceChildren(noMatch()); return; }
    const head = blockHead(hasStack ? 'All findings' : 'Findings', v.flat.length, hasStack ? `Grouped by ${C.GROUPS[state.groupBy].toLowerCase()}` : null);
    if (state.groupBy === 'none') { deckMain.replaceChildren(head, h('div', { class: 'rows' }, v.flat.map((f) => row(f, { chips: true })))); return; }
    deckMain.replaceChildren(head, ...v.groups.map((g) => {
      const isCollapsed = collapsed.has(g.key);
      return h('section', { class: 'group', dataset: { group: g.key } }, groupHead(g, isCollapsed),
        isCollapsed ? null : h('div', { class: 'rows' }, g.items.map((f) => row(f, { chips: state.groupBy !== 'pr' }))));
    }));
  }

  function renderDeck() {
    order = [];
    const sel = hasStack ? selectedPRs() : [];
    const v = app.view();
    deckShowing.textContent = `${v.flat.length} of ${plural(findings.length, 'finding')} shown`;
    renderDeckBar(sel);
    if (sel.length) {
      deckTitle.textContent = `${labels(sel)} dossier`;
      rail.replaceChildren(...sel.map(dossierCard));
      renderDossierMain(sel);
    } else {
      deckTitle.textContent = hasStack ? 'Whole stack' : 'Findings';
      rail.replaceChildren(...(!hasStack ? [dossierCard(TARGET)] : app.sectionVisible('plan') ? [mergePlan()] : []));
      renderWholeMain();
    }
    app.applySections();
  }

  function buildDeck() {
    if (!hasFindings) {
      return h('section', { class: 'section section-deck', 'aria-labelledby': 'sec-deck' },
        secHead('sec-deck', 'Findings'),
        h('div', { class: 'empty-state', dataset: { status: data.status } },
          h('span', { class: 'empty-zero', 'aria-hidden': 'true' }, '0'),
          h('div', { class: 'empty-copy' },
            kicker('Findings recorded'),
            h('p', { class: 'empty-msg' }, data.meta.empty_message),
            h('p', { class: 'empty-sub' }, `${data.meta.completed} of ${plural(data.reviewers.length, 'reviewer')} completed. ${data.meta.status_note}`))));
    }
    deckSection = h('section', { class: 'section section-deck', 'aria-labelledby': 'sec-deck' },
      h('div', { class: 'sec-head' }, h('span', { class: 'sec-num', 'aria-hidden': 'true' }), deckTitle,
        h('div', { class: 'sec-aside' }, deckShowing, ui.filterSummary())),
      hasStack ? null : alarm(),
      deckBar,
      h('div', { class: 'deck' }, rail, deckMain));
    return deckSection;
  }

  /* Keyboard j/k follow the order rows are drawn in (introduced, then inherited), not core's grouping. */
  function move(delta) {
    if (!order.length) return;
    const at = order.indexOf(state.selected);
    const next = at < 0 ? (delta > 0 ? 0 : order.length - 1) : Math.min(order.length - 1, Math.max(0, at + delta));
    app.select(order[next]);
  }
  window.addEventListener('keydown', (event) => {
    if (event.defaultPrevented || event.metaKey || event.ctrlKey || event.altKey || (event.key !== 'j' && event.key !== 'k')) return;
    const t = event.target;
    if (/^(INPUT|SELECT|TEXTAREA)$/.test(t.tagName) || t.isContentEditable) return;
    event.preventDefault();
    move(event.key === 'j' ? 1 : -1);
  }, true);

  /* ── Reviewers ── */
  function teamCard(r) {
    const tone = BAD.includes(r.status) ? 'bad' : WARN.includes(r.status) ? 'warn' : r.status === 'completed' ? 'ok' : 'idle';
    const raised = findings.filter((f) => f.reviewers.includes(r.name)).length;
    const alone = findings.filter((f) => f.reviewers.length === 1 && f.reviewers[0] === r.name).length;
    const kv = (label, value) => (value == null || value === '' ? null : [h('dt', null, label), h('dd', null, String(value))]);
    const snapshot = r.snapshot_id ? `${r.snapshot_id} · ${r.snapshot_verified === true ? 'verified' : 'unverified'}` : ('snapshot_verified' in r ? (r.snapshot_verified === true ? 'verified' : 'unverified') : null);
    return h('article', { class: 'rv-card', dataset: { tone } },
      h('div', { class: 'rv-status' }, h('span', null, statusText(r.status)), r.provider_status ? h('small', null, r.provider_status) : null),
      h('div', { class: 'rv-inner' },
        h('div', { class: 'rv-head' }, ui.reviewerBadges([r.name]), h('h3', { class: 'rv-name' }, r.name)),
        h('p', { class: 'rv-model' }, r.model),
        hasFindings ? h('div', { class: 'rv-stats' },
          h('div', { class: 'rv-stat' }, h('b', null, String(raised)), h('span', null, 'Raised')),
          h('div', { class: 'rv-stat' }, h('b', null, String(alone)), h('span', null, 'Alone'))) : null,
        h('dl', { class: 'rv-kv' },
          kv('Effort', r.effort), kv('Transport', r.transport), kv('Run', r.run_id), kv('Round', r.round),
          kv('Provider status', r.provider_status), kv('Snapshot', snapshot)),
        h('div', { class: 'rv-prov' }, kicker('Provenance'), r.provenance),
        r.limitations ? h('div', { class: 'rv-limits' }, kicker('Limitations'), r.limitations) : null,
        r.output ? h('details', { class: 'rv-output' }, h('summary', null, 'Raw output'), h('pre', null, r.output)) : null));
  }
  function buildTeam() {
    return h('section', { class: 'section', dataset: { section: 'team' }, 'aria-labelledby': 'sec-team' },
      secHead('sec-team', 'Reviewers', `${data.meta.completed} of ${plural(data.reviewers.length, 'reviewer')} completed`),
      data.reviewers.length ? h('div', { class: 'team' }, data.reviewers.map(teamCard)) : h('p', { class: 'muted' }, 'No reviewers recorded.'));
  }

  /* ── Scope & follow-up ── */
  function buildDetails() {
    const list = (kind, title, items) => h('div', { class: 'list-col', dataset: { kind } },
      h('div', { class: 'lc-head' }, h('h3', null, title), h('span', { class: 'lc-n' }, String(items.length))),
      items.length ? h('ol', null, items.map((text) => h('li', null, text))) : h('p', { class: 'list-none' }, 'None recorded.'));
    return h('section', { class: 'section', dataset: { section: 'scope' }, 'aria-labelledby': 'sec-scope' },
      secHead('sec-scope', 'Scope & follow-up'),
      data.target.length ? h('div', { class: 'target' }, data.target.map(([k, v]) => h('div', { class: 'kv-tile' }, kicker(k), h('div', { class: 'kv-val' }, v)))) : null,
      h('div', { class: 'lists' }, list('checks', 'Checks', data.checks), list('gaps', 'Gaps', data.gaps), list('next', 'Next steps', data.next_steps)),
      data.notes.length ? h('div', { class: 'notes' }, data.notes.map((n) => h('article', { class: 'note' }, n.title ? h('h3', null, n.title) : null, h('p', null, n.body || '')))) : null,
      data.sources.length ? h('div', { class: 'sources' }, kicker('Sources'),
        h('ul', null, data.sources.map((s) => h('li', null,
          h('a', { href: s.url, target: '_blank', rel: 'noopener noreferrer' }, s.title || s.url),
          h('span', { class: 'src-url' }, s.url))))) : null);
  }

  /* ── Detail drawer ── */
  const drawer = h('aside', { class: 'drawer no-print', role: 'dialog', 'aria-modal': 'false', 'aria-labelledby': 'drawer-title', hidden: true });
  const drawerHandle = ui.resizer(drawer, { key: 'train-drawer', min: 400, label: 'Resize the finding drawer' });
  function impact(f) {
    const k = classify(f);
    if (!k) return 'Rejected; it never counts toward readiness.';
    if (app.isIgnored(f.id)) return 'Ignored by you, so it is excluded from readiness.';
    if (k === 'open') return 'Recorded, but it does not change readiness.';
    const verb = k === 'blocked' ? 'Blocks' : 'Needs attention at';
    if (!hasStack) return `${verb} ${soloPR ? prLabel(TARGET) : 'the review target'}.`;
    if (!f.prs.length) return 'Not tied to a PR, so no station counts it.';
    const hit = new Set(f.prs.flatMap((p) => [p, ...stack.descendants(p)]));
    return h('span', { class: 'impact-line' }, verb, stack.order.filter((n) => hit.has(n.id)).map((n) => prChip(n.id)));
  }
  function renderDrawer() {
    const f = state.selected ? app.byId.get(state.selected) : null;
    if (!f) {
      if (!drawer.hidden) {
        const hadFocus = drawer.contains(document.activeElement);
        drawer.hidden = true;
        drawer.replaceChildren();
        if (hadFocus || document.activeElement === document.body) {
          const back = (opener && document.querySelector(`[data-focus-key="${CSS.escape(opener)}"]`))
            || (drawerFor && document.querySelector(`[data-finding-id="${CSS.escape(drawerFor)}"] .row-main`));
          if (back) back.focus({ preventScroll: true });
        }
        opener = null;
      }
      drawerFor = null;
      return;
    }
    const at = order.indexOf(f.id);
    const step = (dir, glyph, label) => h('button', {
      type: 'button', class: 'drawer-step', 'aria-label': label, title: `${label} (${dir > 0 ? 'j' : 'k'})`,
      disabled: !order.length || (at >= 0 && (dir < 0 ? at === 0 : at === order.length - 1)),
      dataset: { focusKey: `drawer-${dir > 0 ? 'next' : 'prev'}` }, onclick: () => move(dir),
    }, glyph);
    const sel = selectedPRs();
    const relation = sel.length && f.prs.length && !f.prs.some((p) => sel.includes(p)) ? `Inherited by ${labels(sel)}` : null;
    drawer.dataset.severity = f.severity;
    drawer.dataset.disposition = f.disposition;
    drawer.replaceChildren(
      drawerHandle,
      h('div', { class: 'drawer-band' },
        h('span', { class: 'drawer-sev' }, f.severity),
        h('span', { class: 'drawer-sevtext' }, h('span', null, SEV_LABEL[f.severity]), h('span', { class: 'drawer-id' }, f.id)),
        h('span', { class: 'drawer-nav' }, step(-1, '↑', 'Previous finding'), h('span', { class: 'drawer-pos' }, at >= 0 ? `${at + 1}/${order.length}` : '–'), step(1, '↓', 'Next finding'),
          h('button', {
            type: 'button', class: 'drawer-step drawer-full', 'aria-pressed': String(app.isDrawerFull()), dataset: { focusKey: 'drawer-full' },
            'aria-label': 'Full screen', title: app.isDrawerFull() ? 'Exit full screen (f or Esc)' : 'Full screen (f)', onclick: () => app.toggleDrawerFull(),
          })),
        h('button', { type: 'button', class: 'drawer-close', 'aria-label': 'Close details (Esc)', title: 'Close (Esc)', dataset: { focusKey: 'drawer-close' }, onclick: () => app.select(null) }, '×')),
      h('div', { class: 'drawer-scroll' },
        at < 0 ? h('p', { class: 'drawer-note' }, app.matches(f) ? 'Shown elsewhere on the page (its group is collapsed).' : 'Not in the current filtered view.') : null,
        h('h2', { class: 'drawer-title', id: 'drawer-title', tabindex: '-1' }, f.title),
        h('p', { class: 'drawer-disp' }, swatch(f.disposition), DISP_LABEL[f.disposition]),
        h('dl', { class: 'drawer-meta' },
          hasStack ? [h('dt', null, 'Pull request'), h('dd', null, f.prs.length
            ? h('span', { class: 'impact' }, h('span', { class: 'chips' }, f.prs.map((id) => h('span', { class: 'pr-ref' }, prChip(id), h('span', { class: 'pr-ref-title' }, (stack.byId.get(id) || {}).title || '')))),
              relation ? h('span', { class: 'pr-ref-title' }, relation) : null)
            : 'Not tied to one PR')] : null,
          [h('dt', null, 'Merge impact'), h('dd', null, impact(f))],
          [h('dt', null, 'Raised by'), h('dd', null, f.reviewers.length
            ? h('span', { class: 'who' }, f.reviewers.map((name) => h('span', { class: 'who-item' }, ui.reviewerBadges([name]), name)))
            : 'Coordinator')],
          [h('dt', null, 'Confidence'), h('dd', null, confidence(f.confidence))],
          f.tags.length ? [h('dt', null, 'Tags'), h('dd', null, h('span', { class: 'chips' }, f.tags.map((t) => h('button', {
            type: 'button', class: 'tag-chip', 'aria-pressed': String(state.tag.has(t)), title: `Show only findings tagged ${t}`,
            onclick: () => app.setFacet('tag', [t]),
          }, t))))] : null),
        ui.findingActions(f, { answer: false }),
        ui.findingFields(f)),
      h('div', { class: 'drawer-dock' }, ui.answer(f, { rows: 2 })));
    drawer.hidden = false;
    drawerFor = f.id;
  }

  /* ── Footer ── */
  function buildFooter() {
    return h('footer', { class: 'foot' },
      h('span', null, h('b', null, 'Multi-agent review'), ` · generated ${data.generated_at}`),
      hasFindings ? h('span', null, 'Answers, comments and pins are saved in this browser only and shared by every design of this report; they never change the report.') : null,
      h('span', null, NOT_A_DECISION));
  }

  /* ── Mount ── */
  const sectionDefs = [hasStack ? ['train', 'Merge train'] : null, hasStack && hasFindings ? ['plan', 'Merge plan'] : null, ['team', 'Reviewers'], ['scope', 'Scope & follow-up']].filter(Boolean);
  app.sectionDefaults({ plan: false });
  computeReadiness();
  const train = hasStack ? buildTrain() : null; // one station is not a train
  const strip = hasFindings ? buildStrip() : null;
  const main = h('main', { class: 'page', id: 'main' },
    buildHero(), train ? train.section : null,
    strip ? strip.el : null,
    buildDeck(),
    buildTeam(), buildDetails());
  document.getElementById('app').append(buildTopbar(), main, buildFooter(), drawer, why);

  app.subscribe((reason, detail) => {
    if (reason === 'open') return;
    if (reason === 'sections') { if (detail === 'plan' && hasFindings) keepFocus(renderDeck); return; }
    if (reason === 'layout') { renderDrawer(); return; }
    if (reason === 'select') {
      const group = state.selected && state.groupBy !== 'none' && !selectedPRs().length ? app.view().groups.find((g) => g.items.some((f) => f.id === state.selected)) : null;
      if (group && collapsed.has(group.key)) { collapsed.delete(group.key); app.store.set('collapsed', [...collapsed]); renderDeck(); }
      renderDrawer();
      return;
    }
    computeReadiness();
    refreshHero();
    if (train) train.render();
    if (hasFindings) { renderDeck(); strip.refresh(); }
    renderDrawer();
  });
  app.start();
})();
</script>
</body>
</html>
