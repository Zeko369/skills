<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net; style-src 'unsafe-inline' https://cdn.jsdelivr.net; font-src https://cdn.jsdelivr.net data:; img-src data:; connect-src https://cdn.jsdelivr.net; base-uri 'none'; form-action 'none'">
<meta name="generator" content="human-review · plan">
<title>@@TITLE@@</title>
<style>
@@CORE_CSS@@

/* Sticky command bar */
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:12px;padding:9px 16px;border-bottom:3px solid var(--rule);background:var(--paper);flex-wrap:wrap}
.top h1{font:800 14px/1.2 var(--sans);letter-spacing:-.01em;max-width:30ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top .meta{font:500 11px/1 var(--mono);color:var(--muted)}
/* The lede repeats this verbatim a few pixels below; drop it before the bar wraps. */
@media (max-width:1460px){.top .meta{display:none}}
@media (max-width:1120px){.top h1{max-width:20ch}}

/* Paths are the widest thing here and they are the one thing that must not wrap:
   a file row reads as one line or it reads as nothing. 1500 fits the longest path
   in a real diff next to its notes. Prose keeps its own measure below, because a
   1500px line of 12px text is about 200 characters and unreadable. */
.wrap{max-width:1500px;margin:0 auto;padding:26px clamp(14px,3vw,30px) 90px}
.lede h2{margin:9px 0 0;font:800 clamp(21px,3.4vw,32px)/1.08 var(--sans);letter-spacing:-.025em}
.lede .meta{margin:9px 0 0;font:500 12px/1.5 var(--mono);color:var(--muted)}

/* Metric tiles */
.metrics{display:flex;flex-wrap:wrap;margin:22px 0 0;border:2px solid var(--rule)}
.metric{flex:1 1 120px;padding:9px 13px 11px;border-right:2px solid var(--rule)}
.metric:last-child{border-right:0}
.metric b{display:block;font:800 25px/1 var(--sans);letter-spacing:-.02em;margin-top:4px}
.metric .kicker{color:var(--muted)}
.metric.hot b{color:var(--p0)}

/* Questions */
.band{margin:26px 0 0;border:2px solid var(--rule)}
.band-top{height:11px;background:var(--hazard)}
.band-head{padding:8px 13px;background:var(--slab);color:var(--paper)}
.q{display:flex;gap:13px;padding:11px 13px;border-top:2px solid var(--rule)}
.q .kind{flex:none;width:84px;font:800 10px/1.4 var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.q .body{flex:1;min-width:0}
.q .files{margin:5px 0 0;font:400 11.5px/1.6 var(--mono);color:var(--faint);overflow-wrap:anywhere}

/* Station + tree */
.station{margin:22px 0 0;display:grid;grid-template-columns:42px 1fr}
.gutter{position:relative;display:flex;flex-direction:column;align-items:center;padding-top:5px}
/* The gutter stretches to the station's height, so this reaches across the 22px
   margin and meets the next node. The last one stops at its own lamp instead. */
.gutter::before{content:"";position:absolute;top:0;bottom:-22px;width:2px;background:var(--line)}
.station:last-of-type .gutter::before{bottom:auto;height:48px}
.node{position:relative;z-index:1;width:26px;height:26px;display:grid;place-items:center;border:2px solid var(--wr);background:var(--paper);font:800 11px/1 var(--sans)}
.station[data-weight="critical"] .node{background:var(--p0);color:#fff}
.station[data-weight="read"] .node{background:var(--wbg);color:var(--wi)}
.lamp{width:10px;height:10px;margin-top:7px;border:2px solid var(--wr);background:var(--wbg)}

.group{align-self:start;border:2px solid var(--wr);background:var(--paper)}
.group-head{display:flex;align-items:center;gap:9px;padding:7px 11px;background:var(--wbg);color:var(--wi);cursor:pointer}
.station[data-weight="skip"] .group-head{background:var(--wash);color:var(--muted)}
.group-head .label{font:800 11px/1.2 var(--sans);letter-spacing:.1em;text-transform:uppercase}
.group-head .tally{font:700 10.5px/1 var(--mono);opacity:.75}
.caret{flex:none;width:13px;text-align:center;font-size:10px;transition:transform .12s}
.caret.shut{transform:rotate(-90deg)}
.why{padding:7px 11px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);background:var(--wash)}
.why span{display:block;max-width:92ch}
.station[data-weight="critical"] .why{background:#fff2f3;color:var(--ink)}
:root[data-mode="dark"] .station[data-weight="critical"] .why{background:#2b1416}
.group-body{border-top:2px solid var(--wr)}

.dir,.file{display:flex;flex-wrap:wrap;align-items:center;gap:8px;width:100%;border:0;border-bottom:1px solid var(--line);background:var(--paper);text-align:left;font:inherit;cursor:pointer;padding:5px 11px}
.dir{background:var(--wash);font:700 11.5px/1.4 var(--mono)}
.dir:hover{background:var(--wash-2)}
.dir .n{flex:1;min-width:0;overflow-wrap:anywhere}
.dir .tally{font:600 10px/1 var(--mono);color:var(--muted)}
.file:hover{background:var(--wash)}
.file.open{background:var(--wash-2);box-shadow:inset 3px 0 0 var(--ink)}
.file.done .fname{opacity:.45;text-decoration:line-through}
.file.folded .fname{color:var(--faint)}
/* A note can be a whole sentence, and the notes are the only thing on the row that
   cannot shrink. Sized from zero the name was the only give, so three of them wrung
   it down to nothing and overflow-wrap:anywhere spelled the path out one letter per
   line. The basis makes the name count towards the line, so a note that does not fit
   wraps underneath it instead of squeezing it, and the floor is the width the name is
   never allowed to fall below. */
.fname{flex:1 1 22ch;min-width:min(100%,22ch);font:400 12px/1.35 var(--mono);overflow-wrap:anywhere;color:var(--muted)}
.fname b{font-weight:600;color:var(--ink)}
.file.done .fname b{color:inherit}
.fstat{flex:none;font:500 10.5px/1 var(--mono);color:var(--muted)}
.tag{flex:0 1 auto;min-width:0;overflow-wrap:break-word;padding:1px 5px;background:var(--p2);color:var(--on-p2);font:700 9.5px/1.5 var(--sans);text-transform:uppercase;letter-spacing:.06em}
.tag.cold{background:var(--grey-lt);color:var(--muted)}
.more{width:100%;padding:6px 11px;border:0;border-bottom:1px solid var(--line);background:var(--hatch-soft),var(--wash);font:700 10.5px/1.4 var(--sans);letter-spacing:.04em;color:var(--muted);text-align:left;cursor:pointer}

/* Inline drawer */
.drawer{display:grid;grid-template-columns:1fr 310px;border-top:2px solid var(--rule);border-bottom:2px solid var(--rule);background:var(--wash)}
.drawer-main{min-width:0;display:flex;flex-direction:column;background:var(--paper)}
.drawer-head{display:flex;align-items:center;gap:9px;padding:7px 11px;border-bottom:2px solid var(--rule);flex-wrap:wrap}
.drawer-head .path{font:700 12px/1.3 var(--mono);overflow-wrap:anywhere}
.drawer-diff{min-width:0}
.drawer-side{display:flex;flex-direction:column;border-left:2px solid var(--rule);min-width:0;max-height:620px}
.drawer-side .list{flex:1;overflow:auto;padding:10px;min-height:60px}
@media (max-width:980px){.drawer{grid-template-columns:1fr}.drawer-side{border-left:0;border-top:2px solid var(--rule)}}
/* Hiding the gutter takes it out of grid placement, so the group auto-places into
   what used to be the gutter's column. One column, not two, or the group lands in
   a 0 width track and every row inside it is a sliver. */
@media (max-width:620px){.station{grid-template-columns:1fr}.gutter{display:none}}
</style>
</head>
<body>
<script type="application/json" id="plan">@@DATA@@</script>

<div class="top">
  <h1 id="t-title"></h1>
  <span class="meta" id="t-meta"></span>
  <span class="spacer"></span>
  <span class="progress"><span id="t-progress"></span><span class="bar"><i id="t-bar"></i></span></span>
  <span id="t-theme"></span>
  <button class="btn" id="t-collapse">Collapse</button>
  <a class="btn" href="review.html">Focus mode</a>
  <button class="btn btn-solid" id="t-export">Export <span class="count" id="t-count">0</span></button>
</div>

<div class="wrap">
  <div class="lede">
    <span class="kicker muted">Reading plan</span>
    <h2 id="l-title"></h2>
    <p class="meta" id="l-meta"></p>
  </div>
  <div class="metrics" id="metrics"></div>
  <div class="band" id="band" hidden>
    <div class="band-top"></div>
    <div class="band-head"><span class="kicker">Answer these without opening a diff</span></div>
    <div id="questions"></div>
  </div>
  <div id="stations"></div>
</div>

<div class="overlay" id="overlay">
  <div class="sheet">
    <div class="sheet-head"><span class="kicker spacer">human-review/comments@1</span>
      <button class="btn" id="x-close">Close</button></div>
    <pre id="x-json"></pre>
    <div class="sheet-foot">
      <select id="x-verdict">
        <option value="comment">Verdict: comment</option>
        <option value="request_changes">Verdict: request changes</option>
        <option value="approve">Verdict: approve</option>
      </select>
      <input id="x-summary" placeholder="One-line summary for the agent (optional)">
      <button class="btn" id="x-download">Download</button>
      <button class="btn btn-solid" id="x-copy">Copy JSON</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
@@CORE_JS@@
</script>
<script>
(function () {
  "use strict";
  var plan = HR.plan, el = HR.el, LABEL = HR.LABEL;
  var exporter = HR.mountExport();
  var open = {};        // path -> {row, drawer, view, kind, anchor}
  var showFolded = {};  // group key -> bool

  /* ── Header ─────────────────────────────────────────────────────────── */
  document.getElementById("t-title").textContent = HR.titleOf();
  document.getElementById("l-title").textContent = HR.titleOf();
  document.getElementById("t-meta").textContent = HR.metaOf();
  document.getElementById("l-meta").textContent = HR.metaOf();

  var stats = plan.stats;
  [["Changed files", stats.files, false], ["Need your eyes", stats.critical + stats.read, true],
   ["Stop and read", stats.critical, false], ["Folded away", stats.skip + stats.folded, false],
   ["Lines", "+" + stats.additions + " −" + stats.deletions, false]]
    .forEach(function (tile) {
      var box = el("div", "metric" + (tile[2] ? " hot" : ""));
      box.appendChild(el("span", "kicker", tile[0]));
      box.appendChild(el("b", "", String(tile[1])));
      document.getElementById("metrics").appendChild(box);
    });

  if (plan.questions.length) {
    document.getElementById("band").hidden = false;
    var host = document.getElementById("questions");
    plan.questions.forEach(function (q) {
      var row = el("div", "q");
      row.appendChild(el("span", "kind", q.kind));
      var body = el("div", "body");
      body.appendChild(el("div", "", q.text));
      if (q.files.length) body.appendChild(el("div", "files", q.files.join("  ")));
      row.appendChild(body);
      host.appendChild(row);
    });
  }

  /* ── Progress ───────────────────────────────────────────────────────── */
  function renderProgress() {
    var tally = HR.tallyRead(plan.order);
    document.getElementById("t-progress").textContent = tally.done + " / " + tally.total;
    document.getElementById("t-bar").style.width =
      tally.total ? (100 * tally.done / tally.total) + "%" : "0";
    document.getElementById("t-count").textContent = String(HR.state.comments.length);
  }

  /* ── Checkbox ───────────────────────────────────────────────────────── */
  function checkbox(paths, afterChange, title) {
    var box = el("button", "box");
    box.type = "button";
    box.setAttribute("role", "checkbox");
    box.title = title || "Mark read";
    function sync() { box.setAttribute("aria-checked", HR.tallyRead(paths).tri); }
    box.addEventListener("click", function (event) {
      event.stopPropagation();
      HR.setRead(paths, box.getAttribute("aria-checked") !== "true");
      afterChange();
    });
    sync();
    return box;
  }

  /* ── One file row, and the drawer it opens ──────────────────────────── */
  function fileRow(f, depth, redraw, prefix) {
    var row = el("div", "file" + (HR.isRead(f.path) ? " done" : "") +
                         (f.folded_into ? " folded" : "") + (open[f.path] ? " open" : ""));
    row.style.paddingLeft = (depth * 14 + 11) + "px";
    // Folder rows spend this column on their caret. Files reserve it too, otherwise a
    // child's checkbox sits to the left of its own parent's and the nesting reads wrong.
    row.appendChild(el("span", "caret"));
    row.appendChild(checkbox([f.path], redraw));
    var name = el("span", "fname");
    if (prefix) name.appendChild(document.createTextNode(prefix));
    name.appendChild(el("b", "", f.path.split("/").pop()));
    row.appendChild(name);
    (f.notes || []).forEach(function (note) {
      row.appendChild(el("span", "tag" + (/removal|deletion/.test(note) ? " cold" : ""), note));
    });
    var count = HR.commentsFor(f.path).length;
    if (count) row.appendChild(el("span", "count", String(count)));
    row.appendChild(el("span", "fstat", "+" + f.add + " −" + f.del));
    row.addEventListener("click", function () { toggleDrawer(f, row); });
    return row;
  }

  function toggleDrawer(f, row) {
    if (open[f.path]) { closeDrawer(f.path); return; }
    var drawer = el("div", "drawer");
    var main = el("div", "drawer-main");
    var head = el("div", "drawer-head");
    head.setAttribute("data-weight", f.weight);
    head.appendChild(el("span", "chip", LABEL[f.weight]));
    head.appendChild(el("span", "path", f.path));
    head.appendChild(el("span", "fstat muted", "+" + f.add + " −" + f.del + " · " + f.status));
    head.appendChild(el("span", "spacer"));
    var mark = el("button", "btn btn-sm", HR.isRead(f.path) ? "Unmark" : "Mark read");
    mark.addEventListener("click", function (event) {
      event.stopPropagation();
      HR.setRead([f.path], !HR.isRead(f.path));
      mark.textContent = HR.isRead(f.path) ? "Unmark" : "Mark read";
      redrawAll();
    });
    head.appendChild(mark);
    if (HR.target.repo && HR.target.head_sha) {
      var link = el("a", "btn btn-sm", "GitHub");
      link.href = "https://github.com/" + HR.target.repo + "/blob/" +
                  HR.target.head_sha + "/" + f.path;
      link.target = "_blank"; link.rel = "noreferrer";
      link.addEventListener("click", function (e) { e.stopPropagation(); });
      head.appendChild(link);
    }
    main.appendChild(head);
    var diff = el("div", "drawer-diff");
    main.appendChild(diff);
    drawer.appendChild(main);

    var side = el("div", "drawer-side");
    var list = el("div", "list");
    side.appendChild(list);
    drawer.appendChild(side);
    drawer.addEventListener("click", function (event) { event.stopPropagation(); });
    row.after(drawer);
    row.classList.add("open");

    var entry = { row: row, drawer: drawer, view: null, kind: "fix", anchor: null };
    open[f.path] = entry;

    entry.view = HR.mountDiff(diff, f, {
      autoHeight: true,
      onAnchor: function (line) { setAnchor(f, entry, line); }
    });
    side.appendChild(composer(f, entry, list));
    renderComments(f, entry, list);
  }

  function closeDrawer(path) {
    var entry = open[path];
    if (!entry) return;
    if (entry.view) entry.view.dispose();
    entry.drawer.remove();
    entry.row.classList.remove("open");
    delete open[path];
  }

  function setAnchor(f, entry, line) {
    var a = HR.anchorOf(line);
    entry.anchor = a ? { line: a, text: line.text } : null;
    var label = entry.drawer.querySelector(".anchor");
    label.textContent = entry.anchor
      ? (a.side === "left" ? "removed line " : "line ") + a.line + " · " +
        line.text.trim().slice(0, 36)
      : "file-level";
    entry.drawer.querySelector("textarea").focus();
  }

  function composer(f, entry, list) {
    var box = el("div", "composer");
    var head = el("div", "composer-head");
    var kinds = el("span", "kinds");
    ["fix", "question", "nit", "praise"].forEach(function (kind) {
      var button = el("button", "", kind);
      button.setAttribute("aria-pressed", String(kind === "fix"));
      button.addEventListener("click", function () {
        entry.kind = kind;
        kinds.querySelectorAll("button").forEach(function (b) {
          b.setAttribute("aria-pressed", String(b === button));
        });
      });
      kinds.appendChild(button);
    });
    head.appendChild(kinds);
    box.appendChild(head);
    var text = el("textarea");
    text.placeholder = "Click a line number in the gutter to anchor a comment, or write a file-level note.";
    box.appendChild(text);
    var foot = el("div", "composer-foot");
    foot.appendChild(el("span", "anchor", "file-level"));
    var add = el("button", "btn btn-sm btn-solid", "Add");
    function submit() {
      var body = text.value.trim();
      if (!body) { text.focus(); return; }
      HR.addComment(f.path, body, entry.kind, entry.anchor);
      entry.anchor = null;
      text.value = "";
      box.querySelector(".anchor").textContent = "file-level";
      if (entry.view) entry.view.paint();
      renderComments(f, entry, list);
      renderProgress();
      exporter.refresh();
      redrawAll();
    }
    add.addEventListener("click", submit);
    text.addEventListener("keydown", function (event) {
      if ((event.metaKey || event.ctrlKey) && event.key === "Enter") {
        event.preventDefault(); submit();
      }
    });
    foot.appendChild(add);
    box.appendChild(foot);
    return box;
  }

  function renderComments(f, entry, list) {
    list.textContent = "";
    var items = HR.commentsFor(f.path);
    if (!items.length) {
      list.appendChild(el("p", "muted", "No comments on this file."));
      return;
    }
    items.forEach(function (c) {
      var box = el("div", "cmt");
      var head = el("div", "cmt-head");
      var kind = el("span", "cmt-kind", c.kind);
      kind.setAttribute("data-kind", c.kind);
      head.appendChild(kind);
      var loc = el("span", "cmt-loc", c.line == null ? "file-level"
        : (c.side === "left" ? "−" : "") + "line " + c.line);
      if (c.line != null && entry.view) {
        loc.addEventListener("click", function () { entry.view.reveal(c.side, c.line); });
      }
      head.appendChild(loc);
      var remove = el("button", "cmt-x", "×");
      remove.title = "Delete comment";
      remove.addEventListener("click", function () {
        HR.removeComment(c.id);
        if (entry.view) entry.view.paint();
        renderComments(f, entry, list);
        renderProgress();
        exporter.refresh();
        redrawAll();
      });
      head.appendChild(remove);
      box.appendChild(head);
      if (c.code) box.appendChild(el("pre", "cmt-code", c.code));
      box.appendChild(el("div", "cmt-body", c.body));
      list.appendChild(box);
    });
  }

  /* ── Tree ───────────────────────────────────────────────────────────── */
  function renderTree(host, node, depth, redraw) {
    HR.sortedDirs(node).forEach(function (dir) {
      var paths = HR.filesUnder(dir);
      if (paths.length === 1) {
        // Its own row, a caret and a 0/1 tally, all to introduce one file. Put the
        // directory on the file row instead and save three lines of chrome.
        host.appendChild(fileRow(HR.byPath[paths[0]], depth, redraw, dir.name + "/"));
        return;
      }
      var key = "dir:" + dir.path;
      var shut = HR.collapsed(key, false);
      var row = el("div", "dir");
      row.style.paddingLeft = (depth * 14 + 11) + "px";
      var caret = el("span", "caret" + (shut ? " shut" : ""), "▼");
      row.appendChild(caret);
      row.appendChild(checkbox(paths, redraw, "Mark this folder read"));
      row.appendChild(el("span", "n", dir.name + "/"));
      row.appendChild(el("span", "tally", HR.tallyRead(paths).done + "/" + paths.length));
      row.addEventListener("click", function () {
        HR.setCollapsed(key, !shut);
        redraw();
      });
      host.appendChild(row);
      if (!shut) renderTree(host, dir, depth + 1, redraw);
    });
    node.files.slice().sort().forEach(function (path) {
      host.appendChild(fileRow(HR.byPath[path], depth, redraw));
    });
  }

  /* ── Stations ───────────────────────────────────────────────────────── */
  function renderStations() {
    var host = document.getElementById("stations");
    Object.keys(open).forEach(closeDrawer);
    host.textContent = "";
    plan.groups.forEach(function (group, index) {
      var station = el("div", "station");
      station.setAttribute("data-weight", group.weight);

      var gutter = el("div", "gutter");
      gutter.appendChild(el("div", "node", String(index + 1)));
      gutter.appendChild(el("div", "lamp"));
      station.appendChild(gutter);

      var box = el("div", "group");
      var key = "group:" + group.key;
      var folded = group.files.filter(function (p) { return HR.byPath[p].folded_into; });
      var visible = showFolded[group.key] ? group.files
        : group.files.filter(function (p) { return !HR.byPath[p].folded_into; });

      function foldToggle() {
        var more = el("button", "more", (showFolded[group.key] ? "− hide " : "+ ") +
          folded.length + " with an identical shape" + (showFolded[group.key] ? "" : " — show"));
        more.addEventListener("click", function (event) {
          event.stopPropagation();
          showFolded[group.key] = !showFolded[group.key];
          // Revealing the fan-out turns a one-row group into a real one, and `skip`
          // groups start collapsed - so without this the toggle appears to do nothing.
          if (showFolded[group.key]) HR.setCollapsed(key, false);
          renderStations();
        });
        return more;
      }

      var shut = HR.collapsed(key, false);
      var head = el("div", "group-head");
      head.appendChild(el("span", "caret" + (shut ? " shut" : ""), "▼"));
      head.appendChild(checkbox(group.files, function () {
        // Checking a whole group is a statement that it needs no more attention,
        // so it folds away once every file in it is ticked.
        HR.setCollapsed(key, HR.tallyRead(group.files).tri === "true");
        renderStations();
        renderProgress();
      }, "Mark the whole group read"));
      head.appendChild(el("span", "label", LABEL[group.weight] + " · " + group.label));
      var tally = HR.tallyRead(group.files);
      head.appendChild(el("span", "spacer"));
      head.appendChild(el("span", "tally", tally.done + "/" + tally.total));
      head.addEventListener("click", function () {
        HR.setCollapsed(key, !shut);
        renderStations();
      });
      box.appendChild(head);

      if (!shut) {
        if (group.why) {
          var why = el("div", "why");
          // The box spans the row, the sentence inside it does not - see .why span.
          why.appendChild(el("span", null, group.why));
          box.appendChild(why);
        }
        var body = el("div", "group-body");
        renderTree(body, HR.buildTree(visible), 0, renderStations);
        if (folded.length) body.appendChild(foldToggle());
        box.appendChild(body);
      }
      station.appendChild(box);
      host.appendChild(station);
    });
    renderProgress();
  }
  function redrawAll() { renderStations(); }

  /* ── Wiring ─────────────────────────────────────────────────────────── */
  HR.mountTheme(document.getElementById("t-theme"));
  document.getElementById("t-export").addEventListener("click", exporter.open);
  document.getElementById("t-collapse").addEventListener("click", function () {
    var anyOpen = plan.groups.some(function (g) {
      return !HR.collapsed("group:" + g.key, false);
    });
    plan.groups.forEach(function (g) { HR.setCollapsed("group:" + g.key, anyOpen); });
    this.textContent = anyOpen ? "Expand" : "Collapse";
    renderStations();
  });
  document.addEventListener("keydown", function (event) {
    if (/^(INPUT|TEXTAREA|SELECT)$/.test(event.target.tagName)) return;
    if (event.key === "Escape") {
      if (document.getElementById("overlay").classList.contains("open")) exporter.close();
      else Object.keys(open).forEach(closeDrawer);
    } else if (event.key === "e" && !event.metaKey && !event.ctrlKey) {
      event.preventDefault(); exporter.open();
    }
  });

  renderStations();
  // Monaco arrives after first paint; any drawer opened before then re-mounts with it.
  HR.onMonaco(function (ok) {
    if (!ok) HR.toast("Monaco unavailable — plain diff view");
    var reopen = Object.keys(open);
    reopen.forEach(closeDrawer);
    if (reopen.length) renderStations();
  });
})();
</script>
</body>
</html>
