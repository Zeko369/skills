<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net; style-src 'unsafe-inline' https://cdn.jsdelivr.net; font-src https://cdn.jsdelivr.net data:; img-src data:; connect-src https://cdn.jsdelivr.net; base-uri 'none'; form-action 'none'">
<meta name="generator" content="human-review · review">
<title>@@TITLE@@</title>
<style>
@@CORE_CSS@@

html,body{height:100%}
body{display:grid;grid-template-rows:auto 1fr;overflow:hidden}
:root{--rail:330px;--panel:350px}

.top{display:flex;align-items:center;gap:13px;padding:9px 16px;border-bottom:3px solid var(--rule);background:var(--paper);flex-wrap:wrap}
.top h1{font:800 14px/1.2 var(--sans);letter-spacing:-.01em;max-width:42ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top .meta{font:500 11px/1 var(--mono);color:var(--muted)}

.shell{display:grid;grid-template-columns:var(--rail) 1fr var(--panel);min-height:0}
.rail,.panel{overflow:auto;min-height:0;background:var(--paper)}
.rail{border-right:2px solid var(--rule)}
.panel{border-left:2px solid var(--rule);display:flex;flex-direction:column}
.center{min-width:0;min-height:0;display:flex;flex-direction:column}

.group-head{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:8px;padding:7px 11px;background:var(--wbg);color:var(--wi);border-bottom:2px solid var(--wr);cursor:pointer}
[data-weight="skim"] .group-head,[data-weight="skip"] .group-head{border-color:var(--grey)}
[data-weight="skip"] .group-head{background:var(--wash);color:var(--muted)}
.group-head .label{flex:1;font:800 10px/1.2 var(--sans);letter-spacing:.12em;text-transform:uppercase}
.group-head .tally{font:700 10px/1 var(--mono);opacity:.8}
.caret{flex:none;width:12px;text-align:center;font-size:9px;transition:transform .12s}
.caret.shut{transform:rotate(-90deg)}
.frow{display:flex;flex-wrap:wrap;align-items:center;gap:8px;width:100%;padding:6px 11px;border:0;border-bottom:1px solid var(--line);background:var(--paper);text-align:left;cursor:pointer}
.frow:hover{background:var(--wash)}
.frow[aria-current="true"]{background:var(--wash-2);box-shadow:inset 4px 0 0 var(--ink)}
.frow.done .fname{opacity:.45;text-decoration:line-through}
.fname{flex:1 1 22ch;min-width:min(100%,22ch);font:400 12px/1.35 var(--mono);overflow-wrap:anywhere;color:var(--muted)}
.fname b{font-weight:700;color:var(--ink)}
.fstat{flex:none;font:500 10.5px/1 var(--mono);color:var(--muted)}
.more{width:100%;padding:6px 11px;border:0;border-bottom:1px solid var(--line);background:var(--hatch-soft),var(--wash);font:700 10.5px/1.4 var(--sans);letter-spacing:.04em;color:var(--muted);text-align:left;cursor:pointer}

.fhead{display:flex;align-items:center;gap:10px;padding:8px 14px;border-bottom:2px solid var(--rule);flex-wrap:wrap;flex:none}
.fhead .path{font:700 13px/1.3 var(--mono);overflow-wrap:anywhere}
.fwhy{width:100%;font-size:12px;color:var(--muted)}
#editor{flex:1;min-height:0}
#editor .fallback{height:100%}
.empty{display:grid;place-items:center;height:100%;padding:40px;text-align:center;color:var(--muted)}

.panel-head{display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:2px solid var(--rule);background:var(--slab);color:var(--paper);flex:none}
.panel-body{flex:1;overflow:auto;padding:12px}
.composer{flex:none}
@media (max-width:1100px){:root{--rail:260px;--panel:300px}}
@media (max-width:820px){.shell{grid-template-columns:1fr}.rail,.panel{display:none}}
</style>
</head>
<body>
<script type="application/json" id="plan">@@DATA@@</script>

<div class="top">
  <h1 id="t-title"></h1>
  <span class="meta" id="t-meta"></span>
  <span class="spacer"></span>
  <span class="progress"><span id="t-progress"></span><span class="bar"><i id="t-bar"></i></span></span>
  <span id="t-theme"></span>
  <a class="btn" href="plan.html">Plan</a>
  <button class="btn" id="t-shortcuts" title="Keyboard shortcuts">?</button>
  <button class="btn btn-solid" id="t-export">Export <span class="count" id="t-count">0</span></button>
</div>

<div class="shell">
  <nav class="rail" id="rail" aria-label="Files in reading order"></nav>
  <main class="center">
    <div class="fhead" id="fhead"></div>
    <div id="editor"></div>
  </main>
  <aside class="panel">
    <div class="panel-head"><span class="kicker spacer">Comments</span><span class="count" id="p-count">0</span></div>
    <div class="panel-body" id="comments"></div>
    <div class="composer">
      <div class="composer-head">
        <span class="kinds" id="kinds">
          <button data-kind="fix" aria-pressed="true">Fix</button>
          <button data-kind="question" aria-pressed="false">Question</button>
          <button data-kind="nit" aria-pressed="false">Nit</button>
          <button data-kind="praise" aria-pressed="false">Praise</button>
        </span>
      </div>
      <textarea id="composer" placeholder="Click a line number to anchor a comment, or write a file-level note here."></textarea>
      <div class="composer-foot">
        <span class="anchor" id="anchor">file-level</span>
        <button class="btn btn-sm" id="clear-anchor">Clear</button>
        <button class="btn btn-sm btn-solid" id="add">Add</button>
      </div>
    </div>
  </aside>
</div>

<div class="overlay" id="overlay">
  <div class="sheet">
    <div class="sheet-head"><span class="kicker spacer">human-review/comments@1</span>
      <button class="btn" id="x-close">Close</button></div>
    <pre id="x-json"></pre>
    <div class="sheet-foot">
      <select id="x-verdict">
        <option value="comment">Verdict: comment</option>
        <option value="request_changes">Verdict: request changes</option>
        <option value="approve">Verdict: approve</option>
      </select>
      <input id="x-summary" placeholder="One-line summary for the agent (optional)">
      <button class="btn" id="x-download">Download</button>
      <button class="btn btn-solid" id="x-copy">Copy JSON</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
@@CORE_JS@@
</script>
<script>
(function () {
  "use strict";
  var plan = HR.plan, el = HR.el, LABEL = HR.LABEL;
  var exporter = HR.mountExport();
  var current = null, view = null, anchor = null, kind = "fix";
  var showFolded = {};

  document.getElementById("t-title").textContent = HR.titleOf();
  document.getElementById("t-meta").textContent = HR.metaOf();

  function checkbox(paths, after, title) {
    var box = el("button", "box");
    box.type = "button";
    box.setAttribute("role", "checkbox");
    box.title = title || "Mark read";
    box.setAttribute("aria-checked", HR.tallyRead(paths).tri);
    box.addEventListener("click", function (event) {
      event.stopPropagation();
      HR.setRead(paths, box.getAttribute("aria-checked") !== "true");
      after();
    });
    return box;
  }

  /* ── Rail ───────────────────────────────────────────────────────────── */
  function renderRail() {
    var rail = document.getElementById("rail");
    rail.textContent = "";
    plan.groups.forEach(function (group) {
      var box = el("div");
      box.setAttribute("data-weight", group.weight);
      var key = "group:" + group.key;
      var shut = HR.collapsed(key, false);
      var head = el("div", "group-head");
      head.appendChild(el("span", "caret" + (shut ? " shut" : ""), "▼"));
      head.appendChild(checkbox(group.files, function () {
        HR.setCollapsed(key, HR.tallyRead(group.files).tri === "true");
        renderRail(); renderCounts();
      }, "Mark the whole group read"));
      head.appendChild(el("span", "label", LABEL[group.weight] + " · " + group.label));
      var tally = HR.tallyRead(group.files);
      head.appendChild(el("span", "tally", tally.done + "/" + tally.total));
      head.addEventListener("click", function () { HR.setCollapsed(key, !shut); renderRail(); });
      box.appendChild(head);

      if (!shut) {
        var folded = [];
        group.files.forEach(function (path) {
          var f = HR.byPath[path];
          if (f.folded_into && !showFolded[group.key]) { folded.push(f); return; }
          box.appendChild(fileRow(f));
        });
        if (folded.length) {
          var more = el("button", "more", "+ " + folded.length + " with an identical shape — show");
          more.addEventListener("click", function (event) {
            event.stopPropagation();
            showFolded[group.key] = true;
            renderRail();
          });
          box.appendChild(more);
        }
      }
      rail.appendChild(box);
    });
  }

  function fileRow(f) {
    var row = el("div", "frow" + (HR.isRead(f.path) ? " done" : ""));
    if (f.path === current) row.setAttribute("aria-current", "true");
    row.appendChild(checkbox([f.path], function () { renderRail(); renderCounts(); }));
    var cut = f.path.lastIndexOf("/");
    var name = el("span", "fname");
    name.appendChild(document.createTextNode(cut < 0 ? "" : f.path.slice(0, cut + 1)));
    name.appendChild(el("b", "", cut < 0 ? f.path : f.path.slice(cut + 1)));
    row.appendChild(name);
    var count = HR.commentsFor(f.path).length;
    if (count) row.appendChild(el("span", "count", String(count)));
    row.appendChild(el("span", "fstat", "+" + f.add + " −" + f.del));
    row.addEventListener("click", function () { show(f.path); });
    return row;
  }

  /* ── Centre ─────────────────────────────────────────────────────────── */
  function renderHead(f) {
    var head = document.getElementById("fhead");
    head.textContent = "";
    head.setAttribute("data-weight", f.weight);
    head.appendChild(el("span", "chip", LABEL[f.weight]));
    head.appendChild(el("span", "path", f.path));
    head.appendChild(el("span", "fstat muted", "+" + f.add + " −" + f.del + " · " + f.status));
    head.appendChild(el("span", "spacer"));
    var mark = el("button", "btn btn-sm", HR.isRead(f.path) ? "Unmark" : "Mark read");
    mark.addEventListener("click", function () { toggleRead(f.path); });
    head.appendChild(mark);
    if (HR.target.repo && HR.target.head_sha) {
      var link = el("a", "btn btn-sm", "GitHub");
      link.href = "https://github.com/" + HR.target.repo + "/blob/" +
                  HR.target.head_sha + "/" + f.path;
      link.target = "_blank"; link.rel = "noreferrer";
      head.appendChild(link);
    }
    var why = el("span", "fwhy");
    why.appendChild(document.createTextNode(f.why || ""));
    (f.notes || []).forEach(function (note) { why.appendChild(el("span", "note", note)); });
    head.appendChild(why);
  }

  function show(path) {
    var f = HR.byPath[path];
    if (!f || path === current) return;
    current = path;
    // replaceState, not a hash assignment: browsing files is not navigation, and
    // Back should leave the tool rather than walk every file you glanced at.
    try {
      history.replaceState(null, "", "#" + encodeURIComponent(path));
    } catch (e) { /* file:// in some browsers */ }
    if (view) { view.dispose(); view = null; }
    renderHead(f);
    renderRail();
    anchor = null;
    document.getElementById("anchor").textContent = "file-level";
    view = HR.mountDiff(document.getElementById("editor"), f, {
      onAnchor: setAnchor
    });
    renderComments();
  }

  function toggleRead(path) {
    HR.setRead([path], !HR.isRead(path));
    renderRail(); renderCounts();
    if (path === current) renderHead(HR.byPath[path]);
  }

  /* ── Comments ───────────────────────────────────────────────────────── */
  function setAnchor(line) {
    var a = HR.anchorOf(line);
    anchor = a ? { line: a, text: line.text } : null;
    document.getElementById("anchor").textContent = anchor
      ? (a.side === "left" ? "removed line " : "line ") + a.line + " · " +
        line.text.trim().slice(0, 40)
      : "file-level";
    document.getElementById("composer").focus();
  }
  function renderComments() {
    var host = document.getElementById("comments");
    host.textContent = "";
    var items = current ? HR.commentsFor(current) : [];
    document.getElementById("p-count").textContent = String(items.length);
    if (!items.length) {
      host.appendChild(el("p", "muted", current
        ? "No comments on this file yet. Click a line number to anchor one."
        : "Pick a file from the list."));
      return;
    }
    items.forEach(function (c) {
      var box = el("div", "cmt");
      var head = el("div", "cmt-head");
      var tag = el("span", "cmt-kind", c.kind);
      tag.setAttribute("data-kind", c.kind);
      head.appendChild(tag);
      var loc = el("span", "cmt-loc", c.line == null ? "file-level"
        : (c.side === "left" ? "−" : "") + "line " + c.line);
      if (c.line != null) loc.addEventListener("click", function () {
        if (view) view.reveal(c.side, c.line);
      });
      head.appendChild(loc);
      var remove = el("button", "cmt-x", "×");
      remove.title = "Delete comment";
      remove.addEventListener("click", function () {
        HR.removeComment(c.id);
        if (view) view.paint();
        renderComments(); renderRail(); renderCounts(); exporter.refresh();
      });
      head.appendChild(remove);
      box.appendChild(head);
      if (c.code) box.appendChild(el("pre", "cmt-code", c.code));
      box.appendChild(el("div", "cmt-body", c.body));
      host.appendChild(box);
    });
  }
  function renderCounts() {
    var tally = HR.tallyRead(plan.order);
    document.getElementById("t-progress").textContent = tally.done + " / " + tally.total;
    document.getElementById("t-bar").style.width =
      tally.total ? (100 * tally.done / tally.total) + "%" : "0";
    document.getElementById("t-count").textContent = String(HR.state.comments.length);
  }

  /* ── Wiring ─────────────────────────────────────────────────────────── */
  document.getElementById("kinds").addEventListener("click", function (event) {
    var button = event.target.closest("button[data-kind]");
    if (!button) return;
    kind = button.dataset.kind;
    this.querySelectorAll("button").forEach(function (b) {
      b.setAttribute("aria-pressed", String(b === button));
    });
  });
  function submit() {
    var box = document.getElementById("composer");
    var body = box.value.trim();
    if (!body) { box.focus(); return; }
    if (!current) { HR.toast("Pick a file first"); return; }
    HR.addComment(current, body, kind, anchor);
    anchor = null;
    box.value = "";
    document.getElementById("anchor").textContent = "file-level";
    if (view) view.paint();
    renderComments(); renderRail(); renderCounts(); exporter.refresh();
  }
  document.getElementById("add").addEventListener("click", submit);
  document.getElementById("composer").addEventListener("keydown", function (event) {
    if ((event.metaKey || event.ctrlKey) && event.key === "Enter") {
      event.preventDefault(); submit();
    }
  });
  document.getElementById("clear-anchor").addEventListener("click", function () {
    anchor = null;
    document.getElementById("anchor").textContent = "file-level";
  });
  HR.mountTheme(document.getElementById("t-theme"));
  document.getElementById("t-export").addEventListener("click", exporter.open);
  document.getElementById("t-shortcuts").addEventListener("click", function () {
    HR.toast("j/k file · x mark read · c comment · e export");
  });
  document.addEventListener("keydown", function (event) {
    if (/^(INPUT|TEXTAREA|SELECT)$/.test(event.target.tagName) || event.metaKey || event.ctrlKey) return;
    var order = plan.order.length ? plan.order : plan.files.map(function (f) { return f.path; });
    var index = order.indexOf(current);
    if (event.key === "j") { show(order[Math.min(index + 1, order.length - 1)]); event.preventDefault(); }
    else if (event.key === "k") { show(order[Math.max(index - 1, 0)]); event.preventDefault(); }
    else if (event.key === "x" && current) { toggleRead(current); event.preventDefault(); }
    else if (event.key === "c") { document.getElementById("composer").focus(); event.preventDefault(); }
    else if (event.key === "e") { exporter.open(); event.preventDefault(); }
    else if (event.key === "Escape") { exporter.close(); }
  });

  renderRail(); renderCounts(); renderComments();
  HR.onMonaco(function (ok) {
    if (!ok) HR.toast("Monaco unavailable — plain diff view");
    var start = decodeURIComponent((location.hash || "").slice(1)) ||
                plan.order[0] || plan.files[0].path;
    current = null;
    show(HR.byPath[start] ? start : plan.files[0].path);
  });
})();
</script>
</body>
</html>
